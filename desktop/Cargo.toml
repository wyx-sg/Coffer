[package]
name = "coffer-desktop"
version = "0.1.0"
description = "Coffer desktop shell"
authors = ["Coffer contributors"]
edition = "2021"
license = "MIT"

[lib]
# `staticlib` for iOS, `cdylib` for Android, `rlib` for desktop binaries.
# Generated by `npm create tauri-app` template; safe to leave as-is until
# mobile is on the table.
name = "coffer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# serde / serde_json / specific tauri features will be added by the first
# spec that introduces a Tauri command. The current shell has no commands.
