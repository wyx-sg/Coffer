[package]
name = "coffer-desktop"
version = "0.1.1"
description = "Coffer desktop shell"
authors = ["Coffer contributors"]
edition = "2021"
license = "MIT"

[lib]
# `staticlib` for iOS, `cdylib` for Android, `rlib` for desktop binaries.
# Generated by `npm create tauri-app` template; safe to leave as-is until
# mobile is on the table.
name = "coffer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# The `dialog` and `opener` plugins are deliberately ABSENT. Native folder
# picking, revealing a file in Finder and opening it in an external editor all
# moved onto daemon HTTP routes, which a webview calls exactly like a browser
# tab does (see docs/decisions/daemon-proxies-os-file-actions.md). Re-adding
# the plugins would recreate the `isTauri()` fan-out in the frontend for
# nothing a user could perceive.
#
# `notification` IS admitted, and the test above is why rather than an
# exception to it. That test is not "is there a plugin for it" but "can a
# loopback HTTP route the webview already calls do this instead" — the two
# absent plugins fail it because a local daemon can open Finder as well as any
# process on the machine. A system notification fails it in the other
# direction: the daemon could raise one, but only the app the user installed
# can raise one *as Coffer*, and a notification's whole job is to reach a user
# who is not looking at the page. There is no daemon route to prefer here, and
# no frontend fan-out to recreate — nothing in `frontend/` calls this, and the
# webview is granted no permission to (see `capabilities/default.json`). It is
# Rust-side only, driven by `sync_watch.rs` and `approval_watch.rs`, and it
# exists because a vault held for a confirmation nobody sees stops converging
# in silence — the first one in the field stood for four days — and a secret
# approval nobody sees leaves its destination without its secret (spec vault-sync "Say a vault needs a human
# where the user already is").
[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
# The updater (`updater.rs`): checks a signed release manifest on GitHub
# Releases, verifies the archive against the public key built into the shell,
# and replaces the `.app`. It runs in Rust only; the webview is granted none of
# its permissions (`capabilities/default.json`).
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# The OS language, which the tray is labelled in until the page reports the
# interface language the user chose (`tray_locale.rs`).
sys-locale = "0.3"

# The presence grant (`presence_grant.rs`): an HMAC-SHA256 over the operation
# the person approved, keyed by a key derived from the master key.
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The presence check and the master key's Keychain item (`presence.rs`,
# `master_key.rs`): LocalAuthentication through the Objective-C runtime, and the
# data-protection Keychain through Security.framework. macOS only, like the app.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError"] }
# `OSX_10_15` for `kSecUseDataProtectionKeychain`: access groups are only
# enforced in the data-protection keychain.
security-framework = { version = "3", features = ["OSX_10_15"] }
