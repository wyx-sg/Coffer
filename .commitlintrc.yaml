# Conventional Commits enforcement. Mirrors agents/workflow.md "Commits".
#
# Activated locally via `pre-commit install --hook-type commit-msg`.
# See .pre-commit-config.yaml for the hook wiring.

extends:
  - "@commitlint/config-conventional"

rules:
  # subject-case is intentionally NOT enforced:
  #   1. Conventional Commits doesn't mandate any subject case.
  #   2. Acronyms (MCP, REST, HTTP, ...) and product names are routine.
  #   3. Dependabot generates titles like "Bump X from Y to Z" — Sentence-case,
  #      not user-configurable. A strict lower-case rule would block every
  #      Dependabot PR.
  # The structural rules below (type-enum + scope-empty + length caps) provide
  # the discipline we actually want.
  subject-case: [0]
  subject-empty: [2, "never"]
  subject-max-length: [2, "always", 72]
  body-max-line-length: [2, "always", 100]
  type-enum:
    - 2
    - always
    - - feat
      - fix
      - docs
      - refactor
      - perf
      - test
      - build
      - ci
      - chore
      - revert
