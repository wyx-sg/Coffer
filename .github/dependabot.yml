version: 2

# Monthly minor/patch updates across the four package ecosystems Coffer uses.
# Major bumps are intentionally ignored — they require manual review against
# changelogs, so we handle them by hand on demand instead of letting Dependabot
# open noisy PRs that pile up.
#
# Conventional Commits prefixes match `.commitlintrc.yaml` type-enum so the
# PRs commitlint passes out of the box.

updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python-runtime:
        patterns:
          - "fastapi*"
          - "uvicorn*"
          - "pydantic*"
      python-dev:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
          - "import-linter"
          - "grimp"
          - "pre-commit"
          - "pip-tools"
          - "httpx"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      tooling:
        patterns:
          - "vite*"
          - "vitest*"
          - "@vitejs/*"
          - "@vitest/*"
          - "eslint*"
          - "typescript*"
          - "prettier"

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
      include: scope
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
