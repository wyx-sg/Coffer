name: evals

# The eval flywheel's PR gate (ADR-019). Runs the DETERMINISTIC, model-free
# suites (retrieval-keyword + tool-search) and fails on relative regression vs
# the committed baseline — so a prompt / ranker / retrieval / catalogue change
# can't silently degrade Coffer's non-deterministic behaviour. The model-bearing
# routing suite needs a local LLM and stays on-demand (`make eval-routing`), out
# of CI. Path-filtered: only runs when a surface that affects eval scores moves.

on:
  push:
    branches: [main]
    paths: &eval_paths
      - "evals/**"
      - "backend/coffer/application/mcp/**"
      - "backend/coffer/domain/mcp/**"
      - "backend/coffer/infrastructure/knowledge/**"
      - "backend/coffer/application/knowledge_base/**"
      - "backend/coffer/application/memory/**"
      - ".github/workflows/evals.yml"
  pull_request:
    branches: [main]
    paths: *eval_paths

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eval:
    name: eval (deterministic gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e backend[dev]
      - name: make eval
        run: make eval
