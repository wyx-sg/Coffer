name: evals

# The eval flywheel's PR gate (ADR eval-capture-and-regression-gate). Runs the DETERMINISTIC, model-free
# suite (tool-search) and fails on relative regression vs
# the committed baseline — so a prompt / ranker / catalogue change
# can't silently degrade Coffer's non-deterministic behaviour. The model-bearing
# routing suite needs a local LLM and stays on-demand (`make eval-routing`), out
# of CI. Path-filtered: only runs when a surface that affects eval scores moves.

on:
  push:
    branches: [main]
    paths: &eval_paths
      - "evals/**"
      - "backend/coffer/application/mcp/**"
      - "backend/coffer/domain/mcp/**"
      - "backend/coffer/infrastructure/knowledge/**"
      - "backend/coffer/application/knowledge/**"
      - "backend/coffer/application/memory/**"
      - ".github/workflows/evals.yml"
  pull_request:
    branches: [main]
    paths: *eval_paths

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eval:
    name: eval (deterministic gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Frozen from backend/uv.lock, like ci.yml / verify.yml / release.yml.
      # This job used to `pip install -e backend[dev]`, which re-resolves the
      # `>=` floors in pyproject.toml: the eval gate then scored Coffer against
      # a dependency set no other job ran, and cached on pyproject.toml (which
      # does not pin) rather than on the lockfile (which does).
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install backend (frozen)
        # UV_PROJECT_ENVIRONMENT puts the venv at the repo-root .venv the
        # Makefile's $(PY) expects (uv would otherwise create backend/.venv).
        env:
          UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
        run: uv sync --frozen --extra dev --project backend
      - name: make eval
        run: make eval
