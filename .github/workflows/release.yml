name: Release bundles

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# One release run per tag. cancel-in-progress is false: a release that is
# midway through publishing assets must not be killed by a re-trigger — let it
# finish (the publish step is idempotent via --clobber).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # needed to attach artifacts to a GitHub Release

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            triple: aarch64-apple-darwin
            artifact_suffix: macos-arm64
          # Coffer ships macOS (Apple Silicon) only. macOS x64 (Intel, macos-13)
          # is NOT built: GitHub's Intel runner pool is being deprecated and
          # reliably starves this job, and PyInstaller can't cross-compile the
          # x86_64 sidecars from the arm64 runner. Linux and Windows bundles are
          # not shipped — those legs were never validated.

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Frozen install from backend/uv.lock (same lockfile as CI), so the
      # binaries shipped in a tagged release are built against the exact pinned
      # dependency versions — reproducible, not the `>=` floors in pyproject.
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json

      # --- desktop tier (docs/decisions/desktop-shell-over-a-shared-frontend.md)
      # The .app hosts the same frontend/dist the daemon serves and bundles the
      # same frozen binaries the CLI archive ships, so it rides along on this
      # leg rather than getting a job of its own.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.triple }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: ${{ runner.os }}-${{ matrix.triple }}-cargo-${{ hashFiles('desktop/Cargo.toml', 'desktop/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.triple }}-cargo-

      - name: install backend (frozen; includes pyinstaller via dev extras)
        shell: bash
        # UV_PROJECT_ENVIRONMENT pins the venv to the repo-root .venv that
        # build_binaries.sh probes ($REPO_ROOT/.venv/bin/python); --extra dev
        # pulls pyinstaller. --frozen installs the exact backend/uv.lock pins.
        env:
          UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
        run: uv sync --frozen --extra dev --project backend

      - name: install frontend deps
        working-directory: frontend
        run: npm ci

      # Codegen, then the production build of the web UI the daemon serves
      # over loopback. e2e deps are not used by this job and are intentionally
      # not installed.
      - name: build frontend
        working-directory: frontend
        run: |
          npm run codegen
          npm run build

      # --- signing (RELEASING.md) --------------------------------------------
      # Every signing step below is gated on the credentials it needs. The plan
      # step sees only whether each secret is SET (never its value), logs one
      # annotation per step saying whether it runs and what is missing, and
      # answers the `if:`s. Without any of them the release builds unsigned and
      # the run stays green — the state of this repository until the owner has
      # a Developer Program membership and an updater key.
      - name: plan release signing
        id: plan
        shell: bash
        env:
          HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
          HAS_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          HAS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
          HAS_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY != '' }}
          HAS_APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID != '' }}
          HAS_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER != '' }}
          HAS_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          HAS_COFFER_UPDATER_PUBKEY: ${{ vars.COFFER_UPDATER_PUBKEY != '' }}
        run: python3 scripts/release_plan.py

      # The Developer ID Application certificate, into a temporary keychain
      # deleted at the end of the job. Exports APPLE_SIGNING_IDENTITY (which
      # `tauri build` signs the app with) and COFFER_CODESIGN_IDENTITY (which
      # the PyInstaller specs sign the frozen binaries with).
      - name: import the Developer ID identity
        if: steps.plan.outputs.codesign == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/release_signing.sh import-identity

      # The keychain access group the master key lives in, `<TEAM_ID>.coffer`
      # (ADR master-key-lives-in-the-macos-keychain): stamped into
      # build_identity.py before PyInstaller freezes it, handed to the shell's
      # compile as COFFER_KEYCHAIN_ACCESS_GROUP, and granted by the
      # `keychain-access-groups` entitlement every binary is signed with. An
      # unsigned build is never stamped and keeps the development fallback.
      - name: stamp the keychain access group and render the entitlements
        if: steps.plan.outputs.codesign == 'true'
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          python3 scripts/stamp_build_identity.py "$APPLE_TEAM_ID"
          bash scripts/release_signing.sh render-entitlements "$RUNNER_TEMP/coffer.entitlements"
          {
            echo "COFFER_ENTITLEMENTS_FILE=$RUNNER_TEMP/coffer.entitlements"
            echo "COFFER_KEYCHAIN_ACCESS_GROUP=$APPLE_TEAM_ID.coffer"
          } >> "$GITHUB_ENV"
          # Optional: the entitlement may need a Developer ID provisioning
          # profile embedded in the app (see RELEASING.md).
          if [ -n "${APPLE_PROVISIONING_PROFILE:-}" ]; then
            echo "$APPLE_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/coffer.provisionprofile"
            echo "COFFER_PROVISIONING_PROFILE=$RUNNER_TEMP/coffer.provisionprofile" >> "$GITHUB_ENV"
          else
            echo "::notice::No APPLE_PROVISIONING_PROFILE: the app is signed without an embedded profile"
          fi

      # Only a tagged release is `stable`: it ignores the development
      # environment switches (COFFER_ALLOWED_HOSTS, COFFER_CORS_ORIGINS,
      # COFFER_DEV_CORS), and the commit it was built from is stamped for
      # Settings > About. Experimental features are off in every build.
      # Before the binaries, because PyInstaller freezes the module as it is.
      - name: stamp the stable channel
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: python3 scripts/stamp_channel.py stable --commit "$GITHUB_SHA"

      - name: bundle sidecar binaries
        shell: bash
        run: bash scripts/build_binaries.sh

      # Acceptance scenario: "post-build smoke test boots shim and gets a
      # JSON-RPC reply". build_binaries.sh stages every binary into dist/ under
      # its plain name, which is exactly the layout the CLI archive ships, so
      # the script can probe dist/ directly. It starts the built coffer-daemon,
      # runs the shim against it, and asserts a JSON-RPC round-trip.
      - name: post-build smoke test
        shell: bash
        run: bash scripts/smoke_test_bundle.sh dist

      # PyInstaller signed each binary (and every library it collected) with
      # the Developer ID under the hardened runtime; prove it before shipping.
      - name: verify the frozen binaries' signatures
        if: steps.plan.outputs.codesign == 'true'
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/release_signing.sh verify dist/coffer dist/coffer-daemon dist/coffer-mcp-shim

      # A bare Mach-O cannot carry a stapled ticket, so the CLI binaries are
      # notarised (Gatekeeper then finds the ticket online) but not stapled.
      - name: notarize the CLI binaries
        if: steps.plan.outputs.notarize == 'true'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cli-notary"
          cp dist/coffer dist/coffer-daemon dist/coffer-mcp-shim "$RUNNER_TEMP/cli-notary/"
          ditto -c -k "$RUNNER_TEMP/cli-notary" "$RUNNER_TEMP/coffer-cli.zip"
          bash scripts/release_signing.sh notarize "$RUNNER_TEMP/coffer-cli.zip"

      # The CLI download tier (the documented main road): every binary
      # build_binaries.sh produced,
      # packaged into one tar.gz. The archive contains PLAIN binary names (no
      # triple suffix) so both the one-line installer and manual extraction
      # yield co-located plain-named binaries, which the frozen detect-or-spawn
      # logic requires (ADR daemon-detect-or-spawn): `coffer` looks for `coffer-daemon` next to
      # itself at runtime, and the daemon deploys its siblings from its own
      # directory into ~/.coffer/bin/ at startup.
      - name: package CLI archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          triple="${{ matrix.triple }}"
          binaries=(
            coffer
            coffer-daemon
            coffer-mcp-shim
          )
          for b in "${binaries[@]}"; do
            if [ ! -f "dist/$b" ]; then
              echo "error: dist/$b missing — build_binaries.sh did not produce it" >&2
              ls -la dist/ >&2 || true
              exit 1
            fi
          done
          archive="coffer-cli-${triple}.tar.gz"
          tar -czf "artifacts/$archive" -C dist "${binaries[@]}"
          echo "packaged: artifacts/$archive"

      # The .app bundles the very same three binaries the archive above ships.
      # Stage them where tauri.conf.json's `externalBin` looks: Tauri resolves
      # each `binaries/<name>` entry to `binaries/<name>-<target-triple>`.
      # Deliberately a copy of dist/, NOT a second PyInstaller run — freezing
      # these takes the better part of an hour and it is already done.
      - name: stage frozen binaries for the app bundle
        shell: bash
        run: |
          set -euo pipefail
          triple="${{ matrix.triple }}"
          mkdir -p desktop/binaries
          for b in coffer coffer-daemon coffer-mcp-shim; do
            cp "dist/$b" "desktop/binaries/$b-$triple"
            chmod +x "desktop/binaries/$b-$triple"
          done
          ls -la desktop/binaries/

      # The npm-published CLI, not `cargo install tauri-cli` — the latter
      # compiles for several minutes on every cold cache to produce a tool we
      # invoke exactly once.
      #
      # Signing: APPLE_SIGNING_IDENTITY (exported above) makes Tauri sign the
      # app and its embedded binaries under the hardened runtime with the
      # rendered entitlements; with the App Store Connect key present it also
      # notarises and staples the .app before building the .dmg and the
      # updater archive from it. Updater: with the updater key present Tauri
      # writes Coffer.app.tar.gz and signs it (.sig); COFFER_UPDATER_PUBKEY is
      # compiled into the shell as the key it verifies updates against. Each
      # is merged in through --config only when its credentials exist, so an
      # unsigned build is exactly the build it was before.
      - name: build the desktop app
        working-directory: desktop
        shell: bash
        env:
          HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
          HAS_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          HAS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
          HAS_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          HAS_COFFER_UPDATER_PUBKEY: ${{ vars.COFFER_UPDATER_PUBKEY != '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          COFFER_UPDATER_PUBKEY: ${{ steps.plan.outputs.updater == 'true' && vars.COFFER_UPDATER_PUBKEY || '' }}
          APPLE_API_ISSUER: ${{ steps.plan.outputs.notarize == 'true' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ steps.plan.outputs.notarize == 'true' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_KEY_B64: ${{ steps.plan.outputs.notarize == 'true' && secrets.APPLE_API_KEY || '' }}
        run: |
          set -euo pipefail
          # An unset variable must not reach the compile as an empty key.
          [ -n "$COFFER_UPDATER_PUBKEY" ] || unset COFFER_UPDATER_PUBKEY
          if [ -n "$APPLE_API_KEY_B64" ]; then
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
            echo "$APPLE_API_KEY_B64" | base64 --decode > "$APPLE_API_KEY_PATH"
          else
            unset APPLE_API_ISSUER APPLE_API_KEY
          fi
          unset APPLE_API_KEY_B64
          python3 ../scripts/release_plan.py tauri-config "$RUNNER_TEMP/tauri.release.json" \
            ${COFFER_ENTITLEMENTS_FILE:+--entitlements "$COFFER_ENTITLEMENTS_FILE"} \
            ${COFFER_PROVISIONING_PROFILE:+--profile "$COFFER_PROVISIONING_PROFILE"}
          npx --yes @tauri-apps/cli@^2 build --target ${{ matrix.triple }} \
            --config "$RUNNER_TEMP/tauri.release.json"

      # NOTE: a missing bundle dir here is signal, not noise — fail rather than
      # publish a release whose .dmg silently went missing.
      - name: collect the .dmg
        shell: bash
        run: |
          set -euo pipefail
          triple="${{ matrix.triple }}"
          dmg="$(find "desktop/target/$triple/release/bundle/dmg" \
                   -maxdepth 1 -name '*.dmg' -type f | head -n 1)"
          if [ -z "$dmg" ]; then
            echo "error: no .dmg under desktop/target/$triple/release/bundle/dmg" >&2
            ls -laR "desktop/target/$triple/release/bundle" >&2 || true
            exit 1
          fi
          # An unsigned build says so in the filename: a downloader should know
          # before Gatekeeper tells them.
          if [ "${{ steps.plan.outputs.codesign }}" = "true" ]; then
            name="Coffer-${triple}.dmg"
          else
            name="Coffer-unsigned-${triple}.dmg"
          fi
          cp "$dmg" "artifacts/$name"
          echo "DMG_ARTIFACT=artifacts/$name" >> "$GITHUB_ENV"
          echo "collected: artifacts/$name"

      # Tauri notarised and stapled the .app inside; the .dmg around it gets
      # its own ticket so a downloaded image opens offline too.
      - name: notarize and staple the .dmg
        if: steps.plan.outputs.notarize == 'true'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$DMG_ARTIFACT"
          bash scripts/release_signing.sh notarize "$DMG_ARTIFACT"
          bash scripts/release_signing.sh staple "$DMG_ARTIFACT"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG_ARTIFACT"

      # The desktop updater's feed (spec desktop-app "Check for updates
      # against a signed release manifest"): the archive Tauri signed, its
      # signature, and latest.json naming the version, the archive's URL on
      # this tag's release and the signature. The shell reads latest.json from
      # the newest release and refuses an archive whose signature does not
      # verify against the public key compiled into it.
      - name: collect the updater archive and write latest.json
        if: steps.plan.outputs.updater == 'true'
        shell: bash
        run: |
          set -euo pipefail
          triple="${{ matrix.triple }}"
          dir="desktop/target/$triple/release/bundle/macos"
          archive="$(find "$dir" -maxdepth 1 -name '*.app.tar.gz' -type f | head -n 1)"
          if [ -z "$archive" ] || [ ! -f "$archive.sig" ]; then
            echo "error: no signed updater archive under $dir" >&2
            ls -la "$dir" >&2 || true
            exit 1
          fi
          name="Coffer_${triple}.app.tar.gz"
          cp "$archive" "artifacts/$name"
          cp "$archive.sig" "artifacts/$name.sig"
          version="$(python3 -c 'import json; print(json.load(open("desktop/tauri.conf.json"))["version"])')"
          tag="${GITHUB_REF_NAME}"
          case "$tag" in v*) ;; *) tag="v$version" ;; esac
          python3 scripts/make_update_manifest.py \
            --version "$version" \
            --platform darwin-aarch64 \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${name}" \
            --signature-file "artifacts/$name.sig" \
            --out artifacts/latest.json
          cat artifacts/latest.json

      - name: delete the signing keychain
        if: always() && steps.plan.outputs.codesign == 'true'
        shell: bash
        run: bash scripts/release_signing.sh cleanup

      # Generate SHA-256 checksums so downloaders can verify archive integrity
      # without trusting the GitHub Release UI alone. Cross-platform shim:
      # sha256sum on Linux, shasum -a 256 on macOS.
      - name: compute SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          if command -v sha256sum >/dev/null 2>&1; then
            HASH=(sha256sum)
          else
            HASH=(shasum -a 256)
          fi
          : > SHA256SUMS
          while IFS= read -r f; do
            f="${f#./}"
            [ "$f" = "SHA256SUMS" ] && continue
            "${HASH[@]}" "$f" >> SHA256SUMS
          done < <(find . -maxdepth 1 -type f ! -name SHA256SUMS | sort)
          cat SHA256SUMS

      - name: upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coffer-${{ matrix.artifact_suffix }}
          path: artifacts/
          # Fail the workflow if zero files matched — silent empty uploads
          # have masked broken bundle steps in the past.
          if-no-files-found: error
          retention-days: 30

  # Publish a GitHub Release with every platform's archive attached, so users
  # can download coffer-cli from the Releases page. Runs once, only on a tag
  # push, after all `bundle` matrix legs succeed. Uses the preinstalled gh CLI
  # — no third-party actions to pin.
  release:
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the Release + attach assets
      actions: read # gh run download reads this run's artifacts
    steps:
      - name: download all run artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${GITHUB_RUN_ID}" --dir dist-artifacts --repo "${GITHUB_REPOSITORY}"

      - name: stage release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          # Each matrix leg shipped its own SHA256SUMS; concatenate them into one
          # (a flat copy would otherwise collide on the shared filename).
          find dist-artifacts -name SHA256SUMS -print0 | sort -z | xargs -0 cat > release/SHA256SUMS
          # Copy every coffer-cli archive flat.
          find dist-artifacts -type f ! -name SHA256SUMS -exec cp {} release/ \;
          echo "release assets:"
          ls -la release/

      - name: write release notes
        shell: bash
        run: |
          cat > release-notes.md <<'NOTES'
          ### Command line

          Download `coffer-cli-<platform>.tar.gz` and extract it. It contains
          `coffer` (management CLI), `coffer-daemon` and `coffer-mcp-shim`.
          Keep the binaries
          co-located: `coffer` finds `coffer-daemon` next to itself, and the
          daemon deploys the helper binaries into `~/.coffer/bin/` on startup.

          Start the daemon and open the web UI it serves on loopback; point
          your MCP clients at the shim.

          ### Desktop app

          `Coffer-<platform>.dmg` (`Coffer-unsigned-<platform>.dmg` when the
          release was built without a Developer ID) is the same web UI in a
          native window, with a Dock icon and a menu bar item, and it starts
          the daemon for you. It carries the same three binaries and deploys
          them into `~/.coffer/bin/` on first launch, so installing the app
          installs the CLI too. Once installed, the app checks this page for a
          newer signed release at launch and every six hours, and installs it
          from Settings › About when you choose Download and restart.

          Verify downloads against `SHA256SUMS`.

          > **An unsigned build** (a file named `Coffer-unsigned-…`, or a
          > release without a Developer ID) is not notarised, and macOS blocks
          > downloaded binaries until the quarantine flag is cleared:
          > `xattr -dr com.apple.quarantine <extracted-directory>`, or
          > `xattr -dr com.apple.quarantine /Applications/Coffer.app` after
          > dragging the app across. A binary installed with the one-line
          > installer is never quarantined, so that path skips this step.

          Full install & usage guide: https://wyx-sg.github.io/Coffer/start/install
          NOTES

      - name: publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # Idempotent: create the release if it does not exist yet, otherwise
          # (re-run / workflow_dispatch on an existing tag) just (re-)upload the
          # assets with --clobber so the job stays green instead of failing on
          # "release already exists".
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "$TAG" release/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Coffer ${TAG}" \
              --notes-file release-notes.md \
              --verify-tag
          fi
