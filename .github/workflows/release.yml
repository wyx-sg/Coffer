name: Release bundles

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# One release run per tag. cancel-in-progress is false: a release that is
# midway through publishing assets must not be killed by a re-trigger — let it
# finish (the publish step is idempotent via --clobber).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # needed to attach artifacts to a GitHub Release

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            triple: aarch64-apple-darwin
            artifact_suffix: macos-arm64
          # Coffer ships macOS (Apple Silicon) only. macOS x64 (Intel, macos-13)
          # is NOT built: GitHub's Intel runner pool is being deprecated and
          # reliably starves this job, and PyInstaller can't cross-compile the
          # x86_64 sidecars from the arm64 runner. Linux and Windows bundles are
          # not shipped — those legs were never validated.

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Frozen install from backend/uv.lock (same lockfile as CI), so the
      # binaries shipped in a tagged release are built against the exact pinned
      # dependency versions — reproducible, not the `>=` floors in pyproject.
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.triple }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            desktop/target
          key: ${{ runner.os }}-${{ matrix.triple }}-cargo-${{ hashFiles('desktop/Cargo.toml', 'desktop/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.triple }}-cargo-

      - name: install backend (frozen; includes pyinstaller via dev extras)
        shell: bash
        # UV_PROJECT_ENVIRONMENT pins the venv to the repo-root .venv that
        # build_binaries.sh probes ($REPO_ROOT/.venv/bin/python); --extra dev
        # pulls pyinstaller. --frozen installs the exact backend/uv.lock pins.
        env:
          UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
        run: uv sync --frozen --extra dev --project backend

      # The frozen daemon decodes inbound voice in-process with soundfile + soxr
      # (the `voice` extra, ADR-039); they must be in the build venv so
      # PyInstaller bundles them. mlx-whisper (voice-mlx) is deliberately NOT
      # installed — the frozen app transcribes via the whisper-cli sidecar.
      - name: install voice decode deps (frozen STT)
        shell: bash
        run: uv pip install --python "${{ github.workspace }}/.venv" "soundfile>=0.12" "soxr>=0.5"

      - name: install frontend deps
        working-directory: frontend
        run: npm ci

      # Only run codegen here. The frontend production build is performed once
      # by Tauri's beforeBuildCommand (see desktop/tauri.conf.json) during
      # `cargo tauri build`; a second explicit `npm run build` would be wasted
      # work. e2e deps are not used by this job and are intentionally not
      # installed.
      - name: codegen frontend
        working-directory: frontend
        run: npm run codegen

      # build_binaries.sh builds the whisper-cli STT sidecar from source with
      # cmake (ADR-039). macOS runners ship cmake, but guard explicitly so a
      # runner-image change can't silently break the release build.
      - name: ensure cmake (whisper.cpp build)
        shell: bash
        run: cmake --version || brew install cmake

      - name: bundle sidecar binaries
        shell: bash
        run: bash scripts/build_binaries.sh

      - name: install Tauri CLI
        # Pin to an exact 2.x release. Bump deliberately in a follow-up PR.
        # Idempotent across warm caches: the cache above restores ~/.cargo/bin,
        # so cargo-tauri may already be present from a prior run — a plain
        # `cargo install` then aborts with "binary `cargo-tauri` already exists
        # in destination". Skip when the pinned version is already installed;
        # otherwise (re)install with --force.
        shell: bash
        run: |
          if cargo tauri --version 2>/dev/null | grep -q "2.11.2"; then
            echo "cargo-tauri 2.11.2 already present (cache hit) — skipping install"
          else
            cargo install --locked --force tauri-cli --version "=2.11.2"
          fi

      # macOS code-signing + notarization is intentionally NOT wired here.
      # When the Apple Developer ID is provisioned, set the certificate
      # + identity repo secrets and add a dedicated workflow (e.g.
      # release-macos-signed.yml) gated on the secret being non-empty.
      # We deliberately do NOT reference those secrets from this file:
      # a disabled step that names them still surfaces in repo-secret
      # audits and security tooling. See
      # docs/distribution/macos-notarization.md for the full setup guide.
      # Until then, macOS artifacts are renamed `-unsigned` in the
      # collect step above so downloaders are not misled.

      - name: cargo tauri build
        working-directory: desktop
        run: cargo tauri build --target ${{ matrix.triple }}

      # Acceptance scenario: "post-build smoke test boots shim and gets a
      # JSON-RPC reply". Run the smoke test against the freshly staged sidecar
      # binaries (the same binaries Tauri just bundled). The script starts the
      # bundled coffer-daemon, runs the shim, and asserts a JSON-RPC round-trip.
      - name: post-build smoke test
        shell: bash
        run: |
          set -euo pipefail
          # build_binaries.sh stages the sidecars with triple suffixes
          # (coffer-daemon-<triple>); the smoke script probes the un-suffixed
          # basenames, so copy them into a temp dir under those names first.
          smokedir="$(mktemp -d)"
          cp "desktop/binaries/coffer-daemon-${{ matrix.triple }}" \
             "$smokedir/coffer-daemon"
          cp "desktop/binaries/coffer-mcp-shim-${{ matrix.triple }}" \
             "$smokedir/coffer-mcp-shim"
          cp "desktop/binaries/coffer-${{ matrix.triple }}" \
             "$smokedir/coffer"
          bash scripts/smoke_test_bundle.sh "$smokedir"

      # NOTE: cp failures here are signal, not noise — if the bundle dir is
      # missing or empty we want the workflow to red, not silently upload a
      # tarball with one DMG missing. `shopt -s nullglob` lets the glob
      # expand to nothing without error, but if the glob DOES match anything
      # we let cp's exit status propagate.
      - name: collect artifacts (macOS)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p artifacts
          dmgs=(desktop/target/${{ matrix.triple }}/release/bundle/dmg/*.dmg)
          apps=(desktop/target/${{ matrix.triple }}/release/bundle/macos/Coffer.app)
          if (( ${#dmgs[@]} )); then cp -R "${dmgs[@]}" artifacts/; fi
          if (( ${#apps[@]} )); then cp -R "${apps[@]}" artifacts/; fi
          # macOS bundle is unsigned until APPLE_* secrets are wired (see
          # CODE24-020). The .app is a DIRECTORY — zip it into a single file so
          # it can be checksummed (sha256sum/shasum on a directory exits
          # non-zero under `set -euo pipefail` and would fail the whole job)
          # and rename to make the unsigned status visible in download UIs.
          for app in artifacts/Coffer.app; do
            [ -d "$app" ] || continue
            ditto -c -k --sequesterRsrc --keepParent \
              "$app" "artifacts/Coffer-unsigned-${{ matrix.triple }}.app.zip"
            rm -rf "$app"
          done
          for dmg in artifacts/*.dmg; do
            [ -f "$dmg" ] || continue
            base="$(basename "$dmg" .dmg)"
            case "$base" in
              *-unsigned) ;;  # already tagged
              *) mv "$dmg" "artifacts/${base}-unsigned.dmg" ;;
            esac
          done

      # CLI-only download tier: package the three CLI binaries (coffer,
      # coffer-daemon, coffer-mcp-shim) into one tar.gz for macOS. The archive
      # contains
      # PLAIN binary names (no triple suffix) so that both the one-line
      # installer and manual extraction yield co-located plain-named binaries,
      # which is required by the frozen detect-or-spawn logic (ADR-006):
      # `coffer` looks for `coffer-daemon` next to itself at runtime.
      - name: package CLI-only archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          triple="${{ matrix.triple }}"
          # Source paths: triple-suffixed names produced by build_binaries.sh
          src_daemon="desktop/binaries/coffer-daemon-${triple}"
          src_shim="desktop/binaries/coffer-mcp-shim-${triple}"
          src_cli="desktop/binaries/coffer-${triple}"
          if [ ! -f "$src_daemon" ] || \
             [ ! -f "$src_shim" ] || \
             [ ! -f "$src_cli" ]; then
            echo "error: CLI sidecars missing in desktop/binaries/" >&2
            ls -la desktop/binaries/ >&2 || true
            exit 1
          fi
          # Stage under plain names into a temp dir so the archive contents
          # are clean (no triple suffix). All three must be co-located so
          # detect-or-spawn can find coffer-daemon next to coffer at runtime.
          stagedir="$(mktemp -d)"
          cp "$src_daemon" "$stagedir/coffer-daemon"
          cp "$src_shim"   "$stagedir/coffer-mcp-shim"
          cp "$src_cli"    "$stagedir/coffer"
          archive="coffer-cli-${triple}.tar.gz"
          tar -czf "artifacts/$archive" -C "$stagedir" \
              "coffer" "coffer-daemon" "coffer-mcp-shim"
          rm -rf "$stagedir"
          echo "packaged CLI tier: artifacts/$archive"

      # Generate SHA-256 checksums so downloaders can verify bundle integrity
      # without trusting the GitHub Release UI alone. Cross-platform shim:
      # sha256sum on Linux, shasum -a 256 on macOS. We hash FILES
      # only (the macOS .app is already zipped above) — hashing a directory
      # exits non-zero under `set -euo pipefail` and would fail the job.
      - name: compute SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          if command -v sha256sum >/dev/null 2>&1; then
            HASH=(sha256sum)
          else
            HASH=(shasum -a 256)
          fi
          : > SHA256SUMS
          while IFS= read -r f; do
            f="${f#./}"
            [ "$f" = "SHA256SUMS" ] && continue
            "${HASH[@]}" "$f" >> SHA256SUMS
          done < <(find . -maxdepth 1 -type f ! -name SHA256SUMS | sort)
          cat SHA256SUMS

      - name: upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coffer-${{ matrix.artifact_suffix }}
          path: artifacts/
          # Fail the workflow if zero files matched — silent empty uploads
          # have masked broken bundle steps in the past.
          if-no-files-found: error
          retention-days: 30

  # Publish a GitHub Release with every platform's artifacts attached, so users
  # can download both tiers (desktop installers + coffer-cli archives) from the
  # Releases page. Runs once, only on a tag push, after all `bundle` matrix legs
  # succeed. Uses the preinstalled gh CLI — no third-party actions to pin.
  release:
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the Release + attach assets
      actions: read # gh run download reads this run's artifacts
    steps:
      - name: download all run artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${GITHUB_RUN_ID}" --dir dist-artifacts --repo "${GITHUB_REPOSITORY}"

      - name: stage release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          # Each matrix leg shipped its own SHA256SUMS; concatenate them into one
          # (a flat copy would otherwise collide on the shared filename).
          find dist-artifacts -name SHA256SUMS -print0 | sort -z | xargs -0 cat > release/SHA256SUMS
          # Copy every other artifact (desktop installers + coffer-cli archives) flat.
          find dist-artifacts -type f ! -name SHA256SUMS -exec cp {} release/ \;
          echo "release assets:"
          ls -la release/

      - name: write release notes
        shell: bash
        run: |
          cat > release-notes.md <<'NOTES'
          Coffer ships in two download tiers, built from the same binaries:

          ### Desktop app (most users)

          Download the macOS `.dmg` (Apple Silicon). The daemon, shim, and web
          UI are bundled; install and launch. (Coffer ships macOS only.)

          ### CLI-only (headless / servers)

          Download `coffer-cli-<platform>.tar.gz`; it contains `coffer`
          (management CLI), `coffer-daemon`, and `coffer-mcp-shim`.
          Run the daemon and point your MCP clients at the shim.

          Verify downloads against `SHA256SUMS`.

          > **macOS builds are unsigned** (notarisation pending) — macOS may say the app is
          > "damaged" on first open (right-click → Open won't help). Clear the quarantine flag:
          > `xattr -dr com.apple.quarantine /Applications/Coffer.app`
          > (if it still won't open: `codesign --force --deep --sign - /Applications/Coffer.app`)

          Full install & usage guide: https://wyx-sg.github.io/Coffer/guide/install
          NOTES

      - name: publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # Idempotent: create the release if it does not exist yet, otherwise
          # (re-run / workflow_dispatch on an existing tag) just (re-)upload the
          # assets with --clobber so the job stays green instead of failing on
          # "release already exists".
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "$TAG" release/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Coffer ${TAG}" \
              --notes-file release-notes.md \
              --verify-tag
          fi
