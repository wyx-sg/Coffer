name: pr-title

# Mirror .commitlintrc.yaml against the PR title because the PR title becomes
# the squash-merge commit subject (per agents/workflow.md squash-merge policy).
# The local pre-commit commitlint hook covers individual commits during
# development; this workflow covers the title at PR open/edit/synchronize.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  semantic:
    name: conventional-title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            PR title subject must start with lowercase.
            See agents/workflow.md "Commits" and .commitlintrc.yaml.

  length:
    name: title-length
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title length (<= 72 chars)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          len=${#PR_TITLE}
          if [ "$len" -gt 72 ]; then
            echo "::error::PR title is $len chars; commitlint cap is 72."
            echo "Title: $PR_TITLE"
            exit 1
          fi
          echo "PR title length OK: $len chars."
