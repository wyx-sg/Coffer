name: pr-title

# The PR title becomes the squash-merge commit subject (per
# agents/workflow.md). We lint it with the same commitlint config that the
# local pre-commit commit-msg hook uses (.commitlintrc.yaml), so PR title
# rules and per-commit rules can never drift.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: conventional-title
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned like every other workflow in this repo: a floating `@v4`
      # re-resolves on each run, so a compromised or simply changed tag lands
      # here without a commit.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Install commitlint
        run: |
          npm install --no-save \
            @commitlint/cli@19 \
            @commitlint/config-conventional@19
      - name: Lint PR title against .commitlintrc.yaml
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | npx commitlint --config .commitlintrc.yaml
