name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e backend[dev]
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: make lint
        run: make lint

  unit:
    name: test-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e backend[dev]
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: make verify-unit
        run: make verify-unit

  integration:
    name: test-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install system deps (ripgrep for grep retrieval)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep
      - name: Install backend
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e backend[dev]
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: make verify-integration
        run: make verify-integration

  benchmark:
    name: test-benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e backend[dev]
      # SC-003 gateway-overhead budget. Benchmark-gated tests are excluded
      # from the default suite (make verify); this job is the ONLY place they
      # actually execute, so the acceptance marker can't report green while the
      # budget goes unverified.
      - name: make verify-benchmark
        run: make verify-benchmark

  acceptance:
    name: audit-acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: audit_acceptance
        run: python3 scripts/audit_acceptance.py

  secrets:
    name: secrets-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      # Note: gitleaks-action is free for personal repos (wyx-sg/Coffer).
      # If this repo ever moves under a GitHub organization, switch to the
      # curl-install pattern or supply a GITLEAKS_LICENSE secret.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop:
    name: desktop-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('desktop/Cargo.toml', 'desktop/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      # Tauri 2 Linux webview backend.
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      # The Tauri CLI binary is a frontend dev-dep; tauri build's
      # beforeBuildCommand also calls into the frontend (vite build), so we
      # need frontend node_modules.
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      # Phase 8: tauri.conf.json bundle.externalBin requires the two
      # sidecar binaries to exist at build time. The release workflow
      # produces real PyInstaller builds; for the PR verify job we just
      # need stubs so cargo tauri build accepts the externalBin
      # references and links the bundle. Real binary coverage lives in
      # release.yml.
      - name: Stub sidecar binaries for tauri build
        run: |
          mkdir -p desktop/binaries
          printf '#!/bin/sh\nexit 0\n' > desktop/binaries/coffer-daemon-x86_64-unknown-linux-gnu
          printf '#!/bin/sh\nexit 0\n' > desktop/binaries/coffer-mcp-shim-x86_64-unknown-linux-gnu
          chmod +x desktop/binaries/coffer-daemon-x86_64-unknown-linux-gnu
          chmod +x desktop/binaries/coffer-mcp-shim-x86_64-unknown-linux-gnu
      # Rust unit tests live in desktop/src/lib.rs under `#[cfg(test)] mod
      # tests`. They cover the close-to-tray decision logic that's hard to
      # exercise from a Tauri runtime test. Without this step the unit
      # tests are never executed in CI.
      - name: cargo test (desktop)
        working-directory: desktop
        run: cargo test --lib
      # Full tauri build catches more than cargo build alone: frontend
      # tsc -b + vite build, bundle creation, icon references, and the
      # whole crate-to-installer pipeline. Limited to `.deb` to keep
      # Linux CI under ~10 min (appimage adds AppImageTool + 5+ min).
      - name: tauri build (Linux .deb + binary)
        working-directory: desktop
        run: ../frontend/node_modules/.bin/tauri build --bundles deb
      - name: Verify outputs
        run: |
          bin=desktop/target/release/coffer-desktop
          test -x "$bin" || { echo "::error::release binary missing"; exit 1; }
          file "$bin"
          ls -la desktop/target/release/bundle/deb/
      - name: Upload .deb bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coffer-desktop-linux-deb
          path: desktop/target/release/bundle/deb/*.deb
          retention-days: 7
          if-no-files-found: error

  contract:
    name: test-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e backend[dev]
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: make verify-contract
        run: make verify-contract

  e2e:
    name: test-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install backend
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e backend[dev]
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install e2e
        working-directory: e2e
        run: npm ci
      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: make verify-e2e
        run: make verify-e2e
      # Without these artifacts, an e2e failure on CI shows only the
      # Playwright reporter stack — no daemon stderr, no traces. The shim
      # 500 in PR #14 was effectively undiagnosable from CI logs alone.
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload daemon log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daemon-log
          # start_daemon.sh persists $HOME at /tmp/coffer-e2e-home.path;
          # the daemon writes its stdout/stderr there under .coffer/logs/.
          path: |
            /tmp/coffer-e2e-home.path
            /tmp/coffer-e2e-*/.coffer/logs/
            /tmp/coffer-e2e-*/.coffer/daemon.json
          retention-days: 7
          if-no-files-found: ignore
