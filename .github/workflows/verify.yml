name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every backend install here is FROZEN from backend/uv.lock, the same set ci.yml
# and release.yml resolve. These jobs used to `pip install -e backend[dev]`, which
# re-resolves the `>=` floors in pyproject.toml to whatever is newest that
# morning: they drifted off the locked set and went red on upstream releases
# nothing in the repo had adopted, while ci.yml's frozen job stayed green on the
# identical commit. Deliberate drift belongs to ci.yml's weekly latest-deps
# canary, which is a heads-up to bump + re-lock rather than a merge gate.

# Collapse redundant runs for the same ref into one (a new push cancels the
# previous in-flight run for that branch/PR).
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend (frozen)
        env:
          UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
        run: uv sync --frozen --extra dev --project backend
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: make lint
        run: make lint

  unit:
    name: test-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend (frozen)
        env:
          UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
        run: uv sync --frozen --extra dev --project backend
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: make verify-unit
        run: make verify-unit

  integration:
    name: test-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install system deps (ripgrep for grep retrieval)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep
      - name: Install backend (frozen)
        env:
          UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
        run: uv sync --frozen --extra dev --project backend
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: make verify-integration
        run: make verify-integration

  benchmark:
    name: test-benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install backend (frozen)
        env:
          UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
        run: uv sync --frozen --extra dev --project backend
      # SC-003 gateway-overhead budget. Benchmark-gated tests are excluded
      # from the default suite (make verify); this job is the ONLY place they
      # actually execute, so the acceptance marker can't report green while the
      # budget goes unverified.
      - name: make verify-benchmark
        run: make verify-benchmark

  acceptance:
    name: audit-acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: audit_acceptance
        run: python3 scripts/audit_acceptance.py

  secrets:
    name: secrets-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      # Note: gitleaks-action is free for personal repos (wyx-sg/Coffer).
      # If this repo ever moves under a GitHub organization, switch to the
      # curl-install pattern or supply a GITLEAKS_LICENSE secret.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  contract:
    name: test-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend (frozen)
        env:
          UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
        run: uv sync --frozen --extra dev --project backend
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: make verify-contract
        run: make verify-contract

  e2e:
    name: test-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install backend (frozen)
        env:
          UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
        run: uv sync --frozen --extra dev --project backend
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install e2e
        working-directory: e2e
        run: npm ci
      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: make verify-e2e
        run: make verify-e2e
      # Without these artifacts, an e2e failure on CI shows only the
      # Playwright reporter stack — no daemon stderr, no traces. The shim
      # 500 in PR #14 was effectively undiagnosable from CI logs alone.
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload daemon log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daemon-log
          # start_daemon.sh persists $HOME at /tmp/coffer-e2e-home.path;
          # the daemon writes its stdout/stderr there under .coffer/logs/.
          path: |
            /tmp/coffer-e2e-home.path
            /tmp/coffer-e2e-*/.coffer/logs/
            /tmp/coffer-e2e-*/.coffer/daemon.json
          retention-days: 7
          if-no-files-found: ignore
