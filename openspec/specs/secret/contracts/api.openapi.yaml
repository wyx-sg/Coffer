    SecretSetIn:
      description: |-
        Request body for storing a secret in the secret store.

        Secrets are Fernet-encrypted into the vault; only ciphertext is
        persisted; audit rows carry the ref only.
      properties:
        ref:
          description: Reference key the secret is stored under. Slash-separated segments are allowed (e.g. channel/tg/bot-token).
          minLength: 1
          pattern: ^\.*[A-Za-z0-9_-][A-Za-z0-9_.-]*(/\.*[A-Za-z0-9_-][A-Za-z0-9_.-]*)*$
          title: Ref
          type: string
        value:
          description: The secret value.
          maxLength: 8192
          minLength: 1
          title: Value
          type: string
      required:
      - ref
      - value
      title: SecretSetIn
      type: object
    SecretSettingsIn:
      description: Request body to relocate the master key.
      properties:
        master_key_storage:
          enum:
          - file
          - keychain
          title: Master Key Storage
          type: string
      required:
      - master_key_storage
      title: SecretSettingsIn
      type: object
    SecretSettingsOut:
      description: Where the secret-store master key currently lives.
      properties:
        master_key_storage:
          description: file = ~/.coffer/master.key (development default); keychain = OS keychain entry (development opt-in); keychain_access_group = the signed release's Keychain access group, the only place a release keeps it.
          enum:
          - file
          - keychain
          - keychain_access_group
          title: Master Key Storage
          type: string
      required:
      - master_key_storage
      title: SecretSettingsOut
      type: object
