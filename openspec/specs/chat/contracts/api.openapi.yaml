components:
  schemas:
    AgentConfigOut:
      description: |-
        Read view of a conversation's agent config (managed agents).

        ``session_id`` is provider-internal and deliberately not surfaced.
      properties:
        cwd:
          anyOf:
          - type: string
          - type: 'null'
          title: Cwd
        effort:
          anyOf:
          - type: string
          - type: 'null'
          title: Effort
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
      required:
      - cwd
      - model
      - effort
      title: AgentConfigOut
      type: object
    AgentConfigPatch:
      description: |-
        Body for PATCH /conversations/{id}/agent-config.

        Sets the managed agent's own model (free-text, passed through to its CLI)
        and how hard it should think. An empty or null ``model`` clears the override
        so the conversation inherits the active provider profile's projected
        default; an empty or null ``effort`` clears it so the agent keeps whatever
        its own config says. Each field is written only when the body mentions it,
        so setting one leaves the other alone; ``cwd`` / ``session_id`` are
        preserved (ADR coffer-model-is-an-internal-engine → ADR model-catalogue-read-from-the-agent).
      properties:
        effort:
          anyOf:
          - type: string
          - type: 'null'
          title: Effort
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
      title: AgentConfigPatch
      type: object
    AgentProviderListOut:
      properties:
        agents:
          items:
            $ref: '#/components/schemas/AgentProviderOut'
          title: Agents
          type: array
      required:
      - agents
      title: AgentProviderListOut
      type: object
    AgentProviderOut:
      properties:
        agent_key:
          title: Agent Key
          type: string
        available:
          title: Available
          type: boolean
        display_name:
          title: Display Name
          type: string
      required:
      - agent_key
      - display_name
      - available
      title: AgentProviderOut
      type: object
    Body_upload_attachment_api_v1_chat_attachments_post:
      properties:
        file:
          contentMediaType: application/octet-stream
          title: File
          type: string
      required:
      - file
      title: Body_upload_attachment_api_v1_chat_attachments_post
      type: object
    ChannelBindingOut:
      description: |-
        The IM channel a conversation is also driven from (ADR chat-single-owner-live-mirror).

        The return address for relaying the agent's output back to the channel;
        present iff the conversation has a channel binding.
      properties:
        channel:
          anyOf:
          - type: string
          - type: 'null'
          title: Channel
        channel_uid:
          title: Channel Uid
          type: string
        chat_id:
          title: Chat Id
          type: string
        mirror:
          anyOf:
          - $ref: '#/components/schemas/ChannelMirrorOut'
          - type: 'null'
        place:
          anyOf:
          - $ref: '#/components/schemas/ChannelPlaceOut'
          - type: 'null'
        platform:
          anyOf:
          - type: string
          - type: 'null'
          title: Platform
      required:
      - channel_uid
      - channel
      - chat_id
      - platform
      - place
      - mirror
      title: ChannelBindingOut
      type: object
    ChannelMirrorOut:
      description: |-
        Where a reply typed here will also be sent (spec chat "Show where a reply
        will also be sent").

        ``deliverable`` is False when a reply stays in Coffer; ``reason`` then says
        why: ``group_main`` (a group's main chat), ``not_located`` / ``chat_kind_unknown``
        (no chat to write to is known), ``channel_deleted``. ``target`` is the label
        shown before sending, e.g. ``SeaTalk · 🧵#1 deploy check``.
      properties:
        deliverable:
          title: Deliverable
          type: boolean
        platform:
          title: Platform
          type: string
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        target:
          title: Target
          type: string
        undelivered:
          items:
            $ref: '#/components/schemas/UndeliveredReplyOut'
          title: Undelivered
          type: array
      required:
      - deliverable
      - platform
      - target
      - reason
      - undelivered
      title: ChannelMirrorOut
      type: object
    ChannelPlaceOut:
      description: |-
        Where in its channel a conversation lives — what the Conversations list's
        source badge names ("SeaTalk · DM · 🧵#2", "SeaTalk · <group> > thread").
      properties:
        chat_kind:
          anyOf:
          - enum:
            - direct
            - group
            type: string
          - type: 'null'
          title: Chat Kind
        chat_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Chat Name
        parallel_mark:
          anyOf:
          - type: string
          - type: 'null'
          title: Parallel Mark
        thread:
          default: false
          title: Thread
          type: boolean
      required:
      - chat_kind
      - thread
      - parallel_mark
      - chat_name
      title: ChannelPlaceOut
      type: object
    ChatAttachmentOut:
      description: |-
        Response for POST /attachments — one stored upload.

        ``id`` is what a send names; the file's local path never leaves the daemon
        (spec chat "Upload a file for a web message").
      properties:
        filename:
          title: Filename
          type: string
        id:
          title: Id
          type: string
        mime:
          title: Mime
          type: string
        size:
          title: Size
          type: integer
      required:
      - id
      - filename
      - mime
      - size
      title: ChatAttachmentOut
      type: object
    ContentBlockOut:
      description: |-
        Wire representation of a ContentBlock (text | tool_use | tool_result |
        attachment). ``filename``/``mime`` describe an ``attachment`` reference; the
        local ``path`` is deliberately NOT surfaced (leak/security — spec chat
        "Re-materialise attachments from persisted history").
      properties:
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        filename:
          anyOf:
          - type: string
          - type: 'null'
          title: Filename
        mime:
          anyOf:
          - type: string
          - type: 'null'
          title: Mime
        output:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Output
        text:
          anyOf:
          - type: string
          - type: 'null'
          title: Text
        tool_input:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Tool Input
        tool_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Tool Name
        tool_use_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Tool Use Id
        type:
          enum:
          - text
          - tool_use
          - tool_result
          - attachment
          title: Type
          type: string
      required:
      - type
      - text
      - tool_use_id
      - tool_name
      - tool_input
      - output
      - error
      - filename
      - mime
      title: ContentBlockOut
      type: object
    ConversationCreate:
      description: |-
        Body for POST /conversations.

        ``agent_key`` selects the Coffer-managed agent to talk to (required — chat
        has no built-in agent of its own, ADR coffer-model-is-an-internal-engine).
        ``agent_config`` is an opaque, agent-specific configuration object the named
        agent validates and stores (e.g. ``cwd`` for ``claude_code`` / ``codex``).
      properties:
        agent_config:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Agent Config
        agent_key:
          title: Agent Key
          type: string
      required:
      - agent_key
      title: ConversationCreate
      type: object
    ConversationListOut:
      description: One page of conversations, newest activity first.
      properties:
        conversations:
          items:
            $ref: '#/components/schemas/ConversationOut'
          title: Conversations
          type: array
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      required:
      - conversations
      - next_cursor
      title: ConversationListOut
      type: object
    ConversationOut:
      description: Single conversation response.
      properties:
        agent_key:
          title: Agent Key
          type: string
        archived_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Archived At
        channel_binding:
          anyOf:
          - $ref: '#/components/schemas/ChannelBindingOut'
          - type: 'null'
        created_at:
          format: date-time
          title: Created At
          type: string
        id:
          title: Id
          type: string
        preview:
          anyOf:
          - type: string
          - type: 'null'
          title: Preview
        running:
          default: false
          title: Running
          type: boolean
        title:
          title: Title
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
      required:
      - id
      - agent_key
      - title
      - created_at
      - updated_at
      - archived_at
      - channel_binding
      - preview
      - running
      title: ConversationOut
      type: object
    ConversationPatch:
      description: Body for PATCH /conversations/{id}.
      properties:
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
      title: ConversationPatch
      type: object
    ErrorDetail:
      properties:
        code:
          examples:
          - RESOURCE_NOT_FOUND
          title: Code
          type: string
        details:
          additionalProperties: true
          title: Details
          type: object
        message:
          examples:
          - 'resource not found: mcp_server:filesystem'
          title: Message
          type: string
      required:
      - code
      - message
      - details
      title: ErrorDetail
      type: object
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - error
      title: ErrorResponse
      type: object
    MessageListOut:
      description: List of messages for a conversation.
      properties:
        messages:
          items:
            $ref: '#/components/schemas/MessageOut'
          title: Messages
          type: array
      required:
      - messages
      title: MessageListOut
      type: object
    MessageOut:
      description: Single message response.
      properties:
        completion_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Completion Tokens
        content:
          items:
            $ref: '#/components/schemas/ContentBlockOut'
          title: Content
          type: array
        conversation_id:
          title: Conversation Id
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        id:
          title: Id
          type: string
        model_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Id
        prompt_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Prompt Tokens
        role:
          enum:
          - user
          - assistant
          title: Role
          type: string
        seq:
          title: Seq
          type: integer
        status:
          enum:
          - complete
          - streaming
          - failed
          title: Status
          type: string
      required:
      - id
      - conversation_id
      - seq
      - role
      - content
      - status
      - model_id
      - prompt_tokens
      - completion_tokens
      - created_at
      title: MessageOut
      type: object
    PendingQueueIn:
      description: Body for PUT /conversations/{id}/pending — replaces the ordered queue.
      properties:
        pending:
          items:
            type: string
          title: Pending
          type: array
      required:
      - pending
      title: PendingQueueIn
      type: object
    PendingQueueOut:
      description: |-
        The conversation's current ordered pending-message texts.

        ADR chat-single-owner-live-mirror.
      properties:
        pending:
          items:
            type: string
          title: Pending
          type: array
      required:
      - pending
      title: PendingQueueOut
      type: object
    SendMessageAck:
      description: |-
        Response for POST /conversations/{id}/messages — fire-and-return
        (ADR chat-single-owner-live-mirror).

        ``queued`` is True when the message was enqueued behind an in-flight turn,
        False when its turn started immediately. ``mirror`` says what became of
        the reply in the channel the conversation came from (spec chat "Mirror a
        web reply into the channel it came from"): ``sent`` to the chat, ``pending``
        until the channel can send, ``kept`` in Coffer only; null for a conversation
        no channel drives.
      properties:
        mirror:
          anyOf:
          - enum:
            - sent
            - pending
            - kept
            type: string
          - type: 'null'
          title: Mirror
        queued:
          title: Queued
          type: boolean
      required:
      - queued
      - mirror
      title: SendMessageAck
      type: object
    SendMessageRequest:
      description: |-
        Body for POST /conversations/{id}/messages.

        ``attachment_ids`` name files uploaded through ``POST /attachments`` (spec
        chat "Send uploaded files with a web message"). A message carries text, at
        least one attachment, or both — never neither.
      properties:
        attachment_ids:
          items:
            type: string
          maxItems: 10
          title: Attachment Ids
          type: array
        text:
          default: ''
          maxLength: 32768
          title: Text
          type: string
      title: SendMessageRequest
      type: object
    UndeliveredReplyOut:
      description: |-
        A message Coffer still owes the channel chat: a web ``reply`` or the
        agent's ``answer`` to it (spec chat "Mirror a web reply into the channel it
        came from").
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        kind:
          enum:
          - reply
          - answer
          title: Kind
          type: string
        text:
          title: Text
          type: string
      required:
      - kind
      - text
      - created_at
      title: UndeliveredReplyOut
      type: object
