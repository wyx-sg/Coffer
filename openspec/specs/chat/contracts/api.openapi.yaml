openapi: 3.0.3
info:
  title: Coffer — Chat API
  version: 0.1.0
  description: >
    REST surface for the turn platform and the web Chat page (spec chat).

    Two prefixes, one spec. /api/v1/agent-providers answers questions about the
    agent-provider registry itself — which agents are registered, and what
    models each can be put on — which is not a question about a conversation
    and not the `agent` resource rows /api/v1/agents serves. /api/v1/chat
    carries the conversation, message, pending-queue and SSE routes a turn is
    driven through.

    A conversation is the same object whatever opened it: one started from an
    IM channel (spec channels) is observable and continuable from the page, and
    the reverse.

servers:
  - url: http://127.0.0.1:8000

security:
  - cofferToken: []

paths:
  /api/v1/agent-providers:
    get:
      summary: List the agents the turn platform can run a turn on
      operationId: listAgentProviders
      tags: [agent-providers]
      responses:
        '200':
          description: The registered agent providers, each with availability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProviderListOut'

  /api/v1/chat/conversations:
    get:
      summary: List conversations, newest first
      operationId: listConversations
      tags: [chat]
      parameters:
        - name: archived
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: >
            When true, returns archived conversations; the default lists active
            (non-archived) conversations only. Either listing leaves out a conversation
            owned by another surface (see "Show every conversation on the Chat
            page"); such a conversation is still readable by id.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationListOut'
    post:
      summary: Create a conversation
      operationId: createConversation
      description: >
        Creates a conversation for the named Coffer-managed agent. `agent_key`
        is required; `agent_config` is an opaque, agent-specific configuration
        object the named agent validates and stores. For a managed agent it
        accepts an optional `cwd`, an optional `model` (the agent's own model,
        free-text) and an optional `effort` (its reasoning level). An unknown `agent_key` or an invalid `agent_config`
        is rejected with 400.
      tags: [chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationOut'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/chat/conversations/{id}:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      summary: Get one conversation
      operationId: getConversation
      tags: [chat]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationOut'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Rename a conversation
      operationId: updateConversation
      tags: [chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationPatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationOut'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete a conversation and its messages
      description: >
        Any in-flight turn for the conversation is cancelled and discarded
        before deletion, so no background task outlives the row.
      operationId: deleteConversation
      tags: [chat]
      responses:
        '204':
          description: No Content
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/chat/conversations/{id}/agent-config:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      summary: Read a conversation's agent config (cwd, model, effort)
      operationId: getAgentConfig
      tags: [chat]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConfigOut'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Set a conversation's model and reasoning effort (managed agents)
      description: >
        Sets `agent_config.model` — the managed agent's own model, passed
        through to its CLI (Claude Code `--model`, Codex `model`) — and
        `agent_config.effort`, how hard that model thinks, preserving `cwd` and
        `session_id`. Each field is written only when the body mentions it. An
        empty or null `model` clears the override so the conversation inherits
        the active provider profile's projected default; an empty or null
        `effort` clears it so the agent runs at its own configured level. The
        agent itself is fixed at creation and cannot be changed here. Mirrors
        the channel `/model` and `/effort` commands. It is unrelated to the
        `model_id` recorded on each message, which reports the model a turn
        actually ran on and is never read back as configuration.
      operationId: setAgentConfig
      tags: [chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentConfigPatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConfigOut'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/chat/conversations/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      summary: Archive a conversation (hide from the active list, keep restorable)
      operationId: archiveConversation
      tags: [chat]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationOut'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/chat/conversations/{id}/unarchive:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      summary: Restore an archived conversation into the active list
      operationId: unarchiveConversation
      tags: [chat]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationOut'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/chat/conversations/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      summary: Conversation message history
      operationId: listMessages
      tags: [chat]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageListOut'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Send a user message (starts or enqueues a turn; fire-and-return)
      operationId: sendMessage
      description: >
        Starts a turn for the message, or enqueues it on the conversation's
        pending queue when a turn is already in flight. Returns immediately;
        turn events are consumed via `GET /conversations/{id}/events`, the
        single event path. The composer never locks — a message sent during a
        turn is queued, not rejected.
      tags: [chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '202':
          description: Accepted — the turn started, or the message was queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageAck'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: >-
            Neither text nor an attachment, more than ten attachments, or an
            attachment id naming no stored upload (`ATTACHMENT_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/chat/conversations/{id}/messages/{message_id}/resend:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
      - name: message_id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Send a persisted user message again (the page's Retry)
      operationId: resendMessage
      description: >
        Rebuilds the user message from its persisted row — its text and every
        attachment reference, from the web composer or a channel — and starts
        or enqueues a turn for it exactly as `POST .../messages` does,
        persisting a new user row. A referenced file the 30-day media sweep has
        since deleted is refused with `ATTACHMENT_EXPIRED` (410) and nothing is
        persisted or queued; the message is never sent without it.
      tags: [chat]
      responses:
        '202':
          description: Accepted — the turn started, or the message was queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageAck'
        '404':
          description: >-
            No such conversation (`CONVERSATION_NOT_FOUND`), or no user message
            with that id in it (`MESSAGE_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '410':
          description: >-
            A file the message referenced is no longer stored
            (`ATTACHMENT_EXPIRED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/chat/attachments:
    post:
      summary: Upload a file for a later web message
      operationId: uploadChatAttachment
      description: >
        The web composer's entrance for a file (see "Upload a file for a web
        message"). The bytes are stored under `~/.coffer/chat-media` and the
        response names them by an opaque id, which `POST
        /conversations/{id}/messages` then carries in `attachment_ids`; the
        local path never leaves the daemon. Not tied to a conversation, so a
        draft can attach before its conversation exists. One file per call, at
        most 20 MB; accepted types are images, audio, documents (PDF, Word,
        PowerPoint, Excel, RTF, EPUB, CSV) and any UTF-8 text file. Stored
        files are pruned 30 days after upload.
      tags: [chat]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatAttachmentOut'
        '413':
          description: Over the 20 MB ceiling (`ATTACHMENT_TOO_LARGE`); the message names the limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '415':
          description: A type no agent can use from a turn (`ATTACHMENT_TYPE_UNSUPPORTED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/BadRequest'

  /api/v1/chat/conversations/{id}/events:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      summary: Subscribe to a conversation's live turn events (SSE)
      operationId: subscribeConversationEvents
      description: >
        Server-Sent Events stream of the conversation's turn events, for any
        client. On attach, an in-flight turn's events so far are replayed, then
        streamed live; when idle the connection is held open and the next turn —
        from any surface, a channel included — is streamed. Event names:
        `turn_start`, `text_delta`, `tool_call`, `tool_result`, `turn_done`,
        `turn_error`, `queue_changed`. A `turn_error` carries a `code`; the platform
        itself raises `stream_ended` (the agent's stream ended without a
        terminal event), `turn_timeout` (the idle watchdog cancelled a silent
        turn) and `daemon_stopped` (the daemon cancelled the turn on shutdown),
        and every other code is the agent's own.
      tags: [chat]
      responses:
        '200':
          description: SSE stream of agent events
          content:
            text/event-stream:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/chat/conversations/{id}/pending:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    put:
      summary: Replace the conversation's pending message queue
      operationId: setPendingQueue
      description: >
        Replaces the ordered pending-message texts: one primitive that clears
        (empty list), drops, reorders, or resumes the queue. Unpauses the queue
        and starts the next turn when none is in flight. Broadcasts
        `queue_changed`.
      tags: [chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PendingQueueIn'
      responses:
        '200':
          description: The updated pending queue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingQueueOut'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/chat/conversations/{id}/interrupt:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      summary: Stop the conversation's in-flight turn, keeping partial output
      operationId: interruptTurn
      description: >
        Stops a running turn and pauses the pending queue. Whatever the agent
        produced so far is persisted as the assistant message. A no-op when no
        turn is in flight.
      tags: [chat]
      responses:
        '204':
          description: No Content
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    cofferToken:
      type: apiKey
      in: header
      name: X-Coffer-Token

  parameters:
    ConversationId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Conversation id

  responses:
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: No agent or conversation with this key or id
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    AgentProviderOut:
      type: object
      required: [agent_key, display_name, available]
      properties:
        agent_key:
          type: string
        display_name:
          type: string
        available:
          type: boolean
          description: Whether the agent's CLI is present on this host.

    AgentProviderListOut:
      type: object
      required: [agents]
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/AgentProviderOut'

    ConversationCreate:
      type: object
      required: [agent_key]
      properties:
        agent_key:
          type: string
          description: Which registered agent the conversation talks to.
        agent_config:
          type: object
          additionalProperties: true
          nullable: true
          description: >
            Opaque, agent-specific configuration validated by the named agent.
            For a managed agent (Claude Code / Codex): an optional `cwd`, an
            optional `model` (the agent's own model, free-text, passed through
            to its CLI) and an optional `effort` (its reasoning level).

    ConversationPatch:
      type: object
      properties:
        title: { type: string, nullable: true }

    ConversationOut:
      type: object
      required: [id, agent_key, title, created_at, updated_at]
      properties:
        id: { type: string }
        agent_key: { type: string }
        title: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        archived_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            Null for an active conversation; the instant it was archived
            otherwise.
        channel_binding:
          nullable: true
          description: >-
            The IM channel this conversation is also driven from; null for a
            conversation started on the web page. Present iff the conversation
            stores a channel uid.
          allOf:
            - $ref: '#/components/schemas/ChannelBindingOut'

    ConversationListOut:
      type: object
      required: [conversations]
      properties:
        conversations:
          type: array
          items:
            $ref: '#/components/schemas/ConversationOut'

    ChannelBindingOut:
      type: object
      required: [channel_uid, channel, chat_id]
      properties:
        channel_uid:
          type: string
          description: >-
            The channel's identity. The conversation row stores this, not the
            name, so a renamed channel keeps its conversations — and a client
            follows it to reach the channel.
        channel:
          type: string
          nullable: true
          description: >-
            The channel's current label, resolved when this is read rather than
            stored, so it says what the channel is called now. Null when the
            channel has since been deleted: the conversation keeps its binding —
            it really did arrive over a channel — and there is simply no name
            left to show for it.
        chat_id:
          type: string
          description: The IM chat id used as the return address.

    AgentConfigPatch:
      type: object
      properties:
        model:
          type: string
          nullable: true
          description: >-
            The managed agent's model (free-text, passed through to its CLI).
            Empty or null clears the override; `cwd` and `session_id` are
            preserved.
        effort:
          type: string
          nullable: true
          description: >-
            How hard that model should think, for an agent that takes a
            reasoning effort of its own (Claude Code and Codex both do). Empty or null clears it, so the
            agent runs at whatever its own config says. A body that mentions
            only one of the two fields leaves the other where it was.

    AgentConfigOut:
      type: object
      required: [cwd, model]
      properties:
        cwd: { type: string, nullable: true }
        model: { type: string, nullable: true }
        effort: { type: string, nullable: true }

    ContentBlockOut:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [text, tool_use, tool_result, attachment] }
        text: { type: string, nullable: true }
        tool_use_id: { type: string, nullable: true }
        tool_name: { type: string, nullable: true }
        tool_input: { type: object, additionalProperties: true, nullable: true }
        output: { type: object, additionalProperties: true, nullable: true }
        error: { type: string, nullable: true }
        filename:
          type: string
          nullable: true
          description: >-
            An `attachment` block references a file a channel downloaded or the
            web composer uploaded, by filename and mime only; the local path is
            never emitted to the wire (see "Re-materialise attachments from
            persisted history").
        mime: { type: string, nullable: true }

    MessageOut:
      type: object
      required: [id, conversation_id, seq, role, content, status, created_at]
      properties:
        id: { type: string }
        conversation_id: { type: string }
        seq: { type: integer }
        role: { type: string, enum: [user, assistant] }
        content:
          type: array
          items:
            $ref: '#/components/schemas/ContentBlockOut'
        status: { type: string, enum: [complete, streaming, failed] }
        model_id: { type: string, nullable: true }
        prompt_tokens: { type: integer, nullable: true }
        completion_tokens: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }

    MessageListOut:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MessageOut'

    SendMessageRequest:
      type: object
      description: >-
        A message carries text, at least one attachment, or both — never
        neither (422). An attachment-only message is persisted with a short
        stand-in text naming its files.
      properties:
        text: { type: string, maxLength: 32768, default: "" }
        attachment_ids:
          type: array
          maxItems: 10
          items: { type: string }
          description: >-
            Ids returned by `POST /api/v1/chat/attachments`, in the order the
            files are attached. Each is persisted on the user message as an
            attachment reference (see "Send uploaded files with a web
            message"); an id naming no stored upload is refused with
            `ATTACHMENT_NOT_FOUND` (422) and nothing is persisted or queued.

    ChatAttachmentOut:
      type: object
      required: [id, filename, mime, size]
      properties:
        id:
          type: string
          description: Opaque upload id (32 hex characters) a send names.
        filename:
          type: string
          description: The display name, reduced to its last path segment.
        mime:
          type: string
          description: The type the file is stored and handed to the agent under.
        size:
          type: integer
          description: Size in bytes.

    SendMessageAck:
      type: object
      required: [queued]
      properties:
        queued:
          type: boolean
          description: >-
            True when the message was enqueued behind an in-flight turn; false
            when its turn started immediately.

    PendingQueueIn:
      type: object
      required: [pending]
      properties:
        pending:
          type: array
          items: { type: string }
          description: The new ordered pending-message texts (replaces the queue).

    PendingQueueOut:
      type: object
      required: [pending]
      properties:
        pending:
          type: array
          items: { type: string }
          description: The conversation's current ordered pending-message texts.

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: object
