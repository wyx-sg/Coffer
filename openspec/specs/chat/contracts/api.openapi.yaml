          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageAck'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request failed validation (`CONFIG_INVALID`); the submitted values are not echoed back.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Any other error, as Coffer's error envelope.
      summary: Resend Message
      tags:
      - chat
  /api/v1/chat/conversations/{id}/pending:
    put:
      description: |-
        Replace the conversation's pending message queue (resume / drop / reorder).

        Unpauses the queue and starts the next turn when none is in flight; broadcasts
        ``queue_changed``. 404 when the conversation does not exist.
      operationId: set_pending_api_v1_chat_conversations__id__pending_put
      parameters:
      - in: path
        name: id
        required: true
        schema:
          title: Id
          type: string
      - in: header
        name: x-coffer-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Coffer-Token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PendingQueueIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingQueueOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request failed validation (`CONFIG_INVALID`); the submitted values are not echoed back.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Any other error, as Coffer's error envelope.
      summary: Set Pending
      tags:
      - chat
  /api/v1/chat/conversations/{id}/questions/{question_id}/answer:
    post:
      description: |-
        Answer the question's next unanswered question(s) from the Conversations page.

        404 ``CONVERSATION_NOT_FOUND`` for an unknown conversation; 409
        ``QUESTION_CLOSED`` when the question was already answered (the first answer
        wins), cancelled, or its turn ended; 422 ``QUESTION_ANSWER_INVALID`` for an
        option the question does not offer, several options on a single-choice
        question, or an empty answer. Returns the question as it now stands.
      operationId: answer_question_api_v1_chat_conversations__id__questions__question_id__answer_post
      parameters:
      - in: path
        name: id
        required: true
        schema:
          title: Id
          type: string
      - in: path
        name: question_id
        required: true
        schema:
          title: Question Id
          type: string
      - in: header
        name: x-coffer-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Coffer-Token
      - in: header
        name: x-coffer-actor
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Coffer-Actor
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerQuestionIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request failed validation (`CONFIG_INVALID`); the submitted values are not echoed back.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Any other error, as Coffer's error envelope.
      summary: Answer Question
      tags:
      - chat
  /api/v1/chat/conversations/{id}/unarchive:
    post:
      description: Restore an archived conversation back into the active list.
      operationId: unarchive_conversation_api_v1_chat_conversations__id__unarchive_post
      parameters:
      - in: path
        name: id
        required: true
        schema:
          title: Id
          type: string
      - in: header
        name: x-coffer-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Coffer-Token
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request failed validation (`CONFIG_INVALID`); the submitted values are not echoed back.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Any other error, as Coffer's error envelope.
      summary: Unarchive Conversation
      tags:
      - chat
components:
  schemas:
    AgentConfigOut:
      description: |-
        Read view of a conversation's agent config (managed agents).

        ``session_id`` is provider-internal and deliberately not surfaced.
      properties:
        cwd:
          anyOf:
          - type: string
          - type: 'null'
          title: Cwd
        effort:
          anyOf:
          - type: string
          - type: 'null'
          title: Effort
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
      required:
      - cwd
      - model
      - effort
      title: AgentConfigOut
      type: object
    AgentConfigPatch:
      description: |-
        Body for PATCH /conversations/{id}/agent-config.

        Sets the managed agent's own model (free-text, passed through to its CLI)
        and how hard it should think. An empty or null ``model`` clears the override
        so the conversation inherits the active provider profile's projected
        default; an empty or null ``effort`` clears it so the agent keeps whatever
        its own config says. Each field is written only when the body mentions it,
        so setting one leaves the other alone; ``cwd`` / ``session_id`` are
        preserved (ADR coffer-model-is-an-internal-engine → ADR model-catalogue-read-from-the-agent).
      properties:
        effort:
          anyOf:
          - type: string
          - type: 'null'
          title: Effort
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
      title: AgentConfigPatch
      type: object
    AgentProviderListOut:
      properties:
        agents:
          items:
            $ref: '#/components/schemas/AgentProviderOut'
          title: Agents
          type: array
      required:
      - agents
      title: AgentProviderListOut
      type: object
    AgentProviderOut:
      properties:
        agent_key:
          title: Agent Key
          type: string
        available:
          title: Available
          type: boolean
        display_name:
          title: Display Name
          type: string
      required:
      - agent_key
      - display_name
      - available
      title: AgentProviderOut
      type: object
    AnswerQuestionIn:
      description: |-
        Body for POST .../questions/{question_id}/answer.

        ``answers`` answer the question's still-unanswered questions in order (one
        for the first, or several at once). ``index``, when given, names the question
        being answered: if that one was answered meanwhile the request is refused as
        ``QUESTION_CLOSED`` rather than answering the next.
      properties:
        answers:
          items:
            $ref: '#/components/schemas/QuestionAnswerIn'
          maxItems: 4
          minItems: 1
          title: Answers
          type: array
        index:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          title: Index
      required:
      - answers
      title: AnswerQuestionIn
      type: object
    Body_upload_attachment_api_v1_chat_attachments_post:
      properties:
        file:
          contentMediaType: application/octet-stream
          title: File
          type: string
      required:
      - file
      title: Body_upload_attachment_api_v1_chat_attachments_post
      type: object
    ChannelBindingOut:
      description: |-
        The IM channel a conversation is also driven from (ADR chat-single-owner-live-mirror).

        The return address for relaying the agent's output back to the channel;
        present iff the conversation has a channel binding.
      properties:
        channel:
          anyOf:
          - type: string
          - type: 'null'
          title: Channel
        channel_uid:
          title: Channel Uid
          type: string
        chat_id:
          title: Chat Id
          type: string
        mirror:
          anyOf:
          - $ref: '#/components/schemas/ChannelMirrorOut'
          - type: 'null'
        place:
          anyOf:
          - $ref: '#/components/schemas/ChannelPlaceOut'
          - type: 'null'
        platform:
          anyOf:
          - enum:
            - telegram
            - seatalk
            type: string
          - type: 'null'
          title: Platform
      required:
      - channel_uid
      - channel
      - chat_id
      - platform
      - place
      - mirror
      title: ChannelBindingOut
      type: object
    ChannelMirrorOut:
      description: |-
        Where a reply typed here will also be sent (spec chat "Show where a reply
        will also be sent").

        ``deliverable`` is False when a reply stays in Coffer; ``reason`` then says
        why: ``group_main`` (a group's main chat), ``not_located`` / ``chat_kind_unknown``
        (no chat to write to is known), ``channel_deleted``. ``target`` is the label
        shown before sending, e.g. ``SeaTalk · 🧵#1 deploy check``.
      properties:
        deliverable:
          title: Deliverable
          type: boolean
        platform:
          anyOf:
          - enum:
            - telegram
            - seatalk
            type: string
          - type: 'null'
          title: Platform
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        target:
          title: Target
          type: string
        undelivered:
          items:
            $ref: '#/components/schemas/UndeliveredReplyOut'
          title: Undelivered
          type: array
      required:
      - deliverable
      - platform
      - target
      - reason
      - undelivered
      title: ChannelMirrorOut
      type: object
    ChannelPlaceOut:
      description: |-
        Where in its channel a conversation lives — what the Conversations list's
        source badge names ("SeaTalk · DM · 🧵#2", "SeaTalk · <group> > thread").
      properties:
        chat_kind:
          anyOf:
          - enum:
            - direct
            - group
            type: string
          - type: 'null'
          title: Chat Kind
        chat_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Chat Name
        parallel_mark:
          anyOf:
          - type: string
          - type: 'null'
          title: Parallel Mark
        thread:
          default: false
          title: Thread
          type: boolean
      required:
      - chat_kind
      - thread
      - parallel_mark
      - chat_name
      title: ChannelPlaceOut
      type: object
    ChatAttachmentOut:
      description: |-
        Response for POST /attachments — one stored upload.

        ``id`` is what a send names; the file's local path never leaves the daemon
        (spec chat "Upload a file for a web message").
      properties:
        filename:
          title: Filename
          type: string
        id:
          title: Id
          type: string
        mime:
          title: Mime
          type: string
        size:
          title: Size
          type: integer
      required:
      - id
      - filename
      - mime
      - size
      title: ChatAttachmentOut
      type: object
    ContentBlockOut:
      description: |-
        Wire representation of a ContentBlock (text | tool_use | tool_result |
        attachment | question). ``filename``/``mime`` describe an ``attachment`` reference; the
        local ``path`` is deliberately NOT surfaced (leak/security — spec chat
        "Re-materialise attachments from persisted history").
      properties:
        attachment_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Attachment Id
        duration_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Duration Ms
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        filename:
          anyOf:
          - type: string
          - type: 'null'
          title: Filename
        mime:
          anyOf:
          - type: string
          - type: 'null'
          title: Mime
        output:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Output
        question:
          anyOf:
          - $ref: '#/components/schemas/QuestionOut'
          - type: 'null'
        size:
          anyOf:
          - type: integer
          - type: 'null'
          title: Size
        text:
          anyOf:
          - type: string
          - type: 'null'
          title: Text
        tool_input:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Tool Input
        tool_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Tool Name
        tool_use_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Tool Use Id
        type:
          enum:
          - text
          - tool_use
          - tool_result
          - attachment
          - question
          title: Type
          type: string
      required:
      - type
      - text
      - tool_use_id
      - tool_name
      - tool_input
      - output
      - error
      - duration_ms
      - filename
      - mime
      - attachment_id
      - size
      - question
      title: ContentBlockOut
      type: object
    ConversationBatchIn:
      description: What to do, and to which conversations (at most 200, each listed once).
      properties:
        action:
          enum:
          - archive
          - unarchive
          - delete
          title: Action
          type: string
        ids:
          items:
            type: string
          maxItems: 200
          minItems: 1
          title: Ids
          type: array
      required:
      - action
      - ids
      title: ConversationBatchIn
      type: object
    ConversationBatchOut:
      properties:
        results:
          items:
            $ref: '#/components/schemas/ConversationBatchResultOut'
          title: Results
          type: array
      required:
      - results
      title: ConversationBatchOut
      type: object
    ConversationBatchResultOut:
      properties:
        id:
          title: Id
          type: string
        outcome:
          enum:
          - done
          - skipped
          title: Outcome
          type: string
        reason:
          anyOf:
          - enum:
            - not_found
            - running
            - failed
            type: string
          - type: 'null'
          title: Reason
      required:
      - id
      - outcome
      - reason
      title: ConversationBatchResultOut
      type: object
    ConversationCreate:
      description: |-
        Body for POST /conversations.

        ``agent_key`` selects the Coffer-managed agent to talk to (required — chat
        has no built-in agent of its own, ADR coffer-model-is-an-internal-engine).
        ``agent_config`` is an opaque, agent-specific configuration object the named
        agent validates and stores (e.g. ``cwd`` for ``claude_code`` / ``codex``).
      properties:
        agent_config:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Agent Config
        agent_key:
          title: Agent Key
          type: string
      required:
      - agent_key
      title: ConversationCreate
      type: object
    ConversationListOut:
      description: One page of conversations, newest activity first.
      properties:
        conversations:
          items:
            $ref: '#/components/schemas/ConversationOut'
          title: Conversations
          type: array
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
        total:
          title: Total
          type: integer
      required:
      - conversations
      - next_cursor
      - total
      title: ConversationListOut
      type: object
    ConversationOut:
      description: Single conversation response.
      properties:
        agent_key:
          title: Agent Key
          type: string
        archived_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Archived At
        channel_binding:
          anyOf:
          - $ref: '#/components/schemas/ChannelBindingOut'
          - type: 'null'
        created_at:
          format: date-time
          title: Created At
          type: string
        id:
          title: Id
          type: string
        needs_you:
          default: false
          title: Needs You
          type: boolean
        preview:
          anyOf:
          - type: string
          - type: 'null'
          title: Preview
        running:
          default: false
          title: Running
          type: boolean
        title:
          title: Title
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
      required:
      - id
      - agent_key
      - title
      - created_at
      - updated_at
      - archived_at
      - channel_binding
      - preview
      - running
      - needs_you
      title: ConversationOut
      type: object
    ConversationPatch:
      description: Body for PATCH /conversations/{id}.
      properties:
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
      title: ConversationPatch
      type: object
    ErrorDetail:
      properties:
        code:
          examples:
          - RESOURCE_NOT_FOUND
          title: Code
          type: string
        details:
          additionalProperties: true
          title: Details
          type: object
        message:
          examples:
          - 'resource not found: mcp_server:filesystem'
          title: Message
          type: string
      required:
      - code
      - message
      - details
      title: ErrorDetail
      type: object
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - error
      title: ErrorResponse
      type: object
    MessageListOut:
      description: List of messages for a conversation.
      properties:
        messages:
          items:
            $ref: '#/components/schemas/MessageOut'
          title: Messages
          type: array
      required:
      - messages
      title: MessageListOut
      type: object
    MessageOut:
      description: Single message response.
      properties:
        completion_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Completion Tokens
        content:
          items:
            $ref: '#/components/schemas/ContentBlockOut'
          title: Content
          type: array
        conversation_id:
          title: Conversation Id
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        finished_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Finished At
        id:
          title: Id
          type: string
        model_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Id
        prompt_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Prompt Tokens
        role:
          enum:
          - user
          - assistant
          title: Role
          type: string
        seq:
          title: Seq
          type: integer
        status:
          enum:
          - complete
          - streaming
          - stopped
          - failed
          title: Status
          type: string
      required:
      - id
      - conversation_id
      - seq
      - role
      - content
      - status
      - model_id
      - prompt_tokens
      - completion_tokens
      - created_at
      - finished_at
      title: MessageOut
      type: object
    NeedsYouCountOut:
      description: How many conversations wait on an answer.
      properties:
        count:
          title: Count
          type: integer
      required:
      - count
      title: NeedsYouCountOut
      type: object
    PendingQueueIn:
      description: Body for PUT /conversations/{id}/pending — replaces the ordered queue.
      properties:
        pending:
          items:
            type: string
          title: Pending
          type: array
      required:
      - pending
      title: PendingQueueIn
      type: object
    PendingQueueOut:
      description: |-
        The conversation's current ordered pending-message texts.

        ADR chat-single-owner-live-mirror.
      properties:
        pending:
          items:
            type: string
          title: Pending
          type: array
      required:
      - pending
      title: PendingQueueOut
      type: object
    QuestionAnswerIn:
      description: 'The owner''s answer to one question: option labels and/or free text.'
      properties:
        selected:
          items:
            type: string
          maxItems: 4
          title: Selected
          type: array
        text:
          anyOf:
          - maxLength: 4000
            type: string
          - type: 'null'
          title: Text
      title: QuestionAnswerIn
      type: object
    QuestionAnswerOut:
      description: 'The answer to one question: the chosen option labels and/or typed text.'
      properties:
        header:
          title: Header
          type: string
        selected:
          items:
            type: string
          title: Selected
          type: array
        text:
          anyOf:
          - type: string
          - type: 'null'
          title: Text
      required:
      - header
      - selected
      - text
      title: QuestionAnswerOut
      type: object
    QuestionAskedEventOut:
      description: |-
        The data of a `question_asked` event: the agent asked the owner a question
        and the turn is waiting. Sent again with the same `question_id` as the owner
        answers one question of several; the card is replaced by `question_id`.
      properties:
        question:
          $ref: '#/components/schemas/QuestionOut'
        type:
          const: question_asked
          title: Type
          type: string
      required:
      - type
      - question
      title: QuestionAskedEventOut
      type: object
    QuestionClosedEventOut:
      description: |-
        The data of a `question_closed` event: the question was answered in full,
        or cancelled (the turn stopped or ended).
      properties:
        question:
          $ref: '#/components/schemas/QuestionOut'
        type:
          const: question_closed
          title: Type
          type: string
      required:
      - type
      - question
      title: QuestionClosedEventOut
      type: object
    QuestionOptionOut:
      properties:
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        label:
          title: Label
          type: string
      required:
      - label
      - description
      title: QuestionOptionOut
      type: object
    QuestionOut:
      description: |-
        A question the agent asked the owner (spec chat "Pause a turn on a
        question for the owner") — the ``question`` block of a reply, also the
        payload of the ``question_asked`` / ``question_closed`` events.

        ``answers`` holds the answers given so far, in order (a prefix of
        ``questions`` while ``status`` is ``pending``). ``answered_via`` is ``web`` or
        the answering channel's uid; ``answered_at`` is an ISO-8601 UTC instant.
      properties:
        answered_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Answered At
        answered_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Answered By
        answered_via:
          anyOf:
          - type: string
          - type: 'null'
          title: Answered Via
        answers:
          items:
            $ref: '#/components/schemas/QuestionAnswerOut'
          title: Answers
          type: array
        context:
          anyOf:
          - type: string
          - type: 'null'
          title: Context
        question_id:
          title: Question Id
          type: string
        questions:
          items:
            $ref: '#/components/schemas/QuestionSpecOut'
          title: Questions
          type: array
        status:
          enum:
          - pending
          - answered
          - cancelled
          title: Status
          type: string
      required:
      - question_id
      - context
      - questions
      - status
      - answers
      - answered_via
      - answered_by
      - answered_at
      title: QuestionOut
      type: object
    QuestionSpecOut:
      description: One question of an ask.
      properties:
        header:
          title: Header
          type: string
        multi_select:
          title: Multi Select
          type: boolean
        options:
          items:
            $ref: '#/components/schemas/QuestionOptionOut'
          title: Options
          type: array
        question:
          title: Question
          type: string
      required:
      - header
      - question
      - multi_select
      - options
      title: QuestionSpecOut
      type: object
    QueueChangedEventOut:
      description: 'The data of a `queue_changed` event: the pending-message queue changed.'
      properties:
        pending:
          description: The ordered texts still waiting to run as turns.
          items:
            type: string
          title: Pending
          type: array
        type:
          const: queue_changed
          title: Type
          type: string
      required:
      - type
      - pending
      title: QueueChangedEventOut
      type: object
    SendMessageAck:
      description: |-
        Response for POST /conversations/{id}/messages — fire-and-return
        (ADR chat-single-owner-live-mirror).

        ``queued`` is True when the message was enqueued behind an in-flight turn,
        False when its turn started immediately. ``mirror`` says what became of
        the reply in the channel the conversation came from (spec chat "Mirror a
        web reply into the channel it came from"): ``sent`` to the chat, ``pending``
        until the channel can send, ``kept`` in Coffer only; null for a conversation
        no channel drives.
      properties:
        mirror:
          anyOf:
          - enum:
            - sent
            - pending
            - kept
            type: string
          - type: 'null'
          title: Mirror
        queued:
