  /api/v1/chat/conversations/{id}/events:
    get:
      description: |-
        Subscribe to the conversation's live turn events (SSE, ADR chat-single-owner-live-mirror).

        On attach, the in-flight turn's events so far are replayed (and the current
        pending-queue snapshot), then events stream live; when idle the connection is
        held open and the next turn — from any surface — is streamed. 404 when the
        conversation does not exist. The stream ends on the ``None`` sentinel
        (conversation deleted) or when the client disconnects.
      operationId: subscribe_events_api_v1_chat_conversations__id__events_get
      parameters:
      - in: path
        name: id
        required: true
        schema:
          title: Id
          type: string
      - in: header
        name: x-coffer-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Coffer-Token
      responses:
        '200':
          content:
            text/event-stream:
              itemSchema:
                properties:
                  data:
                    contentMediaType: application/json
                    contentSchema:
                      $ref: '#/components/schemas/TurnEventMessage'
                    type: string
                  event:
                    type: string
                  id:
                    type: string
                  retry:
                    minimum: 0
                    type: integer
                required:
                - data
                type: object
          description: A Server-Sent Events stream of the nine turn events (`turn_start`, `text_delta`, `tool_call`, `tool_result`, `turn_done`, `turn_error`, `queue_changed`, `question_asked`, `question_closed`) that stays open across turns until the client disconnects.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request failed validation (`CONFIG_INVALID`); the submitted values are not echoed back.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Any other error, as Coffer's error envelope.
      summary: Subscribe Events
      tags:
      - chat
