openapi: 3.1.0
info:
  title: Coffer — Credentials API
  version: 0.1.0
  description: The Credentials routes of Coffer's management API, generated from the daemon's Pydantic models. The behaviour behind them is this capability's spec.md; authentication, the error envelope and tracing are described once in the docs-site REST API reference. Every route except `GET /api/v1/daemon/status` requires the `X-Coffer-Token` header.
servers:
- url: http://127.0.0.1:8000
paths:
  /api/v1/credentials:
    get:
      description: |-
        Every credential ref a registered resource cites, with its presence.

        Refs come from every kind's credential extractor (MCP server headers,
        channel bot tokens, provider API keys, ...), so a vault restored without
        its secrets can say which ones are missing. Presence only — no value is
        decrypted, so nothing is audited.
      operationId: list_cited_refs_api_v1_credentials_get
      parameters:
      - in: header
        name: x-coffer-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Coffer-Token
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialListOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request failed validation (`CONFIG_INVALID`); the submitted values are not echoed back.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Any other error, as Coffer's error envelope.
      summary: List Cited Refs
      tags:
      - credentials
    post:
      description: Store `value` under `ref` in the encrypted credential store.
      operationId: set_secret_api_v1_credentials_post
      parameters:
      - in: header
        name: x-coffer-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Coffer-Token
      - in: header
        name: x-coffer-actor
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Coffer-Actor
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialSetIn'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request failed validation (`CONFIG_INVALID`); the submitted values are not echoed back.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Any other error, as Coffer's error envelope.
      summary: Set Secret
      tags:
      - credentials
  /api/v1/credentials/{ref}:
    delete:
      description: |-
        Remove `ref` from the credential store. Idempotent — absent is fine,
        and audited only when a row was actually removed.

        Refuses with 409 CREDENTIAL_IN_USE when a resource config still references
        this credential: deleting it would silently break that channel / model /
        mcp_server, whose config only keeps the credential ref. The 409 names the
        citing resources so the user knows what to detach first.
      operationId: delete_secret_api_v1_credentials__ref__delete
      parameters:
      - in: path
        name: ref
        required: true
        schema:
          title: Ref
          type: string
      - in: header
        name: x-coffer-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Coffer-Token
      - in: header
        name: x-coffer-actor
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Coffer-Actor
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request failed validation (`CONFIG_INVALID`); the submitted values are not echoed back.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Any other error, as Coffer's error envelope.
      summary: Delete Secret
      tags:
      - credentials
    get:
      description: |-
        Return the secret value stored under `ref`.

        Reading a value out is audited (ref only — the value never reaches the
        audit row), so explicit secret reads leave a trail. 404 when absent.
      operationId: get_secret_api_v1_credentials__ref__get
      parameters:
      - in: path
        name: ref
        required: true
        schema:
          title: Ref
          type: string
      - in: header
        name: x-coffer-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Coffer-Token
      - in: header
        name: x-coffer-actor
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Coffer-Actor
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialGetOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request failed validation (`CONFIG_INVALID`); the submitted values are not echoed back.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Any other error, as Coffer's error envelope.
      summary: Get Secret
      tags:
      - credentials
  /api/v1/credentials/{ref}/exists:
    get:
      description: |-
        Report whether a secret is stored under `ref`.

        Presence only — the value is never decrypted or read out for this check,
        so no audit event is recorded and a corrupt (undecryptable) row can't
        500 the probe; it still reports present.
      operationId: secret_exists_api_v1_credentials__ref__exists_get
      parameters:
      - in: path
        name: ref
        required: true
        schema:
          title: Ref
          type: string
      - in: header
        name: x-coffer-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Coffer-Token
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialExistsOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request failed validation (`CONFIG_INVALID`); the submitted values are not echoed back.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Any other error, as Coffer's error envelope.
      summary: Secret Exists
      tags:
      - credentials
  /api/v1/settings/credentials:
    get:
      description: Report where the master key currently lives.
      operationId: get_credential_settings_api_v1_settings_credentials_get
      parameters:
      - in: header
        name: x-coffer-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Coffer-Token
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialSettingsOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request failed validation (`CONFIG_INVALID`); the submitted values are not echoed back.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Any other error, as Coffer's error envelope.
      summary: Get Credential Settings
      tags:
      - settings
    put:
      description: |-
        Relocate the master key. Idempotent; the move itself is audited.

        Moving to "keychain" may trigger one OS authorisation prompt — the
        keychain write runs off the event loop.
      operationId: put_credential_settings_api_v1_settings_credentials_put
      parameters:
      - in: header
        name: x-coffer-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Coffer-Token
      - in: header
        name: x-coffer-actor
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Coffer-Actor
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialSettingsIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialSettingsOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request failed validation (`CONFIG_INVALID`); the submitted values are not echoed back.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Any other error, as Coffer's error envelope.
      summary: Put Credential Settings
      tags:
      - settings
components:
  schemas:
    CredentialCiterOut:
      description: A resource citing a credential ref — identity and label, never config.
      properties:
        kind:
          title: Kind
          type: string
        name:
          title: Name
          type: string
        uid:
          title: Uid
          type: string
      required:
      - uid
      - kind
      - name
      title: CredentialCiterOut
      type: object
    CredentialExistsOut:
      description: Presence-only response — never carries the secret value.
      properties:
        present:
          description: Whether a secret is stored under the ref.
          title: Present
          type: boolean
      required:
      - present
      title: CredentialExistsOut
      type: object
    CredentialGetOut:
      description: Secret-value response for an explicit read from the credential store.
      properties:
        value:
          description: The stored secret value.
          title: Value
          type: string
      required:
      - value
      title: CredentialGetOut
      type: object
    CredentialListOut:
      description: Every ref a registered resource cites, of any kind, sorted by ref.
      properties:
        refs:
          items:
            $ref: '#/components/schemas/CredentialRefOut'
          title: Refs
          type: array
      required:
      - refs
      title: CredentialListOut
      type: object
    CredentialRefOut:
      description: One cited credential ref and whether the store holds it.
      properties:
        cited_by:
          items:
            $ref: '#/components/schemas/CredentialCiterOut'
          title: Cited By
          type: array
        present:
          description: Whether a secret is stored under the ref.
          title: Present
          type: boolean
        ref:
          title: Ref
          type: string
      required:
      - ref
      - present
      - cited_by
      title: CredentialRefOut
      type: object
    CredentialSetIn:
      description: |-
        Request body for storing a secret in the credential store.

        Secrets are Fernet-encrypted into the coffer DB; only ciphertext is
        persisted; audit rows carry the ref only.
      properties:
        ref:
          description: Reference key the secret is stored under. Slash-separated segments are allowed (e.g. channel/tg/bot-token).
          minLength: 1
          pattern: ^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$
          title: Ref
          type: string
        value:
          description: The secret value.
          maxLength: 8192
          minLength: 1
          title: Value
          type: string
      required:
      - ref
      - value
      title: CredentialSetIn
      type: object
    CredentialSettingsIn:
      description: Request body to relocate the master key.
      properties:
        master_key_storage:
          enum:
          - file
          - keychain
          title: Master Key Storage
          type: string
      required:
      - master_key_storage
      title: CredentialSettingsIn
      type: object
    CredentialSettingsOut:
      description: Where the credential-store master key currently lives.
      properties:
        master_key_storage:
          description: file = ~/.coffer/master.key (default); keychain = OS keychain entry.
          enum:
          - file
          - keychain
          title: Master Key Storage
          type: string
      required:
      - master_key_storage
      title: CredentialSettingsOut
      type: object
    ErrorDetail:
      properties:
        code:
          examples:
          - RESOURCE_NOT_FOUND
          title: Code
          type: string
        details:
          additionalProperties: true
          title: Details
          type: object
        message:
          examples:
          - 'resource not found: mcp_server:filesystem'
          title: Message
          type: string
      required:
      - code
      - message
      - details
      title: ErrorDetail
      type: object
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - error
      title: ErrorResponse
      type: object
