components:
  schemas:
    ActivateIn:
      description: |-
        Which agent to switch onto the connection. There is one agent per type
        (spec agent-registry "Keep one agent per type, named by it"), so the type
        names it; the switch changes that agent and no other.
      properties:
        agent_type:
          $ref: '#/components/schemas/AgentType'
      required:
      - agent_type
      title: ActivateIn
      type: object
    ActivateOut:
      description: Result of switching one agent onto a connection.
      properties:
        activated:
          title: Activated
          type: string
        agent:
          title: Agent
          type: string
        agent_type:
          $ref: '#/components/schemas/AgentType'
        protocol:
          $ref: '#/components/schemas/Protocol'
      required:
      - activated
      - protocol
      - agent_type
      - agent
      title: ActivateOut
      type: object
    AgentType:
      description: Supported agent products.
      enum:
      - claude_code
      - codex
      title: AgentType
      type: string
    CuratedPrice:
      additionalProperties: false
      description: |-
        What the user says this connection charges for a model, in USD per
        million tokens (web search per thousand requests). Relays and resellers
        price differently from the vendor, so a connection's own price wins over
        every other source when usage is costed (spec provider-switching "Resolve
        each model's price from the provider, its API, or the bundled list"). A cache category
        left out is charged at the input rate, so an estimate errs high.
      properties:
        cache_read:
          anyOf:
          - minimum: 0.0
            type: number
          - type: 'null'
          title: Cache Read
        cache_write_1h:
          anyOf:
          - minimum: 0.0
            type: number
          - type: 'null'
          title: Cache Write 1H
        cache_write_5m:
          anyOf:
          - minimum: 0.0
            type: number
          - type: 'null'
          title: Cache Write 5M
        input:
          minimum: 0.0
          title: Input
          type: number
        output:
          minimum: 0.0
          title: Output
          type: number
        web_search:
          anyOf:
          - minimum: 0.0
            type: number
          - type: 'null'
          title: Web Search
      required:
      - input
      - output
      title: CuratedPrice
      type: object
    DeactivateOut:
      description: Result of switching an agent type back to its own built-in login.
      properties:
        agent_type:
          $ref: '#/components/schemas/AgentType'
        deprojected:
          items:
            type: string
          title: Deprojected
          type: array
        previous:
          anyOf:
          - type: string
          - type: 'null'
          title: Previous
      required:
      - agent_type
      - deprojected
      - previous
      title: DeactivateOut
      type: object
    DeletePreviewAgentOut:
      properties:
        agent_name:
          title: Agent Name
          type: string
        agent_type:
          $ref: '#/components/schemas/AgentType'
        agent_uid:
          title: Agent Uid
          type: string
        files:
          items:
            $ref: '#/components/schemas/DeletePreviewFileOut'
          title: Files
          type: array
      required:
      - agent_uid
      - agent_type
      - agent_name
      - files
      title: DeletePreviewAgentOut
      type: object
    DeletePreviewFileOut:
      description: One agent file that deleting the connection would change.
      properties:
        diff:
          items:
            $ref: '#/components/schemas/DeletePreviewLine'
          title: Diff
          type: array
        op:
          enum:
          - modify
          - remove
          title: Op
          type: string
        path:
          title: Path
          type: string
      required:
      - path
      - op
      - diff
      title: DeletePreviewFileOut
      type: object
    DeletePreviewLine:
      properties:
        kind:
          enum:
          - context
          - add
          - remove
          - hunk
          title: Kind
          type: string
        new_no:
          anyOf:
          - type: integer
          - type: 'null'
          title: New No
        old_no:
          anyOf:
          - type: integer
          - type: 'null'
          title: Old No
        text:
          title: Text
          type: string
      required:
      - kind
      - text
      - old_no
      - new_no
      title: DeletePreviewLine
      type: object
    DetectLocalIn:
      description: Probe one loopback URL, or — with none — each runtime's default port.
      properties:
        base_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Base Url
      title: DetectLocalIn
      type: object
    DetectLocalOut:
      properties:
        found:
          items:
            $ref: '#/components/schemas/LocalRuntimeOut'
          title: Found
          type: array
        handoff:
          anyOf:
          - $ref: '#/components/schemas/HandoffOut'
          - type: 'null'
      required:
      - found
      - handoff
      title: DetectLocalOut
      type: object
    ErrorDetail:
      properties:
        code:
          examples:
          - RESOURCE_NOT_FOUND
          title: Code
          type: string
        details:
          additionalProperties: true
          title: Details
          type: object
        message:
          examples:
          - 'resource not found: mcp_server:filesystem'
          title: Message
          type: string
      required:
      - code
      - message
      - details
      title: ErrorDetail
      type: object
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - error
      title: ErrorResponse
      type: object
    GroupBy:
      enum:
      - model
      - agent
      - day
      title: GroupBy
      type: string
    HandoffOut:
      description: |-
        A chore for the person's agent. ``prompt`` is the whole text to copy or
        to pre-fill a new conversation with; Coffer never sends it itself.
      properties:
        prompt:
          title: Prompt
          type: string
      required:
      - prompt
      title: HandoffOut
      type: object
    ListModelsIn:
      properties:
        base_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Base Url
        provider:
          title: Provider
          type: string
        secret_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Secret Ref
        secret_value:
          anyOf:
          - type: string
          - type: 'null'
          title: Secret Value
      required:
      - provider
      title: ListModelsIn
      type: object
    LocalModelOut:
      properties:
        context_window:
          anyOf:
          - type: integer
          - type: 'null'
          title: Context Window
        id:
          title: Id
          type: string
        tools:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Tools
      required:
      - id
      - context_window
      - tools
      title: LocalModelOut
      type: object
    LocalRuntime:
      additionalProperties: false
      description: What detection found at a local connection's endpoint.
      properties:
        runtime:
          $ref: '#/components/schemas/Runtime'
        version:
          anyOf:
          - type: string
          - type: 'null'
          title: Version
        wires:
          items:
            type: string
          title: Wires
          type: array
      required:
      - runtime
      title: LocalRuntime
      type: object
    LocalRuntimeOut:
      properties:
        base_url:
          title: Base Url
          type: string
        models:
          items:
            $ref: '#/components/schemas/LocalModelOut'
          title: Models
          type: array
        runtime:
          $ref: '#/components/schemas/LocalRuntime'
      required:
      - base_url
      - runtime
      - models
      title: LocalRuntimeOut
      type: object
    Modality:
      description: The kind of output a model produces.
      enum:
      - text
      - embedding
      - image
      - video
      - audio
      title: Modality
      type: string
    ModelPriceOut:
      description: |-
        One model's price on a provider and where it came from (spec
        provider-switching "Resolve each model's price from the provider, its API,
        or the bundled list"). USD per million tokens; ``source`` ``None`` means no
        price is known and every rate is ``None`` — shown as "—", never as zero.
        ``source_name`` names the provider whose API reported it (``provider``) or
        the price list's provider (``bundled``). ``tiered``: the rates shown are
        the base tier; past a threshold of input tokens the request pays more.
      properties:
        cache_read:
          anyOf:
          - type: number
          - type: 'null'
          title: Cache Read
        cache_write_1h:
          anyOf:
          - type: number
          - type: 'null'
          title: Cache Write 1H
        cache_write_5m:
          anyOf:
          - type: number
          - type: 'null'
          title: Cache Write 5M
        input:
          anyOf:
          - type: number
          - type: 'null'
          title: Input
        model:
          title: Model
          type: string
        output:
          anyOf:
          - type: number
          - type: 'null'
          title: Output
        source:
          anyOf:
          - $ref: '#/components/schemas/PriceSource'
          - type: 'null'
        source_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Name
        source_updated:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Source Updated
        tiered:
          default: false
          title: Tiered
          type: boolean
      required:
      - model
      - source
      - source_name
      - input
      - output
      - cache_write_5m
      - cache_write_1h
      - cache_read
      - tiered
      - source_updated
      title: ModelPriceOut
      type: object
    ModelPricesIn:
      description: The models whose price on this provider to resolve.
      properties:
        models:
          items:
            type: string
          maxItems: 1000
          title: Models
          type: array
      required:
      - models
      title: ModelPricesIn
      type: object
    ModelPricesOut:
      properties:
        bundled_version:
          title: Bundled Version
          type: string
        prices:
          items:
            $ref: '#/components/schemas/ModelPriceOut'
          title: Prices
          type: array
      required:
      - prices
      - bundled_version
      title: ModelPricesOut
      type: object
    ModelSwitchFile:
      description: One file the switch changes (or would change).
      properties:
        added:
          title: Added
          type: integer
        diff:
          items:
            $ref: '#/components/schemas/ModelSwitchLine'
          title: Diff
          type: array
        fingerprint:
          title: Fingerprint
          type: string
        op:
          enum:
          - add
          - modify
          - remove
          title: Op
          type: string
        path:
          title: Path
          type: string
        removed:
          title: Removed
          type: integer
      required:
      - path
      - op
      - added
      - removed
      - diff
      - fingerprint
      title: ModelSwitchFile
      type: object
    ModelSwitchIn:
      description: |-
        What the agent page's Change model dialog asks for.

        ``connection_uid`` ``null`` is the agent's own built-in login: no model,
        effort or tiers are written, and Coffer removes only the keys it wrote.
        ``seen`` is sent only to apply: each previewed file's path with the
        fingerprint the preview read, so a file edited since is refused.
      properties:
        agent_type:
          $ref: '#/components/schemas/AgentType'
        connection_uid:
          anyOf:
          - type: string
          - type: 'null'
          title: Connection Uid
        effort:
          anyOf:
          - type: string
          - type: 'null'
          title: Effort
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
        seen:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Seen
        tier_models:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Tier Models
      required:
      - agent_type
      title: ModelSwitchIn
      type: object
    ModelSwitchLine:
      properties:
        kind:
          enum:
          - context
          - add
          - remove
          - hunk
          title: Kind
          type: string
        new_no:
          anyOf:
          - type: integer
          - type: 'null'
          title: New No
        old_no:
          anyOf:
          - type: integer
          - type: 'null'
          title: Old No
        text:
          title: Text
          type: string
      required:
      - kind
      - text
      - old_no
      - new_no
      title: ModelSwitchLine
      type: object
    ModelSwitchOut:
      properties:
        agent_name:
          title: Agent Name
          type: string
        agent_uid:
          title: Agent Uid
          type: string
        connection_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Connection Name
        files:
          items:
            $ref: '#/components/schemas/ModelSwitchFile'
          title: Files
          type: array
      required:
      - agent_uid
      - agent_name
      - connection_name
      - files
      title: ModelSwitchOut
      type: object
    PriceListIn:
      properties:
        refresh:
          title: Refresh
          type: boolean
      required:
      - refresh
      title: PriceListIn
      type: object
    PriceListOut:
      description: |-
        The price list pricing reads now, and its daily refresh (spec
