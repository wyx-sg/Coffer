components:
  schemas:
    ActivateOut:
      description: Result of a switch — which agents were written, which wire had none.
      properties:
        activated:
          title: Activated
          type: string
        projected:
          items:
            type: string
          title: Projected
          type: array
        protocol:
          $ref: '#/components/schemas/Protocol'
        skipped:
          items:
            type: string
          title: Skipped
          type: array
      required:
      - activated
      - protocol
      - projected
      - skipped
      title: ActivateOut
      type: object
    AgentType:
      description: Supported agent products.
      enum:
      - claude_code
      - codex
      title: AgentType
      type: string
    DeactivateOut:
      description: Result of switching an agent type back to its own built-in login.
      properties:
        agent_type:
          $ref: '#/components/schemas/AgentType'
        deprojected:
          items:
            type: string
          title: Deprojected
          type: array
        previous:
          anyOf:
          - type: string
          - type: 'null'
          title: Previous
      required:
      - agent_type
      - deprojected
      - previous
      title: DeactivateOut
      type: object
    DetectLocalIn:
      description: Probe one loopback URL, or — with none — each runtime's default port.
      properties:
        base_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Base Url
      title: DetectLocalIn
      type: object
    DetectLocalOut:
      properties:
        found:
          items:
            $ref: '#/components/schemas/LocalRuntimeOut'
          title: Found
          type: array
      required:
      - found
      title: DetectLocalOut
      type: object
    DetectProtocolIn:
      properties:
        base_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Base Url
        credential_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Credential Ref
        secret_value:
          anyOf:
          - type: string
          - type: 'null'
          title: Secret Value
      title: DetectProtocolIn
      type: object
    DetectProtocolOut:
      properties:
        protocol:
          title: Protocol
          type: string
      required:
      - protocol
      title: DetectProtocolOut
      type: object
    ErrorDetail:
      properties:
        code:
          examples:
          - RESOURCE_NOT_FOUND
          title: Code
          type: string
        details:
          additionalProperties: true
          title: Details
          type: object
        message:
          examples:
          - 'resource not found: mcp_server:filesystem'
          title: Message
          type: string
      required:
      - code
      - message
      - details
      title: ErrorDetail
      type: object
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - error
      title: ErrorResponse
      type: object
    ListModelsIn:
      properties:
        base_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Base Url
        credential_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Credential Ref
        provider:
          title: Provider
          type: string
        secret_value:
          anyOf:
          - type: string
          - type: 'null'
          title: Secret Value
      required:
      - provider
      title: ListModelsIn
      type: object
    LocalModelOut:
      properties:
        context_window:
          anyOf:
          - type: integer
          - type: 'null'
          title: Context Window
        id:
          title: Id
          type: string
        tools:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Tools
      required:
      - id
      - context_window
      - tools
      title: LocalModelOut
      type: object
    LocalRuntime:
      additionalProperties: false
      description: What detection found at a local connection's endpoint.
      properties:
        runtime:
          $ref: '#/components/schemas/Runtime'
        version:
          anyOf:
          - type: string
          - type: 'null'
          title: Version
        wires:
          items:
            type: string
          title: Wires
          type: array
      required:
      - runtime
      title: LocalRuntime
      type: object
    LocalRuntimeOut:
      properties:
        base_url:
          title: Base Url
          type: string
        models:
          items:
            $ref: '#/components/schemas/LocalModelOut'
          title: Models
          type: array
        runtime:
          $ref: '#/components/schemas/LocalRuntime'
      required:
      - base_url
      - runtime
      - models
      title: LocalRuntimeOut
      type: object
    Modality:
      description: The kind of output a model produces.
      enum:
      - text
      - embedding
      - image
      - video
      - audio
      title: Modality
      type: string
    Protocol:
      description: |-
        Upstream wire protocol a connection speaks (detected, not user-typed).

        ``anthropic`` / ``openai`` / ``unknown`` connections start UNSCOPED — open
        to every agent, including one registered tomorrow — and the user narrows
        from there; ``unknown`` means the probe was inconclusive, and the
        conservative answer to that is "ask", not "guess". ``ollama`` is
        internal-only: it starts scoped to NO agent and is used solely by Coffer's
        internal LLM engine.
      enum:
      - anthropic
      - openai
      - ollama
      - unknown
      title: Protocol
      type: string
    ProviderCreate:
      description: |-
        Create an LLM connection. For ``anthropic`` / ``openai`` / ``unknown``
        supply EXACTLY one of ``secret_value`` / ``credential_ref``; an ``ollama``
        connection has no key, so supply neither. WHICH agents the connection
        projects into is not set here: the new connection starts on the wire's own
        default scope and is re-targeted through the framework's scope surface
        (``PUT /api/v1/resources/{uid}/scope``), the same one every scoped
        kind uses. ``models`` curates which of the endpoint's models this connection
        offers downstream, each with its modality (``None`` ⇒ empty ⇒ no restriction).
      properties:
        base_url:
          minLength: 1
          title: Base Url
          type: string
        credential_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Credential Ref
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        local_runtime:
          anyOf:
          - $ref: '#/components/schemas/LocalRuntime'
          - type: 'null'
        models:
          anyOf:
          - items:
              $ref: '#/components/schemas/ProviderModel'
            type: array
          - type: 'null'
          title: Models
        name:
          maxLength: 64
          minLength: 1
          title: Name
          type: string
        protocol:
          $ref: '#/components/schemas/Protocol'
        secret_value:
          anyOf:
          - maxLength: 8192
            type: string
          - type: 'null'
          title: Secret Value
      required:
      - name
      - protocol
      - base_url
      title: ProviderCreate
      type: object
    ProviderListOut:
      properties:
        providers:
          items:
            $ref: '#/components/schemas/ProviderOut'
          title: Providers
          type: array
      required:
      - providers
      title: ProviderListOut
      type: object
    ProviderModel:
      description: |-
        One model on a connection: an opaque id plus what KIND of model it is.

        The same shape is used both ways — the curated entries a connection stores
        and the ids endpoint introspection discovers — so the connection editor can
        round-trip a discovered model into the curated set without reshaping it.
        ``modality`` defaults to ``text``, the kind every curated set held before
        modalities existed.
      properties:
        context_window:
          anyOf:
          - maximum: 100000000.0
            minimum: 1024.0
            type: integer
          - type: 'null'
          title: Context Window
        default_effort:
          anyOf:
          - type: string
          - type: 'null'
          title: Default Effort
        effort_levels:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Effort Levels
        id:
          maxLength: 200
          minLength: 1
          title: Id
          type: string
        modality:
          $ref: '#/components/schemas/Modality'
          default: text
      required:
      - id
      title: ProviderModel
      type: object
    ProviderModelsOut:
      description: |-
        What an endpoint reports it serves, each id tagged with the modality
        Coffer INFERRED from its name — a pre-fill for the connection editor's
        model table, which the user corrects. Nothing downstream reads this guess:
        once an entry is curated, the stored modality is the truth.
      properties:
        message:
          default: ''
          title: Message
          type: string
        models:
          items:
            $ref: '#/components/schemas/ProviderModel'
          title: Models
          type: array
      required:
      - models
      - message
      title: ProviderModelsOut
      type: object
    ProviderOut:
      description: |-
        An LLM connection as returned by the API (no secret).

        ``credential_ref`` is ``None`` for ``ollama`` connections (no key).
        ``compatible_agents`` is the CONFIGURED reach — the agent types this
        connection's per-agent scope (ADR per-agent-resource-scope) covers among the
        agents Coffer knows, not narrowed by ``enabled``, and empty for a keyless
        (ollama) connection — so the UI can filter agents without re-deriving it.
        It is READ-ONLY: it is reported here, and changed through the scope
        surface. ``models`` is the
        curated set of models this connection offers to every downstream picker, each
        carrying its modality; EMPTY means no restriction — the endpoint's whole
        catalogue. A picker takes the entries of the modality it serves, so a chat
        dropdown never offers an embedding or image model. ``internal_default``
        marks the connection Coffer's internal engine uses (at most one globally),
        ``transcribe_default`` the one it transcribes speech on — a separate flag
        because they are separate models and neither falls back to the other; and
        ``is_active`` marks the one currently projected. A connection may carry any
        combination.

        ``uid`` is the connection's identity and what every route here takes; the
        ``name`` beside it is the label, free to change through
        ``PATCH /api/v1/resources/{uid}`` without anything downstream noticing. That
        is the whole reason this kind no longer owns a rename operation of its own:
        the projected ``apiKeyHelper`` cites the uid, so a rename rewrites nothing
        (ADR resource-identity-is-an-immutable-uid).
      properties:
        base_url:
          title: Base Url
          type: string
        compatible_agents:
          items:
            $ref: '#/components/schemas/AgentType'
          title: Compatible Agents
          type: array
        created_at:
          format: date-time
          title: Created At
          type: string
        credential_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Credential Ref
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        enabled:
          title: Enabled
          type: boolean
        internal_default:
          title: Internal Default
          type: boolean
        is_active:
          title: Is Active
          type: boolean
        local_runtime:
          anyOf:
          - $ref: '#/components/schemas/LocalRuntime'
          - type: 'null'
        models:
          items:
            $ref: '#/components/schemas/ProviderModel'
          title: Models
          type: array
        name:
          title: Name
          type: string
        protocol:
          $ref: '#/components/schemas/Protocol'
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        transcribe_default:
          title: Transcribe Default
          type: boolean
        uid:
          title: Uid
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
      required:
      - uid
      - name
      - title
      - protocol
      - base_url
      - credential_ref
      - compatible_agents
      - models
      - is_active
      - internal_default
      - transcribe_default
      - enabled
      - description
      - created_at
      - local_runtime
      - updated_at
      title: ProviderOut
      type: object
    ProviderPatch:
      description: |-
        Partial update. ``credential_ref`` is immutable (it is the vault address
        the connection owns); ``protocol`` is not — the probe that guessed the wire
        can be wrong, so it is corrected in place rather than by re-entering the
        connection, key and all.

        The wire DOES decide one thing, though, so that correction is refused with
        409 ``PROVIDER_PROTOCOL_LOCKED_WHILE_ACTIVE`` while the connection is
        ``is_active``: an ``ollama`` connection covers no agent whatever its scope
        says. Moving the wire under a live projection would leave the native config
        already written with nothing that would ever take it off. Revert the agents to their
        built-in login, patch, then re-activate. An inactive connection patches
        freely.

        Re-targeting which agents the connection projects into is a scope edit, not
        a patch field (re-target then re-activate to re-project). ``models``
        replaces the curated set as a whole: ``None`` leaves it alone, ``[]`` clears
        the restriction.
      properties:
        base_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Base Url
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        models:
          anyOf:
          - items:
              $ref: '#/components/schemas/ProviderModel'
            type: array
          - type: 'null'
          title: Models
        protocol:
          anyOf:
          - $ref: '#/components/schemas/Protocol'
          - type: 'null'
        secret_value:
          anyOf:
          - maxLength: 8192
            type: string
          - type: 'null'
          title: Secret Value
      title: ProviderPatch
      type: object
    ProxyStatusOut:
      properties:
        last_error:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Error
        pid:
          anyOf:
          - type: integer
          - type: 'null'
          title: Pid
        port:
          title: Port
          type: integer
        restarts:
          title: Restarts
          type: integer
        revision:
          anyOf:
          - type: integer
          - type: 'null'
          title: Revision
        running:
          title: Running
          type: boolean
        version:
          anyOf:
          - type: string
          - type: 'null'
          title: Version
      required:
      - running
      - pid
      - port
      - version
      - restarts
      - last_error
      - revision
      title: ProxyStatusOut
      type: object
    ProxyTokenOut:
      properties:
        agent_uid:
          title: Agent Uid
          type: string
        token:
          title: Token
          type: string
      required:
      - agent_uid
      - token
      title: ProxyTokenOut
      type: object
    ProxyTokenRotatedOut:
      properties:
        agent_uid:
          title: Agent Uid
          type: string
        rotated:
          title: Rotated
          type: boolean
      required:
      - agent_uid
      - rotated
      title: ProxyTokenRotatedOut
      type: object
    Runtime:
      enum:
      - ollama
      - lmstudio
      - vllm
      - llama_server
      title: Runtime
      type: string
    TestConnectionIn:
      properties:
        base_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Base Url
        credential_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Credential Ref
        model:
          title: Model
          type: string
        provider:
          title: Provider
          type: string
        secret_value:
          anyOf:
          - type: string
          - type: 'null'
          title: Secret Value
      required:
      - provider
      - model
      title: TestConnectionIn
      type: object
    TestResultOut:
      properties:
        detail:
          additionalProperties: true
          default: {}
          title: Detail
          type: object
        message:
          title: Message
          type: string
        ok:
          title: Ok
          type: boolean
      required:
      - ok
      - message
      - detail
      title: TestResultOut
      type: object
