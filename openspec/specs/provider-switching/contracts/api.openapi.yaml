openapi: 3.1.0
info:
  title: Coffer — Provider Switching API
  version: "0.1.0"
  description: |
    Provider registry endpoints. Merged into the main Coffer Management API at
    runtime; this document scopes only the provider-specific routes added by
    the provider-switching spec.

    All routes use the same `X-Coffer-Token` authentication from
    `openspec/specs/mcp-gateway/contracts/api.openapi.yaml`.

    Hand-written; NOT contract-test-gated. Sync with the implementation manually.

    Security note: `ProviderOut` never includes the raw secret. `credential_ref`,
    `compatible_agents`, `enabled`, `is_active`, `internal_default` and
    `transcribe_default` are always present.

servers:
  - url: http://127.0.0.1:{port}/api/v1
    variables:
      port:
        default: "8000"

security:
  - cofferToken: []

tags:
  - name: providers
    description: Provider profile registry and activation
  - name: models
    description: >
      Read-only introspection of a connection — what it serves and whether it
      answers. Used by the connection editor before a provider is saved, which
      is why every operation accepts an inline `secret_value` as well as a
      stored `credential_ref`.

paths:
  /providers:
    get:
      tags: [providers]
      operationId: listProviders
      summary: List all provider profiles
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderListOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }

    post:
      tags: [providers]
      operationId: createProvider
      summary: Create a new provider connection
      description: |
        Credential source depends on `protocol`:
        - For `anthropic`/`openai`, exactly one credential source must be
          supplied:
          - `secret_value`: the raw API key — stored to the Fernet vault under
            `provider/<name>/key` and kept only as a `credential_ref`.
          - `credential_ref`: reuse an existing vault ref.
          Supplying both or neither is rejected with 422.
        - For `ollama`, the credential is OPTIONAL — supply NEITHER
          `secret_value` nor `credential_ref` (an ollama connection has no
          key). Supplying either is rejected with 422.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderCreateRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderOut" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /providers/{uid}:
    parameters:
      - in: path
        name: uid
        required: true
        schema: { type: string }
        description: The connection Resource's immutable identity.

    get:
      tags: [providers]
      operationId: getProvider
      summary: Get a single provider profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

    patch:
      tags: [providers]
      operationId: updateProvider
      summary: Update a provider profile
      description: |
        All fields are optional. Supplying `secret_value` rotates the stored
        secret (overwrites the vault entry at the existing `credential_ref`).
        `protocol` and `credential_ref` are immutable (identity) — change
        them by recreating the profile.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderPatchRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderOut" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

    delete:
      tags: [providers]
      operationId: deleteProvider
      summary: Delete a provider profile
      description: |
        If the profile owns its `credential_ref` (no other profile cites it),
        the Fernet vault entry is also deleted. Guarded by
        `find_credential_citations`.
      responses:
        "204":
          description: No Content
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /providers/{uid}/activate:
    parameters:
      - in: path
        name: uid
        required: true
        schema: { type: string }
        description: The connection to activate, by uid.

    post:
      tags: [providers]
      operationId: activateProvider
      summary: Activate (switch to) a provider profile
      description: |
        Sets this profile as the active one for its `protocol` (at most one
        active per wire at any time). Atomically clears `is_active` on all
        other profiles of the same `protocol`.

        For each ENABLED registered agent whose native wire matches the
        profile's `protocol`, projects (writes native config):
        - `anthropic` → `~/.claude/settings.json` (apiKeyHelper + env keys)
        - `openai` → `~/.codex/config.toml` (model + model_providers.coffer)

        If no matching agent is registered, the profile is still activated and
        the response carries the agent in `skipped` — NOT an error.

        An `ollama` connection is internal-only: it is refused with 409
        `PROVIDER_INTERNAL_ONLY`, never becomes `is_active`, and no native
        config is written.

        Emits a `PROVIDER_SWITCHED` audit event with details
        `{from, to, protocol, agents: [...projected...]}`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivateOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /providers/{uid}/internal-default:
    parameters:
      - in: path
        name: uid
        required: true
        schema: { type: string }
        description: The connection to make the internal-engine default, by uid.

    post:
      tags: [providers]
      operationId: setInternalDefaultProvider
      summary: Set a connection as Coffer's internal-engine default
      description: |
        Marks this connection as the one Coffer's own internal engine borrows
        for its endpoint and key. At most one connection globally is the
        internal default; setting one clears the previous one (sequential
        clear-then-set, serialised by the single-process daemon), and the
        database enforces the same invariant against every other writer.

        Emits a `PROVIDER_INTERNAL_DEFAULT_SET` audit event with details
        `{from, to}` and returns the updated `ProviderOut`. It also notifies the
        engine, which applies its own rule about the model it was paired with
        (spec internal-engine FR-007); the engine's own settings live under
        `/api/v1/internal-engine-config` and are not this document's.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /providers/{uid}/transcribe-default:
    parameters:
      - in: path
        name: uid
        required: true
        schema: { type: string }
        description: The connection to transcribe speech on, by uid.

    post:
      tags: [providers]
      operationId: setTranscribeDefaultProvider
      summary: Set the connection Coffer transcribes speech on
      description: |
        The twin of `internal-default`, and a SECOND flag rather than a reuse of
        it: the two are different models, and a gateway that serves chat
        completions commonly serves no `/audio/transcriptions` at all, so
        borrowing the engine's connection would aim every voice message at a
        404. Nothing falls back between them — with no connection marked here,
        Coffer transcribes nothing and hands the agent the audio file
        untouched.

        At most one connection globally carries the flag; setting one clears the
        previous one (sequential clear-then-set, serialised by the
        single-process daemon).

        Emits a `PROVIDER_TRANSCRIBE_DEFAULT_SET` audit event with details
        `{from, to}` and returns the updated `ProviderOut`. It also notifies the
        engine, which applies its own rule about the model it was paired with;
        the model itself lives under `/api/v1/internal-engine-config` and is not
        this document's.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /providers/active-key/{wire}:
    parameters:
      - in: path
        name: wire
        required: true
        schema: { type: string, enum: [anthropic, openai] }
        description: Wire format whose active profile's key to resolve.

    get:
      tags: [providers]
      operationId: activeProviderKey
      summary: Resolve the active provider's API key for a wire format
      description: |
        Returns the decrypted API key of the active profile for `wire`, over the
        local token-protected daemon API. This is what Claude Code's
        `apiKeyHelper = "coffer provider key --wire anthropic"` invokes, so the
        raw key never has to be written into `settings.json`. Not audited —
        `apiKeyHelper` polls it frequently. 404 when no profile is active for
        that wire.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActiveKeyOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /providers/{uid}/key:
    parameters:
      - in: path
        name: uid
        required: true
        schema: { type: string }
        description: The connection whose key to resolve, by uid.

    get:
      tags: [providers]
      operationId: connectionKey
      summary: Resolve a specific connection's API key
      description: |
        Returns the decrypted API key of one connection. This is what Claude
        Code's projected
        `apiKeyHelper = "coffer provider key --connection-uid <uid>"` invokes,
        so the agent always reads exactly the activated connection's key (no
        wire+active mismatch). By uid because that helper line is written once
        into a file Coffer does not own and then read on every turn, for as
        long as the connection lives — a name in it would stop resolving the
        moment the user renamed the connection, and re-projecting on every
        rename is what the provider-specific rename route used to be for. Not
        audited — `apiKeyHelper` polls it frequently. 404 when the connection
        is absent or keyless (ollama).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActiveKeyOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /providers/use-builtin/{wire}:
    parameters:
      - in: path
        name: wire
        required: true
        schema: { type: string, enum: [anthropic, openai] }
        description: Wire format whose agent(s) to switch back to built-in.

    post:
      tags: [providers]
      operationId: useBuiltinProvider
      summary: Switch a wire's agent(s) back to their built-in login
      description: |
        Removes Coffer's projected keys from every ENABLED matching agent's
        native config (the inverse of activate) and clears `is_active` on the
        wire's active connection, so the agent runs on its OWN built-in
        model/login. A Coffer LLM connection is an optional override, not a
        prerequisite (spec provider-switching D1).

        Idempotent — a no-op when nothing is active for the wire. Emits a
        `PROVIDER_SWITCHED` audit event `{from, to: null, protocol, agents}`
        only when something changed.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeactivateOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /models/list-models:
    post:
      tags: [models]
      operationId: listProviderModels
      summary: List the models a provider exposes
      description: >
        An empty list with a `message` means the endpoint does not advertise a
        catalogue — the editor then asks the user to type a model id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListModelsIn'
      responses:
        '200':
          description: The models the endpoint reported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderModelsOut'

  /models/test-connection:
    post:
      tags: [models]
      operationId: testProviderConnection
      summary: Probe a connection with a minimal request
      description: >
        Always 200 — a failed probe is `ok: false` with a message, not an HTTP
        error, because "this key is wrong" is a normal answer to this question.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestConnectionIn'
      responses:
        '200':
          description: Probe result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestResultOut'

  /models/detect-protocol:
    post:
      tags: [models]
      operationId: detectProviderProtocol
      summary: Classify an endpoint's wire protocol
      description: >
        Lets the connection dialog drop its manual type selector — the endpoint
        is asked what it speaks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DetectProtocolIn'
      responses:
        '200':
          description: The detected protocol, or "unknown"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetectProtocolOut'

components:
  securitySchemes:
    cofferToken:
      type: apiKey
      in: header
      name: X-Coffer-Token

  schemas:

    ListModelsIn:
      type: object
      required: [provider]
      properties:
        provider: { type: string }
        base_url: { type: string, nullable: true }
        credential_ref: { type: string, nullable: true }
        secret_value:
          type: string
          nullable: true
          description: Inline secret, to fetch before the connection is saved.

    Modality:
      type: string
      enum: [text, embedding, image, video, audio]
      default: text
      description: >-
        Which KIND of model an id names. A provider endpoint serves more than
        chat models — embedding, image, video and audio models live on the same
        endpoint — so a curated entry says which it is and a picker asks for the
        kind it needs (spec provider-switching FR-029).

    ProviderModel:
      type: object
      required: [id]
      additionalProperties: false
      description: >-
        One curated model on a connection: an opaque vendor id plus the modality
        Coffer stores for it. The STORED modality is the truth — Coffer infers
        one only in the one-shot migration over plain-string entries and in
        endpoint introspection, both correctable from the connection editor, and
        never in a load-time shim.
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 200
          description: >-
            Opaque model id, passed verbatim to the vendor and never checked
            against a list of model names Coffer writes down.
        modality:
          # Optional on the way IN (an omitted modality stores `text`); every
          # response carries it, because what is stored is always concrete.
          $ref: "#/components/schemas/Modality"

    ProviderModelsOut:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items: { $ref: "#/components/schemas/ProviderModel" }
          description: >-
            The ids the endpoint reported, each with an INFERRED modality (spec
            provider-switching FR-030) so the connection editor can pre-fill a
            sensible value. The inference is a suggestion the user may correct —
            what is stored on the connection is the truth, never re-derived.
        message: { type: string, default: "" }

    TestConnectionIn:
      type: object
      required: [provider, model]
      properties:
        provider: { type: string }
        model: { type: string }
        base_url: { type: string, nullable: true }
        credential_ref: { type: string, nullable: true }
        secret_value:
          type: string
          nullable: true
          description: Inline secret, to test before the connection is saved.

    TestResultOut:
      type: object
      required: [ok, message]
      properties:
        ok: { type: boolean }
        message: { type: string }
        detail:
          type: object
          additionalProperties: true

    DetectProtocolIn:
      type: object
      properties:
        base_url: { type: string, nullable: true }
        credential_ref: { type: string, nullable: true }
        secret_value: { type: string, nullable: true }

    DetectProtocolOut:
      type: object
      required: [protocol]
      properties:
        protocol:
          type: string
          description: '"anthropic" | "openai" | "ollama" | "unknown"'

    Protocol:
      type: string
      enum: [anthropic, openai, ollama, unknown]
      description: |
        The connection's detected upstream protocol; determines which native
        agent it projects to:
        - `anthropic` → Claude Code (`~/.claude/settings.json`)
        - `openai` → Codex (`~/.codex/config.toml`)
        - `ollama` → internal-only; projected to NO agent (`target_for`
          returns null). Used solely by Coffer's internal engine when this
          connection is the internal default. Has no API key, so its
          `credential_ref` is absent.
        - `unknown` → the probe was inconclusive; the connection starts open to
          every agent and the user decides.

        The wire supplies only the scope a NEW connection starts with; which
        agents it projects into afterwards is its framework per-agent `scope`.

    ProviderOut:
      type: object
      required:
        - uid
        - name
        - protocol
        - base_url
        - credential_ref
        - compatible_agents
        - models
        - is_active
        - internal_default
        - transcribe_default
        - enabled
        - created_at
        - updated_at
      description: >-
        A provider connection — a credentialed endpoint `{protocol, base_url,
        credential_ref}`. Never includes the raw secret. The model lives apart
        from the connection (spec provider-switching E3) and is chosen at the point of use.
      properties:
        uid:
          type: string
          description: >-
            The connection Resource's immutable identity, and what every route
            in this document addressing a connection takes — including the one
            the projected `apiKeyHelper` calls on every turn.
          example: 9f2c1a7b4e8d4c1fa0b3d5e6f7081920
        name:
          type: string
          description: >-
            A mutable label, unique within kind `provider`, editable through
            the kind-agnostic `PATCH /api/v1/resources/{uid}`. Display only:
            nothing Coffer writes into another tool's config spells it any
            more, which is what let the provider-specific rename route go.
        protocol:
          $ref: "#/components/schemas/Protocol"
        base_url:
          type: string
          description: The upstream LLM endpoint URL.
        credential_ref:
          type: string
          nullable: true
          description: >-
            Fernet vault reference for the API key.
            Pattern: `^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$`.
            An opaque address — `provider/<random>/key` for a secret Coffer
            minted. Deliberately not derived from the connection's name: that
            made the name a key, so a rename had to move the secret too.
            Ownership is decided by citation count, never by the ref's shape,
            and refs already minted under the older `provider/<name>/key`
            spelling keep working as the plain strings they always were.
            Null for an ollama connection (no API key).
        compatible_agents:
          type: array
          items: { $ref: "#/components/schemas/AgentType" }
          description: >-
            READ-ONLY. The CONFIGURED agents this connection covers, derived
            from the resource's framework-level per-agent `scope`
            (ADR per-agent-resource-scope) intersected with the agent types
            Coffer knows. Empty for a keyless (ollama) connection, which covers
            no agent even in principle. It is deliberately NOT narrowed by
            `enabled` — that rides the same payload, so a client wanting the
            effective projection intersects the two itself, while a management
            surface can still render the agent list of a connection the user
            switched off. The projection writer is chosen by agent type, not
            protocol; the Agent Overview picker filters on this AND on
            `enabled`. To CHANGE it, edit the scope
            (`PUT /api/v1/resources/{uid}/scope`).
        models:
          type: array
          items: { $ref: "#/components/schemas/ProviderModel" }
          description: >-
            The curated set of models this connection OFFERS downstream — which
            of the endpoint's models the user intends to use, each with the
            modality saying WHICH KIND of model it is. EMPTY means no
            restriction (every model the endpoint serves), which is the default.
            Not a chosen model: the choice still happens at the point of use
            (spec provider-switching E3). Ids are opaque and passed verbatim to the vendor.
            The modality returned here is the STORED one — nothing re-derives it
            on read.
        is_active:
          type: boolean
          description: >-
            Whether this connection is the active override for its compatible
            agents. At most one active connection per agent type. Always false
            for ollama (internal-only, never projected).
        internal_default:
          type: boolean
          description: >-
            Whether this connection is Coffer's internal-engine default. At
            most one connection globally has internal_default=true.
        transcribe_default:
          type: boolean
          description: >-
            Whether Coffer transcribes speech on this connection. At most one
            connection globally has transcribe_default=true. Separate from
            internal_default and with no fallback between them: the endpoint
            that serves chat completions commonly serves no transcription
            endpoint at all.
        enabled:
          type: boolean
          description: >-
            The user's switch on the resource itself. A disabled connection
            projects into nothing and resolves no key, while still reporting
            the reach it is configured for (see `compatible_agents`). Changed
            through the shared resource enable/disable surface, not here.
        description:
          type: string
          nullable: true
          description: The connection's own description, as stored on the resource row.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProviderCreateRequest:
      type: object
      required:
        - name
        - protocol
        - base_url
      additionalProperties: false
      properties:
        name:
          type: string
          description: Profile name; must pass `validate_name`.
        protocol:
          $ref: "#/components/schemas/Protocol"
        base_url:
          type: string
          description: The upstream LLM endpoint URL.
        credential_ref:
          type: string
          nullable: true
          description: >-
            Reuse an existing vault ref. Mutually exclusive with
            `secret_value`. For anthropic/openai/unknown exactly one of the two
            must be supplied; for ollama supply neither.
        secret_value:
          type: string
          nullable: true
          description: >-
            Raw API key. Stored to the vault under `provider/<name>/key`.
            Mutually exclusive with `credential_ref`. For anthropic/openai/unknown
            exactly one of the two must be supplied; for ollama supply
            neither. Never echoed in any response.
        models:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/ProviderModel" }
          description: >-
            Curate which of the endpoint's models this connection offers
            downstream, each entry naming its modality. Null ⇒ empty ⇒ no
            restriction. Ids are opaque strings (non-blank, deduplicated
            preserving order, at most 200 of at most 200 characters); they are
            never checked against a list of model names Coffer writes down. An
            omitted `modality` stores `text`.
        description:
          type: string
          nullable: true
          description: Free text stored on the resource row.

    ProviderPatchRequest:
      type: object
      additionalProperties: false
      description: >-
        All fields optional. `credential_ref` is immutable — it is the vault
        address the connection owns — but `protocol` is not: the probe that
        guessed the wire can be wrong, and nothing keys off it for projection.
        Re-targeting which agents the connection projects
        into is a SCOPE edit (`PUT /api/v1/resources/{uid}/scope`),
        not a patch field — re-target then re-activate to re-project. No CHOSEN
        model is on the connection (spec provider-switching E3); `models` only
        curates which of the endpoint's models it offers.
      properties:
        protocol:
          $ref: "#/components/schemas/Protocol"
        base_url:
          type: string
          nullable: true
        secret_value:
          type: string
          nullable: true
          description: >-
            Rotate the stored secret. Overwrites the vault entry at the
            current `credential_ref`. Never echoed in any response.
        models:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/ProviderModel" }
          description: >-
            Replace the curated offered set as a whole (no merging).
            Null ⇒ leave unchanged; `[]` clears the
            restriction, so every model the endpoint serves is offered again.
            Each entry carries its own modality; an omitted `modality` stores
            `text`.
        description:
          type: string
          nullable: true
          description: Free text stored on the resource row.

    AgentType:
      type: string
      enum: [claude_code, codex]
      description: A coding agent a connection can project into.

    ActivateOut:
      type: object
      required: [activated, protocol, projected, skipped]
      description: Result of a successful activate operation.
      properties:
        activated:
          type: string
          description: Name of the profile that is now active.
        protocol:
          $ref: "#/components/schemas/Protocol"
        projected:
          type: array
          items: { type: string }
          description: Agent names whose native config was updated.
        skipped:
          type: array
          items: { type: string }
          description: >-
            Agent type(s) matching this protocol that have no registered
            enabled agent to project into. Not an error — the profile is still
            activated. (A genuine native-config write failure aborts the switch
            with a 5xx and leaves the registry unchanged, rather than skipping.)

    DeactivateOut:
      type: object
      required: [protocol, deprojected]
      description: Result of switching a wire back to the agent's built-in login.
      properties:
        protocol:
          $ref: "#/components/schemas/Protocol"
        deprojected:
          type: array
          items: { type: string }
          description: Agent names whose Coffer projection was removed.
        previous:
          type: [string, "null"]
          description: The connection that was active before, or null if none.

    ProviderListOut:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items: { $ref: "#/components/schemas/ProviderOut" }

    ActiveKeyOut:
      type: object
      required: [value]
      description: >-
        The decrypted API key of the active profile for a wire format, served
        for Claude Code's apiKeyHelper. Never logged or audited.
      properties:
        value:
          type: string
          description: The decrypted provider API key.

    ErrorOut:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Machine-readable error code.
        message:
          type: string
          description: Human-readable description.
        details:
          type: object
          additionalProperties: true
          description: Optional structured error details.

  responses:
    Unauthorized:
      description: Missing or invalid X-Coffer-Token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorOut" }
    BadRequest:
      description: Malformed request body or query parameters
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorOut" }
    NotFound:
      description: Provider profile not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorOut" }
    Conflict:
      description: A provider with this name already exists
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorOut" }
    UnprocessableEntity:
      description: |
        Validation failure. Common cases:
        - Unknown `protocol`
        - For anthropic/openai: both `secret_value` and `credential_ref`
          supplied, or neither
        - For ollama: a `secret_value` or `credential_ref` supplied (ollama
          has no key)
        - `credential_ref` pattern violation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorOut" }
    InternalError:
      description: >-
        Server error during projection (e.g. config file write failed).
        The profile's `is_active` state reflects the transaction outcome;
        check the audit log for details.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorOut" }
