    RuntimeHealthOut:
      description: |-
        The event loop's health and the background tasks' crash count.

        Lag is how late the loop woke a periodic probe, over a rolling window: one
        synchronous call blocking the loop stalls every request, channel and turn
        at once, and this is where that shows. See ``application.runtime``.
      properties:
        last_crash:
          anyOf:
          - $ref: '#/components/schemas/TaskCrashOut'
          - type: 'null'
        loop_lag_max_ms:
          anyOf:
          - type: number
          - type: 'null'
          title: Loop Lag Max Ms
        loop_lag_p99_ms:
          anyOf:
          - type: number
          - type: 'null'
          title: Loop Lag P99 Ms
        loop_lag_samples:
          title: Loop Lag Samples
          type: integer
        loop_lag_window_seconds:
          title: Loop Lag Window Seconds
          type: number
        task_crashes:
          title: Task Crashes
          type: integer
        tasks_running:
          title: Tasks Running
          type: integer
      required:
      - loop_lag_p99_ms
      - loop_lag_max_ms
      - loop_lag_samples
      - loop_lag_window_seconds
      - tasks_running
      - task_crashes
      - last_crash
      title: RuntimeHealthOut
      type: object
