components:
  schemas:
    CacheClearOut:
      properties:
        cleared_bytes:
          title: Cleared Bytes
          type: integer
      required:
      - cleared_bytes
      title: CacheClearOut
      type: object
    CacheUsageOut:
      properties:
        bytes:
          title: Bytes
          type: integer
      required:
      - bytes
      title: CacheUsageOut
      type: object
    DaemonLogListOut:
      properties:
        path:
          title: Path
          type: string
        records:
          items:
            $ref: '#/components/schemas/DaemonLogRecordOut'
          title: Records
          type: array
      required:
      - records
      - path
      title: DaemonLogListOut
      type: object
    DaemonLogRecordOut:
      description: |-
        One record of ``daemon.log``, parsed where possible.

        ``daemon.log`` interleaves several writers — Coffer's own JSON (one object
        per line, every field on it), uvicorn and rich — so ``record`` carries
        whatever that line stated, normalised onto ``timestamp`` / ``level`` /
        ``logger`` / ``event``, plus ``continuation`` for the lines (a traceback, a
        wrapped message) that belong to this record rather than to one of their
        own. A line no writer's format fits is kept whole as
        ``{"raw": <line>}``. The three lifted fields are what a timeline renders
        without knowing any of that; they are absent on a raw line, which is why
        they are nullable.
      properties:
        event:
          anyOf:
          - type: string
          - type: 'null'
          title: Event
        level:
          anyOf:
          - type: string
          - type: 'null'
          title: Level
        record:
          additionalProperties: true
          title: Record
          type: object
        timestamp:
          anyOf:
          - type: string
          - type: 'null'
          title: Timestamp
      required:
      - timestamp
      - level
      - event
      - record
      title: DaemonLogRecordOut
      type: object
    DaemonPortIn:
      properties:
        port:
          title: Port
          type: integer
      required:
      - port
      title: DaemonPortIn
      type: object
    DaemonPortOut:
      description: |-
        The port of the next start beside the port this daemon answers on.

        ``pending`` is a saved port this daemon is not on: it takes effect at the
        next start (spec daemon "Bind a fixed, settable port"), so until then the page
        says so and the status keeps showing ``bound_port``.
      properties:
        bound_port:
          title: Bound Port
          type: integer
        pending:
          title: Pending
          type: boolean
        port:
          title: Port
          type: integer
      required:
      - port
      - bound_port
      - pending
      title: DaemonPortOut
      type: object
    DaemonResidencyIn:
      properties:
