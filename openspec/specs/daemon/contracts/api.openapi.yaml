        own, so there is no idle window to report (spec daemon "Change residency
        from the settings page or the command line").
      properties:
        login_service_installed:
          title: Login Service Installed
          type: boolean
        login_service_supported:
          title: Login Service Supported
          type: boolean
      required:
      - login_service_supported
      - login_service_installed
      title: DaemonResidencyOut
      type: object
