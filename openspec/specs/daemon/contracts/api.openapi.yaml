        name: level
        required: false
        schema:
          default: ''
          title: Level
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 100
          maximum: 500
          minimum: 1
          title: Limit
          type: integer
      - description: Only the lines written under this correlation id (a request's or a turn's).
        in: query
        name: trace_id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Only the lines written under this correlation id (a request's or a turn's).
          title: Trace Id
