    ChangeOut:
      description: 'One change to knowledge: one commit naming its writer.'
      properties:
        actor:
          anyOf:
          - type: string
          - type: 'null'
          description: The audit actor of the operation.
          title: Actor
        agent:
          anyOf:
          - type: string
          - type: 'null'
          description: The agent that wrote it (writer `agent`).
          title: Agent
        collections:
          description: The collections the change touched.
          items:
            type: string
          title: Collections
          type: array
        documents:
          items:
            $ref: '#/components/schemas/DocumentChangeOut'
          title: Documents
          type: array
        item:
          anyOf:
          - type: string
          - type: 'null'
          description: The item a retired curation pass curated.
          title: Item
        operation:
          description: '`save`, `delete`, `promote`, `restore`, `edit`, `sync`, `create`, `rename`, `remove`, `layout`, `baseline` or `tidy` (one tidy an agent did, its report the summary); a change a retired curation pass made also reads `pass`, `submit` or `undo`.'
          title: Operation
          type: string
        restored_from:
          anyOf:
          - type: string
          - type: 'null'
          title: Restored From
        status:
          anyOf:
          - type: string
          - type: 'null'
          description: A tidy's `reported` (its agent finished it with a report) or `expired` (Coffer closed it after its collection sat unchanged); a retired curation pass's outcome status.
          title: Status
        summary:
          title: Summary
          type: string
        time:
          format: date-time
          title: Time
          type: string
        undoes:
          anyOf:
          - type: string
          - type: 'null'
          title: Undoes
        version:
          description: The change's id (its commit), what a restore of a delete takes.
          title: Version
          type: string
        writer:
          description: '`user` a person; `agent` an agent whose material became a document on arrival; `curation` a change Coffer''s retired curation pass made, kept in the history; `sync` another machine''s change; `disk` an edit made outside Coffer (a person''s editor, an agent''s file tools); `daemon` a loose document an earlier Coffer filed into `pages/`, kept in the history.'
          enum:
          - user
          - agent
          - curation
          - sync
          - disk
          - daemon
          title: Writer
          type: string
      required:
      - version
      - time
      - writer
      - operation
      - summary
      - actor
      - agent
      - collections
      - item
      - status
      - restored_from
      - undoes
      - documents
