          - agent
          - curation
          - sync
          - disk
          title: Writer
          type: string
      required:
      - version
      - time
      - writer
      - operation
      - summary
      - actor
      - agent
      - collections
      - item
      - status
      - restored_from
      - undoes
      - documents
