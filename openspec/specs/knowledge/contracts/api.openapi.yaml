openapi: 3.1.0
info:
  title: Coffer — Knowledge API
  version: 0.6.0
  description: |
    REST surface for the one `knowledge` resource kind (spec knowledge,
    Knowledge Layer). Eight routes, and that is the whole management plane.

    ## A collection is one tree of documents, not an index

    Knowledge is Markdown files under `~/.coffer/knowledge/<collection>/`, and a
    collection is **one tree of documents** that a person and Coffer's curation
    pass write together (see "Store each collection as one tree of Markdown
    files"). The nesting is whoever filed a document's; the system assigns it no
    meaning. A `README.md` sits at the collection root and its first paragraph
    is the collection's `description`; it is not a document.

    The one hidden directory Coffer writes is the collection's `.inbox/`, where
    new knowledge waits as **material** until a curation pass merges it into the
    documents and deletes it (see "Hide dot-prefixed entries except the inbox",
    "Submit every entrance's input as material"). Nothing here lists it or
    addresses it: `CollectionOut.pending_count` is the only thing this surface
    says about it. There is no `.raw/` and no `.history/`, and an uploaded
    original is not kept anywhere.

    The files are the **sole** source of truth: there is no `documents` table,
    no chunk table, no FTS5 index and no vectors, so nothing is derived and
    nothing is reconciled
    ([Knowledge Is Plain Files](../../../../docs/decisions/knowledge-is-plain-files.md)).

    A file's **path is its identity** — the `path` every route takes and
    returns is relative to the knowledge root: `shopee/gateway-routing.md`,
    `shopee/account/login-sessions.md`. There is no id anywhere in this
    contract. Frontmatter carries `title`, `description`, `actor`
    (`agent` | `user`), `created_at` and `updated_at`, plus
    `coffer_curated_at` on a document curation has had in front of it.

    ## Nothing here retrieves

    There is **no** `POST /search` and **no** `GET /grep`. The layer keeps no
    index and exposes no retrieval anywhere (see "Expose exactly one knowledge
    tool"; invariant 4): an agent reads the files with its own `Read` and `Grep`
    at the absolute paths its delivered skill carries, and the person reads them
    through `GET /tree` and `GET /file`. The one input beside the tree on the
    web page narrows the names already on screen, client-side (see "Present a
    collection as one tree in the web UI") — it is not a query.

    `GET /tree` walks **one level at a time** — a directory's immediate
    subdirectories and its documents, each with the `title` and `description`
    from its frontmatter. The listing is produced by walking the directory and
    reading frontmatter at call time; it is never materialized, so it cannot
    fall out of step with the disk.

    `GET /file` returns a whole document. There is no chunking, no passage
    granularity and no `top_k`.

    ## New knowledge is submitted, never written

    There is no route that writes a document. A person edits one in their own
    editor — the page's open-in-editor action hands them the file — and the edit
    is live on the next read (see "Keep direct file edits a complete way to
    change knowledge", "Cover collection management on REST and the CLI"). What
    this surface accepts is **material**: `POST /material` and `POST /upload`
    both submit into the collection's inbox, and a curation pass merges what is
    new into the documents (see "Submit every entrance's input as material").
    With no internal model configured, material is promoted to a document of its
    own on the spot instead (see "Promote material directly when no model is
    configured"), which is what `SubmissionOut.status` `written` and
    `IngestedDocumentOut.pending` `false` report.

    `DELETE /file` removes **any** document: the tree is the person's as much
    as curation's (see "Let only a person delete a document").

    ## Ingestion: one entrance beside the filesystem

    Writing a Markdown document into the collection stays a complete way to add
    knowledge (see "Keep direct file edits a complete way to change knowledge").
    But the filesystem is only reachable while the person is sitting at the
    machine, so `POST /upload` converts a document — whatever `markitdown`
    handles, plus plain text and CSV — to Markdown and submits it as material,
    so what is new in it is appended to the collection's knowledge (see "Convert
    uploads into material without keeping them"). Neither the original nor the
    extracted text is kept as a file. A channel doing the same thing from the
    person's phone is the other end of this path.

    ## Curation

    `POST /collections/{uid}/curate` runs one bounded agentic pass over a
    collection, driven by Coffer's internal model connection. It takes one item
    — one piece of material, or one document edited since curation last stamped
    it — and its tool surface is `list_documents`, `read_document`,
    `write_document` and `retire_document`, fenced to that collection's
    documents: none can reach the inbox (see "Curate through a fenced four-tool
    pass"). A pass is bounded to eight writes (see "Bound a pass to eight
    writes") and reports what it refused. With no internal connection configured
    it promotes the whole inbox as it stands (`status: no_model`, `promoted`
    listing the documents); with nothing pending, `up_to_date`. Every one of
    those is a 200 — a vault with no model configured is an ordinary state, not
    a bad request (see "Promote material directly when no model is configured").

    A background sweep runs the same pass on an interval — the inbox first, then
    documents edited out of band — governed by installation-wide settings that
    live elsewhere (`auto_curate_enabled`, `curate_interval_s` and
    `curate_owner_machine_id` on `internal_engine_config`, reached through the
    engine settings routes, out of scope for this contract).
    `auto_curate_enabled` ships **on**: curation is how submitted material
    becomes part of the documents an agent reads (see "Curate on one owner
    machine only").

    ## Why there is no reindex or settings route

    - **No reindex.** Nothing is indexed, so nothing can be stale. An edit made
      in the person's own editor is live on the very next call, with no import
      step and nothing to reconcile (see "Store each collection as one tree of
      Markdown files", "Keep direct file edits a complete way to change
      knowledge").
    - **No check-sources / update-source.** External source tracking is gone
      with the index that motivated it, and an upload keeps nothing to track.
    - **No embedding or per-scope settings.** A collection carries **no
      configuration at all** — `KnowledgeConfig` is empty and refuses unknown
      keys. There are no retrieval modes to pick, no chunk parameters and no
      embedding config, installation-wide or otherwise (see "Carry no vector or
      embedding dependency").

    ## Why deleting a collection is not here

    There is deliberately **no** `DELETE /api/v1/knowledge/collections/{uid}`. A
    collection's lifecycle is a Resource's lifecycle, so deletion goes through
    the kind-agnostic resource route, `DELETE /api/v1/resources/{uid}` (see
    "Cover collection management on REST and the CLI"). That way unregistering a
    collection runs the same lifecycle, audit and cascade as unregistering any
    other resource, instead of a second path that would have to be kept in step
    with it. Creation gets its own route only because it returns the collection
    already projected as a `CollectionOut`.

    ## Transport

    All routes are loopback-only and require the daemon's auth token in the
    `X-Coffer-Token` header (token from `~/.coffer/daemon.json`). Write routes
    additionally read an optional `X-Coffer-Actor` header. Every error response
    uses the app-wide envelope `{ "error": { code, message, details } }`.

    Nothing here is filtered per agent, and neither is what an agent reaches: a
    collection carries no per-agent reach, so every **enabled** collection is
    catalogued into every agent's delivered skill and a **disabled** one into
    none (see "Gate collections with enabled alone"). `enabled` gates delivery,
    not readability (see "Present knowledge as files on disk").

    ## Reading this file against the code

    Component names mirror the Pydantic class names in
    `coffer/surfaces/http/knowledge/schemas.py`, so this contract can be diffed
    against the app's generated OpenAPI without a translation table. The only
    exception is `ErrorEnvelope`, a contract-only alias for the app-wide error
    shape.

servers:
  - url: http://127.0.0.1:8000
    description: Local daemon (default port; actual port read from daemon.json)

security:
  - cofferToken: []

tags:
  - name: knowledge
    description: |
      The single `knowledge` kind: collections, one level of one collection,
      reading one document, submitting material, uploading a document,
      deleting a document, and the manual curation trigger. No retrieval of
      any kind.
      Mounted by `coffer.surfaces.http.knowledge` as one router with the prefix
      `/api/v1/knowledge`.

paths:
  # --- collections ----------------------------------------------------------

  /api/v1/knowledge/collections:
    get:
      summary: List collections
      description: |
        Every collection: the top-level folders under the knowledge root, each
        with the first paragraph of its `README.md` as `description`, its
        documents counted, and the material waiting in its inbox counted
        apart. Hidden entries (anything dot-prefixed) are excluded from the
        document count, and `README.md` itself is neither listed nor counted
        (see "Keep the collection README out of the corpus").

        The two counts answer different questions — how much an agent can
        read today, and how much has arrived that it cannot read yet. A
        collection with pending material is one curation has not reached,
        which a single total would hide.

        The list can legitimately be empty — nothing auto-provisions, so a
        fresh installation has no collections until someone creates one.
      operationId: listKnowledgeCollections
      tags: [knowledge]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionListOut"

    post:
      summary: Create a collection
      description: |
        Creates one collection: a directory under the knowledge root, and one
        `knowledge` Resource for it — which is what gives the collection a
        lifecycle, an audit trail and its one `enabled` switch.
        Nothing else creates one — not a read, not a write, not an agent's
        working directory (see "Create collections only deliberately").

        `name` is a single path segment. Names that would escape the root
        (containing `/`, `\` or `..`, or dot-only) are rejected, as is a name
        already taken. A `description` is written into the new collection's
        `README.md`; omitted, the collection simply has no description until
        someone writes that README by hand.
      operationId: createKnowledgeCollection
      tags: [knowledge]
      parameters:
        - $ref: "#/components/parameters/ActorHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionOut"
        "400":
          $ref: "#/components/responses/UnsafePath"
        "409":
          $ref: "#/components/responses/AlreadyExists"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  # --- one level of one collection ------------------------------------------

  /api/v1/knowledge/tree:
    get:
      summary: List one level of one collection
      description: |
        One level, not the whole tree: the immediate subdirectories of `path`
        and the documents directly in it, each with the `title` and
        `description` from its frontmatter.

        `path` is relative to the knowledge root — `shopee` for a collection's
        top level, `shopee/account` for a folder inside it. The listing is
        generated at call time by walking the directory and reading frontmatter,
        never materialized (see "Store each collection as one tree of Markdown
        files"). Hidden entries — the inbox included — are absent, and so is the
        collection's `README.md`.
      operationId: readKnowledgeTree
      tags: [knowledge]
      parameters:
        - $ref: "#/components/parameters/TreePath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeOut"
        "400":
          $ref: "#/components/responses/UnsafePath"
        "404":
          $ref: "#/components/responses/CollectionNotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  # --- one document ---------------------------------------------------------

  /api/v1/knowledge/file:
    get:
      summary: Read a document
      description: |
        The document's full text, plus its frontmatter fields and the two
        absolute on-disk paths the UI needs to offer open-in-editor and
        reveal-in-file-manager on the file and on its folder (see "Return
        absolute paths on reads"). `curated_at` says when curation last had it
        in front of it.

        Whole file, always: no chunking, no passage granularity, no `top_k`.
        Bytes come off disk at call time, so an edit made in the person's own
        editor is what comes back.
      operationId: readKnowledgeFile
      tags: [knowledge]
      parameters:
        - $ref: "#/components/parameters/FilePath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileOut"
        "400":
          $ref: "#/components/responses/UnsafePath"
        "404":
          $ref: "#/components/responses/FileNotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

    delete:
      summary: Delete a document
      description: |
        Removes the document from disk. There is nothing else to remove — no
        index row, no chunks, no embedding — so the deletion is complete when
        the file is gone. Recorded in the audit log with the actor.

        **Any** document, whoever wrote it (see "Let only a person delete a
        document"): the tree is the person's as much as curation's. No
        agent-facing tool deletes anything. A path that is not a document — the
        collection itself, its `README.md`, or anything hidden — is refused as
        `KNOWLEDGE_PATH_UNSAFE`.
      operationId: deleteKnowledgeFile
      tags: [knowledge]
      parameters:
        - $ref: "#/components/parameters/FilePath"
        - $ref: "#/components/parameters/ActorHeader"
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/UnsafePath"
        "404":
          $ref: "#/components/responses/FileNotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  # --- new knowledge --------------------------------------------------------

  /api/v1/knowledge/material:
    post:
      summary: Submit new knowledge to a collection
      description: |
        Submits **material** — a title, a description and a Markdown body — into
        the collection's inbox, for a curation pass to merge into the documents
        (see "Submit every entrance's input as material"). It takes no path and
        no folder, and replaces nothing: where the knowledge belongs, and what
        in it is new, is curation's to decide. Two submissions of the same title
        are two pieces of material.

        The submission itself is a plain file write — no LLM, no conversion, no
        indexing step (see "Submit material through coffer__write").
        `description` is required, not optional: it is what curation reads first
        when deciding where material belongs, and what the skill's catalogue
        shows if the material becomes a document of its own (see "Carry title,
        description and actor in frontmatter").

        `status` says what became of it: `pending` while it waits in the inbox,
        with no `path` — an inbox address vanishes once the material is
        merged — or `written`, with the document's `path`, when no internal
        model is configured and the material was promoted to a document as it
        stood (see "Promote material directly when no model is configured").

        This is the route the CLI's `coffer knowledge write` calls; an agent
        reaches the same service through `coffer__write`.
      operationId: submitKnowledgeMaterial
      tags: [knowledge]
      parameters:
        - $ref: "#/components/parameters/ActorHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialIn"
      responses:
        "201":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionOut"
        "400":
          $ref: "#/components/responses/UnsafePath"
        "404":
          $ref: "#/components/responses/CollectionNotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/knowledge/upload:
    post:
      summary: Convert a document and submit it to a collection
      description: |
        The entrance for a document the person did not write as Markdown. The
        file is converted to Markdown and given its frontmatter (see "Fill
        frontmatter on converted material") — `title` from the document falling back to its file name,
        `description` from the internal connection where one is configured and
        from the document's opening prose where not — and **submitted as
        material** into `collection`'s inbox, exactly as `POST /material` does.
        What is new in it is then appended to the collection's knowledge by the
        next pass; with no internal model, it becomes a document of its own on
        the spot (see "Promote material directly when no model is configured").

        **Neither file is kept.** The original bytes are not stored anywhere,
        and the extracted Markdown lives only as the inbox item until a pass
        merges it: the upload is the carrier of its knowledge, not the
        knowledge. There is no `folder` — where the knowledge lands is
        curation's to decide — no hidden `.raw/`, no re-conversion on a
        schedule and no external-source tracking.

        Supported inputs are exactly what `markitdown` handles (PDF, `.docx`,
        `.pptx`, `.xlsx`, `.xls`, HTML, EPUB) plus plain text, Markdown and
        CSV. The call is bounded: **one file**, a size ceiling, and a refusal
        that names the limit. All-or-nothing — a conversion failure leaves
        nothing behind, not even an inbox item.

        Upload is deliberately **not** an agent tool (see "Expose exactly one
        knowledge tool"): a document enters through a human surface — this
        route, the CLI, or a channel that confirms the collection with its
        paired owner.
      operationId: uploadKnowledgeDocument
      tags: [knowledge]
      parameters:
        - $ref: "#/components/parameters/ActorHeader"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, collection]
              properties:
                file:
                  type: string
                  format: binary
                  description: The document to convert. One per call.
                collection:
                  type: string
                  description: |
                    The collection's directory name. Must already exist and be
                    enabled.
      responses:
        "201":
          description: Converted and submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestedDocumentOut"
        "400":
          $ref: "#/components/responses/IngestRejected"
        "404":
          $ref: "#/components/responses/CollectionNotFound"
        "413":
          $ref: "#/components/responses/UploadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/EngineUnavailable"

  # --- curation -------------------------------------------------------------

  /api/v1/knowledge/collections/{uid}/curate:
    post:
      summary: Run one curation pass over one collection
      description: |
        One bounded agentic pass, driven by the internal model connection, whose
        tool surface is **four** operations — `list_documents`, `read_document`,
        `write_document`, `retire_document` — fenced to this collection's
        documents: none of them can reach the inbox, the collection's
        `README.md` or another collection (see "Curate through a fenced
        four-tool pass").

        The pass takes **one item**. Name a `document` in the body to carry one
        edited document through; omit the body and the pass takes the oldest
        pending item — inbox material first, then a document whose modification
        time is newer than its `coffer_curated_at` (see "Run curation on a sweep
        and on demand") — which is what the page's "Curate now" button wants.
        One item either way: a trigger is never a corpus-wide rewrite (see
        "Bound a pass to eight writes").

        Its context is bounded — the item in full, at most five candidate
        documents in full, and the collection's catalogue of titles and
        descriptions (see "Assemble a pass from a bounded context") — and its
        writes are bounded to eight, with `refused` reporting what the bound or
        the no-file-references rule (see "Refuse file-name references in
        documents") turned away. New material that contradicts a document wins;
        a document a person edited is never reverted (see "Let newer statements
        win and a person's edit stand").

        `status` is `ok` when a pass ran; `no_model` when no internal connection
        is configured, in which case every inbox item was promoted to a document
        as it stood and `promoted` lists them; `up_to_date` when nothing is
        pending; `too_large` when the item does not fit the model's context
        (`limit` then names the ceiling); and `failed` when the pass did not
        complete — in which case the item is left as it was, so it is curated
        later rather than lost (see "Settle an item only after its pass
        completes"). All of them are **200**: none is a fault of the request.

        **One pass per collection at a time** (see "Run one pass per collection
        at a time"). A request that arrives while a pass over the same
        collection is still running is refused with `409` rather than queued:
        the caller asked to start a pass, and no pass is going to start. Which
        collections are being curated right now is readable at
        `GET /api/v1/upkeep/runs` (spec mcp-gateway's contract), so a surface
        that mounts mid-pass shows the button as already running instead of
        inviting the second click.
      operationId: curateKnowledgeCollection
      tags: [knowledge]
      parameters:
        - $ref: "#/components/parameters/CollectionUid"
        - $ref: "#/components/parameters/ActorHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurationRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurationOut"
        "404":
          description: |
            `RESOURCE_NOT_FOUND` for a uid no resource answers to, the same as
            every other uid-addressed route; `KNOWLEDGE_COLLECTION_NOT_FOUND`
            for a disabled collection, or a uid naming a resource that is not
            a collection. An unknown uid is always an error — nothing is
            conjured into existence by being asked for (see "Create
            collections only deliberately").
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          $ref: "#/components/responses/UpkeepAlreadyRunning"
        "422":
          $ref: "#/components/responses/ValidationFailed"

components:
  securitySchemes:
    cofferToken:
      type: apiKey
      in: header
      name: X-Coffer-Token

  parameters:
    CollectionUid:
      in: path
      name: uid
      required: true
      description: |
        The collection Resource's immutable uid. Not the collection's name:
        that name is also the top-level directory under
        `~/.coffer/knowledge/`, and renaming a collection moves the directory
        with it — so a name is precisely the thing that does not stay put. The
        uid does, and a pass started before a rename is a pass over the same
        collection after it.
      schema: { type: string }
      examples:
        shopee: { value: 9f2c1a7b4e8d4c1fa0b3d5e6f7081920 }
    TreePath:
      in: query
      name: path
      required: true
      description: |
        A directory path relative to the knowledge root: a collection, or a
        folder nested inside one. Required — there is a dedicated route for the
        collection list, so this one always names a level.
      schema: { type: string, minLength: 1 }
      examples:
        collection: { value: shopee }
        nested: { value: shopee/account }
    FilePath:
      in: query
      name: path
      required: true
      description: |
        A document path relative to the knowledge root —
        `<collection>/…/<name>.md`. This is the document's identity; there is
        no id.
      schema: { type: string, minLength: 1 }
      examples:
        top: { value: shopee/gateway-routing.md }
        nested: { value: shopee/account/login-sessions.md }
    ActorHeader:
      in: header
      name: X-Coffer-Actor
      required: false
      description: |
        Who is writing, for the audit trail and for the file's `actor`
        frontmatter. `agent` is recorded as such; anything else, an absent
        header included, is recorded as `user`.
      schema:
        type: string
        enum: [agent, user]

  responses:
    UnsafePath:
      description: |
        A path that escapes the knowledge root, names a hidden entry — the inbox
        included — or cannot name a document because it is the collection itself
        or its `README.md` (`KNOWLEDGE_PATH_UNSAFE`). The rule lives in path
        construction rather than in a check each handler remembers to make,
        which is why it is reported here (see "Guard every path through one
        module").
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UpkeepAlreadyRunning:
      description: |
        A curation pass over this collection is already in flight
        (`UPKEEP_ALREADY_RUNNING`). Refused rather than queued — the caller
        asked to start a pass, and no pass is going to start (see "Run one pass
        per collection at a time").
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    AlreadyExists:
      description: A collection of that name already exists (`KNOWLEDGE_COLLECTION_EXISTS`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    CollectionNotFound:
      description: |
        No such collection (`KNOWLEDGE_COLLECTION_NOT_FOUND`). An unknown uid
        is always an error — nothing is conjured into existence by being asked
        for (see "Create collections only deliberately").
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    FileNotFound:
      description: No file at that path (`KNOWLEDGE_FILE_NOT_FOUND`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    IngestRejected:
      description: |
        The document could not be converted (`INGEST_REJECTED`). `details`
        carries a `reason` — `unsupported_type`, `scanned_pdf` or
        `empty_conversion` — and the rejected `doc_type`, so a surface can name
        the format it will not take instead of failing vaguely. Legacy
        `.doc`/`.ppt`, `.rtf` and `.odt` reach this case deliberately: no
        converter claims them, so they are refused cleanly rather than turned
        into a misleading conversion failure. Nothing half-converted is stored:
        no inbox item, no document and no original is left behind.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UploadTooLarge:
      description: |
        The upload is past the size ceiling (`KNOWLEDGE_UPLOAD_TOO_LARGE`).
        Refused before any conversion or write is attempted, naming the limit so
        the caller knows what to shrink below (see "Bound uploads and leave
        nothing behind on failure").
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    EngineUnavailable:
      description: |
        A converter library the call needs is absent (`ENGINE_UNAVAILABLE`) —
        one of MarkItDown's format backends on an upload. The daemon stays up
        and the answer names the engine.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationFailed:
      description: Request schema validation failed (FastAPI's `HTTPValidationError` shape).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    CollectionOut:
      type: object
      description: One collection, as the collection list sees it.
      required: [uid, name, description, document_count, pending_count]
      properties:
        uid:
          type: string
          description: |
            The collection Resource's immutable identity, and what every route
            addressing this collection takes. A client that has a collection
            from this list never has to look one up by name to act on it.
          example: 9f2c1a7b4e8d4c1fa0b3d5e6f7081920
        name:
          type: string
          description: |
            A mutable label, unique among collections, which is also the
            directory name under the knowledge root — a rename moves the
            directory. Use it to display the collection and to build the
            `path` and `collection` arguments of the file, material and upload
            routes, which are filesystem values; use `uid` for anything that
            has to keep pointing at this collection.
        description:
          type: string
          description: |
            The first paragraph of the collection's `README.md`, empty when
            there is none. Never stored in the database (see "Read a
            collection's description from its README").
        document_count:
          type: integer
          description: |
            Documents in the collection's tree, counted recursively, hidden
            entries and the collection's own `README.md` excluded — what an
            agent can read today.
        pending_count:
          type: integer
          description: |
            Material waiting in the collection's inbox to be merged (see "Hide
            dot-prefixed entries except the inbox") — what has arrived and an
            agent cannot read yet. Counted apart because a single total would
            hide a collection curation has not reached.
      example:
        uid: 9f2c1a7b4e8d4c1fa0b3d5e6f7081920
        name: shopee
        description: Internal systems at Shopee — services, data plane, the chains between them.
        document_count: 23
        pending_count: 2

    CollectionListOut:
      type: object
      required: [collections]
      properties:
        collections:
          type: array
          items:
            $ref: "#/components/schemas/CollectionOut"

    CollectionCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: One path segment. No `/`, no `\`, no `..`, not dot-only.
        description:
          anyOf:
            - type: string
            - type: "null"
          description: |
            Written into the new collection's `README.md` as its first
            paragraph. Omitted, the collection has no description until someone
            writes that README themselves.
      example:
        name: shopee
        description: Internal systems at Shopee — services, data plane, the chains between them.

    DirectoryOut:
      type: object
      description: A subdirectory at the level being listed.
      required: [path, name, file_count]
      properties:
        path:
          type: string
          description: Path relative to the knowledge root — pass it back to `GET /tree` to descend.
        name:
          type: string
          description: The directory's own name.
        file_count:
          type: integer
          description: Files beneath it, counted recursively.

    FileSummaryOut:
      type: object
      description: |
        One file as a tree row shows it — enough to judge relevance without
        reading the body.
      required: [path, title, description, actor, updated_at]
      properties:
        path:
          type: string
          description: Path relative to the knowledge root. The document's identity.
        title:
          type: string
        description:
          type: string
          description: What the file says it is about. Required on write (see "Carry title, description and actor in frontmatter").
        actor:
          type: string
          enum: [agent, user]
          description: Who last wrote it.
        updated_at:
          type: string
          description: ISO-8601 timestamp from frontmatter.

    TreeOut:
      type: object
      description: One level of one collection — never the whole tree.
      required: [path, directories, files]
      properties:
        path:
          type: string
          description: The level that was listed, relative to the knowledge root.
        directories:
          type: array
          items:
            $ref: "#/components/schemas/DirectoryOut"
        files:
          type: array
          items:
            $ref: "#/components/schemas/FileSummaryOut"

    FileOut:
      type: object
      description: |
        One document in full: its frontmatter, its body, and the absolute
        paths the UI needs for open-in-editor and reveal-in-file-manager.
      required:
        [
          path,
          title,
          description,
          actor,
          created_at,
          updated_at,
          body,
          file_path,
          folder_path,
          curated_at,
        ]
      properties:
        path:
          type: string
          description: Path relative to the knowledge root. The document's identity.
        title:
          type: string
        description:
          type: string
        actor:
          type: string
          enum: [agent, user]
        created_at:
          type: string
        updated_at:
          type: string
        body:
          type: string
          description: The Markdown body, frontmatter stripped.
        file_path:
          type: string
          description: Absolute on-disk path of the file (see "Return absolute paths on reads").
        folder_path:
          type: string
          description: Absolute on-disk path of its containing folder (see "Return absolute paths on reads").
        curated_at:
          type: string
          description: |
            When curation last had this document in front of it
            (`coffer_curated_at`), empty when it never has (see "Settle an item
            only after its pass completes"). A document modified since is what
            the sweep comes back for (see "Run curation on a sweep and on
            demand").

    MaterialIn:
      type: object
      description: |
        New knowledge for a collection (see "Submit every entrance's input as
        material"). No path, no folder and no lane: where it belongs is
        curation's to decide.
      required: [collection, title, description]
      properties:
        collection:
          type: string
          minLength: 1
          description: |
            The collection's directory name — a filesystem value, like every
            path on this family. Must exist and be enabled.
        title:
          type: string
          minLength: 1
          description: Names the subject; also the slug of the document it becomes if promoted.
        description:
          type: string
          minLength: 1
          description: |
            Required. What curation reads first when deciding where material
            belongs, and what the catalogue shows if it becomes a document of
            its own (see "Carry title, description and actor in frontmatter").
        body:
          type: string
          default: ""
          description: The Markdown body. Frontmatter is written by the layer, not supplied here.
      example:
        collection: shopee
        title: Session ownership
        description: Which service owns a login session, and what reads it.
        body: |
          Login state is owned by `account.session`.

    SubmissionOut:
      type: object
      description: |
        What became of submitted material. `pending`: it waits in the inbox for
        a pass to merge, and there is no path to report. `written`: no internal
        model is configured, so it was promoted to a document as it stood, and
        `path` is that document (see "Promote material directly when no model is
        configured").
      required: [status, collection, title, path]
      properties:
        status:
          type: string
          enum: [pending, written]
        collection:
          type: string
          description: The collection's name.
        title:
          type: string
        path:
          anyOf:
            - type: string
            - type: "null"
          description: The document it became, with `status` `written`; null while pending.
      example:
        status: pending
        collection: shopee
        title: Session ownership
        path: null

    CurationRequest:
      type: object
      description: |
        Which item to take. The whole body is optional — omitted, the pass takes
        the oldest pending item: inbox material first, then a document whose
        modification time is newer than its `coffer_curated_at` (see "Run
        curation on a sweep and on demand"), which is what the page's button
        wants.
      properties:
        document:
          anyOf:
            - type: string
            - type: "null"
          description: |
            One document to carry through, relative to the knowledge root. An
            inbox item cannot be named: the inbox is not addressable.
      example:
        document: shopee/account/login-sessions.md

    CurationOut:
      type: object
      description: |
        What one pass did. Every status is a 200 — a collection with no model
        configured, or with nothing pending, is an ordinary state of the feature
        and not a fault of the request (see "Promote material directly when no
        model is configured").
      required:
        [
          status,
          collection,
          item,
          model,
          written,
          retired,
          refused,
          documents_before,
          documents_after,
          limit,
          promoted,
        ]
      properties:
        status:
          type: string
          enum: [ok, no_model, up_to_date, too_large, failed]
          description: |
            `no_model` when no internal connection is configured — every inbox
            item was promoted to a document as it stood, never an error.
            `up_to_date` when nothing is pending. `too_large` when the item
            does not fit, `limit` naming the ceiling. `failed` leaves the item
            as it was so it is curated later rather than lost.
        collection:
          type: string
          description: The collection's NAME, not its uid — this is what a surface renders.
        item:
          type: string
          description: |
            The item the pass took, when it took one: an inbox item's path, or
            the edited document's.
        model:
          type: string
          description: |
            The internal model that ran it, so a surprising rewrite is
            traceable to a model rather than to Coffer.
        written:
          type: integer
          description: Documents this pass wrote.
        retired:
          type: integer
          description: Documents this pass retired, their content written elsewhere.
        refused:
          type: integer
          description: |
            Writes the pass refused — a document naming another file (see
            "Refuse file-name references in documents"), the eight-write bound
            (see "Bound a pass to eight writes"), or a path outside the
            collection's documents. Reported rather than swallowed, because a
            pass that hit its bound has more to absorb than it managed.
        documents_before:
          type: integer
        documents_after:
          type: integer
        limit:
          type: integer
          description: The item-size ceiling, present only with `status` `too_large`.
        promoted:
          type: array
          items: { type: string }
          description: |
            The documents the inbox was promoted into as it stood, present only
            with `status` `no_model` (see "Promote material directly when no
            model is configured").
      example:
        status: ok
        collection: shopee
        item: shopee/.inbox/session-ownership.md
        model: internal-model
        written: 2
        retired: 1
        refused: 0
        documents_before: 22
        documents_after: 23
        limit: 0
        promoted: []

    IngestedDocumentOut:
      type: object
      description: |
        What an upload became. Note `converter` is reported here and written
        **nowhere on disk**, and nothing of the upload itself is kept: the
        extracted Markdown is material, and the original bytes are gone
        (see "Convert uploads into material without keeping them").
      required: [path, title, description, converter, pending]
      properties:
        path:
          anyOf:
            - type: string
            - type: "null"
          description: |
            The document the upload became when it was promoted on the spot
            (no internal model to merge it), relative to the knowledge root;
            null while it waits in the inbox.
        title: { type: string }
        description: { type: string }
        converter:
          type: string
          description: Which converter produced the Markdown.
        pending:
          type: boolean
          description: True when the upload waits in the inbox for a pass to merge it.

    ErrorEnvelope:
      type: object
      description: |
        The app-wide error shape (`surfaces/http/errors.py`). Contract-only
        alias — there is no Pydantic model of this name.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: e.g. `KNOWLEDGE_COLLECTION_NOT_FOUND`, `KNOWLEDGE_PATH_UNSAFE`.
            message:
              type: string
            details:
              type: object
