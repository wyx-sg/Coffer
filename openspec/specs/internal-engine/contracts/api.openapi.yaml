components:
  schemas:
    CurationOwnerUpdate:
      description: |-
        Name the machine that may run the curation pass; ``null`` clears it.

        Deliberately NOT validated against the registry. A vault that has never
        converged has no registry at all and must still be able to name its own
        machine — the one install where checking would refuse the only correct
        answer.
      properties:
        machine_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Machine Id
      title: CurationOwnerUpdate
      type: object
    ErrorDetail:
      properties:
        code:
          examples:
          - RESOURCE_NOT_FOUND
          title: Code
          type: string
        details:
          additionalProperties: true
          title: Details
          type: object
        message:
          examples:
          - 'resource not found: mcp_server:filesystem'
          title: Message
          type: string
      required:
      - code
      - message
      - details
      title: ErrorDetail
      type: object
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - error
      title: ErrorResponse
      type: object
    InternalEngineConfigOut:
      description: 'Coffer''s own operating settings: its model, and its unattended work.'
      properties:
        curate_owner_machine_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Curate Owner Machine Id
        default_model_timeout_s:
          title: Default Model Timeout S
          type: integer
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
        model_timeout_s:
          anyOf:
          - type: integer
          - type: 'null'
          title: Model Timeout S
        transcribe_model:
          anyOf:
          - type: string
          - type: 'null'
          title: Transcribe Model
        updated_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Updated At
        upkeep:
          additionalProperties:
            $ref: '#/components/schemas/UpkeepSettingOut'
          title: Upkeep
          type: object
      required:
      - model
      - updated_at
      - upkeep
      - curate_owner_machine_id
      - model_timeout_s
      - default_model_timeout_s
      - transcribe_model
      title: InternalEngineConfigOut
      type: object
    InternalEngineConfigUpdate:
      description: Set the internal-engine model; ``null``/empty clears it.
      properties:
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
      title: InternalEngineConfigUpdate
      type: object
    ModelTimeoutUpdate:
      description: |-
        Bound one call to Coffer's own model; ``null`` restores the default.

        The range is checked by the service rather than declared here, so the
        terminal, this route and a synced document are all refused by one rule that
        says which numbers are allowed and why — and the operator reads the reason
        instead of a generated constraint message.
      properties:
        seconds:
          anyOf:
          - type: integer
          - type: 'null'
          title: Seconds
      title: ModelTimeoutUpdate
      type: object
    TranscribeModelUpdate:
      description: |-
        Choose the speech-to-text model; ``null``/empty stops transcription.

        Deliberately NOT defaulted to the engine's own model: a gateway that serves
        chat completions commonly serves no transcription endpoint, so borrowing
        the engine's choice would aim every voice message at a 404 instead of at
        the behaviour an unconfigured vault already has.
      properties:
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
      title: TranscribeModelUpdate
      type: object
    UpkeepSettingOut:
      description: |-
        One unattended pass's switch and timer, as a surface needs to show them.

        ``interval_s`` is ``null`` while the operator has chosen none;
        ``default_interval_s`` is what runs in that case, reported so a settings
        page can name the default instead of showing a blank where a number
        belongs.
      properties:
        default_interval_s:
          title: Default Interval S
          type: integer
        enabled:
          title: Enabled
          type: boolean
        interval_s:
          anyOf:
          - type: integer
          - type: 'null'
          title: Interval S
      required:
      - enabled
      - interval_s
      - default_interval_s
      title: UpkeepSettingOut
      type: object
    UpkeepUpdate:
      description: |-
        Change ONE unattended pass, leaving the others exactly as they stand.

        One pass at a time on purpose: a settings page toggles one row, and a body
        carrying all three would make every toggle a chance to write back a stale
        copy of the other two — on settings the operator may also be changing on
        another machine, since they converge through vault sync.

        Omitting a field leaves that half of the pass alone, so a switch and a
        timer can be changed independently.
      properties:
        enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enabled
        interval_s:
          anyOf:
          - minimum: 60.0
            type: integer
          - type: 'null'
          title: Interval S
        pass:
          enum:
          - aggregate
          - distil
          - curate
          title: Pass
          type: string
        use_default_interval:
          default: false
          title: Use Default Interval
          type: boolean
      required:
      - pass
      title: UpkeepUpdate
      type: object
