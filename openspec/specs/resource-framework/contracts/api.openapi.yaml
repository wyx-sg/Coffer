        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Coffer-Token
      responses:
        '200':
          content:
            text/event-stream:
              itemSchema:
                properties:
                  data:
                    contentMediaType: application/json
                    contentSchema:
                      $ref: '#/components/schemas/EventStreamMessage'
                    type: string
                  event:
                    type: string
                  id:
                    type: string
                  retry:
                    minimum: 0
                    type: integer
                required:
                - data
                type: object
          description: A Server-Sent Events stream of `change`, `resync` and `heartbeat` events that stays open until the client disconnects.
