      properties:
        policies:
          items:
            $ref: '#/components/schemas/RetentionPolicyOut'
          title: Policies
          type: array
      required:
      - policies
      title: RetentionPolicyListOut
      type: object
    RetentionPolicyOut:
      properties:
        default_retention_days:
          anyOf:
          - type: integer
          - type: 'null'
          title: Default Retention Days
        description:
          title: Description
          type: string
        display_name:
          title: Display Name
          type: string
        last_pruned_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Last Pruned At
        last_pruned_rows:
          title: Last Pruned Rows
          type: integer
        retention_days:
          anyOf:
          - type: integer
          - type: 'null'
          title: Retention Days
        table_name:
          title: Table Name
          type: string
      required:
      - table_name
      - display_name
      - description
      - default_retention_days
      - retention_days
      - last_pruned_at
      - last_pruned_rows
      title: RetentionPolicyOut
      type: object
    RetentionPolicyUpdate:
      properties:
        retention_days:
          anyOf:
          - maximum: 3650.0
            minimum: 1.0
            type: integer
          - type: 'null'
          description: Null = keep forever; 1..3650 days otherwise.
          title: Retention Days
      title: RetentionPolicyUpdate
      type: object
    RetentionPreviewOut:
      description: What shortening one policy's window would delete, counted and not run.
      properties:
        days:
          title: Days
          type: integer
        rows_to_delete:
          title: Rows To Delete
          type: integer
        table_name:
          title: Table Name
          type: string
        total_rows:
          title: Total Rows
          type: integer
      required:
      - table_name
      - days
      - total_rows
      - rows_to_delete
      title: RetentionPreviewOut
      type: object
    ScopeIn:
      additionalProperties: false
      description: |-
        A resource's activation scope as a request writes it: one allow-list of
        agents (ADR per-agent-resource-scope). ``null`` or absent means
        unrestricted; ``[]`` matches nothing, i.e. dormant.

        Extra keys are REFUSED rather than ignored, which is the unusual choice and
        the deliberate one. This model used to carry a second axis, ``machines``,
        and a client that still sends it — a browser tab left open across the
        upgrade — means "only on that machine". Ignoring the key would store what
        is left, ``agents: null``, and that reads as *every agent, everywhere*: the
        request would silently widen the very restriction it was trying to write.
        A 422 tells the caller its request was not understood, which is the only
        honest answer.
