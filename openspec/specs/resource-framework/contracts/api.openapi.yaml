    ResourceScopeOut:
      description: |-
        GET .../scope response: the current scope plus whether this kind
        supports scope at all (False means any non-null write is a 422).
      properties:
        scope:
          anyOf:
          - $ref: '#/components/schemas/ScopeOut'
          - type: 'null'
        supports_scope:
          default: false
          title: Supports Scope
          type: boolean
      required:
      - scope
      - supports_scope
      title: ResourceScopeOut
      type: object
    ResourceScopeUpdate:
      description: |-
        PUT .../scope request body: which agents this resource is active for.

        ``scope: null`` clears back to unscoped — every agent. A list restricts to
        exactly those agents, and an empty list matches nothing, so
        ``{"agents": []}`` is dormant.

        Scope is set per machine and does not sync: every machine holding this
        vault decides for itself which of its agents a resource activates for.
      properties:
        scope:
          anyOf:
          - $ref: '#/components/schemas/ScopeIn'
          - type: 'null'
      title: ResourceScopeUpdate
      type: object
    ResourceUpdate:
      properties:
        config:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Config
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        name:
          anyOf:
          - maxLength: 64
            minLength: 1
            pattern: ^[a-zA-Z0-9_.\-]+$
            type: string
          - type: 'null'
          title: Name
        title:
          anyOf:
          - maxLength: 80
            type: string
          - type: 'null'
          title: Title
      title: ResourceUpdate
      type: object
    ResyncEventOut:
      description: |-
        The data of a `resync` event: events may have been missed; refetch everything.

        Sent first on a reconnect whose `Last-Event-ID` the buffer cannot cover
        (older than its oldest entry, or never issued by this daemon run), and in
        place of the backlog when a client falls too far behind. Live `change`
        events follow it.
      properties:
        seq:
          description: The head `seq` when the resync was issued.
          title: Seq
          type: integer
      required:
      - seq
      title: ResyncEventOut
      type: object
