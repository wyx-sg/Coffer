      title: HandoffOut
      type: object
    HeartbeatEventOut:
      description: |-
        The data of a `heartbeat` event: sent at a fixed interval while nothing changes.

        A client whose last seen `seq` is below `seq` is behind and should reconnect.
      properties:
        seq:
          description: The current head `seq`; 0 before the first change.
          title: Seq
          type: integer
      required:
