  /api/v1/agents/{uid}/transcripts:
    get:
      description: |-
        List an agent's transcript sessions with search, filter, and sort.

        Searches title + project path (``q``), filters by exact ``project``, and
        sorts by ``sort``/``order`` with ``session_id`` as the tie-break. Backed by
        the reader's mtime-aware cache, so an agent with thousands of past sessions
        stays responsive. Paged by ``limit`` and the answer's ``next_cursor``
        alongside the matched total — a cursor, not an offset, because the agent
        keeps writing sessions while a reader pages.
      operationId: list_transcripts_api_v1_agents__uid__transcripts_get
      parameters:
      - in: path
        name: uid
        required: true
        schema:
          title: Uid
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 100
          maximum: 500
          minimum: 1
          title: Limit
          type: integer
      - description: The previous page's next_cursor. Bound to the search, filter and sort it was issued with; any other value is 400 CURSOR_INVALID.
        in: query
        name: cursor
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The previous page's next_cursor. Bound to the search, filter and sort it was issued with; any other value is 400 CURSOR_INVALID.
          title: Cursor
      - description: Search title or project path.
        in: query
        name: q
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search title or project path.
          title: Q
      - description: Filter to this exact project_path.
        in: query
        name: project
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter to this exact project_path.
          title: Project
      - in: query
        name: sort
        required: false
        schema:
          default: last_activity_at
          enum:
          - started_at
          - last_activity_at
          - message_count
          title: Sort
          type: string
      - in: query
        name: order
        required: false
        schema:
          default: desc
          enum:
          - asc
          - desc
          title: Order
          type: string
      - in: header
        name: x-coffer-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Coffer-Token
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptSessionListResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request failed validation (`CONFIG_INVALID`); the submitted values are not echoed back.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Any other error, as Coffer's error envelope.
      summary: List Transcripts
      tags:
      - agents
  /api/v1/agents/{uid}/transcripts/session:
    get:
      description: |-
        Render one of the agent's conversations: its summary and a page of turns.

        Bounded twice over, because a single transcript can be tens of megabytes:
        at most ``limit`` turns come back (500 ceiling), and each turn's text is cut
        at the domain's per-turn cap with ``truncated`` set. Every turn is
        secret-scrubbed before it leaves the parser — a prompt is where a pasted key
        would be. ``path`` must resolve inside this agent's own sessions directory;
        anything else is 404 rather than a file read.
      operationId: read_transcript_session_api_v1_agents__uid__transcripts_session_get
      parameters:
      - in: path
        name: uid
        required: true
        schema:
          title: Uid
          type: string
      - description: Absolute source_path of a session, as the listing gave it.
        in: query
        name: path
        required: true
        schema:
          description: Absolute source_path of a session, as the listing gave it.
          title: Path
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 200
          maximum: 500
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          title: Offset
          type: integer
      - in: header
        name: x-coffer-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Coffer-Token
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptSessionDetailResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request failed validation (`CONFIG_INVALID`); the submitted values are not echoed back.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Any other error, as Coffer's error envelope.
      summary: Read Transcript Session
      tags:
      - agents
components:
  schemas:
    AdoptedOut:
      description: |-
        The resource adoption just created.

        ``uid`` is here because this is the only moment the caller learns the new
        resource exists, and it is the only value that will still address it after
        the user renames it — a client that wants to open what it just adopted has
        to hold this, not the label beside it.
      properties:
        kind:
          title: Kind
          type: string
        name:
          title: Name
          type: string
        uid:
          title: Uid
          type: string
      required:
      - uid
      - kind
      - name
      title: AdoptedOut
      type: object
    AgentCandidatesOut:
      description: The supported types seen here and not registered yet — at most one per type.
      properties:
        candidates:
          items:
            $ref: '#/components/schemas/AgentTypeOut'
          title: Candidates
          type: array
      required:
      - candidates
      title: AgentCandidatesOut
      type: object
    AgentCreate:
      properties:
        config_dir:
          anyOf:
          - type: string
          - type: 'null'
          title: Config Dir
        type:
          $ref: '#/components/schemas/AgentType'
      required:
      - type
      title: AgentCreate
      type: object
    AgentHooksOut:
      properties:
        coffer_hook:
          anyOf:
          - $ref: '#/components/schemas/CofferHookOut'
          - type: 'null'
        items:
          items:
            $ref: '#/components/schemas/NativeHookOut'
          title: Items
          type: array
        parse_errors:
          items:
            $ref: '#/components/schemas/ParseErrorOut'
