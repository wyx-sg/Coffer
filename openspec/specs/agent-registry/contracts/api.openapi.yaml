          title: Config Dir
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        display_name:
          title: Display Name
          type: string
        effort:
          anyOf:
          - type: string
          - type: 'null'
          title: Effort
        install_handoff:
          anyOf:
          - $ref: '#/components/schemas/HandoffOut'
          - type: 'null'
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
        name:
          title: Name
          type: string
        state:
          $ref: '#/components/schemas/DetectionState'
