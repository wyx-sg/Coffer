          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
        version:
          anyOf:
          - type: string
          - type: 'null'
          title: Version
        wire_api:
          anyOf:
          - type: string
          - type: 'null'
          title: Wire Api
