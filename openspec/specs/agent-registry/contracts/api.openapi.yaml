    TranscriptSessionDetailResponse:
      description: |-
        Response for GET /api/v1/agents/{uid}/transcripts/session.

        The summary fields are the listing's, so a page reached by deep link shows
        the same title and project the row did. ``message_count`` is the WHOLE
        file's turn count while ``messages`` is the ``limit`` turns from
        ``offset`` — a reader must be able to tell "200 of 812" from "all 200".
      properties:
        last_activity_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Last Activity At
        limit:
          title: Limit
          type: integer
        message_count:
          title: Message Count
          type: integer
        messages:
          items:
            $ref: '#/components/schemas/TranscriptMessageOut'
          title: Messages
          type: array
        offset:
          title: Offset
          type: integer
        project_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Project Path
        session_id:
          title: Session Id
          type: string
        source_path:
          title: Source Path
          type: string
        started_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Started At
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
      required:
      - session_id
      - title
      - project_path
      - message_count
      - started_at
      - last_activity_at
      - source_path
      - messages
      - limit
      - offset
      title: TranscriptSessionDetailResponse
      type: object
    TranscriptSessionListResponse:
      description: |-
        Response for GET /api/v1/agents/{uid}/transcripts.

        ``sessions`` is one page; ``total`` is the number of sessions matching the
        search/filter, so the UI can show "N of total". ``next_cursor`` reads the
        page after this one and is null on the last page.
      properties:
        limit:
          title: Limit
          type: integer
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
        sessions:
          items:
            $ref: '#/components/schemas/TranscriptSessionSummary'
          title: Sessions
          type: array
        total:
          title: Total
          type: integer
      required:
      - sessions
      - total
      - limit
      - next_cursor
      title: TranscriptSessionListResponse
      type: object
