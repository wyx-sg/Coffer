      - name
      - display_name
      - type
      - config_dir
      - model
      - effort
      - tier_models
      - wire_api
      - state
      - version
      - install_handoff
      - created_at
      - updated_at
      title: AgentOut
      type: object
    AgentPatch:
      properties:
        config_dir:
          anyOf:
          - type: string
          - type: 'null'
          title: Config Dir
        effort:
          anyOf:
          - type: string
          - type: 'null'
          title: Effort
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
        tier_models:
          anyOf:
          - additionalProperties:
              type: string
