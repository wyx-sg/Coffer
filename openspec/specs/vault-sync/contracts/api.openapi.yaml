    SyncRemoteIn:
      description: |-
        The remote as the user configures it.

        Every field but the URL carries the spec's default, so a ``PUT`` with a
        bare URL is a complete configuration rather than a half-set one.

        The URL and the branch become arguments to ``git``. Neither may begin with
        ``-`` — git would read it as an option, and ``--receive-pack=<cmd>`` is a
        command — and the branch is held to ``git check-ref-format --branch``. The
        ``pattern`` catches the shape at the wire; the validators run the domain's
        full rule, so a bad name is a 422 here rather than a git error later.
      properties:
        branch:
          default: main
          pattern: ^[^-\s~^:?*\[\\\x00-\x1f\x7f][^\s~^:?*\[\\\x00-\x1f\x7f]*$
          title: Branch
          type: string
        credential_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Credential Ref
        enabled:
          default: true
          title: Enabled
          type: boolean
        include_credentials:
          default: false
          title: Include Credentials
          type: boolean
        interval_seconds:
          default: 3600
          minimum: 60.0
          title: Interval Seconds
          type: integer
        url:
          pattern: ^[^-\s]\S*$
          title: Url
          type: string
        worktree_path:
          default: ~/.coffer/sync
          minLength: 1
          title: Worktree Path
          type: string
      required:
      - url
      title: SyncRemoteIn
      type: object
    SyncRemoteOut:
      properties:
        branch:
          title: Branch
          type: string
        credential_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Credential Ref
        enabled:
          title: Enabled
          type: boolean
        include_credentials:
          title: Include Credentials
          type: boolean
        interval_seconds:
          title: Interval Seconds
          type: integer
        url:
          title: Url
          type: string
        worktree_path:
          title: Worktree Path
          type: string
      required:
      - url
      - branch
      - credential_ref
      - include_credentials
      - interval_seconds
      - enabled
      - worktree_path
      title: SyncRemoteOut
      type: object
