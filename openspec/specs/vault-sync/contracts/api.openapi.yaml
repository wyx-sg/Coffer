  /api/v1/sync/stop/handoff:
    post:
      description: |-
        Hand the stopped round's conflicting files (every one an agent may
        merge, or the named ones) to an agent: the prompt, with each file's merged
        copy written outside the vault. The agent's merge is shown as
        ``merged_by_agent`` on the file; marking it resolved is the ``edited``
        answer. Asked again for a merged file, it starts that file over.
      operationId: stop_handoff_api_v1_sync_stop_handoff_post
      parameters:
      - in: header
        name: x-coffer-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Coffer-Token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandoffIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentHandoffOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request failed validation (`CONFIG_INVALID`); the submitted values are not echoed back.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Any other error, as Coffer's error envelope.
      summary: Stop Handoff
      tags:
      - sync
  /api/v1/sync/vault/move:
    post:
      description: |-
        Move the vault out of a synchronised folder: rounds and writes are held
        off, the folder is moved and its git repository checked at the new place.
        The old folder is left empty. 422 ``SYNC_VAULT_TARGET_INVALID`` /
        ``SYNC_VAULT_TARGET_IN_CLOUD``, 409 ``SYNC_VAULT_TARGET_NOT_EMPTY``, 500
        ``SYNC_VAULT_MOVE_FAILED`` (the vault is back where it was).
      operationId: move_vault_api_v1_sync_vault_move_post
      parameters:
      - in: header
        name: x-coffer-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Coffer-Token
      requestBody:
        content:
          application/json:
            schema:
