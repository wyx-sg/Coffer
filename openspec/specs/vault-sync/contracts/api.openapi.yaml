components:
  schemas:
    AdoptIn:
      properties:
        choice:
          anyOf:
          - const: keep-local
            type: string
          - type: 'null'
          title: Choice
      title: AdoptIn
      type: object
    BreachOut:
      properties:
        area:
          title: Area
          type: string
        deleted:
          title: Deleted
          type: integer
        total:
          title: Total
          type: integer
      required:
      - area
      - deleted
      - total
      title: BreachOut
      type: object
    ChangeStatus:
      enum:
      - added
      - modified
      - deleted
      title: ChangeStatus
      type: string
    ConvergeStatus:
      enum:
      - ok
      - no_change
      - conflict
      - awaiting_confirmation
      - push_failed
      - failed
      - disabled
      - awaiting_join
      title: ConvergeStatus
      type: string
    DiffCountsOut:
      description: |-
        What a round moved, as a tally AND as the list behind it.

        The tally alone is what a row can show; the list is what the reader opens
        the row to find out. A round reporting `+1 ~1` and then "nothing further to
        report" is the surface refusing to answer the only question the row raises,
        and the paths were in the payload the whole time.
      properties:
        added:
          default: 0
          title: Added
          type: integer
        changes:
          default: []
          items:
            $ref: '#/components/schemas/DocChangeOut'
          title: Changes
          type: array
        deleted:
          default: 0
          title: Deleted
          type: integer
        modified:
          default: 0
          title: Modified
          type: integer
      required:
      - added
      - modified
      - deleted
      - changes
      title: DiffCountsOut
      type: object
    DocChangeOut:
      description: 'One document''s fate in one round: what moved, and which way.'
      properties:
        path:
          title: Path
          type: string
        status:
          $ref: '#/components/schemas/ChangeStatus'
      required:
      - path
      - status
      title: DocChangeOut
      type: object
    ErrorDetail:
      properties:
        code:
          examples:
          - RESOURCE_NOT_FOUND
          title: Code
          type: string
        details:
          additionalProperties: true
          title: Details
          type: object
        message:
          examples:
          - 'resource not found: mcp_server:filesystem'
          title: Message
          type: string
      required:
      - code
      - message
      - details
      title: ErrorDetail
      type: object
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - error
      title: ErrorResponse
      type: object
    FailureOut:
      properties:
        path:
          title: Path
          type: string
        reason:
          title: Reason
          type: string
      required:
      - path
      - reason
      title: FailureOut
      type: object
    JoinPreviewOut:
      description: |-
        The join a round would make, stated before anything is applied.

        ``joining`` is False for a machine that already converged here: adopting
        is then an ordinary round with nothing to announce. ``case`` is
        ``ambiguous`` for a returning machine whose base is gone, which still
        needs the explicit ``keep-local`` choice (or a rebuild) before it joins.
      properties:
        base:
          anyOf:
          - type: string
          - type: 'null'
          title: Base
        case:
          anyOf:
          - enum:
            - new
            - returning
            - ambiguous
            type: string
          - type: 'null'
          title: Case
        joining:
          title: Joining
          type: boolean
        last_converged_on:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Last Converged On
        remote_changed:
          anyOf:
          - type: integer
          - type: 'null'
          title: Remote Changed
        vault_documents:
          anyOf:
          - type: integer
          - type: 'null'
          title: Vault Documents
      required:
      - joining
      - case
      - base
      - last_converged_on
      - remote_changed
      - vault_documents
      title: JoinPreviewOut
      type: object
    KeyFingerprintOut:
      properties:
        fingerprint:
          anyOf:
          - type: string
          - type: 'null'
          title: Fingerprint
      required:
      - fingerprint
      title: KeyFingerprintOut
      type: object
    KeyImportOut:
      properties:
        locked_refs:
          items:
            type: string
          title: Locked Refs
          type: array
      required:
      - locked_refs
      title: KeyImportOut
      type: object
    KeyMaterialIn:
      properties:
        material:
          title: Material
          type: string
      required:
      - material
      title: KeyMaterialIn
      type: object
    MachineListOut:
      properties:
        machines:
          items:
            $ref: '#/components/schemas/MachineOut'
          title: Machines
          type: array
      required:
      - machines
      title: MachineListOut
      type: object
    MachineOut:
      properties:
        agents:
          items:
            type: string
          title: Agents
          type: array
        coffer_version:
          title: Coffer Version
          type: string
        hostname:
          title: Hostname
          type: string
        is_self:
          title: Is Self
          type: boolean
        key_matches:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Key Matches
        last_converged_on:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Last Converged On
        machine_id:
          title: Machine Id
          type: string
        name:
          title: Name
          type: string
        os:
          title: Os
          type: string
      required:
      - machine_id
      - name
      - os
      - hostname
      - coffer_version
      - last_converged_on
      - key_matches
      - agents
      - is_self
      title: MachineOut
      type: object
    MachineRemovedOut:
      properties:
        removed:
          title: Removed
          type: boolean
      required:
      - removed
