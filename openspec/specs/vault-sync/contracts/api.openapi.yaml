openapi: 3.1.0
info:
  title: Coffer — Vault Sync API
  version: 0.4.0
  description: |
    REST surface for vault sync (spec vault-sync "Cover the same operations over
    HTTP"). Nineteen operations: the round and its answers, the preview of a
    join, the remote's configuration, the run history, the machine registry, and
    the master key.

    Sync is a **cross-cutting service, not a resource kind**, so it has its own
    route family rather than riding `/resources`.

    ## One operation: the round

    The vault **converges bidirectionally** with a git remote the user owns.
    Every write path here is the same round ("Run the seven round steps in
    order") — apply what the remote has, publish what this vault has, on a diff
    against a recorded base. `POST /run` is that round; `POST /adopt` is the
    same round on a machine joining a remote. Whether a machine is joining — and
    as new or returning — is read from the absence of a pointer rather than from
    the route ("Detect joining on every round without a pointer"), so
    configuring a remote on a machine that forgot its pointer cannot route
    around the new-versus-returning distinction ("Tell a new machine from a
    returning one"). Joining itself is explicit: only `/adopt` joins, after
    `GET /join` has stated the join, and `/run` on a machine that has not joined
    reports `awaiting_join`.

    There is deliberately **no export and no import route**. Writing a bundle to
    a directory and reading one back was a wholesale overwrite with no base — the
    operation that caused a mutual deletion — and it has no place beside the
    diff-based round. What replaces it: a new machine calls `/adopt`, an offline
    medium is a `file://` remote, and a hand-carried copy is a `git clone` of the
    working tree.

    ## The deletion guard, and the three answers to it

    A round whose diff would delete more of one side than the guard permits does
    not run ("Hold a round that would lose too much"): it is **held** ("Ask the
    user to confirm a tripped breaker"), and `RoundOut.pending` carries which
    direction tripped ("Guard both directions"), the per-area breaches and the
    paths. Three routes answer a held round, and they are three separate routes
    rather than flags on one:

    - `POST /confirm` — apply it anyway.
    - `POST /reject` — leave everything as it is.
    - `POST /rebuild` — rebuild **this** machine from the remote, discarding
      local-only documents ("Rebuild a vault from the remote only on request").
      Destructive on purpose: it is the answer for a machine whose vault is
      gone, which rejoins with a valid base and nothing to publish but the loss
      ("Hold a returning machine's empty vault instead of publishing the loss"),
      so neither other answer serves it.

    `POST /rollback` undoes the last round ("Snapshot before applying and roll
    back from it"); `POST /restore` brings the vault back to a sha, a ref, or
    the last commit at or before a `YYYY-MM-DD` date ("Restore to a revision
    without discarding later work"). Restore is always explicit — no round
    reaches back into history on its own ("Restore only on request").

    ## Credentials never appear on this surface

    Every remote shape carries `credential_ref` — a name in the credential store
    — and **never** the push credential itself, so a remote can be rendered in a
    browser, logged, or pasted into a bug report with nothing to redact. The
    daemon resolves the ref at push time and nowhere else ("Hand the push
    credential to git as a helper").

    The **master key never travels inside the repository** ("Never write the master
    key into the repository"); moving it
    is a separate, deliberate act. `POST /key/export` hands its material back over
    the token-guarded loopback API and the caller decides where it lands — the
    daemon never writes to a path a caller named, because a browser has no path
    to give it. Ciphertext applied onto a machine without the matching key is
    stored as-is and reported in `locked_refs` ("Report refs without a key as
    locked"); the affected resources
    refuse to spawn rather than failing decryption silently.

    These two routes are the only survivors of the deleted export/import pair,
    and they move key **material** only — never documents.

    ## Sync being off is the ordinary state

    An unconfigured remote is a `200` with `configured: false` and
    `remote: null`, not an error. `DELETE /remote` is idempotent and answers
    `cleared: false` when there was nothing to clear.

    ## Retiring a machine rewrites nothing else

    Retiring a machine removes its descriptor and rewrites nothing else. No
    scope can name a machine, because per-agent reach is machine-local ("Keep
    reach machine-local", "Scope names agents only"). Two travelling documents
    do name a machine id — a channel's machine binding and the curation owner in
    the `internal-engine` settings — and a binding or owner that named the
    retired machine is then reported as naming a machine the registry does not
    hold ("Report and change the rewriter's owner"), never silently rewritten.
    That is why `MachineRemovedOut` has no second half. Renaming is free: the
    id is derived and nothing keys on the name ("Treat the machine name as a
    label").

    ## Errors

    Every failure is the app-wide envelope,
    `{"error": {"code": "...", "message": "..."}}`, raised from a `CofferError`
    and mapped centrally. A malformed URL or branch is a `422` at the wire — the
    `pattern` catches the shape and the domain's full rule runs in a validator,
    so a bad name is refused here rather than becoming a `git` error later.
    Neither may begin with `-`: git would read it as an option, and
    `--receive-pack=<cmd>` is a command ("Refuse a URL or branch git would read
    as an option").

servers:
  - url: http://127.0.0.1:8000
    description: The local daemon, loopback only.

security:
  - CofferToken: []

tags:
  - name: sync
    description: The converge round, the remote, the history, the machines, the key.

paths:
  /api/v1/sync/run:
    post:
      tags: [sync]
      operationId: runSyncRound
      summary: Run one converge round now.
      description: |
        Never joins. On a machine that has not joined the remote the round
        still detects the join — new, or returning with its recovered base —
        and reports it in `join` and `join_report`, applying and pushing
        nothing, with status `awaiting_join`; `POST /adopt` joins.
      responses:
        "200":
          description: The round's outcome. A held round reports `pending`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoundOut"

  /api/v1/sync/join:
    get:
      tags: [sync]
      operationId: previewSyncJoin
      summary: State the join `/adopt` would make, applying nothing.
      description: |
        Joining is explicit and reported: before anything is applied, the
        surfaces state which case it is, when this machine last converged, how
        many documents the remote has changed since, and how many this vault
        has. This fetches and reads the remote's registry the way the round's
        step 0 does, and stops there — the vault and the pointer are
        untouched. `joining: false` means this machine already converged here
        and `/adopt` is an ordinary round. `case: ambiguous` is a returning
        machine whose recorded base is gone; it still needs `choice`.
      parameters:
        - name: choice
          in: query
          required: false
          schema:
            type: string
            enum: [keep-local]
          description: Preview the join as `/adopt` would make it with this choice.
      responses:
        "200":
          description: The join, stated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinPreviewOut"

  /api/v1/sync/adopt:
    post:
      tags: [sync]
      operationId: adoptSyncRemote
      summary: Join the configured remote.
      description: |
        The same round as any other. The surfaces call `GET /join` first and
        show its answer before calling this. `choice` is only for a returning machine
        whose recorded base is gone from the remote's history: `keep-local`
        joins as new and publishes this vault's documents as additions. Absent,
        that case is refused rather than guessed.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdoptIn"
      responses:
        "200":
          description: The joining round's outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoundOut"

  /api/v1/sync/confirm:
    post:
      tags: [sync]
      operationId: confirmHeldSyncRound
      summary: Apply a round the deletion guard held.
      responses:
        "200":
          description: The now-applied round's outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoundOut"
        "409":
          description: "`SYNC_NOTHING_PENDING` — no round is held for confirmation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/sync/reject:
    post:
      tags: [sync]
      operationId: rejectHeldSyncRound
      summary: Discard a held round, leaving both sides as they are.
      responses:
        "200":
          description: Cleared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncRemoteClearedOut"
        "409":
          description: "`SYNC_NOTHING_PENDING` — no round is held for confirmation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/sync/rebuild:
    post:
      tags: [sync]
      operationId: rebuildVaultFromRemote
      summary: Rebuild this machine from the remote, discarding local-only documents.
      description: |
        Destructive on purpose — the answer for a machine whose vault is gone.
      responses:
        "200":
          description: The rebuilding round's outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoundOut"
        "409":
          description: |
            `SYNC_NOTHING_TO_ROLL_BACK` when no remote is configured;
            `SYNC_BUNDLE_TOO_NEW` when the remote's layout is newer than this
            build understands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          $ref: "#/components/responses/GitFailed"

  /api/v1/sync/rollback:
    post:
      tags: [sync]
      operationId: rollbackLastSyncRound
      summary: Undo the last round.
      responses:
        "200":
          description: |
            The rollback round's outcome. The pointer does not move: the
            reverted vault is an ordinary local change the next round publishes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoundOut"
        "409":
          description: "`SYNC_NOTHING_TO_ROLL_BACK` — no remote, no pointer, or no pre-apply snapshot to return to."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/sync/restore:
    post:
      tags: [sync]
      operationId: restoreVaultAtPoint
      summary: Bring the vault back to an earlier point in the remote's history.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreIn"
      responses:
        "200":
          description: The restoring round's outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoundOut"
        "409":
          description: |
            `SYNC_NOTHING_TO_ROLL_BACK` when no remote is configured or this
            machine has no pointer; `SYNC_BUNDLE_TOO_NEW` when the revision's
            layout is newer than this build understands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          $ref: "#/components/responses/GitFailed"

  /api/v1/sync/remote:
    get:
      tags: [sync]
      operationId: getSyncRemote
      summary: The configured remote, or nothing.
      responses:
        "200":
          description: |
            `configured: false` with `remote: null` on a fresh vault — sync
            being off is the ordinary state, not an error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncRemoteStateOut"
    put:
      tags: [sync]
      operationId: setSyncRemote
      summary: Configure the remote.
      description: |
        Every field but the URL carries a default, so a `PUT` with a bare URL is
        a complete configuration rather than a half-set one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRemoteIn"
      responses:
        "200":
          description: The stored remote, without its credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncRemoteOut"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      tags: [sync]
      operationId: clearSyncRemote
      summary: Forget the remote. Idempotent.
      responses:
        "200":
          description: "`cleared: false` when there was nothing to clear."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncRemoteClearedOut"

  /api/v1/sync/status:
    get:
      tags: [sync]
      operationId: getSyncStatus
      summary: The remote, the last round, and this machine's own identity.
      responses:
        "200":
          description: The status a surface opens on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncStatusOut"

  /api/v1/sync/runs:
    get:
      tags: [sync]
      operationId: listSyncRuns
      summary: Every round this vault has run, newest first.
      description: |
        Read-only and unfiltered. The surface searches, filters and pages in the
        browser over the window it is handed, the same way the Activity page
        does, so this route stays one query with one knob. Rounds that changed
        nothing are included — they are what makes a gap in the record visible.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 500
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: The run history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncRunListOut"

  /api/v1/sync/machines:
    get:
      tags: [sync]
      operationId: listSyncMachines
      summary: Every machine in the registry, with this one marked.
      responses:
        "200":
          description: The registry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MachineListOut"

  /api/v1/sync/machines/self:
    patch:
      tags: [sync]
      operationId: renameSelfMachine
      summary: Rename this machine.
      description: |
        Free — nothing keys on the label, so nothing else has to change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MachineRenameIn"
      responses:
        "200":
          description: This machine's descriptor, renamed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MachineOut"
        "422":
          description: "`BACKUP_REMOTE_INVALID` — the name is empty."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/sync/machines/{machine_id}:
    delete:
      tags: [sync]
      operationId: retireSyncMachine
      summary: Retire a machine from the registry.
      description: |
        Idempotent: retiring an id the registry does not hold answers
        `removed: true` as well.
      parameters:
        - name: machine_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed. Nothing else in the vault is rewritten.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MachineRemovedOut"
        "422":
          description: |
            `SYNC_CANNOT_RETIRE_SELF` when the id is this machine's own;
            `BACKUP_REMOTE_INVALID` when no sync remote is configured, so there
            is no registry to retire from.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/sync/key/fingerprint:
    get:
      tags: [sync]
      operationId: getMasterKeyFingerprint
      summary: This machine's master-key fingerprint.
      responses:
        "200":
          description: The fingerprint, or null when none has been published.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyFingerprintOut"

  /api/v1/sync/key/export:
    post:
      tags: [sync]
      operationId: exportMasterKey
      summary: Hand back the master key's material.
      description: |
        Moves key **material** only, never documents. The caller decides where
        it lands; the daemon never writes to a path a caller named.
      responses:
        "200":
          description: The key material.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyMaterialOut"
        "422":
          description: "`MASTER_KEY_FILE_INVALID` — this machine holds no master key to export."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/sync/key/import:
    post:
      tags: [sync]
      operationId: importMasterKey
      summary: Adopt a master key exported from another machine.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyMaterialIn"
      responses:
        "200":
          description: |
            The credential refs still locked after the import — ciphertext this
            machine holds but cannot decrypt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyImportOut"
        "422":
          description: "`MASTER_KEY_FILE_INVALID` — no material was supplied, or it is not a valid Fernet key."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  securitySchemes:
    CofferToken:
      type: apiKey
      in: header
      name: X-Coffer-Token

  responses:
    GitFailed:
      description: "`GIT_MIRROR_FAILED` — a git operation against the working tree or the remote failed."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unprocessable:
      description: |
        The remote was refused: a malformed URL or branch at the wire, or
        `BACKUP_REMOTE_INVALID` when the working tree is refused or the remote
        cannot be reached.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string

    DocChangeOut:
      type: object
      required: [path, status]
      description: One document's fate in one round — what moved, and which way.
      properties:
        path:
          type: string
        status:
          type: string
          enum: [added, modified, deleted]

    DiffCountsOut:
      type: object
      description: |
        What a round moved, as a tally **and** as the list behind it. The tally
        is what a row shows; the list is what the reader opens the row to find.
      properties:
        added:
          type: integer
          default: 0
        modified:
          type: integer
          default: 0
        deleted:
          type: integer
          default: 0
        changes:
          type: array
          default: []
          description: Every path this side of the round touched, sorted, with its status.
          items:
            $ref: "#/components/schemas/DocChangeOut"

    FailureOut:
      type: object
      required: [path, reason]
      properties:
        path:
          type: string
        reason:
          type: string

    BreachOut:
      type: object
      required: [area, deleted, total]
      description: One area the deletion guard tripped on, and by how much.
      properties:
        area:
          type: string
        deleted:
          type: integer
        total:
          type: integer

    PendingConfirmationOut:
      type: object
      required: [direction, breaches, paths, raised_at]
      description: A round the deletion guard held.
      properties:
        direction:
          type: string
          enum: [apply, publish]
          description: |
            `apply` means the remote would delete too much of this vault;
            `publish` means this vault would delete too much of the remote — the
            case where this machine is the damaged one.
        breaches:
          type: array
          items:
            $ref: "#/components/schemas/BreachOut"
        paths:
          type: array
          items:
            type: string
        raised_at:
          type: string
          format: date-time

    JoinPreviewOut:
      type: object
      required: [joining]
      properties:
        joining:
          type: boolean
          description: False when this machine already converged with the remote.
        case:
          type: [string, "null"]
          enum: [new, returning, ambiguous, null]
          default: null
        base:
          type: [string, "null"]
          default: null
          description: The commit a returning machine recovered from its own descriptor.
        last_converged_on:
          type: [string, "null"]
          format: date
          default: null
          description: The day this machine last converged here; null for a new machine.
        remote_changed:
          type: [integer, "null"]
          default: null
          description: |
            Documents the remote changed since this machine's base — everything
            it holds, for a new machine. Null when the base is gone.
        vault_documents:
          type: [integer, "null"]
          default: null
          description: Documents this vault holds.

    RoundOut:
      type: object
      required: [status, applied, published]
      description: One converge round's outcome.
      properties:
        status:
          type: string
          enum:
            [ok, no_change, conflict, awaiting_confirmation, push_failed, failed, disabled, awaiting_join]
          description: |
            The whole of `ConvergeStatus`, and `status` is what discriminates this
            one shape across every round-shaped operation. `no_change` and
            `disabled` are successes rather than skips: an unchanged vault makes
            no commit by design, and an unconfigured or switched-off remote is
            the ordinary state of a fresh install. `conflict` left the vault
            untouched and the pointer unmoved; `awaiting_confirmation` is held at
            the deletion guard and `pending` says which way; `push_failed`
            applied everything locally and kept the commit for the next round.
            `awaiting_join` is a machine that has not joined the remote: joining
            is explicit, so an ordinary round applied and pushed nothing, and
            only `POST /adopt` joins.
        join:
          type: [string, "null"]
          default: null
          description: "`new` or `returning` when this round joined a remote; null otherwise."
        applied:
          $ref: "#/components/schemas/DiffCountsOut"
        published:
          $ref: "#/components/schemas/DiffCountsOut"
        commit:
          type: [string, "null"]
          default: null
        conflicts:
          type: array
          default: []
          items:
            type: string
        agent_resolved:
          type: array
          default: []
          description: |
            Paths an agent merged. Always reported, successful or not: a silent
            machine merge of the user's own notes is what they would most want
            told.
          items:
            type: string
        failures:
          type: array
          default: []
          items:
            $ref: "#/components/schemas/FailureOut"
        not_applicable:
          type: array
          default: []
          description: |
            Paths this round met that can never apply on this machine (an agent
            whose config directory does not exist here). Held and not retried,
            and not failures.
          items:
            type: string
        locked_refs:
          type: array
          default: []
          description: Credential refs whose ciphertext this machine cannot decrypt.
          items:
            type: string
        join_report:
          description: |
            On an `awaiting_join` round: the join the round detected — detection
            runs on every round without a pointer — and did not apply. `join`
            names its kind.
          oneOf:
            - $ref: "#/components/schemas/JoinPreviewOut"
            - type: "null"
          default: null
        pending:
          oneOf:
            - $ref: "#/components/schemas/PendingConfirmationOut"
            - type: "null"
          default: null
        error:
          type: [string, "null"]
          default: null

    RunRecordOut:
      allOf:
        - $ref: "#/components/schemas/RoundOut"
        - type: object
          required: [id, started_at, finished_at]
          description: |
            One round as the history holds it: the same report, plus when. A
            superset of `RoundOut` rather than a shape of its own, so the status
            page and the history table can never drift into describing a round
            differently.
          properties:
            id:
              type: integer
              description: |
                A row key for a surface, never shown — two rounds that changed
                nothing are otherwise indistinguishable values.
            started_at:
              type: string
              format: date-time
            finished_at:
              type: string
              format: date-time

    SyncRunListOut:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/RunRecordOut"

    AdoptIn:
      type: object
      properties:
        choice:
          type: [string, "null"]
          default: null
          description: |
            `keep-local` only, and only for a returning machine whose recorded
            base is gone from the remote's history.

    SyncRemoteIn:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: |
            Becomes an argument to `git`, so it may not begin with `-`.
        branch:
          type: string
          default: main
          description: Held to `git check-ref-format --branch`.
        credential_ref:
          type: [string, "null"]
          default: null
          description: |
            A name in the credential store — **never** the secret. The daemon
            resolves it at push time and nowhere else.
        include_credentials:
          type: boolean
          default: false
          description: Whether encrypted credentials travel with the documents.
        interval_seconds:
          type: integer
          default: 3600
          minimum: 1
          description: |
            Seconds between automatic rounds. The worker converges on this
            interval as soon as a remote is configured and `enabled`.
        enabled:
          type: boolean
          default: true
          description: |
            Whether sync runs. `false` PAUSES the remote without forgetting it:
            every round reports `disabled`, records nothing and raises no
            attention on any surface, while the remote, the pointer and the
            history are kept (see "Pause a configured remote without
            forgetting it"). `coffer sync remote set` sends the stored value
            back, so re-running it keeps a paused remote paused; a first remote
            is stored enabled.
        worktree_path:
          type: string
          default: ~/.coffer/sync
          minLength: 1
          description: |
            The separate working tree the round commits from — never the live
            vault directory.

    SyncRemoteOut:
      type: object
      required:
        [url, branch, credential_ref, include_credentials, interval_seconds, enabled, worktree_path]
      properties:
        url:
          type: string
        branch:
          type: string
        credential_ref:
          type: [string, "null"]
        include_credentials:
          type: boolean
        interval_seconds:
          type: integer
        enabled:
          type: boolean
        worktree_path:
          type: string

    SyncRemoteStateOut:
      type: object
      required: [configured, remote]
      properties:
        configured:
          type: boolean
          description: "`false` on a fresh vault."
        remote:
          oneOf:
            - $ref: "#/components/schemas/SyncRemoteOut"
            - type: "null"

    SyncRemoteClearedOut:
      type: object
      required: [cleared]
      properties:
        cleared:
          type: boolean
          description: "`false` when there was nothing to clear — delete is idempotent."

    SyncStatusOut:
      type: object
      required: [configured, remote, last_run, machine_id, machine_id_is_derived]
      properties:
        configured:
          type: boolean
        remote:
          oneOf:
            - $ref: "#/components/schemas/SyncRemoteOut"
            - type: "null"
        last_run:
          oneOf:
            - $ref: "#/components/schemas/RoundOut"
            - type: "null"
        machine_id:
          type: string
          description: This machine's own id, so a surface can mark its row in the registry.
        machine_id_is_derived:
          type: boolean
          description: |
            `true` when the id was derived from the host; `false` when it came
            from the local fallback file (`~/.coffer/machine-id`), which does
            not survive deleting `~/.coffer`.
        joined:
          type: boolean
          default: false
          description: |
            Whether this machine has joined the remote. Until it has, a round
            reports `awaiting_join` and only `POST /adopt` joins.
        not_applicable:
          type: array
          default: []
          description: Every path recorded as not applicable on this machine, sorted.
          items:
            type: string

    MachineOut:
      type: object
      required:
        [machine_id, name, os, hostname, coffer_version, last_converged_on, key_matches, agents, is_self]
      properties:
        machine_id:
          type: string
        name:
          type: string
        os:
          type: string
        hostname:
          type: string
        coffer_version:
          type: string
        last_converged_on:
          type: [string, "null"]
          description: |
            The **day** this machine last converged — a day rather than an
            instant, because an idle machine must not commit a heartbeat every
            round.
        key_matches:
          type: [boolean, "null"]
          description: |
            Null when either side has published no fingerprint yet. `false`
            means that machine's credentials cannot be decrypted here.
        agents:
          type: array
          items:
            type: string
        is_self:
          type: boolean

    MachineListOut:
      type: object
      required: [machines]
      properties:
        machines:
          type: array
          items:
            $ref: "#/components/schemas/MachineOut"

    MachineRenameIn:
      type: object
      required: [name]
      properties:
        name:
          type: string

    MachineRemovedOut:
      type: object
      required: [removed]
      description: |
        Retiring a machine removes its descriptor and rewrites nothing else; a
        channel binding or curation owner that named it is then reported as
        naming a machine the registry does not hold. That is why this answer
        has no second half.
      properties:
        removed:
          type: boolean

    RestoreIn:
      type: object
      properties:
        at:
          type: [string, "null"]
          default: null
          description: |
            A sha, a ref, or a `YYYY-MM-DD` date resolving to the last commit at
            or before it — the tip cannot return something deleted last week.

    KeyMaterialIn:
      type: object
      required: [material]
      properties:
        material:
          type: string

    KeyMaterialOut:
      type: object
      required: [material]
      properties:
        material:
          type: string

    KeyImportOut:
      type: object
      required: [locked_refs]
      properties:
        locked_refs:
          type: array
          description: Refs whose ciphertext is still undecryptable after the import.
          items:
            type: string

    KeyFingerprintOut:
      type: object
      required: [fingerprint]
      properties:
        fingerprint:
          type: [string, "null"]
