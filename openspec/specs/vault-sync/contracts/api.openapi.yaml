            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Any other error, as Coffer's error envelope.
      summary: Move Vault
      tags:
      - sync
components:
  schemas:
    AgentHandoffOut:
      properties:
        handoff:
          $ref: '#/components/schemas/HandoffOut'
        paths:
          items:
            type: string
          title: Paths
          type: array
      required:
      - handoff
      - paths
      title: AgentHandoffOut
      type: object
    AgentInventoryOut:
      properties:
        name:
          title: Name
          type: string
        plugins:
          items:
            $ref: '#/components/schemas/SyncPluginOut'
          title: Plugins
          type: array
        type:
          title: Type
          type: string
      required:
      - type
      - name
      - plugins
      title: AgentInventoryOut
      type: object
    Answer:
      enum:
      - mine
      - theirs
      - edited
      title: Answer
      type: string
    AreaCountOut:
      properties:
        area:
          title: Area
          type: string
        files:
          title: Files
          type: integer
      required:
      - area
      - files
      title: AreaCountOut
      type: object
    AreaCountsOut:
      properties:
        knowledge_documents:
          title: Knowledge Documents
          type: integer
        resources:
          title: Resources
          type: integer
        secrets:
          title: Secrets
          type: integer
        secrets_synced:
          title: Secrets Synced
          type: boolean
        skills:
          title: Skills
          type: integer
      required:
      - knowledge_documents
      - skills
      - resources
      - secrets
      - secrets_synced
      title: AreaCountsOut
      type: object
    BreachOut:
      properties:
        area:
          title: Area
          type: string
        lost:
          title: Lost
          type: integer
        total:
          title: Total
          type: integer
      required:
      - area
      - lost
      - total
      title: BreachOut
      type: object
    ConflictFileOut:
      properties:
        agent_conversation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Agent Conversation Id
        agent_handed_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Agent Handed At
        agent_mergeable:
          default: false
          title: Agent Mergeable
          type: boolean
        agent_merged_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Agent Merged At
        agent_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Agent Name
        agent_state:
          anyOf:
          - enum:
            - handed_off
            - merged_by_agent
            type: string
          - type: 'null'
          title: Agent State
        answer:
          anyOf:
          - $ref: '#/components/schemas/Answer'
          - type: 'null'
        area:
          title: Area
          type: string
        editor_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Editor Path
        other_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Other Path
        ours_time:
          anyOf:
          - type: string
          - type: 'null'
          title: Ours Time
        path:
          title: Path
          type: string
        reason:
          $ref: '#/components/schemas/ConflictReason'
        secret:
          default: false
          title: Secret
          type: boolean
        theirs_machine:
          anyOf:
          - type: string
          - type: 'null'
          title: Theirs Machine
        theirs_time:
          anyOf:
          - type: string
          - type: 'null'
          title: Theirs Time
      required:
      - path
      - area
      - reason
      - ours_time
      - theirs_time
      - theirs_machine
      - other_path
      - answer
      - editor_path
      - secret
      - agent_mergeable
      - agent_state
      - agent_handed_at
      - agent_name
      - agent_conversation_id
      - agent_merged_at
      title: ConflictFileOut
      type: object
    ConflictReason:
      enum:
      - both_changed
      - changed_and_deleted
      - same_name_different_uid
      - duplicate_uid
      - invalid_merge
      - join_differs
      title: ConflictReason
      type: string
    EditorCopyOut:
      properties:
        editor_path:
          title: Editor Path
          type: string
        path:
          title: Path
          type: string
      required:
      - path
      - editor_path
      title: EditorCopyOut
      type: object
    ErrorDetail:
      properties:
        code:
          examples:
          - RESOURCE_NOT_FOUND
          title: Code
          type: string
        details:
          additionalProperties: true
          title: Details
          type: object
        message:
          examples:
          - 'resource not found: mcp_server:filesystem'
          title: Message
          type: string
      required:
      - code
      - message
      - details
      title: ErrorDetail
      type: object
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - error
      title: ErrorResponse
      type: object
    FileAnswerIn:
      properties:
        answer:
          $ref: '#/components/schemas/Answer'
        path:
          minLength: 1
          title: Path
          type: string
      required:
      - path
      - answer
      title: FileAnswerIn
      type: object
    FilePathIn:
      properties:
        path:
          minLength: 1
          title: Path
          type: string
      required:
      - path
      title: FilePathIn
      type: object
    FileVersionsOut:
      properties:
        binary:
          title: Binary
          type: boolean
        ours:
          anyOf:
          - type: string
          - type: 'null'
          title: Ours
        path:
          title: Path
          type: string
        take_theirs:
          title: Take Theirs
          type: string
        theirs:
          anyOf:
          - type: string
          - type: 'null'
          title: Theirs
      required:
      - path
      - ours
      - theirs
      - take_theirs
      - binary
      title: FileVersionsOut
      type: object
    HandoffIn:
      description: |-
        Which files to hand to an agent (every file an agent may merge when
        ``paths`` is omitted). ``agent`` and ``conversation_id`` are what the
        caller opened the prompt in, kept for the file's merged state; send the
        request again with them once the conversation exists.
      properties:
        agent:
          anyOf:
          - maxLength: 64
            type: string
          - type: 'null'
          title: Agent
        conversation_id:
          anyOf:
          - maxLength: 128
            type: string
          - type: 'null'
          title: Conversation Id
        paths:
          anyOf:
          - items:
              type: string
            minItems: 1
            type: array
          - type: 'null'
          title: Paths
      title: HandoffIn
      type: object
    HandoffOut:
      description: |-
