openapi: 3.0.3
info:
  title: Coffer — Channels API
  version: 0.1.0
  description: >
    REST surface for messaging channels (spec channels). Channel CRUD rides the
    generic /resources endpoints (spec resource-framework); this contract adds the
    channel-specific operations: pairing, status and notify. Inbound traffic
    never arrives over this API: Telegram is polled and SeaTalk is pushed down an
    outbound websocket connection the daemon holds, so no route here is called
    by an IM platform.

    The conversation, message, pending-queue and SSE routes a channel turn runs
    on belong to the turn platform and are contracted in spec chat; the agent
    listing and per-agent model catalogue are contracted in spec agent-registry.
    A channel consumes both and adds no route of its own to either.

servers:
  - url: http://127.0.0.1:8000

security:
  - bearerAuth: []

paths:
  /api/v1/channels/{uid}/pairing-code:
    post:
      summary: Issue a single-use pairing code for a channel
      operationId: issuePairingCode
      tags: [channels]
      parameters:
        - $ref: '#/components/parameters/ChannelUid'
      responses:
        '200':
          description: Code issued (replaces any previous pending code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingCodeOut'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/channels/{uid}/status:
    get:
      summary: Runtime, pairing, and inbound status of a channel
      operationId: getChannelStatus
      tags: [channels]
      parameters:
        - $ref: '#/components/parameters/ChannelUid'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelStatusOut'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/channels/{uid}/notify:
    post:
      summary: Push a text message to the channel's paired peer
      operationId: notifyChannel
      tags: [channels]
      parameters:
        - $ref: '#/components/parameters/ChannelUid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotifyIn'
      responses:
        '200':
          description: Delivered to the IM platform
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotifyOut'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            CHANNEL_NOT_PAIRED (the channel has no paired peer, or `chat_id`
            names a chat this channel is not paired to) or CHANNEL_NOT_RUNNING
            (the channel's adapter is not running here, e.g. it is disabled).
            Nothing is sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: CHANNEL_SEND_FAILED — the IM platform refused or failed the send
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    ChannelUid:
      name: uid
      in: path
      required: true
      schema: { type: string }
      description: >-
        The channel resource's immutable uid, as `ResourceOut.uid` reports it.
        Not the channel's name: a name is a label its owner may edit, and the
        websocket supervisor keys its connection on this value — a path built
        from a label stops resolving the moment the label changes.

  responses:
    NotFound:
      description: No channel with this uid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    PairingCodeOut:
      type: object
      required: [code, expires_at]
      properties:
        pair_url:
          type: string
          description: >-
            A link carrying the code, so the owner pairs by opening it rather
            than transcribing it. Empty when the platform has no such link or
            the bot's username is unknown; the typed code always works.
        code:
          type: string
          description: 8-character code from an unambiguous alphabet
        expires_at:
          type: string
          format: date-time

    ChannelStatusOut:
      type: object
      required: [uid, name, channel_type, enabled, running, pending_pairing, peer, inbound]
      properties:
        uid:
          type: string
          description: >-
            The channel resource's immutable identity — the same value the
            path takes, echoed back so a client that reached this status from
            a list can key its state on it without re-deriving anything.
          example: 9f2c1a7b4e8d4c1fa0b3d5e6f7081920
        name:
          type: string
          description: >-
            A mutable label, unique among channels. For display only; anything
            that must keep pointing at this channel holds the uid.
        channel_type:
          type: string
          enum: [telegram, seatalk]
        enabled: { type: boolean }
        running:
          type: boolean
          description: Whether the adapter task is currently live
        pending_pairing:
          type: boolean
          description: Whether an unexpired pairing code is outstanding
        peer:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ChannelPeerOut'
        inbound:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/InboundInfoOut'
          description: >-
            A SeaTalk channel's websocket connection. Null for a telegram
            channel, whose inbound is the adapter's own polling and is reported
            by `running`.
        diagnostics:
          type: array
          description: >-
            Contradictions between the channel's configuration and what the
            platform actually permits. Empty is the healthy case.
          items:
            $ref: '#/components/schemas/ChannelDiagnosticOut'
        runs_on:
          type: string
          nullable: true
          description: >-
            The machine_id of the one machine whose daemon runs this channel's
            adapter. Null means unbound, which runs nowhere.
        runs_here:
          type: boolean
          description: >-
            Whether the bound machine is the one answering this request. It
            separates the two facts `running: false` collapses — a channel that
            failed to start here, and a channel that was never this machine's
            to start.

    ChannelDiagnosticOut:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable identifier, so a UI can style or link the finding
        message:
          type: string
          description: What is wrong and what to do about it

    ChannelPeerOut:
      type: object
      required: [chat_id, display_name, paired_at, active_conversation_id]
      properties:
        chat_id: { type: string }
        display_name: { type: string }
        paired_at:
          type: string
          format: date-time
        active_conversation_id:
          type: string
          nullable: true

    InboundInfoOut:
      type: object
      description: >-
        How a SeaTalk channel's inbound is doing: the state of the one outbound
        websocket connection it receives every event on (spec channels/seatalk
        "Report the websocket connection as the channel's inbound state"). There
        is no listener, port, path, public URL or tunnel to report.
      required: [websocket_state, websocket_error]
      properties:
        websocket_state:
          type: string
          nullable: true
          enum: [connecting, connected, kicked, sdk_missing, error]
          description: >-
            State of the held WebSocket connection; null before the first
            connection attempt.
        websocket_error:
          type: string
          nullable: true
          description: The last connection error, verbatim, so the owner can act on it

    NotifyIn:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4096
        chat_id:
          type: [string, "null"]
          default: null
          description: >-
            Which paired chat to push to. Omitted, the channel's owner chat —
            its earliest pairing, the owner's DM. A chat this channel is not
            paired to is refused, so a caller cannot address an arbitrary
            group.

    NotifyOut:
      type: object
      required: [sent]
      properties:
        sent: { type: boolean }

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: object
              additionalProperties: true
