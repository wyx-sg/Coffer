components:
  schemas:
    ChannelCommandOut:
      description: |-
        One slash command the channel answers (spec channels "Answer the
        conversation commands from any paired chat"), from the one roster that also
        feeds the help text and the platform menus.
      properties:
        args:
          title: Args
          type: string
        description:
          title: Description
          type: string
        description_zh:
          title: Description Zh
          type: string
        name:
          title: Name
          type: string
      required:
      - name
      - args
      - description
      - description_zh
      title: ChannelCommandOut
      type: object
    ChannelDiagnosticOut:
      properties:
        code:
          title: Code
          type: string
        message:
          title: Message
          type: string
      required:
      - code
      - message
      title: ChannelDiagnosticOut
      type: object
    ChannelPersonOut:
      description: |-
        A person paired to the channel (spec channels "Gate inbound traffic on
        sender identity"): every one is answered with identical rights.
      properties:
        active_conversation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Active Conversation Id
        chat_id:
          title: Chat Id
          type: string
        display_name:
          title: Display Name
          type: string
        paired_at:
          format: date-time
          title: Paired At
          type: string
        sender_id:
          title: Sender Id
          type: string
      required:
      - sender_id
      - display_name
      - paired_at
      - chat_id
      - active_conversation_id
      title: ChannelPersonOut
      type: object
    ChannelPromptOut:
      description: One chat kind's system prompt, as the page shows it.
      properties:
        channel_note:
          title: Channel Note
          type: string
        default_changed:
          title: Default Changed
          type: boolean
        default_style:
          title: Default Style
          type: string
      required:
      - channel_note
      - default_style
      - default_changed
      title: ChannelPromptOut
      type: object
    ChannelPromptsOut:
      properties:
        direct:
          $ref: '#/components/schemas/ChannelPromptOut'
        group:
          $ref: '#/components/schemas/ChannelPromptOut'
      required:
      - direct
      - group
      title: ChannelPromptsOut
      type: object
    ChannelStatusOut:
      properties:
        channel_type:
          enum:
          - telegram
          - seatalk
          title: Channel Type
          type: string
        commands:
          default: []
          items:
            $ref: '#/components/schemas/ChannelCommandOut'
          title: Commands
          type: array
        diagnostics:
          default: []
          items:
            $ref: '#/components/schemas/ChannelDiagnosticOut'
          title: Diagnostics
          type: array
        enabled:
          title: Enabled
          type: boolean
        handoff:
          anyOf:
          - $ref: '#/components/schemas/HandoffOut'
          - type: 'null'
        inbound:
          anyOf:
          - $ref: '#/components/schemas/InboundInfoOut'
          - type: 'null'
        name:
          title: Name
          type: string
        pending_pairing:
          title: Pending Pairing
          type: boolean
        people:
          items:
            $ref: '#/components/schemas/ChannelPersonOut'
          title: People
          type: array
        prompts:
          anyOf:
          - $ref: '#/components/schemas/ChannelPromptsOut'
          - type: 'null'
        running:
          title: Running
          type: boolean
        secret_approval:
          anyOf:
          - $ref: '#/components/schemas/SecretApprovalOut'
          - type: 'null'
        settings:
          anyOf:
          - discriminator:
              mapping:
                seatalk: '#/components/schemas/SeaTalkChannelConfig'
                telegram: '#/components/schemas/TelegramChannelConfig'
              propertyName: channel_type
            oneOf:
            - $ref: '#/components/schemas/TelegramChannelConfig'
            - $ref: '#/components/schemas/SeaTalkChannelConfig'
          - type: 'null'
          title: Settings
        starting:
          default: false
          title: Starting
          type: boolean
        uid:
          title: Uid
          type: string
        workspace_directory:
          default: ''
          title: Workspace Directory
          type: string
      required:
      - uid
      - name
      - channel_type
      - enabled
      - running
      - pending_pairing
      - people
      - inbound
      - diagnostics
      - secret_approval
      - starting
      - handoff
      - settings
      - prompts
      - commands
      - workspace_directory
      title: ChannelStatusOut
      type: object
    CredentialCheckOut:
      properties:
        bot_handle:
          anyOf:
          - type: string
          - type: 'null'
          title: Bot Handle
        bot_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Bot Name
        detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Detail
        ok:
          title: Ok
          type: boolean
        reason:
          anyOf:
          - enum:
            - missing
            - rejected
            - unreachable
            - timeout
            type: string
          - type: 'null'
          title: Reason
        same_bot:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Same Bot
      required:
      - ok
      - bot_handle
      - bot_name
      - same_bot
      - reason
      - detail
      title: CredentialCheckOut
      type: object
    CronSchedule:
      additionalProperties: false
      description: A five-field cron expression, in local time.
      properties:
        expr:
          title: Expr
          type: string
        kind:
          const: cron
          default: cron
          title: Kind
          type: string
      required:
      - expr
      title: CronSchedule
      type: object
    DailyReportIn:
      properties:
        agent:
          anyOf:
          - type: string
          - type: 'null'
          title: Agent
        channel:
          minLength: 1
          title: Channel
          type: string
        time:
          default: '18:00'
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          title: Time
          type: string
      required:
      - channel
      title: DailyReportIn
      type: object
    DailySchedule:
      additionalProperties: false
      description: Every day at ``time`` (local).
      properties:
        kind:
          const: daily
          default: daily
          title: Kind
          type: string
        time:
          title: Time
          type: string
      required:
      - time
      title: DailySchedule
      type: object
    ErrorDetail:
      properties:
        code:
          examples:
          - RESOURCE_NOT_FOUND
          title: Code
          type: string
        details:
          additionalProperties: true
          title: Details
          type: object
        message:
          examples:
          - 'resource not found: mcp_server:filesystem'
          title: Message
          type: string
      required:
      - code
      - message
      - details
      title: ErrorDetail
      type: object
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - error
      title: ErrorResponse
      type: object
    HandoffOut:
      description: |-
        A chore for the person's agent. ``prompt`` is the whole text to copy or
        to pre-fill a new conversation with; Coffer never sends it itself.
      properties:
        prompt:
          title: Prompt
          type: string
      required:
      - prompt
      title: HandoffOut
      type: object
    HourlySchedule:
      additionalProperties: false
      description: Every hour, at ``minute`` past.
      properties:
        kind:
          const: hourly
          default: hourly
          title: Kind
          type: string
        minute:
          default: 0
          maximum: 59.0
          minimum: 0.0
          title: Minute
          type: integer
      title: HourlySchedule
