      description: 'Set how one tool is exposed to agents: ``auto``, ``listed`` or ``search``.'
      operationId: set_tool_exposure_api_v1_resources_mcp_server__uid__tools__tool__exposure_patch
      parameters:
      - in: path
        name: uid
        required: true
        schema:
          title: Uid
          type: string
      - in: path
        name: tool
        required: true
        schema:
          title: Tool
          type: string
      - in: header
        name: x-coffer-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Coffer-Token
      - in: header
        name: x-coffer-actor
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Coffer-Actor
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolExposureBody'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request failed validation (`CONFIG_INVALID`); the submitted values are not echoed back.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Any other error, as Coffer's error envelope.
      summary: Set Tool Exposure
      tags:
      - mcp
