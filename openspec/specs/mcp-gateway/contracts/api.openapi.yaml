    McpServerStatusOut:
      description: |-
        Cheap per-server status, derived from persisted state (no spawn).

        Beside the state word, what the page says about it (spec mcp-gateway
        "Explain a server's state on its page"): the last transport failure and
        since when the server has been failing, the last successful call, and the
        first cited secret with no value on this machine. Each is null when
        nothing persisted says it.
      properties:
        failing_since:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Failing Since
        last_checked_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Last Checked At
        last_error:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Error
        last_error_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Last Error At
        last_ok_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Last Ok At
        last_ok_capability:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Ok Capability
        missing_runner:
          anyOf:
          - type: string
          - type: 'null'
          title: Missing Runner
        missing_secret:
          anyOf:
          - type: string
          - type: 'null'
          title: Missing Secret
        missing_secret_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Missing Secret Ref
        status:
          enum:
          - healthy
          - failing
          - unknown
          title: Status
          type: string
      required:
      - status
      - missing_runner
      - last_error
      - last_error_at
      - failing_since
      - last_checked_at
      - last_ok_at
      - last_ok_capability
      - missing_secret
      - missing_secret_ref
      title: McpServerStatusOut
      type: object
