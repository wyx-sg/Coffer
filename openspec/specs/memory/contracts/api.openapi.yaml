          items:
            $ref: '#/components/schemas/NoteSummaryOut'
          title: Notes
          type: array
      required:
      - notes
      title: NoteListOut
      type: object
    NoteOut:
      description: |-
        One note, whole: Coffer's own text and the entries behind it.

        ``body`` is Coffer's writing, not a quote of any source ("Distil each raw entry into a note
        mechanically") — the
        sources are named in ``origins`` and kept verbatim under the partition's
        ``.raw/``, which is what keeps a paraphrase traceable.
      properties:
        agents:
          items:
            type: string
          title: Agents
          type: array
        body:
          title: Body
          type: string
        created_at:
          title: Created At
          type: string
        description:
          title: Description
          type: string
        file_path:
          default: ''
          title: File Path
          type: string
        key:
          title: Key
          type: string
        origins:
          items:
            $ref: '#/components/schemas/OriginOut'
          title: Origins
          type: array
        partition:
          title: Partition
          type: string
        search_terms:
          items:
            type: string
          title: Search Terms
          type: array
        slug:
          title: Slug
          type: string
        title:
          title: Title
          type: string
        type:
          title: Type
          type: string
        updated_at:
          title: Updated At
          type: string
      required:
      - key
      - slug
      - partition
      - title
      - description
      - type
      - search_terms
      - created_at
      - updated_at
      - agents
      - file_path
      - body
      - origins
      title: NoteOut
      type: object
    NoteSummaryOut:
      description: |-
        One note without its body — which is what an index line needs.

        There is no ``status`` and no ``superseded_by``. A retired note is not
        listed as dead: it has left ``notes/`` and is recorded in ``RETIRED.md``
        (``RetiredNoteOut`` below), so nothing on this shape has to be filtered by a
        client. The previous design left that filtering to the reader and 11 dead
        facts were served as current for weeks.
      properties:
        agents:
          items:
            type: string
          title: Agents
          type: array
        created_at:
          title: Created At
          type: string
        description:
          title: Description
          type: string
        file_path:
          default: ''
          title: File Path
          type: string
        key:
          title: Key
          type: string
        partition:
          title: Partition
          type: string
        search_terms:
          items:
            type: string
          title: Search Terms
          type: array
        slug:
          title: Slug
          type: string
        title:
          title: Title
          type: string
        type:
          title: Type
          type: string
        updated_at:
          title: Updated At
          type: string
      required:
      - key
      - slug
      - partition
      - title
      - description
      - type
      - search_terms
      - created_at
      - updated_at
      - agents
      - file_path
      title: NoteSummaryOut
      type: object
    OriginOut:
      description: One raw entry a note was built from, and where it was read out of.
      properties:
        agent:
          title: Agent
          type: string
        anchor:
          title: Anchor
          type: string
        captured_at:
          title: Captured At
          type: string
        native_path:
          title: Native Path
          type: string
        source_written_at:
          title: Source Written At
          type: string
      required:
      - agent
      - native_path
      - anchor
      - captured_at
      - source_written_at
      title: OriginOut
      type: object
    PartitionListOut:
      properties:
        partitions:
          items:
            $ref: '#/components/schemas/PartitionOut'
          title: Partitions
          type: array
      required:
      - partitions
      title: PartitionListOut
      type: object
    PartitionOut:
      description: |-
        One partition, as the management surface lists it.

        Two repository fields rather than one ``project_root``, because a partition
        is keyed on a **repository** and a repository is two things: an identity two
        clones agree on (``repository_key``) and a place on this disk
        (``repository_path``). Both are empty for ``global``, which is no
        repository. The single working-directory root they replace is what split a
        worktree from its own checkout and turned six dated scratch folders into six
        permanent partitions ("Identify a partition by its repository", "Create no
        partition for a non-repository directory").
      properties:
        distilled_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Distilled At
        name:
          title: Name
          type: string
        note_count:
          title: Note Count
          type: integer
        repository_key:
          title: Repository Key
          type: string
        repository_path:
          title: Repository Path
          type: string
        sources:
          items:
            type: string
          title: Sources
          type: array
        tidy_handoff:
          $ref: '#/components/schemas/HandoffOut'
        uid:
          title: Uid
          type: string
        unresolvable:
          title: Unresolvable
          type: boolean
        updated_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Updated At
        waiting_agents:
          items:
            type: string
          title: Waiting Agents
          type: array
        waiting_entries:
          default: 0
          title: Waiting Entries
          type: integer
      required:
      - uid
      - name
      - repository_key
      - repository_path
      - note_count
      - unresolvable
      - distilled_at
      - sources
      - waiting_entries
      - waiting_agents
      - updated_at
      - tidy_handoff
      title: PartitionOut
      type: object
    ReadFailureOut:
