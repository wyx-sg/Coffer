    FileNodeOut:
      description: |-
        One entry in a partition's own directory ("Show a partition's memories read-only").

        Same shape as the skill kind's file tree so the two surfaces render through
        one component on the frontend. ``path`` is POSIX and relative to the
        partition directory (``""`` for the root); ``abs_path`` and
        ``folder_abs_path`` are what the viewer's open-in-editor and
        reveal-in-file-manager actions need, since a browser cannot resolve a path
        on the user's own disk but the loopback daemon can.
      properties:
        abs_path:
          title: Abs Path
          type: string
        children:
          items:
            $ref: '#/components/schemas/FileNodeOut'
          title: Children
          type: array
        folder_abs_path:
          title: Folder Abs Path
          type: string
        name:
          title: Name
          type: string
        path:
          title: Path
          type: string
        size:
          anyOf:
          - type: integer
          - type: 'null'
          title: Size
        truncated:
          default: false
          title: Truncated
          type: boolean
        type:
          enum:
          - file
          - dir
          title: Type
          type: string
      required:
      - name
      - path
      - abs_path
      - folder_abs_path
      - type
      - size
      - truncated
      - children
      title: FileNodeOut
      type: object
    FileTreeOut:
      properties:
        root:
          $ref: '#/components/schemas/FileNodeOut'
      required:
      - root
      title: FileTreeOut
      type: object
    HandoffOut:
      description: |-
        A chore for the person's agent. ``prompt`` is the whole text to copy or
        to pre-fill a new conversation with; Coffer never sends it itself.
      properties:
        prompt:
          title: Prompt
          type: string
      required:
      - prompt
      title: HandoffOut
      type: object
    HookFireIn:
      description: |-
