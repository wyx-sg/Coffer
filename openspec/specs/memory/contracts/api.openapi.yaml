        repository_key:
          title: Repository Key
          type: string
        repository_path:
          title: Repository Path
          type: string
        sample:
          anyOf:
          - type: string
          - type: 'null'
          title: Sample
        sources:
          items:
            type: string
          title: Sources
          type: array
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        uid:
          title: Uid
          type: string
        unresolvable:
          title: Unresolvable
          type: boolean
        updated_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Updated At
        waiting_agents:
          items:
            type: string
          title: Waiting Agents
          type: array
        waiting_entries:
          default: 0
          title: Waiting Entries
          type: integer
      required:
      - uid
      - name
      - repository_key
      - repository_path
      - note_count
      - unresolvable
      - title
      - distilled_at
      - sample
      - sources
      - waiting_entries
      - waiting_agents
      - updated_at
      title: PartitionOut
      type: object
    ReadFailureOut:
      description: One agent's memory the last read could not parse.
      properties:
        agent:
          description: The agent's resource name; empty when not recorded.
          title: Agent
          type: string
        last_read_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: When that agent's memory was last read with nothing failing, if known. Its memories stay as that read left them.
          title: Last Read At
        path:
          description: The native source that would not parse.
          title: Path
          type: string
        reason:
          description: Why it would not parse.
          title: Reason
          type: string
      required:
      - agent
      - path
      - reason
      - last_read_at
      title: ReadFailureOut
      type: object
    ReadingOut:
      description: The last read of the agents' memory.
      properties:
        failures:
          items:
            $ref: '#/components/schemas/ReadFailureOut'
          title: Failures
          type: array
        read_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: When the last read finished; null before the first.
          title: Read At
      required:
      - read_at
      - failures
      title: ReadingOut
      type: object
    RetiredListOut:
      properties:
        retired:
          items:
            $ref: '#/components/schemas/RetiredNoteOut'
          title: Retired
          type: array
      required:
      - retired
      title: RetiredListOut
      type: object
    RetiredNoteOut:
      description: |-
        One line of ``RETIRED.md``.

        ``entry_ids`` is deliberately not on the wire. It is the mechanism the next
        distil pass matches on, not something a reader of the record needs, and
        putting it here would invite a client to treat the retirement record as an
        index of raw entries rather than as the human-readable account it is.
      properties:
        reason:
          title: Reason
          type: string
        replaced_by:
          title: Replaced By
          type: string
        retired_at:
          title: Retired At
          type: string
        slug:
          title: Slug
          type: string
        title:
          title: Title
          type: string
      required:
      - slug
      - title
      - reason
      - replaced_by
      - retired_at
      title: RetiredNoteOut
      type: object
