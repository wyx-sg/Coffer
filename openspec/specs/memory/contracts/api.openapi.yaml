      - agent_name
      - agent_type
      - event
      - text
      title: DeliveredTextOut
      type: object
    DeliveryOverviewOut:
      properties:
        agents:
          items:
            $ref: '#/components/schemas/AgentDeliveryStatsOut'
          title: Agents
          type: array
        window_days:
          title: Window Days
          type: integer
      required:
      - window_days
      - agents
      title: DeliveryOverviewOut
      type: object
    ErrorDetail:
      properties:
        code:
          examples:
