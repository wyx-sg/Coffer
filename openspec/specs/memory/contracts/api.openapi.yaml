info:
  title: Coffer — Memory API
  version: 0.1.0
  description: The Memory routes of Coffer's management API, generated from the daemon's Pydantic models. The behaviour behind them is this capability's spec.md; authentication, the error envelope and tracing are described once in the docs-site REST API reference. Every route except `GET /api/v1/daemon/status` requires the `X-Coffer-Token` header.
servers:
- url: http://127.0.0.1:8000
paths:
  /api/v1/memory/context:
    post:
      description: |-
        Compose the session-start payload for one directory.

        The one route a real agent's own session reaches. ``body.agent_uid`` names
        who fired and nothing more: it does not reach ``compose_context``, which has
        no caller identity to narrow by, and exists here for ``record_fired`` — the
        audited "this agent's hook fired" event. ``record_fired`` is what the
        installed hook sets; a management surface previewing the payload leaves it
        false so it never records a fire that did not happen ("Audit every
        delivery fire").
      operationId: context_api_v1_memory_context_post
      parameters:
      - in: header
        name: x-coffer-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Coffer-Token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContextQuery'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComposedContextOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request failed validation (`CONFIG_INVALID`); the submitted values are not echoed back.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Any other error, as Coffer's error envelope.
      summary: Context
      tags:
      - memory
  /api/v1/memory/partitions:
    get:
      operationId: list_partitions_api_v1_memory_partitions_get
      parameters:
      - in: header
        name: x-coffer-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Coffer-Token
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartitionListOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request failed validation (`CONFIG_INVALID`); the submitted values are not echoed back.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Any other error, as Coffer's error envelope.
      summary: List Partitions
      tags:
      - memory
  /api/v1/memory/partitions/{uid}/files:
    get:
      description: The partition's own directory, as a read-only tree.
      operationId: list_partition_files_api_v1_memory_partitions__uid__files_get
      parameters:
      - in: path
        name: uid
        required: true
        schema:
          title: Uid
          type: string
      - in: header
        name: x-coffer-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Coffer-Token
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileTreeOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request failed validation (`CONFIG_INVALID`); the submitted values are not echoed back.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Any other error, as Coffer's error envelope.
      summary: List Partition Files
      tags:
      - memory
  /api/v1/memory/partitions/{uid}/files/content:
    get:
      description: |-
        One file out of the partition's directory.

        ``UnsafeMemoryPath`` (400) and ``MemoryFileNotFound`` (404) both propagate
        to the app-wide handler in ``surfaces/http/errors.py``, which already maps
        every ``CofferError`` — the same way knowledge's own file read reports an
        escape or a miss, rather than each route inventing an ``HTTPException``.
      operationId: read_partition_file_api_v1_memory_partitions__uid__files_content_get
      parameters:
      - in: path
        name: uid
        required: true
        schema:
          title: Uid
          type: string
      - in: query
        name: path
        required: true
        schema:
          minLength: 1
          title: Path
          type: string
      - in: header
        name: x-coffer-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Coffer-Token
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileContentOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request failed validation (`CONFIG_INVALID`); the submitted values are not echoed back.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Any other error, as Coffer's error envelope.
      summary: Read Partition File
      tags:
      - memory
  /api/v1/memory/partitions/{uid}/notes:
    get:
      description: |-
        Every note in one partition, read from ``notes/`` at call time.

        A retired note is not filtered out of this list — it is not *in* it, because
        retirement takes the file out of that directory and records it in
        ``RETIRED.md``. Reading the directory rather than a cached value is
        what keeps that true here.
      operationId: list_notes_api_v1_memory_partitions__uid__notes_get
      parameters:
      - in: path
        name: uid
        required: true
        schema:
          title: Uid
          type: string
      - in: header
        name: x-coffer-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Coffer-Token
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteListOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request failed validation (`CONFIG_INVALID`); the submitted values are not echoed back.
        default:
          content:
