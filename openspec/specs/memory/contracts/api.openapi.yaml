        One line of ``RETIRED.md``.

        ``entry_ids`` is deliberately not on the wire. It is the mechanism the next
        distil pass matches on, not something a reader of the record needs, and
        putting it here would invite a client to treat the retirement record as an
        index of raw entries rather than as the human-readable account it is.
      properties:
        reason:
          title: Reason
          type: string
        replaced_by:
          title: Replaced By
          type: string
        retired_at:
          title: Retired At
          type: string
        slug:
          title: Slug
          type: string
        title:
          title: Title
          type: string
      required:
      - slug
      - title
      - reason
      - replaced_by
      - retired_at
      title: RetiredNoteOut
      type: object
    SyncAgentOut:
      properties:
        agent:
          title: Agent
          type: string
        agent_type:
          title: Agent Type
          type: string
        copies:
          additionalProperties:
            type: integer
          title: Copies
          type: object
        curation:
