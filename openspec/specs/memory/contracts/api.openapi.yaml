components:
  schemas:
    AgentDeliveryStatsOut:
      properties:
        agent_name:
          title: Agent Name
          type: string
        agent_type:
          title: Agent Type
          type: string
        agent_uid:
          title: Agent Uid
          type: string
        by_moment:
          additionalProperties:
            type: integer
          title: By Moment
          type: object
        deliveries:
          title: Deliveries
          type: integer
        last_delivered_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Last Delivered At
        notes_read:
          anyOf:
          - type: integer
          - type: 'null'
          title: Notes Read
        notes_read_status:
          enum:
          - available
          - unavailable
          title: Notes Read Status
          type: string
      required:
      - agent_uid
      - agent_name
      - agent_type
      - deliveries
      - by_moment
      - last_delivered_at
      - notes_read
      - notes_read_status
      title: AgentDeliveryStatsOut
      type: object
    AggregationResultOut:
      description: |-
        What one Update memory action did: its aggregation pass, then which
        partitions it distilled.

        ``entries_written`` counts raw entries put under the partitions' ``.raw/``,
        and never notes: aggregation may not write one, and only aggregation may
        write ``.raw/`` ("Let only aggregation write raw entries"). A pass that
        found nothing new reports
        zero, which is the ordinary state of a machine whose agents have not
        written since the last pass.
      properties:
        distilled:
          items:
            type: string
          title: Distilled
          type: array
        entries_written:
          title: Entries Written
          type: integer
        failures:
          items:
            type: string
          title: Failures
          type: array
        partitions:
          items:
            type: string
          title: Partitions
          type: array
        skipped:
          items:
            type: string
          title: Skipped
          type: array
        sources_read:
          title: Sources Read
          type: integer
        sources_skipped:
          title: Sources Skipped
          type: integer
      required:
      - partitions
      - entries_written
      - sources_read
      - sources_skipped
      - failures
      - distilled
      - skipped
      title: AggregationResultOut
      type: object
    DeliveredOut:
      properties:
        agents:
          items:
            $ref: '#/components/schemas/DeliveredTextOut'
          title: Agents
          type: array
        partition:
          title: Partition
          type: string
      required:
      - partition
      - agents
      title: DeliveredOut
      type: object
    DeliveredTextOut:
      properties:
        agent_name:
          title: Agent Name
          type: string
        agent_type:
          title: Agent Type
          type: string
        agent_uid:
          title: Agent Uid
          type: string
        event:
          title: Event
          type: string
        text:
          title: Text
          type: string
      required:
