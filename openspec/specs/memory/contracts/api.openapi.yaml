      - description
      - type
      - search_terms
      - created_at
      - updated_at
      - agents
      - file_path
      - body
      - origins
      - fingerprint
      title: NoteOut
      type: object
    NoteSave:
      description: A note's new body, from the web UI's editor. The frontmatter is kept.
