              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Any other error, as Coffer's error envelope.
      summary: List Notes
      tags:
      - memory
  /api/v1/memory/partitions/{uid}/notes/{slug}:
    get:
      description: |-
        One note, whole. ``NoteNotFound`` (404) propagates to the app-wide
        handler, like every other ``CofferError`` on this family.

        ``slug`` stays a name because it IS the note's file name under ``notes/``,
        and a note is not a Resource — it has no identity of its own to address it
        by.
      operationId: get_note_api_v1_memory_partitions__uid__notes__slug__get
      parameters:
      - in: path
        name: uid
        required: true
        schema:
          title: Uid
          type: string
      - in: path
        name: slug
        required: true
        schema:
          title: Slug
          type: string
      - in: header
        name: x-coffer-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Coffer-Token
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request failed validation (`CONFIG_INVALID`); the submitted values are not echoed back.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Any other error, as Coffer's error envelope.
      summary: Get Note
      tags:
      - memory
  /api/v1/memory/partitions/{uid}/retired:
    get:
      description: |-
        ``RETIRED.md``, read back — newest first.

        The store returns the records in the order they were written and refuses to
        sort them, because a caller appending one rewrites the whole file and a
        re-sort there would silently reorder a file a human reads. Appending means
        the file is oldest-first, so *newest first* on the wire is that order
        reversed — not a sort on ``retired_at``, which is a string a record from an
        older pass may not carry at all.
      operationId: list_retired_api_v1_memory_partitions__uid__retired_get
      parameters:
      - in: path
        name: uid
        required: true
        schema:
          title: Uid
          type: string
      - in: header
        name: x-coffer-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Coffer-Token
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetiredListOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request failed validation (`CONFIG_INVALID`); the submitted values are not echoed back.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Any other error, as Coffer's error envelope.
      summary: List Retired
      tags:
      - memory
  /api/v1/memory/sync:
    post:
      description: |-
        Update memory: aggregate every registered, enabled agent's native
        memory, then distil every partition it left with undistilled raw entries
        ("Update memory in one action"; see ``application/memory/update.py``).

        The actor travels in so the ``memory_aggregated`` and ``memory_distilled``
        events the service records distinguish this requested update from the
        workers' scheduled passes.
      operationId: sync_api_v1_memory_sync_post
      parameters:
      - in: header
        name: x-coffer-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Coffer-Token
      - in: header
        name: x-coffer-actor
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Coffer-Actor
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AggregationResultOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request failed validation (`CONFIG_INVALID`); the submitted values are not echoed back.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Any other error, as Coffer's error envelope.
      summary: Sync
      tags:
      - memory
components:
  schemas:
    AggregationResultOut:
      description: |-
        What one Update memory action did: its aggregation pass, then which
        partitions it distilled.

        ``entries_written`` counts raw entries put under the partitions' ``.raw/``,
        and never notes: aggregation may not write one, and only aggregation may
        write ``.raw/`` ("Let only aggregation write raw entries"). A pass that
        found nothing new reports
        zero, which is the ordinary state of a machine whose agents have not
        written since the last pass.
      properties:
        distilled:
          items:
            type: string
          title: Distilled
          type: array
        entries_written:
          title: Entries Written
          type: integer
        failures:
          items:
            type: string
          title: Failures
          type: array
        partitions:
          items:
            type: string
          title: Partitions
          type: array
        skipped:
          items:
            type: string
          title: Skipped
          type: array
        sources_read:
          title: Sources Read
          type: integer
        sources_skipped:
          title: Sources Skipped
          type: integer
      required:
      - partitions
      - entries_written
      - sources_read
      - sources_skipped
      - failures
      - distilled
      - skipped
      title: AggregationResultOut
      type: object
    ComposedContextOut:
      description: |-
        The session-start payload, and enough accounting to audit the ceiling.

        There is no ``layers`` field any more. Delivery is not a two-tier digest: it
        is the whole index of the current repository's partition plus what is known
        about the developer, so naming a layer would name a structure the payload no
        longer has ("Deliver the index and the notes path at session start").
      properties:
        notes_included:
          title: Notes Included
          type: integer
        notes_omitted:
          title: Notes Omitted
          type: integer
        partition:
          title: Partition
          type: string
        text:
          title: Text
          type: string
      required:
      - text
      - partition
      - notes_included
      - notes_omitted
      title: ComposedContextOut
      type: object
    ContextQuery:
      description: |-
        Body for composing a session-start context ("Deliver the index and the
        notes path at session start").

        A ``POST`` despite being a read, because the query is structured rather than
        a couple of scalar filters (knowledge's ``search`` is a ``POST`` for the same
        reason) — nothing here has a side effect on the memory tree itself.
      properties:
        agent_uid:
          anyOf:
          - type: string
          - type: 'null'
          title: Agent Uid
        ceiling_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Ceiling Tokens
        cwd:
          default: ''
          title: Cwd
          type: string
        record_fired:
          default: false
          title: Record Fired
          type: boolean
      title: ContextQuery
      type: object
    ErrorDetail:
      properties:
        code:
          examples:
          - RESOURCE_NOT_FOUND
          title: Code
          type: string
        details:
          additionalProperties: true
          title: Details
          type: object
        message:
          examples:
          - 'resource not found: mcp_server:filesystem'
          title: Message
          type: string
      required:
      - code
      - message
      - details
      title: ErrorDetail
      type: object
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - error
      title: ErrorResponse
      type: object
    FileContentOut:
      description: |-
        One file's content, read-only.

        No fingerprint, unlike the skill kind's equivalent: a fingerprint exists to
        make a later write conditional, and this family has no write. The tree under
        ``~/.coffer/memory/`` is derived ("Keep the memory tree derived and local") —
        an edit here would be overwritten
        by the next aggregation pass, so the surface does not offer one.
      properties:
        abs_path:
          title: Abs Path
          type: string
        binary:
          title: Binary
          type: boolean
        content:
          title: Content
          type: string
        folder_abs_path:
          title: Folder Abs Path
          type: string
        path:
          title: Path
          type: string
        size:
          title: Size
          type: integer
        truncated:
          title: Truncated
          type: boolean
      required:
      - path
      - abs_path
      - folder_abs_path
      - content
      - truncated
      - binary
      - size
      title: FileContentOut
      type: object
    FileNodeOut:
      description: |-
        One entry in a partition's own directory ("Present partitions as a table
        and a file tree").

        Same shape as the skill kind's file tree so the two surfaces render through
        one component on the frontend. ``path`` is POSIX and relative to the
        partition directory (``""`` for the root); ``abs_path`` and
        ``folder_abs_path`` are what the viewer's open-in-editor and
        reveal-in-file-manager actions need, since a browser cannot resolve a path
        on the user's own disk but the loopback daemon can.
      properties:
        abs_path:
          title: Abs Path
          type: string
        children:
          items:
            $ref: '#/components/schemas/FileNodeOut'
          title: Children
          type: array
        folder_abs_path:
          title: Folder Abs Path
          type: string
        name:
          title: Name
          type: string
        path:
          title: Path
          type: string
        size:
          anyOf:
          - type: integer
          - type: 'null'
          title: Size
        truncated:
          default: false
          title: Truncated
          type: boolean
        type:
          enum:
          - file
          - dir
          title: Type
          type: string
      required:
      - name
      - path
      - abs_path
      - folder_abs_path
      - type
      - size
      - truncated
      - children
      title: FileNodeOut
      type: object
    FileTreeOut:
      properties:
        root:
          $ref: '#/components/schemas/FileNodeOut'
      required:
      - root
      title: FileTreeOut
      type: object
    NoteListOut:
      properties:
        notes:
          items:
            $ref: '#/components/schemas/NoteSummaryOut'
          title: Notes
          type: array
      required:
      - notes
      title: NoteListOut
      type: object
    NoteOut:
      description: |-
        One note, whole: Coffer's own text and the entries behind it.

        ``body`` is Coffer's writing, not a quote of any source ("Write notes in
        Coffer's own words") — the
        sources are named in ``origins`` and kept verbatim under the partition's
        ``.raw/``, which is what keeps a paraphrase traceable.
      properties:
        body:
          title: Body
          type: string
        created_at:
          title: Created At
          type: string
        description:
          title: Description
          type: string
        key:
          title: Key
          type: string
        origins:
          items:
            $ref: '#/components/schemas/OriginOut'
          title: Origins
          type: array
        partition:
          title: Partition
          type: string
        search_terms:
          items:
            type: string
          title: Search Terms
          type: array
        slug:
          title: Slug
          type: string
        title:
          title: Title
          type: string
        type:
          title: Type
          type: string
        updated_at:
          title: Updated At
          type: string
      required:
      - key
      - slug
      - partition
      - title
      - description
      - type
      - search_terms
      - created_at
      - updated_at
      - body
      - origins
      title: NoteOut
      type: object
    NoteSummaryOut:
      description: |-
        One note without its body — which is what an index line needs.

        There is no ``status`` and no ``superseded_by``. A retired note is not
        listed as dead: it has left ``notes/`` and is recorded in ``RETIRED.md``
        (``RetiredNoteOut`` below), so nothing on this shape has to be filtered by a
        client. The previous design left that filtering to the reader and 11 dead
        facts were served as current for weeks.
      properties:
        created_at:
          title: Created At
          type: string
        description:
          title: Description
          type: string
        key:
          title: Key
          type: string
        partition:
          title: Partition
          type: string
        search_terms:
          items:
            type: string
          title: Search Terms
          type: array
        slug:
          title: Slug
          type: string
        title:
          title: Title
          type: string
        type:
          title: Type
          type: string
        updated_at:
          title: Updated At
          type: string
      required:
      - key
      - slug
      - partition
      - title
      - description
      - type
      - search_terms
      - created_at
      - updated_at
      title: NoteSummaryOut
      type: object
    OriginOut:
      description: One raw entry a note was built from, and where it was read out of.
      properties:
        agent:
          title: Agent
          type: string
        anchor:
          title: Anchor
          type: string
        captured_at:
          title: Captured At
          type: string
        native_path:
          title: Native Path
          type: string
        source_written_at:
          title: Source Written At
          type: string
      required:
      - agent
      - native_path
      - anchor
      - captured_at
      - source_written_at
      title: OriginOut
      type: object
    PartitionListOut:
      properties:
        partitions:
          items:
            $ref: '#/components/schemas/PartitionOut'
          title: Partitions
          type: array
      required:
      - partitions
      title: PartitionListOut
      type: object
    PartitionOut:
      description: |-
        One partition, as the management surface lists it.

        Two repository fields rather than one ``project_root``, because a partition
        is keyed on a **repository** and a repository is two things: an identity two
        clones agree on (``repository_key``) and a place on this disk
        (``repository_path``). Both are empty for ``global``, which is no
        repository. The single working-directory root they replace is what split a
        worktree from its own checkout and turned six dated scratch folders into six
        permanent partitions ("Identify a partition by its repository", "Create no
        partition for a non-repository directory").
      properties:
        name:
          title: Name
          type: string
        note_count:
          title: Note Count
          type: integer
        repository_key:
          title: Repository Key
          type: string
        repository_path:
          title: Repository Path
          type: string
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        uid:
          title: Uid
          type: string
        unresolvable:
          title: Unresolvable
          type: boolean
      required:
      - uid
      - name
      - repository_key
      - repository_path
      - note_count
      - unresolvable
      - title
      title: PartitionOut
      type: object
    RetiredListOut:
      properties:
        retired:
          items:
            $ref: '#/components/schemas/RetiredNoteOut'
          title: Retired
          type: array
      required:
      - retired
      title: RetiredListOut
      type: object
    RetiredNoteOut:
      description: |-
        One line of ``RETIRED.md``.

        ``entry_ids`` is deliberately not on the wire. It is the mechanism the next
        distil pass matches on, not something a reader of the record needs, and
        putting it here would invite a client to treat the retirement record as an
        index of raw entries rather than as the human-readable account it is.
      properties:
        reason:
          title: Reason
          type: string
        replaced_by:
          title: Replaced By
          type: string
        retired_at:
          title: Retired At
          type: string
        slug:
          title: Slug
          type: string
        title:
          title: Title
          type: string
      required:
      - slug
      - title
      - reason
      - replaced_by
      - retired_at
      title: RetiredNoteOut
      type: object
