components:
  schemas:
    AggregationResultOut:
      description: |-
        What one Update memory action did: its aggregation pass, then which
        partitions it distilled.

        ``entries_written`` counts raw entries put under the partitions' ``.raw/``,
        and never notes: aggregation may not write one, and only aggregation may
        write ``.raw/`` ("Let only aggregation write raw entries"). A pass that
        found nothing new reports
        zero, which is the ordinary state of a machine whose agents have not
        written since the last pass.
      properties:
        distilled:
          items:
            type: string
          title: Distilled
          type: array
        entries_written:
          title: Entries Written
          type: integer
        failures:
          items:
            type: string
          title: Failures
          type: array
        partitions:
          items:
            type: string
          title: Partitions
          type: array
        skipped:
          items:
            type: string
          title: Skipped
          type: array
        sources_read:
          title: Sources Read
          type: integer
        sources_skipped:
          title: Sources Skipped
          type: integer
      required:
      - partitions
      - entries_written
      - sources_read
      - sources_skipped
      - failures
      - distilled
      - skipped
      title: AggregationResultOut
      type: object
    CodexImportIn:
      properties:
        value:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Value
      title: CodexImportIn
      type: object
    CurateIn:
      properties:
        agent_type:
          title: Agent Type
          type: string
      required:
      - agent_type
      title: CurateIn
      type: object
    CurateOut:
      properties:
        started:
          title: Started
          type: boolean
      required:
      - started
      title: CurateOut
      type: object
    CurationStateOut:
      properties:
        curation:
          title: Curation
          type: string
        memory:
          title: Memory
          type: string
      required:
      - memory
      - curation
