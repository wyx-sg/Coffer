          title: Children
          type: array
        folder_abs_path:
          title: Folder Abs Path
          type: string
        name:
          title: Name
          type: string
        path:
          title: Path
          type: string
        size:
          anyOf:
          - type: integer
          - type: 'null'
          title: Size
        truncated:
          default: false
          title: Truncated
