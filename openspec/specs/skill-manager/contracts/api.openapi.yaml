components:
  schemas:
    AdoptBody:
      properties:
        location:
          enum:
          - skills
          - agents_dir
          title: Location
          type: string
      required:
      - location
      title: AdoptBody
      type: object
    ArchiveImportSourceOut:
      description: A skill unpacked from an uploaded archive; both fields are informational.
      properties:
        archive_name:
          title: Archive Name
          type: string
        folder:
          title: Folder
          type: string
        type:
          const: archive_import
          title: Type
          type: string
      required:
      - type
      - archive_name
      - folder
      title: ArchiveImportSourceOut
      type: object
    Body_stage_archive_api_v1_skills_stage_archive_post:
      properties:
        file:
          contentMediaType: application/octet-stream
          title: File
          type: string
      required:
      - file
      title: Body_stage_archive_api_v1_skills_stage_archive_post
      type: object
    BuiltinSourceOut:
      description: |-
        Coffer generated this skill. It carries no provenance fields at all:
        the master folder is rewritten from the running build at every start.
      properties:
        type:
          const: builtin
          title: Type
          type: string
      required:
      - type
      title: BuiltinSourceOut
      type: object
    CliListOut:
      properties:
        items:
          items:
            $ref: '#/components/schemas/CliOut'
          title: Items
          type: array
        warnings:
          items:
            $ref: '#/components/schemas/CliWarningOut'
          title: Warnings
          type: array
      required:
      - items
      - warnings
      title: CliListOut
      type: object
    CliLoginOut:
      description: |-
        ``state`` is ``None`` when the command was not found, so its login check
        could not run. ``command`` is the login command to copy — Coffer never
        runs it. ``check`` is the declared login check.
      properties:
        check:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Check
        command:
          anyOf:
          - type: string
          - type: 'null'
          title: Command
        state:
          anyOf:
          - enum:
            - logged_in
            - logged_out
            - not_needed
            type: string
          - type: 'null'
          title: State
      required:
      - state
      - check
      - command
      title: CliLoginOut
      type: object
    CliNeededByOut:
      description: One skill that requires the command, with what it asked for.
      properties:
        min_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Min Version
        skill_name:
          title: Skill Name
          type: string
        skill_uid:
          title: Skill Uid
          type: string
        why:
          anyOf:
          - type: string
          - type: 'null'
          title: Why
      required:
      - skill_uid
      - skill_name
      - min_version
      - why
      title: CliNeededByOut
      type: object
    CliOut:
      properties:
        checked_at:
          format: date-time
          title: Checked At
          type: string
        command:
          title: Command
          type: string
        handoff:
          anyOf:
          - $ref: '#/components/schemas/HandoffOut'
          - type: 'null'
        login:
          $ref: '#/components/schemas/CliLoginOut'
        min_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Min Version
        needed_by:
          items:
            $ref: '#/components/schemas/CliNeededByOut'
          title: Needed By
          type: array
        needed_by_servers:
          items:
            $ref: '#/components/schemas/CliServerOut'
          title: Needed By Servers
          type: array
        path:
          anyOf:
          - type: string
          - type: 'null'
          title: Path
        status:
          enum:
          - missing
          - outdated
          - logged_out
          - ready
          title: Status
          type: string
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        version:
          anyOf:
          - type: string
          - type: 'null'
          title: Version
      required:
      - command
      - title
      - status
      - path
      - version
      - min_version
      - login
      - handoff
      - needed_by
      - needed_by_servers
      - checked_at
      title: CliOut
      type: object
    CliServerOut:
      description: |-
        One enabled stdio MCP server started with the command (or with a
        launcher it provides: ``uvx`` for ``uv``, ``npx`` for ``node``).
      properties:
        launcher:
          title: Launcher
          type: string
        server_name:
          title: Server Name
          type: string
        server_uid:
          title: Server Uid
          type: string
      required:
      - server_uid
      - server_name
      - launcher
      title: CliServerOut
      type: object
    CliWarningOut:
      description: A ``requires:`` entry a skill declares that was skipped, and why.
      properties:
        message:
          title: Message
          type: string
        skill_name:
          title: Skill Name
          type: string
        skill_uid:
          title: Skill Uid
          type: string
      required:
      - skill_uid
      - skill_name
      - message
      title: CliWarningOut
      type: object
    DriftEntryOut:
      description: |-
        One disagreement between what Coffer delivered and what is on disk.

        By NAME, and deliberately so even now that ``DriftEntry`` carries uids:
        an entry is a finding about a PATH in a workspace, and two of the five
        kinds (``missing_master``, ``orphan_master``) are precisely the case where
        no resource stands behind the name — there would be nothing to put in a uid
        field. The report is read and acted on as a whole through
        ``POST /skills/repair``, never used to address one resource, so a uid here
        would be an identity nobody follows. The uids on the domain entry exist for
        the repair pass, which re-delivers against them so a skill renamed between
        verify and repair is still the skill that gets repaired; that is an
        internal guarantee, not a field of this report.
      properties:
        agent_name:
          title: Agent Name
          type: string
        handoff:
          anyOf:
          - $ref: '#/components/schemas/HandoffOut'
          - type: 'null'
        kind:
          $ref: '#/components/schemas/DriftKind'
        skill_name:
