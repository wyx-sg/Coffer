openapi: 3.1.0
info:
  title: Coffer — Skill Manager API
  version: "0.1.0"
  description: |
    Skill manager endpoints. Merged into the main Coffer Management API at
    runtime; this document scopes only the skill-specific routes added by
    the skill-manager spec. Depends on the agent kind from spec agent-registry.

    All routes use the same `X-Coffer-Token` authentication from
    `openspec/specs/mcp-gateway/contracts/api.openapi.yaml`.

servers:
  - url: http://127.0.0.1:{port}/api/v1
    variables:
      port:
        default: "8000"

security:
  - cofferToken: []

tags:
  - name: skills
    description: Managed AgentSkills folders
  - name: agents
    description: >-
      Per-agent workspace skill operations (unmanaged scan / adopt / delete);
      mounted under /agents/{uid} but owned by this spec.

paths:
  /skills:
    get:
      tags: [skills]
      operationId: listSkills
      summary: List managed skills
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/SkillOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /skills/import:
    post:
      tags: [skills]
      operationId: importSkill
      summary: Import a skill from a local filesystem path
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SkillImportRequest" }
      responses:
        "201":
          description: Imported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SkillOut" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /skills/{uid}:
    parameters:
      - in: path
        name: uid
        required: true
        schema: { type: string }
        description: >-
          The skill Resource's immutable identity. Not its name: a skill's name
          is also its master folder under `~/.coffer/skills/` and the name of
          every delivered link, all of which move when it is renamed.
    get:
      tags: [skills]
      operationId: getSkill
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SkillOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [skills]
      operationId: deleteSkill
      summary: Remove a skill and all its bindings
      responses:
        "204":
          description: No Content
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /skills/{uid}/files:
    parameters:
      - in: path
        name: uid
        required: true
        schema: { type: string }
        description: >-
          The skill Resource's immutable identity. Not its name: a skill's name
          is also its master folder under `~/.coffer/skills/` and the name of
          every delivered link, all of which move when it is renamed.
    get:
      tags: [skills]
      operationId: listSkillFiles
      summary: List a skill's master folder as a read-only file tree
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SkillFileTreeOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /skills/{uid}/files/content:
    parameters:
      - in: path
        name: uid
        required: true
        schema: { type: string }
        description: >-
          The skill Resource's immutable identity. Not its name: a skill's name
          is also its master folder under `~/.coffer/skills/` and the name of
          every delivered link, all of which move when it is renamed.
    get:
      tags: [skills]
      operationId: readSkillFile
      summary: Read a single file's contents from a skill's master folder
      parameters:
        - in: query
          name: path
          required: true
          description: Path to the file, relative to the skill's master folder.
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SkillFileContentOut" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    put:
      tags: [skills]
      operationId: writeSkillFile
      summary: Overwrite one existing text file in a skill's master folder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SkillFileWriteRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SkillFileContentOut" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /skills/verify:
    post:
      tags: [skills]
      operationId: verifySkillDrift
      summary: Report drift between bindings and on-disk symlinks
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriftReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /skills/repair:
    post:
      tags: [skills]
      operationId: repairSkillDrift
      summary: Opt-in repair that re-delivers repairable drift from the master library
      description: |
        Re-delivers repairable drift kinds (missing_link, tampered_link) from
        the master library. Foreign/user content (replaced_with_regular), a
        missing master, and orphan_master entries are left intact and returned
        in `remaining`. Each repair is audited. This endpoint is the HTTP
        surface for `coffer skill verify --fix`; `POST /skills/verify` remains
        report-only ("Report skill drift on request").
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepairReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /agents/{uid}/unmanaged-skills:
    parameters:
      - in: path
        name: uid
        required: true
        schema: { type: string }
        description: >-
          The agent Resource's immutable uid (kind `agent`, spec
          agent-registry) whose workspace to scan.
    get:
      tags: [agents]
      operationId: listUnmanagedSkills
      summary: List skill-shaped folders in the agent's workspace that Coffer doesn't manage
      description: |
        Read-only scan of the agent's skill locations — `<config_dir>/skills`
        for both types, plus `~/.agents/skills` for codex — derived at request
        time, never stored ("List unmanaged skills in an agent's skill
        locations"). Coffer-managed links (symlinks resolving inside
        `~/.coffer/skills/`) and dot-entries such as Codex's `.system` are
        excluded. Symlinks pointing outside the master store are listed with
        `foreign_link=true` and are never adoptable.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/UnmanagedSkillOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /agents/{uid}/unmanaged-skills/{skill}:
    parameters:
      - in: path
        name: uid
        required: true
        schema: { type: string }
        description: >-
          The agent Resource's immutable uid. Note the asymmetry in this path:
          the agent is addressed by uid because it IS a resource, while
          `{skill}` is a bare folder name — an unmanaged folder has no resource
          and so no uid to be addressed by. That is exactly what adopting one
          gives it.
      - in: path
        name: skill
        required: true
        schema: { type: string }
        description: Unmanaged skill folder name as reported by the scan.
    delete:
      tags: [agents]
      operationId: deleteUnmanagedSkill
      summary: Delete an unmanaged skill folder from the agent's workspace
      description: |
        Removes only that entry from disk — never master content or bindings
        ("Delete an unmanaged skill on explicit request"). Audited as
        `skill_unmanaged_deleted`.
      parameters:
        - in: query
          name: location
          required: true
          schema: { type: string, enum: [skills, agents_dir] }
          description: Where the folder was discovered, as reported by the scan.
      responses:
        "204":
          description: No Content
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /agents/{uid}/unmanaged-skills/{skill}/adopt:
    parameters:
      - in: path
        name: uid
        required: true
        schema: { type: string }
        description: >-
          The agent Resource's immutable uid. Note the asymmetry in this path:
          the agent is addressed by uid because it IS a resource, while
          `{skill}` is a bare folder name — an unmanaged folder has no resource
          and so no uid to be addressed by. That is exactly what adopting one
          gives it.
      - in: path
        name: skill
        required: true
        schema: { type: string }
    post:
      tags: [agents]
      operationId: adoptUnmanagedSkill
      summary: Adopt an unmanaged skill folder into the Coffer master store
      description: |
        Validates the folder, moves it to `~/.coffer/skills/<name>/`, registers
        the `skill` resource, delivers the managed link to
        `<config_dir>/skills/<name>`, and records an enabled binding for the
        agent — in that order ("Adopt an unmanaged skill"). Adopting from
        `~/.agents/skills` consolidates: the original folder there is removed
        and the link lands in `<config_dir>/skills`. Any failure before
        registration leaves the original folder unmoved. Audited as
        `skill_adopted`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnmanagedAdoptRequest" }
      responses:
        "201":
          description: Adopted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SkillRefOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: >-
            Invalid skill folder (`UNMANAGED_SKILL_INVALID`) or a foreign
            symlink, which is never adoptable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorOut" }

components:
  securitySchemes:
    cofferToken:
      type: apiKey
      in: header
      name: X-Coffer-Token

  schemas:
    ErrorOut:
      type: object
      description: |
        The app-wide error envelope (`surfaces/http/errors.py`), the same shape
        `ErrorResponse` carries in the mcp-gateway contract. Contract-only
        alias — there is no Pydantic model of this name.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: SKILL_NOT_FOUND
            message:
              type: string
              example: "skill not found: reviewer"
            details:
              type: object
              additionalProperties: true

    SkillImportRequest:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path:
          {
            type: string,
            description: "Path to the existing skill folder; supports `~` expansion.",
          }
        overwrite:
          {
            type: boolean,
            default: false,
            description: "Replace an existing skill of the same name instead of rejecting.",
          }

    SkillSource:
      oneOf:
        - $ref: "#/components/schemas/LocalImportSource"
        - $ref: "#/components/schemas/BuiltinSource"
      discriminator:
        propertyName: type
        # The mapping is not optional decoration here. Without it a generator
        # is free to fall back on the schema NAMES as the discriminator values,
        # and openapi-typescript does exactly that — it emitted
        # `type: "LocalImportSource"` / `type: "BuiltinSource"` while the wire
        # carries `local_import` / `builtin`. Every value below must equal the
        # variant's own `type` enum.
        mapping:
          local_import: "#/components/schemas/LocalImportSource"
          builtin: "#/components/schemas/BuiltinSource"

    LocalImportSource:
      type: object
      required: [type, original_path]
      properties:
        type: { type: string, enum: [local_import] }
        original_path: { type: string }

    BuiltinSource:
      type: object
      description:
        "Coffer generated this skill. It carries no provenance fields at all:
        the master folder is rewritten from the running build at every start,
        so nothing about where it came from would still be true tomorrow — and
        a skill's config converges to the user's other machines, where anything
        machine-specific would never settle."
      required: [type]
      properties:
        type: { type: string, enum: [builtin] }

    SkillOut:
      type: object
      required:
        [
          uid,
          name,
          description,
          source,
          builtin,
          enabled,
          scope,
          version_hash,
          master_path,
          created_at,
          updated_at,
          bindings,
        ]
      properties:
        uid:
          type: string
          description: >-
            The skill Resource's immutable identity, and what every route
            addressing this skill takes.
          example: 9f2c1a7b4e8d4c1fa0b3d5e6f7081920
        name:
          type: string
          description: >-
            A mutable label, unique among skills, editable through the
            kind-agnostic `PATCH /api/v1/resources/{uid}`. It is also the
            skill's master folder name and the name of every link delivered
            into an agent's workspace, so a rename moves those with it —
            `master_path` on the response after a rename is the new one.
        description: { type: string }
        source: { $ref: "#/components/schemas/SkillSource" }
        builtin:
          type: boolean
          description: >-
            True for a skill Coffer generates and owns: its master folder is
            rewritten from the running build at every boot, so DELETE is
            refused with 409 `RESOURCE_PROTECTED`. Enabling, disabling and
            narrowing its scope stay available — those decide reach, which is
            the owner's to decide, while existence is not.
        enabled: { type: boolean }
        scope: { $ref: "#/components/schemas/ScopeOut" }
        version_hash: { type: string }
        master_path: { type: string }
        last_synced_from_source_at:
          { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        bindings:
          type: array
          items: { $ref: "#/components/schemas/SkillBindingOut" }

    ScopeOut:
      type: object
      description: >-
        Which agents this skill is delivered to, on THIS machine. `agents: null`
        means every agent; `[]` matches nothing, i.e. dormant. Shape is shared
        with every other kind — it is the resource framework's scope, not a
        skill-specific one — so it MUST stay identical to `ScopeOut` in
        `openspec/specs/resource-framework/contracts/api.openapi.yaml` and to `ScopeOut`
        in `backend/coffer/surfaces/http/schemas.py`. It was previously declared
        here as a bare `string[]`, which is the agent list one level down; the
        wire has always carried the object.
      required: [agents]
      additionalProperties: false
      properties:
        agents:
          type: array
          description: >-
            Agent resource UIDS, not names. A scope is a reference to another
            resource and a name is a label its owner may change; while this
            held names, renaming an agent silently emptied every scope naming
            it — which for a skill means it stops being delivered to the agent
            the user picked, with nothing said.
          items: { type: string }
          nullable: true
          example: [9f2c1a7b4e8d4c1fa0b3d5e6f7081920]
      nullable: true

    SkillBindingOut:
      type: object
      required: [agent_uid, agent_name]
      description: >-
        Internal delivery bookkeeping, not a user-facing toggle: a row means
        this agent currently holds a delivered copy of the skill. Delivery is
        decided by the skill's own enabled flag and scope.
      properties:
        agent_uid:
          type: string
          description: >-
            Which agent holds the copy. A uid because a binding is a STORED
            pointer at another resource — the row is a foreign key into
            `resources` and outlives any number of renames on either side — so
            the wire form of that pointer has to be the identity, not a label
            that was merely current when the row was written.
          example: 9f2c1a7b4e8d4c1fa0b3d5e6f7081920
        agent_name:
          type: string
          description: >-
            The same agent's label, resolved at read time. Carried beside the
            uid and not instead of it: the bindings list is rendered as a line
            of agent names under a skill, and a row of UUIDs tells the reader
            nothing. Both, because this one object answers a machine's question
            and a person's at once.
        last_linked_at: { type: string, format: date-time, nullable: true }
        last_link_path: { type: string, nullable: true }
        link_mode:
          type: string
          enum: [symlink, junction, copy_fallback]
          nullable: true

    DriftEntry:
      type: object
      required: [skill_name, agent_name, kind, suggested_remedy]
      description: >-
        One disagreement between what Coffer believes it delivered and what is
        on disk. Reported by NAME, not by uid, and deliberately so: an entry is
        a finding about a path in a workspace, and two of the five kinds
        (`missing_master`, `orphan_master`) describe precisely the case where
        no resource stands behind the name — there is no uid to report. The
        report is read and acted on as a whole through `POST /skills/repair`,
        never used to address one resource.
      properties:
        skill_name: { type: string }
        agent_name: { type: string }
        kind:
          type: string
          enum:
            [
              missing_link,
              tampered_link,
              replaced_with_regular,
              missing_master,
              orphan_master,
            ]
        target_path: { type: string }
        suggested_remedy: { type: string }

    DriftReport:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/DriftEntry" }

    RepairReport:
      type: object
      required: [remediated, remaining]
      properties:
        remediated:
          type: array
          description: Drift entries that were successfully re-delivered from master during this repair run.
          items: { $ref: "#/components/schemas/DriftEntry" }
        remaining:
          $ref: "#/components/schemas/DriftReport"
          description: Drift still present after repair (foreign content, missing master, orphan master — requires manual action).

    SkillFileNodeOut:
      type: object
      required: [name, path, abs_path, folder_abs_path, type]
      properties:
        name: { type: string }
        path:
          type: string
          description: POSIX path relative to the master folder root ("" for the root).
        abs_path:
          type: string
          description: >-
            Resolved absolute path of this entry on disk. The in-app file
            viewer is read-only; this path backs open-in-external-editor /
            reveal-in-file-manager.
        folder_abs_path:
          type: string
          description: >-
            Absolute path of this entry's containing folder (its parent
            directory). For the root node it equals the master folder's parent.
        type: { type: string, enum: [file, dir] }
        size:
          type: integer
          nullable: true
          description: Byte size for files; null for directories.
        truncated:
          type: boolean
          default: false
          description: True on a directory whose children were clipped at the max tree depth.
        children:
          type: array
          description: Child nodes; empty for files.
          items: { $ref: "#/components/schemas/SkillFileNodeOut" }

    SkillFileTreeOut:
      type: object
      required: [root]
      properties:
        root: { $ref: "#/components/schemas/SkillFileNodeOut" }

    UnmanagedSkillOut:
      type: object
      required: [name, path, location, valid, reason, foreign_link]
      description: >-
        A skill-shaped entry found in an agent's skill locations that Coffer
        does not manage — derived at scan time, never stored.
      properties:
        name: { type: string, description: "Folder name." }
        path: { type: string, description: "Absolute path on disk." }
        location:
          type: string
          enum: [skills, agents_dir]
          description: >-
            Which scan location the entry was found in: `skills` =
            `<config_dir>/skills`; `agents_dir` = the agent product's
            secondary standard location (today: Codex's `~/.agents/skills`).
        valid:
          type: boolean
          description: >-
            Whether the folder passes AgentSkills validation ("Validate imported
            skill folders against AgentSkills").
        reason:
          type: string
          nullable: true
          description: "Validation failure reason when `valid` is false; null otherwise."
        foreign_link:
          type: boolean
          description: >-
            True for symlinks whose target resolves outside the master store;
            surfaced to the user but never adoptable (origin is unknown).

    UnmanagedAdoptRequest:
      type: object
      required: [location]
      additionalProperties: false
      properties:
        location:
          type: string
          enum: [skills, agents_dir]
          description: Where the folder was discovered, as reported by the scan.

    SkillRefOut:
      type: object
      description: >-
        The skill resource adoption just created, named both ways: the uid to
        navigate to it with, the name to say which folder became it.
      required: [uid, name]
      properties:
        uid:
          type: string
          description: >-
            The new skill Resource's immutable identity — what the caller
            follows to `GET /skills/{uid}`.
          example: 9f2c1a7b4e8d4c1fa0b3d5e6f7081920
        name:
          type: string
          description: >-
            The adopted skill's label, which is the folder name it was adopted
            under.

    SkillFileContentOut:
      type: object
      required:
        [path, abs_path, folder_abs_path, content, truncated, binary, size, fingerprint]
      properties:
        path:
          type: string
          description: POSIX path relative to the master folder root.
        abs_path:
          type: string
          description: >-
            Resolved absolute path of the file on disk. Backs
            open-in-external-editor / reveal-in-file-manager alongside the
            in-app editor.
        folder_abs_path:
          type: string
          description: Absolute path of the file's containing folder (its parent directory).
        content:
          type: string
          description: File text; empty when `binary` is true.
        truncated:
          type: boolean
          description: True when the file exceeded the read cap and was truncated.
        binary:
          type: boolean
          description: True for non-UTF-8 / NUL-containing files (content is empty).
        size:
          type: integer
          description: True byte size of the file on disk.
        fingerprint:
          type: string
          description: >-
            sha256 hex digest of the file's RAW on-disk bytes — not of
            `content`, which is truncated past the read cap and empty for a
            binary file. Echo it back as `expected_fingerprint` on a write to
            make that write conditional.
    SkillFileWriteRequest:
      type: object
      required: [path, content]
      properties:
        path:
          type: string
          minLength: 1
          description: >-
            POSIX path of an EXISTING text file, relative to the master folder
            root. Must stay inside the folder; new files / directories are not
            created here.
        content:
          type: string
          description: >-
            Full new UTF-8 contents. Rejected (400) if it exceeds the file-size
            cap or the target is an existing binary file.
        expected_fingerprint:
          type: [string, "null"]
          description: >-
            The `fingerprint` from the read that seeded this edit. When supplied
            and it no longer matches the bytes on disk, the write is rejected
            (409, `SKILL_FILE_STALE`) and the file is left byte-identical — the
            master folder is also edited directly by the user, so a lost-update
            race is routine. Omit for an unconditional last-writer-wins write.

  responses:
    Unauthorized:
      description: Missing or invalid X-Coffer-Token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorOut" }
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorOut" }
    NotFound:
      description: Skill or agent not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorOut" }
    Conflict:
      description: Duplicate skill name
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorOut" }
    UnprocessableEntity:
      description: Validation failure (invalid SKILL.md, size limit, path-escape, ...)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorOut" }
