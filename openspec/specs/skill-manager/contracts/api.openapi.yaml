        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Coffer-Token
      - in: header
        name: x-coffer-actor
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Coffer-Actor
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillFileWriteRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillFileContentOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request failed validation (`CONFIG_INVALID`); the submitted values are not echoed back.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Any other error, as Coffer's error envelope.
      summary: Write Skill File
      tags:
      - skills
components:
  schemas:
    AdoptBody:
      properties:
        location:
          enum:
          - skills
          - agents_dir
          title: Location
          type: string
      required:
      - location
      title: AdoptBody
      type: object
    BuiltinSourceOut:
      description: |-
        Coffer generated this skill. It carries no provenance fields at all:
        the master folder is rewritten from the running build at every start.
      properties:
        type:
          const: builtin
          title: Type
          type: string
      required:
      - type
      title: BuiltinSourceOut
      type: object
    CliInstallIn:
      description: The formula the confirmation showed; it must equal the declared one.
      properties:
        formula:
          maxLength: 128
          minLength: 1
          title: Formula
          type: string
      required:
      - formula
      title: CliInstallIn
      type: object
    CliInstallOut:
      properties:
        action:
          enum:
          - install
          - upgrade
          title: Action
          type: string
        argv:
          items:
            type: string
          title: Argv
          type: array
        command:
          title: Command
          type: string
        exit_code:
          anyOf:
          - type: integer
          - type: 'null'
          title: Exit Code
        finished_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Finished At
        first_line:
          title: First Line
          type: integer
        formula:
          title: Formula
          type: string
        lines:
          items:
            type: string
          title: Lines
          type: array
        next_line:
          title: Next Line
          type: integer
        started_at:
          format: date-time
          title: Started At
          type: string
        state:
          enum:
          - running
          - succeeded
          - failed
          title: State
          type: string
      required:
      - command
      - formula
      - action
      - argv
      - state
      - exit_code
      - started_at
      - finished_at
      - first_line
      - lines
      - next_line
      title: CliInstallOut
      type: object
    CliListOut:
      properties:
        items:
          items:
            $ref: '#/components/schemas/CliOut'
          title: Items
          type: array
        warnings:
          items:
            $ref: '#/components/schemas/CliWarningOut'
          title: Warnings
          type: array
      required:
      - items
      - warnings
      title: CliListOut
      type: object
    CliLoginOut:
      description: |-
        ``state`` is ``None`` when the command was not found, so its login check
        could not run. ``command`` is the login command to copy — Coffer never
        runs it. ``check`` is the declared login check.
      properties:
        check:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Check
        command:
          anyOf:
          - type: string
          - type: 'null'
          title: Command
        state:
          anyOf:
          - enum:
            - logged_in
            - logged_out
            - not_needed
            type: string
          - type: 'null'
          title: State
      required:
      - state
      - check
      - command
      title: CliLoginOut
      type: object
    CliNeededByOut:
      description: One skill that requires the command, with what it asked for.
      properties:
        min_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Min Version
        skill_name:
          title: Skill Name
          type: string
        skill_uid:
          title: Skill Uid
          type: string
        why:
          anyOf:
          - type: string
          - type: 'null'
          title: Why
      required:
      - skill_uid
      - skill_name
      - min_version
      - why
      title: CliNeededByOut
      type: object
    CliOut:
      properties:
        brew:
          anyOf:
          - type: string
          - type: 'null'
          title: Brew
        checked_at:
          format: date-time
          title: Checked At
          type: string
        command:
          title: Command
          type: string
        install_command:
          anyOf:
          - type: string
          - type: 'null'
          title: Install Command
        install_state:
          anyOf:
          - enum:
            - running
            - succeeded
            - failed
            type: string
          - type: 'null'
          title: Install State
        login:
          $ref: '#/components/schemas/CliLoginOut'
        min_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Min Version
        needed_by:
          items:
            $ref: '#/components/schemas/CliNeededByOut'
          title: Needed By
          type: array
        path:
          anyOf:
          - type: string
          - type: 'null'
          title: Path
        status:
          enum:
          - missing
          - outdated
          - logged_out
          - ready
          title: Status
          type: string
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        version:
          anyOf:
          - type: string
          - type: 'null'
          title: Version
      required:
      - command
      - title
      - status
      - path
      - version
      - min_version
      - login
      - brew
      - install_command
      - install_state
      - needed_by
      - checked_at
      title: CliOut
      type: object
    CliWarningOut:
      description: A ``requires:`` entry a skill declares that was skipped, and why.
      properties:
        message:
          title: Message
          type: string
        skill_name:
          title: Skill Name
          type: string
        skill_uid:
          title: Skill Uid
          type: string
      required:
      - skill_uid
      - skill_name
      - message
      title: CliWarningOut
      type: object
    DriftEntryOut:
      description: |-
        One disagreement between what Coffer delivered and what is on disk.

        By NAME, and deliberately so even now that ``DriftEntry`` carries uids:
        an entry is a finding about a PATH in a workspace, and two of the five
        kinds (``missing_master``, ``orphan_master``) are precisely the case where
        no resource stands behind the name — there would be nothing to put in a uid
        field. The report is read and acted on as a whole through
        ``POST /skills/repair``, never used to address one resource, so a uid here
        would be an identity nobody follows. The uids on the domain entry exist for
        the repair pass, which re-delivers against them so a skill renamed between
        verify and repair is still the skill that gets repaired; that is an
        internal guarantee, not a field of this report.
      properties:
        agent_name:
          title: Agent Name
          type: string
        kind:
          $ref: '#/components/schemas/DriftKind'
        skill_name:
          title: Skill Name
          type: string
        suggested_remedy:
          title: Suggested Remedy
          type: string
        target_path:
          title: Target Path
          type: string
      required:
      - skill_name
      - agent_name
      - kind
      - target_path
      - suggested_remedy
      title: DriftEntryOut
      type: object
    DriftKind:
      description: Categorical disagreement between a binding row and its disk target.
      enum:
      - missing_link
      - tampered_link
      - replaced_with_regular
      - missing_master
      - orphan_master
      title: DriftKind
      type: string
    DriftReportOut:
      properties:
        entries:
          items:
            $ref: '#/components/schemas/DriftEntryOut'
          title: Entries
          type: array
      required:
      - entries
      title: DriftReportOut
      type: object
    ErrorDetail:
      properties:
        code:
          examples:
          - RESOURCE_NOT_FOUND
          title: Code
          type: string
        details:
          additionalProperties: true
          title: Details
          type: object
        message:
          examples:
          - 'resource not found: mcp_server:filesystem'
          title: Message
          type: string
      required:
      - code
      - message
      - details
      title: ErrorDetail
      type: object
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - error
      title: ErrorResponse
      type: object
    LinkMode:
      description: How a binding's target was realised on disk.
      enum:
      - symlink
      - junction
      - copy_fallback
      title: LinkMode
      type: string
    LocalImportSourceOut:
      description: A skill copied in from a folder on disk; the path is informational.
      properties:
        original_path:
          title: Original Path
          type: string
        type:
          const: local_import
          title: Type
          type: string
      required:
      - type
      - original_path
      title: LocalImportSourceOut
      type: object
    RepairReportOut:
      properties:
        remaining:
          $ref: '#/components/schemas/DriftReportOut'
        remediated:
          items:
            $ref: '#/components/schemas/DriftEntryOut'
          title: Remediated
          type: array
      required:
      - remediated
      - remaining
      title: RepairReportOut
      type: object
    ScopeOut:
      description: |-
        A resource's activation scope as a response carries it. ``agents`` is
        always present: ``null`` means unrestricted, ``[]`` dormant.
      properties:
        agents:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          examples:
          - - 9f2c1a7b4e8d4c1fa0b3d5e6f7081920
          title: Agents
      required:
      - agents
      title: ScopeOut
      type: object
    SkillBindingOut:
      description: |-
        One agent currently holding a delivered copy of this skill.

        Internal delivery bookkeeping surfaced read-only: there is no per-binding
        toggle any more, so a row here simply means "delivered". Which agents get a
        row is decided by ``SkillOut.enabled`` + ``SkillOut.scope``.

        Both halves of the agent's identity ride along: ``agent_uid`` is what a
        client follows to that agent, ``agent_name`` is what it prints. A delivery
        is a fact about an agent row, so it keeps pointing at the same agent when
        the user renames it (ADR resource-identity-is-an-immutable-uid).
      properties:
        agent_name:
          title: Agent Name
          type: string
        agent_uid:
          title: Agent Uid
          type: string
        last_link_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Link Path
        last_linked_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Last Linked At
        link_mode:
          anyOf:
          - $ref: '#/components/schemas/LinkMode'
          - type: 'null'
      required:
      - agent_uid
      - agent_name
      - last_linked_at
      - last_link_path
      - link_mode
      title: SkillBindingOut
      type: object
    SkillFileContentOut:
      properties:
        abs_path:
          title: Abs Path
          type: string
        binary:
          title: Binary
          type: boolean
        content:
          title: Content
          type: string
        fingerprint:
          title: Fingerprint
          type: string
        folder_abs_path:
          title: Folder Abs Path
          type: string
        path:
          title: Path
          type: string
        size:
          title: Size
          type: integer
        truncated:
          title: Truncated
          type: boolean
      required:
      - path
      - abs_path
      - folder_abs_path
      - content
      - truncated
      - binary
      - size
      - fingerprint
      title: SkillFileContentOut
      type: object
    SkillFileNodeOut:
      properties:
        abs_path:
          title: Abs Path
          type: string
        children:
          items:
            $ref: '#/components/schemas/SkillFileNodeOut'
          title: Children
          type: array
        folder_abs_path:
          title: Folder Abs Path
          type: string
        name:
          title: Name
          type: string
        path:
          title: Path
          type: string
        size:
          anyOf:
          - type: integer
          - type: 'null'
          title: Size
        truncated:
          default: false
          title: Truncated
          type: boolean
        type:
          enum:
          - file
          - dir
          title: Type
          type: string
      required:
      - name
      - path
      - abs_path
      - folder_abs_path
      - type
      - size
      - truncated
      - children
      title: SkillFileNodeOut
      type: object
    SkillFileTreeOut:
      properties:
        root:
          $ref: '#/components/schemas/SkillFileNodeOut'
      required:
      - root
      title: SkillFileTreeOut
      type: object
    SkillFileWriteRequest:
      properties:
        content:
          title: Content
          type: string
        expected_fingerprint:
          anyOf:
          - type: string
          - type: 'null'
          title: Expected Fingerprint
        path:
          minLength: 1
          title: Path
          type: string
      required:
      - path
      - content
      title: SkillFileWriteRequest
      type: object
    SkillImportRequest:
      properties:
        overwrite:
          default: false
          title: Overwrite
          type: boolean
        path:
          minLength: 1
          title: Path
          type: string
      required:
      - path
      title: SkillImportRequest
      type: object
    SkillListOut:
      properties:
        items:
          items:
            $ref: '#/components/schemas/SkillOut'
          title: Items
          type: array
      required:
      - items
      title: SkillListOut
      type: object
    SkillOut:
      properties:
        bindings:
          items:
            $ref: '#/components/schemas/SkillBindingOut'
          title: Bindings
          type: array
        builtin:
          title: Builtin
          type: boolean
        created_at:
          format: date-time
          title: Created At
          type: string
        description:
          title: Description
          type: string
        enabled:
          title: Enabled
          type: boolean
        last_synced_from_source_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Last Synced From Source At
        master_path:
          title: Master Path
          type: string
        name:
          title: Name
          type: string
        scope:
          anyOf:
          - $ref: '#/components/schemas/ScopeOut'
          - type: 'null'
        source:
          discriminator:
            mapping:
              builtin: '#/components/schemas/BuiltinSourceOut'
              local_import: '#/components/schemas/LocalImportSourceOut'
            propertyName: type
          oneOf:
          - $ref: '#/components/schemas/LocalImportSourceOut'
          - $ref: '#/components/schemas/BuiltinSourceOut'
          title: Source
        uid:
          title: Uid
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
        version_hash:
          title: Version Hash
          type: string
      required:
      - uid
      - name
      - description
      - source
      - builtin
      - enabled
      - scope
      - version_hash
      - master_path
      - last_synced_from_source_at
      - created_at
      - updated_at
      - bindings
      title: SkillOut
      type: object
    SkillRefOut:
      description: |-
        The managed skill an adoption just created.

        The ``uid`` is what a caller needs to go on and address the new skill —
        ``/api/v1/skills/{uid}`` — while the ``name`` is what it tells the user was
        adopted. An unmanaged folder had neither: it has no resource row at all,
        which is why it is named by its directory name in the path above.
      properties:
        name:
          title: Name
          type: string
        uid:
          title: Uid
          type: string
      required:
      - uid
      - name
      title: SkillRefOut
      type: object
    UnmanagedListOut:
      properties:
        items:
          items:
            $ref: '#/components/schemas/UnmanagedSkillOut'
          title: Items
          type: array
      required:
      - items
      title: UnmanagedListOut
      type: object
    UnmanagedSkillDetailOut:
      description: |-
        One unmanaged skill for its read-only detail page.

        ``description`` is the SKILL.md frontmatter's, known only when the folder
        validates; an invalid folder carries ``reason`` instead.
      properties:
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        foreign_link:
          title: Foreign Link
          type: boolean
        location:
          enum:
          - skills
          - agents_dir
          title: Location
          type: string
        name:
          title: Name
          type: string
        path:
          title: Path
          type: string
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        valid:
          title: Valid
          type: boolean
      required:
      - name
      - path
      - location
      - valid
      - reason
      - foreign_link
      - description
      title: UnmanagedSkillDetailOut
      type: object
    UnmanagedSkillOut:
      properties:
        foreign_link:
          title: Foreign Link
          type: boolean
        location:
          enum:
          - skills
          - agents_dir
          title: Location
          type: string
        name:
          title: Name
          type: string
        path:
          title: Path
          type: string
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        valid:
          title: Valid
          type: boolean
      required:
      - name
      - path
      - location
      - valid
      - reason
      - foreign_link
      title: UnmanagedSkillOut
      type: object
