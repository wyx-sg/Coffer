# Run `pre-commit install --hook-type pre-commit --hook-type commit-msg`
# once after `make install`. From there, hooks fire on every commit.
#
# Local fast feedback only. CI re-runs `make verify` independently — these
# hooks are NOT the source of truth, they're a guard against trivial slips.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]

  # Keep this rev equal to the ruff version backend/uv.lock pins, which is the
  # one `make lint` / `make format` / CI run. Two ruff versions on the same
  # code is how the hook and `make format` end up undoing each other, and a
  # rev below the `ruff>=0.16.0` floor in backend/pyproject.toml is that by
  # construction. (The previous pin, v0.15.14, was not even a real tag — that
  # series ends at v0.15.9 — so `pre-commit` could not install this repo at
  # all.)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.3.3
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, json, yaml, markdown, css]
        exclude: |
          (?x)^(
            frontend/package-lock\.json|
            e2e/package-lock\.json
          )$

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.20.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional@19.5.0"]
