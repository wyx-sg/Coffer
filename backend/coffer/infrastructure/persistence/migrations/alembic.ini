[alembic]
script_location = %(here)s
prepend_sys_path = ../../../..
sqlalchemy.url = driver://overridden-in-env
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# No [loggers] / [handlers] / [formatters] sections, on purpose. Alembic's
# generated ini ships them for its env.py to hand to logging.config.fileConfig,
# which REPLACES the root logger's handlers: inside the daemon that threw away
# the rotating daemon.log handler and the JSON formatter
# coffer.infrastructure.logging.setup had just installed, and left every line
# written afterwards without a timestamp. env.py no longer calls fileConfig, so
# these sections would be configuration nobody reads and an invitation to put
# the call back. Alembic's own INFO lines reach the log by propagating to the
# root logger the daemon configured.

# Keep this file ASCII-only. Alembic reads it with encoding="locale"
# (alembic.util.compat.read_config_parser), a sentinel that PEP 686 keeps
# outside UTF-8 mode on purpose, so the specs' -X utf8 does not cover it.
# In a frozen daemon started without LANG/LC_CTYPE that locale is ASCII,
# and one non-ASCII byte anywhere in here -- a comment is enough -- kills
# the daemon during lifespan startup with a UnicodeDecodeError. Guarded by
# tests/integration/surfaces/http/test_alembic_ini_is_ascii.py.
