[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coffer"
version = "0.1.1"
description = "Local-first AI agent vault — backend"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Coffer contributors" }]
dependencies = [
    # 0.137.x regressed APIRouter inclusion (app.include_router adds only the
    # first route of a multi-route router), which strips most endpoints off the
    # app — observed in 0.137.0 and still present in 0.137.1, so the whole
    # 0.137 line is excluded (a fresh CI install otherwise grabs 0.137.1 and
    # the knowledge contract checks fail). Lift the cap once a fixed
    # release is verified.
    "fastapi>=0.141.1,<0.142",
    "uvicorn[standard]>=0.52.4",
    # The web Chat page streams a turn over SSE; `surfaces/http/chat/turn_routes`
    # imports EventSourceResponse directly, so it is declared here rather than
    # relied on arriving transitively through `mcp` (same reasoning as httpx2).
    "sse-starlette>=3.4",
    "watchfiles>=1.0,<2.0",
    "pydantic>=2.13.5",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "keyring>=25.0",
    "cryptography>=42.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=26.1.0",
    "mcp>=2.2",
    # mcp 2.0 builds on httpx2 (httpx's 2.x line, published under a new
    # distribution name). `infrastructure/mcp/http_client` hands the SDK a
    # timeout and catches its transport errors, so it imports httpx2 directly
    # rather than relying on it arriving transitively.
    "httpx2>=2.7",
    "psutil>=5.9",
    "tomlkit>=0.13",
    "pyyaml>=6.0",
    # Document → text, for exactly two callers, which is what Contract 7
    # ("engine confinement") fences it to: inbound channel attachments (spec
    # channels "Give documents to every agent as extracted text",
    # ``infrastructure/chat``) and knowledge ingest
    # (``infrastructure/knowledge/converters``, which turns an uploaded file
    # into a markdown knowledge file). What the knowledge layer no longer has
    # is an INDEX — nothing here embeds or retrieves (ADR
    # knowledge-is-plain-files); conversion at ingest is untouched by that.
    # The extras pull in its format backends — without them every rich format
    # it advertises (pdf/docx/pptx/xlsx/xls) raises MissingDependencyException
    # at extraction time. html is built-in.
    # Removed with the index: sqlite-vec (the vector index), llama-index-*,
    # sentence-transformers, chromadb, mem0ai, pypdf. Coffer embeds nothing at
    # all now — knowledge search and memory recall are literal.
    "markitdown[docx,pdf,pptx,xls,xlsx]>=0.1",
    "openai>=1.40",
    # Agent turns: built-in LangGraph multi-LLM agent.
    "langgraph>=1.2",
    "langchain>=1.3",
    "langchain-anthropic>=1.4",
    "langchain-openai>=1.2",
    "langchain-ollama>=1.1",
    "claude-agent-sdk>=0.2,<0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4",
    "httpx>=0.28.1",
    "ruff>=0.16.0",
    "mypy>=2.3.0",
    "types-psutil>=5.9",
    "types-PyYAML>=6.0",
    # import-linter + grimp: most platforms get the latest (grimp 3.x is a
    # Rust extension, but wheels exist for typical CI + dev targets).
    # On Python 3.14 macOS x86_64 there is no prebuilt grimp 3.x wheel and
    # source builds fail on Apple's linker — pin to the last pure-Python pair
    # (import-linter 1.10 + grimp 2.5) only on that combination. PEP 508
    # has no `not` operator, so the "everywhere else" branch is expressed
    # via De Morgan's law as an `or` chain.
    "import-linter>=1.10,<1.11; python_version == '3.14' and sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "grimp<4; python_version == '3.14' and sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "import-linter>=2.0; python_version != '3.14' or sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "pre-commit>=4.6.1",
    "pytest-cov>=7.1.0",
    "pyinstaller>=6.21.0",
]

[project.scripts]
coffer = "coffer.surfaces.cli.main:run"
coffer-mcp-shim = "coffer.surfaces.shim.main:run"

[tool.setuptools]
packages = ["coffer"]

[tool.setuptools.package-data]
# The hand-written half of Coffer's own skill (spec knowledge "Merge the manual
# and the catalogue in the skill body") is a markdown file, not a module, so an
# installed wheel has to be told to carry it. A frozen build is told
# separately, in backend/coffer-daemon.spec.
coffer = ["application/knowledge/skill_assets/**/*.md"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "C4", "SIM", "RUF"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
show_error_codes = true
pretty = true

# Optional, lazily-imported third-party engines without type stubs. They are
# present on CI (→ import-untyped) but may be absent in a lean dev/verify env
# (→ import-not-found); ignoring missing imports keeps mypy stable across both.
[[tool.mypy.overrides]]
module = [
    "markitdown.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "acceptance(spec, scenario): tags a test as covering a spec.md acceptance scenario",
    "benchmark: performance benchmark; only runs when COFFER_RUN_BENCHMARKS=1",
    "timeout(seconds): per-test wall-clock cap enforced by pytest-timeout",
]

[tool.importlinter]
root_packages = ["coffer"]
include_external_packages = true
# Annotation-only imports (``if TYPE_CHECKING:``) do not count: a port may be
# typed with another kind's class without executing any of its code.
exclude_type_checking_imports = true

# Contract 1: surfaces > application > domain — imports flow inward only.
[[tool.importlinter.contracts]]
name = "Layered architecture: surfaces > application > domain"
type = "layers"
layers = [
    "coffer.surfaces",
    "coffer.application",
    "coffer.domain",
]

# Contract 2: infrastructure adapts ports defined in application; it must not
# reach back into surfaces.
[[tool.importlinter.contracts]]
name = "Infrastructure does not import surfaces"
type = "forbidden"
source_modules = ["coffer.infrastructure"]
forbidden_modules = ["coffer.surfaces"]

# Contract 2b (CODE-005): application code depends only on ports it defines
# (Protocols in application/*); it must not import infrastructure directly.
# Concrete infrastructure adapters are wired at composition root.
#
# Exception: the knowledge substrate (``coffer.infrastructure.knowledge``) is a
# set of pure helpers — path layout, frontmatter/YAML, file I/O, and the
# ripgrep wrapper — that the application composes directly. There is no engine
# behind a port any more, because there is no index (ADR
# knowledge-is-plain-files); what is left is thin enough that routing it through
# a port would be ceremony. So the application MAY import these substrate
# modules, but no other infrastructure.
#
# Second exception: ``coffer.application.memory`` (``service.py``,
# ``aggregate.py``) composes ``coffer.infrastructure.memory`` — the fact-file
# store, its path layout, its source-digest cache, and the two reader
# adapters — directly, the same substrate reasoning as knowledge above: there
# is no engine behind a port, only file I/O and two format parsers, and this
# is the whole layer's one consumer of them. The memory layer holds no table
# at all now that the developer's overrides are gone, so there is no
# persistence exception beside it.
[[tool.importlinter.contracts]]
name = "Application does not import infrastructure"
type = "forbidden"
source_modules = ["coffer.application"]
forbidden_modules = ["coffer.infrastructure"]
ignore_imports = [
    "coffer.application.knowledge.* -> coffer.infrastructure.knowledge.*",
    "coffer.application.memory.* -> coffer.infrastructure.memory.*",
]

# Contract 3: domain is pure — no imports from any other project layer, no
# external SDKs that imply I/O. The list of forbidden externals is the smell
# set; add more here when a new I/O dependency joins the project.
[[tool.importlinter.contracts]]
name = "Domain is pure"
type = "forbidden"
source_modules = ["coffer.domain"]
forbidden_modules = [
    "coffer.application",
    "coffer.infrastructure",
    "coffer.surfaces",
    "fastapi",
    "sqlalchemy",
    "sqlite3",
    "httpx",
    "keyring",
    "anyio",
]

# Contract 4: keyring is confined to infrastructure. Only the (future)
# infrastructure keyring adapter may import it; surfaces and application
# must use credential refs and ask infrastructure to resolve them.
# (Domain already cannot import keyring via Contract 3.)
[[tool.importlinter.contracts]]
name = "keyring confined to infrastructure"
type = "forbidden"
source_modules = [
    "coffer.surfaces",
    "coffer.application",
]
forbidden_modules = ["keyring"]
# Application may use infrastructure adapters that wrap keyring; only
# *direct* imports of keyring from surfaces/application are forbidden.
allow_indirect_imports = "True"

# The daemon is the sole keychain owner. The CLI must reach the
# keychain only through the daemon's HTTP API, never the KeyringAdapter in
# process — otherwise CLI-created items are owned by a different code identity
# than the daemon that reads them, which makes macOS re-prompt.
[[tool.importlinter.contracts]]
name = "CLI does not access the keychain directly"
type = "forbidden"
source_modules = ["coffer.surfaces.cli"]
forbidden_modules = ["coffer.infrastructure.credentials"]

# Contract 5: cross-kind imports forbidden. Each kind's modules may not import
# any other kind's modules; the kind-agnostic core (Resource/Audit/etc.),
# Coffer's own engine (``application.engine`` and the engine modules listed in
# Contract 6), the knowledge substrate, and the kind-agnostic infrastructure
# packages (``infrastructure.net``, ``infrastructure.agent_files``,
# ``infrastructure.llm``, ``infrastructure.persistence``) are the only shared
# ground. Only the composition root (``surfaces.http.app`` + ``*_wiring.py``,
# ``*_composition.py``, ``surfaces.cli.main``) may see two kinds at once.
#
# One contract per kind, all nine generated from ONE table
# (``scripts``-free: the table is the list below, kept symmetric by hand — a
# kind appears as a source in its own contract and in the forbidden list of
# every other). Two things are deliberately NOT fenced:
#
# * a kind's pure DOMAIN vocabulary, where another kind exists to act on it —
#   ``provider`` and ``memory`` read ``domain.agent`` (which agents there are,
#   where their config lives), ``channel`` reads ``domain.chat`` (what a turn
#   carries). Each such dependency is named in that contract's
#   ``ignore_imports`` so the exception is visible, never blanket.
# * annotation-only imports under ``TYPE_CHECKING``
#   (``exclude_type_checking_imports`` above): a Protocol may be typed with
#   another kind's class without executing any of its code.
#
# Everything else crosses through a port the consuming kind declares
# (``application.chat.ports.ModelCatalogPort``, ``application.memory.delivery
# .AgentConfigWriter``) and the composition root satisfies.

# MCP servers: the gateway, the supervisors, the capability catalogue.
[[tool.importlinter.contracts]]
name = "Cross-kind imports forbidden (mcp)"
type = "forbidden"
source_modules = [
    "coffer.domain.mcp",
    "coffer.application.mcp",
    "coffer.infrastructure.mcp",
