[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coffer"
version = "0.1.1"
description = "Local-first AI agent vault — backend"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Coffer contributors" }]
dependencies = [
    # 0.137.x regressed APIRouter inclusion (app.include_router adds only the
    # first route of a multi-route router), which strips most endpoints off the
    # app — observed in 0.137.0 and still present in 0.137.1, so the whole
    # 0.137 line is excluded (a fresh CI install otherwise grabs 0.137.1 and
    # the knowledge contract checks fail). Lift the cap once a fixed
    # release is verified.
    "fastapi>=0.141.1,<0.142",
    "uvicorn[standard]>=0.52.4",
    # The web Chat page streams a turn over SSE; `surfaces/http/chat/turn_routes`
    # imports EventSourceResponse directly, so it is declared here rather than
    # relied on arriving transitively through `mcp` (same reasoning as httpx2).
    "sse-starlette>=3.4",
    "watchfiles>=1.0,<2.0",
    "pydantic>=2.13.5",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "keyring>=25.0",
    "cryptography>=42.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=26.1.0",
    "mcp>=2.2",
    # mcp 2.0 builds on httpx2 (httpx's 2.x line, published under a new
    # distribution name). `infrastructure/mcp/http_client` hands the SDK a
    # timeout and catches its transport errors, so it imports httpx2 directly
    # rather than relying on it arriving transitively.
    "httpx2>=2.7",
    "psutil>=5.9",
    "tomlkit>=0.13",
    "pyyaml>=6.0",
    # spec agent-registry (agent registry): round-trip YAML editing for agents whose config
    # is YAML (e.g. Hermes ~/.hermes/config.yaml) — preserves the user's
    # comments/order on MCP install, the YAML analogue of tomlkit. pyyaml alone
    # would clobber comments.
    "ruamel.yaml>=0.18",
    # Inbound channel attachments → text (spec channels FR-030). MarkItDown is
    # here for that alone: the knowledge layer converts nothing any more (ADR
    # knowledge-is-plain-files), so this is no longer a "knowledge substrate"
    # dependency. The extras pull in its format backends — without them every
    # rich format it advertises (pdf/docx/pptx/xlsx/xls) raises
    # MissingDependencyException at extraction time. html is built-in.
    # Removed with the index: sqlite-vec (the vector index), llama-index-*,
    # sentence-transformers, chromadb, mem0ai, pypdf.
    "markitdown[docx,pdf,pptx,xls,xlsx]>=0.1",
    "openai>=1.40",
    # Agent turns: built-in LangGraph multi-LLM agent.
    "langgraph>=1.2",
    "langchain>=1.3",
    "langchain-anthropic>=1.4",
    "langchain-openai>=1.2",
    "langchain-ollama>=1.1",
    "claude-agent-sdk>=0.2,<0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4",
    "httpx>=0.28.1",
    "ruff>=0.16.0",
    "mypy>=2.3.0",
    "types-psutil>=5.9",
    "types-PyYAML>=6.0",
    # import-linter + grimp: most platforms get the latest (grimp 3.x is a
    # Rust extension, but wheels exist for typical CI + dev targets).
    # On Python 3.14 macOS x86_64 there is no prebuilt grimp 3.x wheel and
    # source builds fail on Apple's linker — pin to the last pure-Python pair
    # (import-linter 1.10 + grimp 2.5) only on that combination. PEP 508
    # has no `not` operator, so the "everywhere else" branch is expressed
    # via De Morgan's law as an `or` chain.
    "import-linter>=1.10,<1.11; python_version == '3.14' and sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "grimp<4; python_version == '3.14' and sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "import-linter>=2.0; python_version != '3.14' or sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "pre-commit>=4.6.1",
    "pytest-cov>=7.1.0",
    "pyinstaller>=6.21.0",
]

[project.scripts]
coffer = "coffer.surfaces.cli.main:run"
coffer-mcp-shim = "coffer.surfaces.shim.main:run"

[tool.setuptools]
packages = ["coffer"]

[tool.setuptools.package-data]
# The knowledge skill seeded at boot (spec knowledge FR-042) is a file, so an
# installed wheel has to carry it alongside the modules.
coffer = ["application/knowledge/skill_assets/**/*.md"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "C4", "SIM", "RUF"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
show_error_codes = true
pretty = true

# Optional, lazily-imported third-party engines without type stubs. They are
# present on CI (→ import-untyped) but may be absent in a lean dev/verify env
# (→ import-not-found); ignoring missing imports keeps mypy stable across both.
[[tool.mypy.overrides]]
module = [
    "sqlite_vec.*",
    "markitdown.*",
    "ruamel.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "acceptance(spec, scenario): tags a test as covering a spec.md acceptance scenario",
    "benchmark: performance benchmark; only runs when COFFER_RUN_BENCHMARKS=1",
    "timeout(seconds): per-test wall-clock cap enforced by pytest-timeout",
]

[tool.importlinter]
root_packages = ["coffer"]
include_external_packages = true

# Contract 1: surfaces > application > domain — imports flow inward only.
[[tool.importlinter.contracts]]
name = "Layered architecture: surfaces > application > domain"
type = "layers"
layers = [
    "coffer.surfaces",
    "coffer.application",
    "coffer.domain",
]

# Contract 2: infrastructure adapts ports defined in application; it must not
# reach back into surfaces.
[[tool.importlinter.contracts]]
name = "Infrastructure does not import surfaces"
type = "forbidden"
source_modules = ["coffer.infrastructure"]
forbidden_modules = ["coffer.surfaces"]

# Contract 2b (CODE-005): application code depends only on ports it defines
# (Protocols in application/*); it must not import infrastructure directly.
# Concrete infrastructure adapters are wired at composition root.
#
# Exception: the knowledge substrate (``coffer.infrastructure.knowledge``) is a
# set of pure helpers — path layout, frontmatter/YAML, file I/O, and the
# ripgrep wrapper — that the application composes directly. There is no engine
# behind a port any more, because there is no index (ADR
# knowledge-is-plain-files); what is left is thin enough that routing it through
# a port would be ceremony. So the application MAY import these substrate
# modules, but no other infrastructure.
[[tool.importlinter.contracts]]
name = "Application does not import infrastructure"
type = "forbidden"
source_modules = ["coffer.application"]
forbidden_modules = ["coffer.infrastructure"]
ignore_imports = [
    "coffer.application.knowledge.* -> coffer.infrastructure.knowledge.*",
]

# Contract 3: domain is pure — no imports from any other project layer, no
# external SDKs that imply I/O. The list of forbidden externals is the smell
# set; add more here when a new I/O dependency joins the project.
[[tool.importlinter.contracts]]
name = "Domain is pure"
type = "forbidden"
source_modules = ["coffer.domain"]
forbidden_modules = [
    "coffer.application",
    "coffer.infrastructure",
    "coffer.surfaces",
    "fastapi",
    "sqlalchemy",
    "sqlite3",
    "httpx",
    "keyring",
    "anyio",
]

# Contract 4: keyring is confined to infrastructure. Only the (future)
# infrastructure keyring adapter may import it; surfaces and application
# must use credential refs and ask infrastructure to resolve them.
# (Domain already cannot import keyring via Contract 3.)
[[tool.importlinter.contracts]]
name = "keyring confined to infrastructure"
type = "forbidden"
source_modules = [
    "coffer.surfaces",
    "coffer.application",
]
forbidden_modules = ["keyring"]
# Application may use infrastructure adapters that wrap keyring; only
# *direct* imports of keyring from surfaces/application are forbidden.
allow_indirect_imports = "True"

# The daemon is the sole keychain owner. The CLI must reach the
# keychain only through the daemon's HTTP API, never the KeyringAdapter in
# process — otherwise CLI-created items are owned by a different code identity
# than the daemon that reads them, which makes macOS re-prompt.
[[tool.importlinter.contracts]]
name = "CLI does not access the keychain directly"
type = "forbidden"
source_modules = ["coffer.surfaces.cli"]
forbidden_modules = ["coffer.infrastructure.credentials"]

# Contract 5: cross-kind imports forbidden. Each kind's modules may not import
# any other kind's modules; the kind-agnostic core (Resource/Audit/etc.) is the
# only shared substrate. As more kinds land, append to BOTH source_modules and
# forbidden_modules (symmetrically) so each new kind is fenced off from peers.
[[tool.importlinter.contracts]]
name = "Cross-kind imports forbidden (mcp)"
type = "forbidden"
source_modules = [
    "coffer.domain.mcp",
    "coffer.application.mcp",
    "coffer.infrastructure.mcp",
    "coffer.surfaces.http.mcp",
    "coffer.surfaces.cli.mcp",
]
forbidden_modules = [
    "coffer.domain.agent",
    "coffer.application.agent",
    "coffer.infrastructure.agent",
    "coffer.surfaces.http.agent_routes",
    "coffer.surfaces.cli.agent_cmd",
    "coffer.domain.skill",
    "coffer.application.skill",
    "coffer.infrastructure.skill",
    "coffer.surfaces.http.skill_routes",
    "coffer.surfaces.cli.skill_cmd",
    # ``domain.knowledge`` and ``infrastructure.knowledge`` are the SUBSTRATE
    # (Document/retrieval ports, chunker, index) and stay exempt: the
    # kind-agnostic embedding config is defined in terms of them. Only the
    # knowledge FACADE is fenced off from the other kinds.
    "coffer.application.knowledge",
    "coffer.surfaces.http.knowledge",
    "coffer.surfaces.cli.knowledge_cmd",
    "coffer.domain.channel",
    "coffer.application.channel",
    "coffer.infrastructure.channel",
    "coffer.surfaces.http.channel_routes",
    "coffer.surfaces.cli.channel_cmd",
    "coffer.surfaces.callback",
]

# Contract 5b: agent kind may not reach into mcp or skill. Symmetric with 5.
[[tool.importlinter.contracts]]
name = "Cross-kind imports forbidden (agent)"
type = "forbidden"
source_modules = [
    "coffer.domain.agent",
    "coffer.application.agent",
    "coffer.infrastructure.agent",
    "coffer.surfaces.http.agent_routes",
    "coffer.surfaces.cli.agent_cmd",
]
forbidden_modules = [
    "coffer.domain.mcp",
    "coffer.application.mcp",
    "coffer.infrastructure.mcp",
    "coffer.surfaces.http.mcp",
    "coffer.surfaces.cli.mcp",
    "coffer.domain.skill",
    "coffer.application.skill",
    "coffer.infrastructure.skill",
    "coffer.surfaces.http.skill_routes",
    "coffer.surfaces.cli.skill_cmd",
    # ``domain.knowledge`` and ``infrastructure.knowledge`` are the SUBSTRATE
    # (Document/retrieval ports, chunker, index) and stay exempt: the
    # kind-agnostic embedding config is defined in terms of them. Only the
    # knowledge FACADE is fenced off from the other kinds.
    "coffer.application.knowledge",
    "coffer.surfaces.http.knowledge",
    "coffer.surfaces.cli.knowledge_cmd",
    "coffer.domain.channel",
    "coffer.application.channel",
    "coffer.infrastructure.channel",
    "coffer.surfaces.http.channel_routes",
    "coffer.surfaces.cli.channel_cmd",
    "coffer.surfaces.callback",
]

# Contract 5c: skill kind may not reach into mcp or agent. Symmetric with 5/5b.
# The composition root (coffer.surfaces.http.agent_skill_wiring) is permitted
# to wire both kinds together because it lives outside the per-kind subpackages.
[[tool.importlinter.contracts]]
name = "Cross-kind imports forbidden (skill)"
type = "forbidden"
source_modules = [
    "coffer.domain.skill",
    "coffer.application.skill",
    "coffer.infrastructure.skill",
    "coffer.surfaces.http.skill_routes",
    "coffer.surfaces.cli.skill_cmd",
]
forbidden_modules = [
    "coffer.domain.mcp",
    "coffer.application.mcp",
    "coffer.infrastructure.mcp",
    "coffer.surfaces.http.mcp",
    "coffer.surfaces.cli.mcp",
    "coffer.domain.agent",
    "coffer.application.agent",
    "coffer.infrastructure.agent",
    "coffer.surfaces.http.agent_routes",
    "coffer.surfaces.cli.agent_cmd",
    # ``domain.knowledge`` and ``infrastructure.knowledge`` are the SUBSTRATE
    # (Document/retrieval ports, chunker, index) and stay exempt: the
    # kind-agnostic embedding config is defined in terms of them. Only the
    # knowledge FACADE is fenced off from the other kinds.
    "coffer.application.knowledge",
    "coffer.surfaces.http.knowledge",
    "coffer.surfaces.cli.knowledge_cmd",
    "coffer.domain.channel",
    "coffer.application.channel",
    "coffer.infrastructure.channel",
    "coffer.surfaces.http.channel_routes",
    "coffer.surfaces.cli.channel_cmd",
    "coffer.surfaces.callback",
]

# Contract 5d: the knowledge kind may not reach into mcp/agent/skill/channel.
# Symmetric with the others. There is ONE knowledge kind — ``memory`` and
# ``knowledge_base`` were merged into it — so this replaces what used to be two
# contracts fencing the two faces off from each other as well.
[[tool.importlinter.contracts]]
name = "Cross-kind imports forbidden (knowledge)"
type = "forbidden"
source_modules = [
    "coffer.domain.knowledge",
    "coffer.application.knowledge",
    "coffer.infrastructure.knowledge",
    "coffer.surfaces.http.knowledge",
    "coffer.surfaces.cli.knowledge_cmd",
]
forbidden_modules = [
    "coffer.domain.mcp",
    "coffer.application.mcp",
    "coffer.infrastructure.mcp",
    "coffer.surfaces.http.mcp",
    "coffer.surfaces.cli.mcp",
    "coffer.domain.agent",
    "coffer.application.agent",
    "coffer.infrastructure.agent",
    "coffer.surfaces.http.agent_routes",
    "coffer.surfaces.cli.agent_cmd",
    "coffer.domain.skill",
    "coffer.application.skill",
    "coffer.infrastructure.skill",
    "coffer.surfaces.http.skill_routes",
    "coffer.surfaces.cli.skill_cmd",
    "coffer.domain.channel",
    "coffer.application.channel",
    "coffer.infrastructure.channel",
    "coffer.surfaces.http.channel_routes",
    "coffer.surfaces.cli.channel_cmd",
    "coffer.surfaces.callback",
]

# Contract 5f: channel kind may not reach into any other kind. Symmetric.
[[tool.importlinter.contracts]]
name = "Cross-kind imports forbidden (channel)"
type = "forbidden"
source_modules = [
    "coffer.domain.channel",
    "coffer.application.channel",
    "coffer.infrastructure.channel",
    "coffer.surfaces.http.channel_routes",
    "coffer.surfaces.cli.channel_cmd",
    "coffer.surfaces.callback",
]
forbidden_modules = [
    "coffer.domain.mcp",
    "coffer.application.mcp",
    "coffer.infrastructure.mcp",
    "coffer.surfaces.http.mcp",
    "coffer.surfaces.cli.mcp",
    "coffer.domain.agent",
    "coffer.application.agent",
    "coffer.infrastructure.agent",
    "coffer.surfaces.http.agent_routes",
    "coffer.surfaces.cli.agent_cmd",
    "coffer.domain.skill",
    "coffer.application.skill",
    "coffer.infrastructure.skill",
    "coffer.surfaces.http.skill_routes",
    "coffer.surfaces.cli.skill_cmd",
    # ``domain.knowledge`` and ``infrastructure.knowledge`` are the SUBSTRATE
    # (Document/retrieval ports, chunker, index) and stay exempt: the
    # kind-agnostic embedding config is defined in terms of them. Only the
    # knowledge FACADE is fenced off from the other kinds.
    "coffer.application.knowledge",
    "coffer.surfaces.http.knowledge",
    "coffer.surfaces.cli.knowledge_cmd",
]

# Contract 6: kind-agnostic core does not import kind-specific modules.
[[tool.importlinter.contracts]]
name = "Kind-agnostic core does not import kind-specific code"
type = "forbidden"
source_modules = [
    "coffer.application.resource_service",
    "coffer.application.audit_service",
    "coffer.application.retention_service",
    "coffer.application.retention_worker",
    "coffer.application.builtin_tools",
    "coffer.domain.resource",
    "coffer.domain.audit",
    "coffer.domain.retention",
    "coffer.infrastructure.persistence.models",
    "coffer.surfaces.http.resource_routes",
    "coffer.surfaces.http.audit_routes",
    "coffer.surfaces.http.retention_routes",
]
forbidden_modules = [
    "coffer.domain.mcp",
    "coffer.application.mcp",
    "coffer.infrastructure.mcp",
    "coffer.surfaces.http.mcp",
    "coffer.domain.agent",
    "coffer.application.agent",
    "coffer.infrastructure.agent",
    "coffer.surfaces.http.agent_routes",
    "coffer.domain.skill",
    "coffer.application.skill",
    "coffer.infrastructure.skill",
    "coffer.surfaces.http.skill_routes",
    # Substrate exempt (see the note in the cross-kind contracts); the facade
    # is what the kind-agnostic core must not reach into.
    "coffer.application.knowledge",
    "coffer.surfaces.http.knowledge",
    "coffer.domain.channel",
    "coffer.application.channel",
    "coffer.infrastructure.channel",
    "coffer.surfaces.http.channel_routes",
]

# Contract 7: converter confinement. ``markitdown`` has exactly one consumer —
# ``infrastructure.chat.document_extract``, which turns an inbound channel
# attachment into text (spec channels FR-030). It used to live in the knowledge
# substrate; the knowledge layer converts nothing now (ADR
# knowledge-is-plain-files), so the rule keeps it out of every other package
# rather than granting one an exemption. The vector-index and embedding SDKs it
# also used to fence are gone from the dependency set entirely and are banned by
# Contract 8 instead, so a reintroduction has to be a deliberate act.
[[tool.importlinter.contracts]]
name = "Engine confinement: the markdown converter lives in infrastructure.chat only"
type = "forbidden"
source_modules = [
    "coffer.domain",
    "coffer.application",
    "coffer.infrastructure.mcp",
    "coffer.infrastructure.agent",
    "coffer.infrastructure.skill",
    "coffer.infrastructure.knowledge",
    "coffer.infrastructure.persistence",
    "coffer.infrastructure.credentials",
    "coffer.infrastructure.daemon",
    "coffer.infrastructure.logging",
]
forbidden_modules = [
    "markitdown",
    "docling",
]

# Contract 8: the dropped stacks must not return anywhere in the codebase.
[[tool.importlinter.contracts]]
name = "Dropped engines banned everywhere (llama_index/mem0/chromadb/sqlite_vec)"
type = "forbidden"
source_modules = [
    "coffer.domain",
    "coffer.application",
    "coffer.infrastructure",
    "coffer.surfaces",
]
forbidden_modules = [
    "llama_index",
    "mem0",
    "chromadb",
    "sentence_transformers",
    # Dropped with the knowledge index (ADR knowledge-is-plain-files): there is
    # no vector store and nothing to embed for, so an import is a mistake.
    "sqlite_vec",
    "fastembed",
]

# Contract 9a: langgraph + langchain* confined to infrastructure/llm.
# These SDKs call a plain chat model on Coffer's behalf (knowledge merge,
# organize, agentic reorg). infrastructure/llm is their only home — including
# infrastructure/chat, which drives coding agents through their own SDKs and
# has no business reaching for a chat model. Domain and application reach the
# loop only through injected ports (Contracts 2b / 5e).
[[tool.importlinter.contracts]]
name = "LangGraph and LangChain confined to infrastructure/llm"
type = "forbidden"
source_modules = [
    "coffer.domain",
    "coffer.application",
    "coffer.infrastructure.chat",
    "coffer.infrastructure.mcp",
    "coffer.infrastructure.channel",
    "coffer.infrastructure.knowledge",
    "coffer.infrastructure.persistence",
    "coffer.infrastructure.credentials",
    "coffer.infrastructure.daemon",
    "coffer.infrastructure.logging",
]
forbidden_modules = [
    "langgraph",
    "langchain",
    "langchain_core",
    "langchain_anthropic",
    "langchain_openai",
    "langchain_ollama",
]

# Contract 9b: the Claude Agent SDK confined to infrastructure/chat, which is
# where agent adapters live. Everything else — including infrastructure/llm —
# must not import it.
[[tool.importlinter.contracts]]
name = "Claude Agent SDK confined to infrastructure/chat"
type = "forbidden"
source_modules = [
    "coffer.domain",
    "coffer.application",
    "coffer.infrastructure.llm",
    "coffer.infrastructure.mcp",
    "coffer.infrastructure.channel",
    "coffer.infrastructure.knowledge",
    "coffer.infrastructure.persistence",
    "coffer.infrastructure.credentials",
    "coffer.infrastructure.daemon",
    "coffer.infrastructure.logging",
]
forbidden_modules = [
    "claude_agent_sdk",
]
