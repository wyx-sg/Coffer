# Contract 7 (REPLACES the old LlamaIndex + mem0 rules): engine confinement.
# The knowledge-substrate engines (file→markdown converters, the sqlite-vec
# vector index, and the OpenAI/fastembed embedding clients) may be imported
# ONLY by the shared infrastructure substrate ``coffer.infrastructure.knowledge``.
# Domain + application MUST NOT import them, and neither may sibling
# infrastructure packages. ``llama_index``, ``mem0``, and ``chromadb`` are gone
# from the codebase and are banned everywhere to prevent reintroduction.
[[tool.importlinter.contracts]]
name = "Engine confinement: converters/sqlite-vec/embedding SDKs in infrastructure.knowledge only"
type = "forbidden"
source_modules = [
    "coffer.domain",
    "coffer.application",
    "coffer.infrastructure.mcp",
    "coffer.infrastructure.agent",
    "coffer.infrastructure.skill",
    "coffer.infrastructure.channel",
    "coffer.infrastructure.knowledge_base",
    "coffer.infrastructure.memory",
    "coffer.infrastructure.persistence",
    "coffer.infrastructure.credentials",
    "coffer.infrastructure.daemon",
    "coffer.infrastructure.logging",
]
forbidden_modules = [
    "markitdown",
    "docling",
    "sqlite_vec",
    "openai",
    "fastembed",
]

# Contract 8: the dropped stacks must not return anywhere in the codebase.
[[tool.importlinter.contracts]]
name = "Dropped engines banned everywhere (llama_index/mem0/chromadb)"
type = "forbidden"
source_modules = [
    "coffer.domain",
    "coffer.application",
    "coffer.infrastructure",
    "coffer.surfaces",
]
forbidden_modules = [
    "llama_index",
    "mem0",
    "chromadb",
    "sentence_transformers",
]

# Contract 9: langgraph + langchain* confined to infrastructure/chat (spec 008).
# Domain + application MUST NOT import these SDKs; all other infrastructure
# packages MUST NOT either. The composition root (surfaces/http/app.py +
# surfaces/http/wiring.py) instantiates LangGraphBuiltinAgent via wire_chat.
[[tool.importlinter.contracts]]
name = "LangGraph and LangChain confined to infrastructure/chat"
type = "forbidden"
source_modules = [
    "coffer.domain",
    "coffer.application",
    "coffer.infrastructure.mcp",
    "coffer.infrastructure.channel",
    "coffer.infrastructure.knowledge",
    "coffer.infrastructure.memory",
    "coffer.infrastructure.persistence",
    "coffer.infrastructure.credentials",
    "coffer.infrastructure.daemon",
    "coffer.infrastructure.logging",
]
forbidden_modules = [
    "langgraph",
    "langchain",
    "langchain_core",
    "langchain_anthropic",
    "langchain_openai",
    "langchain_ollama",
    "claude_agent_sdk",
]
