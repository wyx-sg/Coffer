[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coffer"
version = "0.1.1"
description = "Local-first AI agent vault — backend"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Coffer contributors" }]
dependencies = [
    # 0.137.x regressed APIRouter inclusion (app.include_router adds only the
    # first route of a multi-route router), which strips most endpoints off the
    # app — observed in 0.137.0 and still present in 0.137.1, so the whole
    # 0.137 line is excluded (a fresh CI install otherwise grabs 0.137.1 and
    # the kb/memory/distill contract checks fail). Lift the cap once a fixed
    # release is verified.
    "fastapi>=0.136.3,<0.137",
    "uvicorn[standard]>=0.49.0",
    "watchfiles>=1.0,<2.0",
    "pydantic>=2.13.4",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "keyring>=25.0",
    "cryptography>=42.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=26.1.0",
    "mcp>=1.0",
    "psutil>=5.9",
    "tomlkit>=0.13",
    "pyyaml>=6.0",
    # spec 004 (agent registry): round-trip YAML editing for agents whose config
    # is YAML (e.g. Hermes ~/.hermes/config.yaml) — preserves the user's
    # comments/order on MCP install, the YAML analogue of tomlkit. pyyaml alone
    # would clobber comments.
    "ruamel.yaml>=0.18",
    # specs 006 (knowledge_base) + 007 (memory): shared knowledge substrate.
    # Converters → Markdown (MarkItDown default); FTS5 ships with SQLite; the
    # OpenAI SDK drives the swappable-base_url embedding client; sqlite-vec is
    # the vector index. Removed: llama-index-*, sentence-transformers, chromadb,
    # mem0ai, pypdf (all belonged to the dropped LlamaIndex/mem0 stack).
    # The extras pull in MarkItDown's format backends — without them every rich
    # format the converter advertises (pdf/docx/pptx/xlsx/xls) raises
    # MissingDependencyException at conversion time. html is built-in (no extra).
    "markitdown[docx,pdf,pptx,xls,xlsx]>=0.1",
    "sqlite-vec>=0.1.1",
    "openai>=1.40",
    # spec 008 — agent chat: built-in LangGraph multi-LLM agent.
    "langgraph>=1.2",
    "langchain>=1.3",
    "langchain-anthropic>=1.4",
    "langchain-openai>=1.2",
    "langchain-ollama>=1.1",
    "claude-agent-sdk>=0.2,<0.3",
]

[project.optional-dependencies]
# Optional in-process local embeddings (no cloud call). Vector retrieval still
# works via any OpenAI-compatible provider without this extra.
local-embeddings = [
    "fastembed>=0.3",
]
# Local speech-to-text for inbound channel voice messages. The frozen desktop
# app transcribes with a bundled torch-free `whisper-cli` (Metal) and decodes
# audio in-process with soundfile + soxr — this `voice` extra IS the decode
# stack, small and torch-free, so it is installed into the frozen build venv and
# bundled. See spec 009 FR-022 / ADR-039 (builds on ADR-038).
voice = [
    "soundfile>=0.12",
    "soxr>=0.5",
]
# Optional source-run STT fallback engine. `mlx-whisper` drags torch/mlx, so it
# is EXCLUDED from the frozen build (which uses whisper-cli); install it only for
# a `make dev` source run that wants the mlx engine instead of a local whisper-cli.
voice-mlx = [
    "mlx-whisper>=0.4",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4",
    "httpx>=0.28.1",
    "ruff>=0.16.0",
    "mypy>=2.3.0",
    "types-psutil>=5.9",
    "types-PyYAML>=6.0",
    # import-linter + grimp: most platforms get the latest (grimp 3.x is a
    # Rust extension, but wheels exist for typical CI + dev targets).
    # On Python 3.14 macOS x86_64 there is no prebuilt grimp 3.x wheel and
    # source builds fail on Apple's linker — pin to the last pure-Python pair
    # (import-linter 1.10 + grimp 2.5) only on that combination. PEP 508
    # has no `not` operator, so the "everywhere else" branch is expressed
    # via De Morgan's law as an `or` chain.
    "import-linter>=1.10,<1.11; python_version == '3.14' and sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "grimp<4; python_version == '3.14' and sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "import-linter>=2.0; python_version != '3.14' or sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "pre-commit>=4.6.1",
    "pytest-cov>=7.1.0",
    "pyinstaller>=6.0",
]

[project.scripts]
coffer = "coffer.surfaces.cli.main:run"
coffer-mcp-shim = "coffer.surfaces.shim.main:run"
coffer-hook = "coffer.surfaces.hook.main:run"

[tool.setuptools]
packages = ["coffer"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "C4", "SIM", "RUF"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
show_error_codes = true
pretty = true

# Optional, lazily-imported third-party engines without type stubs. They are
# present on CI (→ import-untyped) but may be absent in a lean dev/verify env
# (→ import-not-found); ignoring missing imports keeps mypy stable across both.
[[tool.mypy.overrides]]
module = [
    "sqlite_vec.*",
    "markitdown.*",
    "fastembed.*",
    "ruamel.*",
    "mlx_whisper.*",
    "soundfile.*",
    "soxr.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "acceptance(spec, scenario): tags a test as covering a spec.md acceptance scenario",
    "benchmark: performance benchmark; only runs when COFFER_RUN_BENCHMARKS=1",
    "timeout(seconds): per-test wall-clock cap enforced by pytest-timeout",
]

[tool.importlinter]
root_packages = ["coffer"]
include_external_packages = true

# Contract 1: surfaces > application > domain — imports flow inward only.
[[tool.importlinter.contracts]]
name = "Layered architecture: surfaces > application > domain"
type = "layers"
layers = [
    "coffer.surfaces",
    "coffer.application",
    "coffer.domain",
]

# Contract 2: infrastructure adapts ports defined in application; it must not
# reach back into surfaces.
[[tool.importlinter.contracts]]
name = "Infrastructure does not import surfaces"
type = "forbidden"
source_modules = ["coffer.infrastructure"]
forbidden_modules = ["coffer.surfaces"]

# Contract 2b (CODE-005): application code depends only on ports it defines
# (Protocols in application/*); it must not import infrastructure directly.
# Concrete infrastructure adapters are wired at composition root.
#
# Exception (specs 006/007): the shared knowledge substrate
# (``coffer.infrastructure.knowledge`` + ``coffer.infrastructure.memory``) is a
# kind-agnostic set of pure-ish helpers (chunking, frontmatter/YAML, content
# ids, per-fact file I/O, path layout) that the application phase composes
# behind the shared ``RetrievalPort`` / reindex routine. The data-model frames
# this substrate as application-composable; the heavy engines (markitdown,
# sqlite-vec, embedding SDKs) are still injected as ports and confined to
# infrastructure by Contract 7 (engine confinement). So the application MAY
# import the substrate helper modules, but no other infrastructure.
[[tool.importlinter.contracts]]
name = "Application does not import infrastructure"
type = "forbidden"
source_modules = ["coffer.application"]
forbidden_modules = ["coffer.infrastructure"]
ignore_imports = [
    "coffer.application.knowledge_base.* -> coffer.infrastructure.knowledge.*",
    "coffer.application.memory.* -> coffer.infrastructure.knowledge.*",
    "coffer.application.memory.* -> coffer.infrastructure.memory.*",
]

# Contract 3: domain is pure — no imports from any other project layer, no
# external SDKs that imply I/O. The list of forbidden externals is the smell
# set; add more here when a new I/O dependency joins the project.
[[tool.importlinter.contracts]]
name = "Domain is pure"
type = "forbidden"
source_modules = ["coffer.domain"]
forbidden_modules = [
    "coffer.application",
    "coffer.infrastructure",
    "coffer.surfaces",
    "fastapi",
    "sqlalchemy",
    "sqlite3",
    "httpx",
    "keyring",
    "anyio",
]

# Contract 4: keyring is confined to infrastructure. Only the (future)
# infrastructure keyring adapter may import it; surfaces and application
# must use credential refs and ask infrastructure to resolve them.
# (Domain already cannot import keyring via Contract 3.)
[[tool.importlinter.contracts]]
name = "keyring confined to infrastructure"
type = "forbidden"
source_modules = [
    "coffer.surfaces",
    "coffer.application",
]
forbidden_modules = ["keyring"]
# Application may use infrastructure adapters that wrap keyring; only
# *direct* imports of keyring from surfaces/application are forbidden.
allow_indirect_imports = "True"

# Spec 006: the daemon is the sole keychain owner. The CLI must reach the
# keychain only through the daemon's HTTP API, never the KeyringAdapter in
# process — otherwise CLI-created items are owned by a different code identity
# than the daemon that reads them, which makes macOS re-prompt.
[[tool.importlinter.contracts]]
name = "CLI does not access the keychain directly (spec 006)"
type = "forbidden"
source_modules = ["coffer.surfaces.cli"]
forbidden_modules = ["coffer.infrastructure.credentials"]

# Contract 5: cross-kind imports forbidden. Each kind's modules may not import
# any other kind's modules; the kind-agnostic core (Resource/Audit/etc.) is the
# only shared substrate. As more kinds land, append to BOTH source_modules and
# forbidden_modules (symmetrically) so each new kind is fenced off from peers.
[[tool.importlinter.contracts]]
name = "Cross-kind imports forbidden (mcp)"
type = "forbidden"
source_modules = [
    "coffer.domain.mcp",
    "coffer.application.mcp",
    "coffer.infrastructure.mcp",
    "coffer.surfaces.http.mcp",
    "coffer.surfaces.cli.mcp",
]
forbidden_modules = [
    "coffer.domain.agent",
    "coffer.application.agent",
    "coffer.infrastructure.agent",
    "coffer.surfaces.http.agent_routes",
    "coffer.surfaces.cli.agent_cmd",
