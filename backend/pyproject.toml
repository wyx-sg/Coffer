# Contract 7: converter confinement. ``markitdown`` has exactly two consumers —
# ``infrastructure.chat.document_extract``, which turns an inbound channel
# attachment into text (spec channels "Give documents to every agent as
# extracted text"), and
# ``infrastructure.knowledge.converters.markitdown_converter``, which turns an
# uploaded document into a Markdown file (spec knowledge "Convert uploads into
# material without keeping them"). The source is the whole ``coffer`` package,
# so a package added later is covered without anyone remembering to list it;
# the two consumers' own edges are the only ones ignored, which also removes
# every indirect chain through them. The vector-index and embedding SDKs it
# also used to fence are gone from the dependency set entirely and are banned
# by Contract 8 instead, so a reintroduction has to be a deliberate act. Coffer
# no longer embeds anything at any layer.
[[tool.importlinter.contracts]]
name = "Engine confinement: markitdown is imported by the channel attachment extractor and the knowledge converter only"
type = "forbidden"
source_modules = ["coffer"]
forbidden_modules = [
    "markitdown",
    "docling",
]
ignore_imports = [
    "coffer.infrastructure.chat.document_extract -> markitdown",
    "coffer.infrastructure.knowledge.converters.markitdown_converter -> markitdown",
]

# Contract 8: the dropped stacks must not return anywhere in the codebase.
[[tool.importlinter.contracts]]
name = "Dropped engines banned everywhere (llama_index/mem0/chromadb/sqlite_vec)"
