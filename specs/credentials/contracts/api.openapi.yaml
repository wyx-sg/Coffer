openapi: 3.1.0
info:
  title: Coffer Credentials API
  version: "0.1.0"
  description: |
    The encrypted credential store of Coffer's local daemon: where a secret is
    written, probed, read and destroyed, and where the Fernet master key that
    opens it is reported and relocated.

    Authentication: every request must carry `X-Coffer-Token`. The token, and
    the loopback-only posture around it, are spec daemon's.

    No response on this surface carries a secret except `GET /credentials/{ref}`,
    which is audited for exactly that reason.
  contact:
    name: Coffer
    url: https://github.com/wyx-sg/Coffer

servers:
  - url: http://127.0.0.1:{port}/api/v1
    description: Local daemon
    variables:
      port:
        default: "8000"
        description: Port from `~/.coffer/daemon.json`.

security:
  - cofferToken: []

# Every mutating endpoint accepts an optional `X-Coffer-Actor` request header
# (values: cli, api, ui, system). The audit log records the supplied value so
# downstream tooling can attribute actions back to the originating surface.
# Absent header defaults to "api".

tags:
  - name: credentials
    description: Fernet-encrypted credential store

paths:
  /credentials:
    post:
      tags: [credentials]
      operationId: setCredential
      summary: Store a secret in the Fernet-encrypted credential store under a reference key.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialSetIn" }
      responses:
        "204":
          description: Secret stored. Ciphertext persisted in the local DB; audit row carries the ref only.
        "401": { $ref: "#/components/responses/Unauthorized" }

  /credentials/{ref}:
    get:
      tags: [credentials]
      operationId: getCredential
      summary: Read a secret value from the encrypted credential store (audited).
      parameters:
        - name: ref
          in: path
          required: true
          schema:
            { type: string, pattern: "^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$" }
      responses:
        "200":
          description: The stored secret value (decrypted in memory, never logged).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialGetOut" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [credentials]
      operationId: deleteCredential
      summary: Remove a secret from the encrypted credential store. Idempotent.
      parameters:
        - name: ref
          in: path
          required: true
          schema:
            { type: string, pattern: "^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$" }
      responses:
        "204":
          description: Secret removed (or already absent).
        "409": { $ref: "#/components/responses/Conflict" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /credentials/{ref}/exists:
    get:
      tags: [credentials]
      operationId: credentialExists
      summary: Report whether a secret is stored under a ref (no value returned).
      parameters:
        - name: ref
          in: path
          required: true
          schema:
            { type: string, pattern: "^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$" }
      responses:
        "200":
          description: Presence flag.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialExistsOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /settings/credentials:
    get:
      tags: [credentials]
      operationId: getCredentialSettings
      summary: Report where the credential master key is stored.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialSettingsOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [credentials]
      operationId: putCredentialSettings
      summary: Relocate the credential master key (file <-> OS keychain).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialSettingsIn" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialSettingsOut" }
        "400": { $ref: "#/components/responses/BadRequest" }

components:
  securitySchemes:
    cofferToken:
      type: apiKey
      in: header
      name: X-Coffer-Token

  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: No secret is stored under this ref
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: The credential is still cited by a registered resource
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    CredentialSetIn:
      type: object
      required: [ref, value]
      properties:
        ref:
          type: string
          minLength: 1
          pattern: "^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$"
          description: Reference key the secret is stored under.
        value:
          type: string
          minLength: 1
          maxLength: 8192
          description: The secret value. Persisted Fernet-encrypted; audit rows carry the ref only.

    CredentialGetOut:
      type: object
      required: [value]
      properties:
        value:
          type: string
          description: The stored secret value (decrypted in memory, never logged).

    CredentialExistsOut:
      type: object
      required: [present]
      properties:
        present:
          type: boolean
          description: Whether a secret is stored under the ref.

    CredentialSettingsOut:
      type: object
      required: [master_key_storage]
      properties:
        master_key_storage:
          type: string
          enum: [file, keychain]
          description: file = master.key beside the DB (default); keychain = OS keychain entry.

    CredentialSettingsIn:
      type: object
      required: [master_key_storage]
      properties:
        master_key_storage:
          type: string
          enum: [file, keychain]

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: CREDENTIAL_IN_USE
            message:
              type: string
              example: "credential 'github-token' is referenced by: mcp_server:github"
            details:
              type: object
              additionalProperties: true
