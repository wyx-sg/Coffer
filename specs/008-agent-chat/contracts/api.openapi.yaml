openapi: 3.0.3
info:
  title: Coffer — Agent Chat API
  version: 0.1.0
  description: >
    REST + SSE surface for the chat platform, the agent-provider registry, the
    built-in agent, and configured LLM models. Spec 008. Conversations and
    models are not Resources. An agent is reached only through the registry;
    adding another agent provider requires no change to this contract.

servers:
  - url: http://127.0.0.1:8000

security:
  - bearerAuth: []

paths:
  /api/v1/chat/agents:
    get:
      summary: List the agents the platform offers
      operationId: listAgents
      tags: [chat]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatAgentListOut'

  /api/v1/chat/conversations:
    get:
      summary: List conversations, newest first
      operationId: listConversations
      tags: [chat]
      parameters:
        - name: archived
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: >
            When true, returns archived conversations; the default lists active
            (non-archived) conversations only.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationListOut'
    post:
      summary: Create a conversation
      operationId: createConversation
      description: >
        Creates a conversation for the named Coffer-managed agent. `agent_key`
        is required (chat has no built-in agent since ADR-024); `agent_config`
        is an opaque, agent-specific configuration object the named agent
        validates and stores. For a managed agent it accepts an optional `cwd`
        and an optional `model` (the agent's own model, free-text). An unknown
        `agent_key` or an invalid `agent_config` is rejected with 400.
      tags: [chat]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationOut'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/chat/conversations/{id}:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      summary: Get one conversation
      operationId: getConversation
      tags: [chat]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationOut'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Rename a conversation or change its model
      operationId: updateConversation
      tags: [chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationPatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationOut'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete a conversation and its messages
      operationId: deleteConversation
      tags: [chat]
      responses:
        '204':
          description: No Content
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/chat/conversations/{id}/agent-config:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      summary: Read a conversation's agent config (cwd, model)
      operationId: getAgentConfig
      tags: [chat]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConfigOut'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Set a conversation's agent model (managed agents)
      description: >
        Sets `agent_config.model` — the managed agent's own model, passed through
        to its CLI (Claude Code `--model`, Codex `model`) — preserving `cwd` and
        `session_id`. An empty or omitted `model` clears the override so the
        conversation inherits the active provider profile's projected default.
        Mirrors the channel `/model` command. The registry `model_id` (PATCH
        /conversations/{id}) is unrelated and is not read by the managed-agent
        turn path.
      operationId: setAgentConfig
      tags: [chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentConfigPatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConfigOut'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/chat/conversations/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      summary: Archive a conversation (hide from the active list, keep restorable)
      operationId: archiveConversation
      tags: [chat]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationOut'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/chat/conversations/{id}/unarchive:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      summary: Restore an archived conversation into the active list
      operationId: unarchiveConversation
      tags: [chat]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationOut'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/chat/conversations/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      summary: Conversation message history
      operationId: listMessages
      tags: [chat]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageListOut'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Send a user message (starts or enqueues a turn; fire-and-return)
      operationId: sendMessage
      description: >
        Starts a turn for the message, or enqueues it on the conversation's
        pending queue when a turn is already in flight (ADR-031). Returns
        immediately; turn events are consumed via
        `GET /conversations/{id}/events` (single event path). The composer never
        locks — a message sent during a turn is queued, not rejected.
      tags: [chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '202':
          description: Accepted — the turn started, or the message was queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageAck'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/chat/conversations/{id}/events:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      summary: Subscribe to a conversation's live turn events (SSE)
      operationId: subscribeConversationEvents
      description: >
        Server-Sent Events stream of the conversation's turn events, for any
        client (ADR-031). On attach, an in-flight turn's events so far are
        replayed, then streamed live; when idle, the connection is held open and
        the next turn (from any surface) is streamed. Event names: `turn_start`,
        `text_delta`, `tool_call`, `tool_result`, `turn_done`, `turn_error`,
        `queue_changed`.
      tags: [chat]
      responses:
        '200':
          description: SSE stream of agent events
          content:
            text/event-stream:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/chat/conversations/{id}/pending:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    put:
      summary: Replace the conversation's pending message queue
      operationId: setPendingQueue
      description: >
        Replace the ordered pending-message texts (ADR-031): one primitive that
        clears (empty list), drops, reorders, or resumes the queue. Unpauses the
        queue and starts the next turn when none is in flight. Broadcasts
        `queue_changed`.
      tags: [chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PendingQueueIn'
      responses:
        '200':
          description: The updated pending queue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingQueueOut'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/chat/conversations/{id}/interrupt:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      summary: Stop the conversation's in-flight turn, keeping partial output
      operationId: interruptTurn
      description: >
        Stops a running turn. Whatever the agent produced so far is persisted
        as the assistant message. A no-op when no turn is in flight.
      tags: [chat]
      responses:
        '204':
          description: No Content
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/models:
    get:
      summary: List configured models
      operationId: listModels
      tags: [models]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelListOut'
    post:
      summary: Register a model
      operationId: createModel
      tags: [models]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelOut'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/models/{id}:
    parameters:
      - $ref: '#/components/parameters/ModelId'
    patch:
      summary: Edit a model
      operationId: updateModel
      tags: [models]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelPatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelOut'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Remove a model
      operationId: deleteModel
      tags: [models]
      responses:
        '204':
          description: No Content
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/models/list-models:
    post:
      summary: List the models a provider exposes (for the model picker)
      operationId: listProviderModels
      tags: [models]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider: { type: string }
                base_url: { type: string, nullable: true }
                credential_ref: { type: string, nullable: true }
      responses:
        '200':
          description: Models (empty + message when none could be listed)
          content:
            application/json:
              schema:
                type: object
                required: [models, message]
                properties:
                  models: { type: array, items: { type: string } }
                  message: { type: string }

  /api/v1/models/test-connection:
    post:
      summary: Probe a chat provider with a minimal request
      operationId: testModelConnection
      tags: [models]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, model]
              properties:
                provider: { type: string }
                model: { type: string }
                base_url: { type: string, nullable: true }
                credential_ref: { type: string, nullable: true }
      responses:
        '200':
          description: Result (ok=true/false + humanized message), nothing persisted
          content:
            application/json:
              schema:
                type: object
                required: [ok, message]
                properties:
                  ok: { type: boolean }
                  message: { type: string }
                  detail: { type: object, additionalProperties: true }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    ConversationId:
      in: path
      name: id
      required: true
      schema: { type: string }
    ModelId:
      in: path
      name: id
      required: true
      schema: { type: string }

  responses:
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorOut'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorOut'

  schemas:
    ChatAgentOut:
      type: object
      required: [agent_key, display_name, available]
      properties:
        agent_key: { type: string, example: builtin }
        display_name: { type: string, example: Coffer Assistant }
        available: { type: boolean }

    ChatAgentListOut:
      type: object
      required: [agents]
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/ChatAgentOut'

    ConversationCreate:
      type: object
      properties:
        agent_key:
          type: string
          default: builtin
          description: Which agent the conversation talks to.
        agent_config:
          type: object
          additionalProperties: true
          nullable: true
          description: >
            Opaque, agent-specific configuration validated by the named agent.
            For a managed agent (Claude Code / Codex): an optional `cwd` and an
            optional `model` (the agent's own model, free-text, passed through to
            its CLI).

    ConversationPatch:
      type: object
      properties:
        title: { type: string, nullable: true }
        model_id: { type: string, nullable: true }

    AgentConfigPatch:
      type: object
      properties:
        model:
          type: string
          nullable: true
          description: >
            The managed agent's model (free-text, passed through to its CLI).
            Empty or null clears the override; `cwd` and `session_id` are
            preserved.

    AgentConfigOut:
      type: object
      required: [cwd, model]
      properties:
        cwd: { type: string, nullable: true }
        model: { type: string, nullable: true }

    ConversationOut:
      type: object
      required: [id, agent_key, title, model_id, created_at, updated_at]
      properties:
        id: { type: string }
        agent_key: { type: string, example: builtin }
        title: { type: string }
        model_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        archived_at:
          type: string
          format: date-time
          nullable: true
          description: Null for an active conversation; the instant it was archived otherwise.
        channel_binding:
          nullable: true
          description: >
            The IM channel this conversation is also driven from (ADR-031); null
            for a desktop-only conversation. Present iff channel_name is set.
          allOf:
            - $ref: '#/components/schemas/ChannelBindingOut'

    ChannelBindingOut:
      type: object
      required: [channel, chat_id]
      properties:
        channel: { type: string, description: The channel resource name. }
        chat_id: { type: string, description: The IM chat id used as the return address. }

    SendMessageAck:
      type: object
      required: [queued]
      properties:
        queued:
          type: boolean
          description: >
            True when the message was enqueued behind an in-flight turn; false
            when its turn started immediately.

    PendingQueueIn:
      type: object
      required: [pending]
      properties:
        pending:
          type: array
          items: { type: string }
          description: The new ordered pending-message texts (replaces the queue).

    PendingQueueOut:
      type: object
      required: [pending]
      properties:
        pending:
          type: array
          items: { type: string }
          description: The conversation's current ordered pending-message texts.

    ConversationListOut:
      type: object
      required: [conversations]
      properties:
        conversations:
          type: array
          items:
            $ref: '#/components/schemas/ConversationOut'

    ContentBlock:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [text, tool_use, tool_result] }
        text: { type: string, nullable: true }
        tool_use_id: { type: string, nullable: true }
        tool_name: { type: string, nullable: true }
        tool_input: { type: object, additionalProperties: true, nullable: true }
        output: { type: object, additionalProperties: true, nullable: true }
        error: { type: string, nullable: true }

    MessageOut:
      type: object
      required: [id, conversation_id, seq, role, content, status, created_at]
      properties:
        id: { type: string }
        conversation_id: { type: string }
        seq: { type: integer }
        role: { type: string, enum: [user, assistant] }
        content:
          type: array
          items:
            $ref: '#/components/schemas/ContentBlock'
        status: { type: string, enum: [complete, streaming, failed] }
        model_id: { type: string, nullable: true }
        prompt_tokens: { type: integer, nullable: true }
        completion_tokens: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }

    MessageListOut:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MessageOut'

    SendMessageRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 32768 }

    ModelCreate:
      type: object
      required: [display_name, provider, model]
      properties:
        display_name: { type: string, minLength: 1 }
        provider: { type: string, enum: [anthropic, openai, ollama] }
        model: { type: string, minLength: 1 }
        credential_ref: { type: string, nullable: true }
        base_url: { type: string, nullable: true }
        is_default: { type: boolean, default: false }

    ModelPatch:
      type: object
      properties:
        display_name: { type: string, nullable: true }
        model: { type: string, nullable: true }
        credential_ref: { type: string, nullable: true }
        base_url: { type: string, nullable: true }
        is_default: { type: boolean, nullable: true }

    ModelOut:
      type: object
      required: [id, display_name, provider, model, is_default, created_at, updated_at]
      properties:
        id: { type: string }
        display_name: { type: string }
        provider: { type: string, enum: [anthropic, openai, ollama] }
        model: { type: string }
        credential_ref: { type: string, nullable: true }
        base_url: { type: string, nullable: true }
        is_default: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ModelListOut:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/ModelOut'

    ErrorOut:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }
