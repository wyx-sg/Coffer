openapi: 3.0.3
info:
  title: Coffer — Channels API
  version: 0.1.0
  description: >
    REST surface for messaging channels (spec channels). Channel CRUD rides the
    generic /resources endpoints (spec mcp-gateway); this contract adds the
    channel-specific operations: pairing, status, notify, and the SeaTalk
    event ingest the callback listener forwards to. The callback listener's
    own public path (POST /seatalk/{channel}) is served by a separate process
    and is not part of the daemon's API surface.

    It also carries the turn platform's own surfaces, which channels share with
    the web Chat page: the read routes saying which agents are registered and
    what models each can be put on, and the /api/v1/chat conversation, message,
    pending-queue and SSE routes the page drives a turn through. A conversation
    is the same object either way — one started from a channel is observable
    and continuable from the page, and the reverse.

servers:
  - url: http://127.0.0.1:8000

security:
  - bearerAuth: []

paths:
  /api/v1/channels/{name}/pairing-code:
    post:
      summary: Issue a single-use pairing code for a channel
      operationId: issuePairingCode
      tags: [channels]
      parameters:
        - $ref: '#/components/parameters/ChannelName'
      responses:
        '200':
          description: Code issued (replaces any previous pending code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingCodeOut'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/channels/{name}/status:
    get:
      summary: Runtime, pairing, and callback status of a channel
      operationId: getChannelStatus
      tags: [channels]
      parameters:
        - $ref: '#/components/parameters/ChannelName'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelStatusOut'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/channels/{name}/notify:
    post:
      summary: Push a text message to the channel's paired peer
      operationId: notifyChannel
      tags: [channels]
      parameters:
        - $ref: '#/components/parameters/ChannelName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotifyIn'
      responses:
        '200':
          description: Delivered to the IM platform
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotifyOut'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Channel has no paired peer or is disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/channels/{name}/events:
    post:
      summary: Ingest a verified SeaTalk callback event (listener-internal)
      description: >
        Called by the callback listener over loopback after signature
        verification. Requires the daemon token like every other route;
        the body is the raw SeaTalk event envelope.
      operationId: ingestChannelEvent
      tags: [channels]
      parameters:
        - $ref: '#/components/parameters/ChannelName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeaTalkEventIn'
      responses:
        '200':
          description: Accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAcceptedOut'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The channel's adapter is not running (channel disabled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/agent-providers:
    get:
      summary: List the agents the turn platform can run a turn on
      operationId: listAgentProviders
      tags: [agent-providers]
      responses:
        '200':
          description: The registered agent providers, each with availability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProviderListOut'

  /api/v1/agent-providers/{agent_key}/models:
    get:
      summary: List the models an agent can be put on
      operationId: listAgentModels
      tags: [agent-providers]
      parameters:
        - name: agent_key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: >
            The concrete models the installed agent itself reported, minus the
            ones its own retirement table says are gone. The order is
            meaningful (newest first). Nothing narrows it: the agent answers
            only "what can this agent be put on", and a surface with an
            audience of its own — a channel's allowed range — curates over it
            on its own side.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentModelsOut'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/chat/conversations:
    get:
      summary: List conversations, newest first
      operationId: listConversations
      tags: [chat]
      parameters:
        - name: archived
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: >
            When true, returns archived conversations; the default lists active
            (non-archived) conversations only.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationListOut'
    post:
      summary: Create a conversation
      operationId: createConversation
      description: >
        Creates a conversation for the named Coffer-managed agent. `agent_key`
        is required; `agent_config` is an opaque, agent-specific configuration
        object the named agent validates and stores. For a managed agent it
        accepts an optional `cwd` and an optional `model` (the agent's own
        model, free-text). An unknown `agent_key` or an invalid `agent_config`
        is rejected with 400.
      tags: [chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationOut'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/chat/conversations/{id}:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      summary: Get one conversation
      operationId: getConversation
      tags: [chat]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationOut'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Rename a conversation or change its model
      operationId: updateConversation
      tags: [chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationPatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationOut'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete a conversation and its messages
      description: >
        Any in-flight turn for the conversation is cancelled and discarded
        before deletion, so no background task outlives the row.
      operationId: deleteConversation
      tags: [chat]
      responses:
        '204':
          description: No Content
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/chat/conversations/{id}/agent-config:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      summary: Read a conversation's agent config (cwd, model)
      operationId: getAgentConfig
      tags: [chat]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConfigOut'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Set a conversation's agent model (managed agents)
      description: >
        Sets `agent_config.model` — the managed agent's own model, passed
        through to its CLI (Claude Code `--model`, Codex `model`) — preserving
        `cwd` and `session_id`. An empty or null `model` clears the override so
        the conversation inherits the active provider profile's projected
        default. Mirrors the channel `/model` command. The `model_id` of PATCH
        /conversations/{id} is unrelated and is not read by the turn path.
      operationId: setAgentConfig
      tags: [chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentConfigPatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConfigOut'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/chat/conversations/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      summary: Archive a conversation (hide from the active list, keep restorable)
      operationId: archiveConversation
      tags: [chat]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationOut'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/chat/conversations/{id}/unarchive:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      summary: Restore an archived conversation into the active list
      operationId: unarchiveConversation
      tags: [chat]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationOut'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/chat/conversations/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      summary: Conversation message history
      operationId: listMessages
      tags: [chat]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageListOut'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Send a user message (starts or enqueues a turn; fire-and-return)
      operationId: sendMessage
      description: >
        Starts a turn for the message, or enqueues it on the conversation's
        pending queue when a turn is already in flight. Returns immediately;
        turn events are consumed via `GET /conversations/{id}/events`, the
        single event path. The composer never locks — a message sent during a
        turn is queued, not rejected.
      tags: [chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '202':
          description: Accepted — the turn started, or the message was queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageAck'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/chat/conversations/{id}/events:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      summary: Subscribe to a conversation's live turn events (SSE)
      operationId: subscribeConversationEvents
      description: >
        Server-Sent Events stream of the conversation's turn events, for any
        client. On attach, an in-flight turn's events so far are replayed, then
        streamed live; when idle the connection is held open and the next turn —
        from any surface, a channel included — is streamed. Event names:
        `turn_start`, `text_delta`, `tool_call`, `tool_result`, `turn_done`,
        `turn_error`, `queue_changed`.
      tags: [chat]
      responses:
        '200':
          description: SSE stream of agent events
          content:
            text/event-stream:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/chat/conversations/{id}/pending:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    put:
      summary: Replace the conversation's pending message queue
      operationId: setPendingQueue
      description: >
        Replaces the ordered pending-message texts: one primitive that clears
        (empty list), drops, reorders, or resumes the queue. Unpauses the queue
        and starts the next turn when none is in flight. Broadcasts
        `queue_changed`.
      tags: [chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PendingQueueIn'
      responses:
        '200':
          description: The updated pending queue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingQueueOut'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/chat/conversations/{id}/interrupt:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      summary: Stop the conversation's in-flight turn, keeping partial output
      operationId: interruptTurn
      description: >
        Stops a running turn and pauses the pending queue. Whatever the agent
        produced so far is persisted as the assistant message. A no-op when no
        turn is in flight.
      tags: [chat]
      responses:
        '204':
          description: No Content
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    ChannelName:
      name: name
      in: path
      required: true
      schema: { type: string }
      description: Channel resource name (the `<name>` of `channel:<name>`)
    ConversationId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Conversation id

  responses:
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: No channel, agent, or conversation with this name or id
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    AgentProviderOut:
      type: object
      required: [agent_key, display_name, available]
      properties:
        agent_key:
          type: string
        display_name:
          type: string
        available:
          type: boolean
          description: Whether the agent's CLI is present on this host.

    AgentProviderListOut:
      type: object
      required: [agents]
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/AgentProviderOut'

    AgentModelOut:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: >-
            The id passed verbatim to the agent's CLI. Concrete models only —
            tier aliases (`sonnet`, `opus`, `best`, `sonnet[1m]`, …) are not
            listed, since each resolves to a model already in the list.
        label:
          type: string
        description:
          type: string

    AgentModelsOut:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/AgentModelOut'

    PairingCodeOut:
      type: object
      required: [code, expires_at]
      properties:
        pair_url:
          type: string
          description: >-
            A link carrying the code, so the owner pairs by opening it rather
            than transcribing it. Empty when the platform has no such link or
            the bot's username is unknown; the typed code always works.
        code:
          type: string
          description: 8-character code from an unambiguous alphabet
        expires_at:
          type: string
          format: date-time

    ChannelStatusOut:
      type: object
      required: [name, channel_type, enabled, running, peer, callback]
      properties:
        name: { type: string }
        channel_type:
          type: string
          enum: [telegram, seatalk]
        enabled: { type: boolean }
        running:
          type: boolean
          description: Whether the adapter task is currently live
        pending_pairing:
          type: boolean
          description: Whether an unexpired pairing code is outstanding
        peer:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ChannelPeerOut'
        callback:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CallbackInfoOut'
          description: Present for seatalk channels only
        diagnostics:
          type: array
          description: >-
            Contradictions between the channel's configuration and what the
            platform actually permits. Empty is the healthy case.
          items:
            $ref: '#/components/schemas/ChannelDiagnosticOut'

    ChannelDiagnosticOut:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable identifier, so a UI can style or link the finding
        message:
          type: string
          description: What is wrong and what to do about it

    ChannelPeerOut:
      type: object
      required: [chat_id, display_name, paired_at, active_conversation_id]
      properties:
        chat_id: { type: string }
        display_name: { type: string }
        paired_at:
          type: string
          format: date-time
        active_conversation_id:
          type: string
          nullable: true

    CallbackInfoOut:
      type: object
      required: [port, path, listener_running]
      properties:
        port: { type: integer }
        path:
          type: string
          description: The path to append to the tunnel URL
        listener_running: { type: boolean }

    NotifyIn:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4096

    NotifyOut:
      type: object
      required: [sent]
      properties:
        sent: { type: boolean }

    SeaTalkEventIn:
      type: object
      required: [event_type, event]
      properties:
        event_id: { type: string }
        event_type: { type: string }
        timestamp: { type: integer }
        app_id: { type: string }
        event:
          type: object
          additionalProperties: true

    EventAcceptedOut:
      type: object
      required: [accepted]
      properties:
        accepted: { type: boolean }

    ConversationCreate:
      type: object
      required: [agent_key]
      properties:
        agent_key:
          type: string
          description: Which registered agent the conversation talks to.
        agent_config:
          type: object
          additionalProperties: true
          nullable: true
          description: >
            Opaque, agent-specific configuration validated by the named agent.
            For a managed agent (Claude Code / Codex): an optional `cwd` and an
            optional `model` (the agent's own model, free-text, passed through
            to its CLI).

    ConversationPatch:
      type: object
      properties:
        title: { type: string, nullable: true }
        model_id: { type: string, nullable: true }

    ConversationOut:
      type: object
      required: [id, agent_key, title, model_id, created_at, updated_at]
      properties:
        id: { type: string }
        agent_key: { type: string }
        title: { type: string }
        model_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        archived_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            Null for an active conversation; the instant it was archived
            otherwise.
        channel_binding:
          nullable: true
          description: >-
            The IM channel this conversation is also driven from; null for a
            conversation started on the web page. Present iff the conversation
            carries a channel name.
          allOf:
            - $ref: '#/components/schemas/ChannelBindingOut'

    ConversationListOut:
      type: object
      required: [conversations]
      properties:
        conversations:
          type: array
          items:
            $ref: '#/components/schemas/ConversationOut'

    ChannelBindingOut:
      type: object
      required: [channel, chat_id]
      properties:
        channel: { type: string, description: The channel resource name. }
        chat_id:
          type: string
          description: The IM chat id used as the return address.

    AgentConfigPatch:
      type: object
      properties:
        model:
          type: string
          nullable: true
          description: >-
            The managed agent's model (free-text, passed through to its CLI).
            Empty or null clears the override; `cwd` and `session_id` are
            preserved.

    AgentConfigOut:
      type: object
      required: [cwd, model]
      properties:
        cwd: { type: string, nullable: true }
        model: { type: string, nullable: true }

    ContentBlockOut:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [text, tool_use, tool_result, attachment] }
        text: { type: string, nullable: true }
        tool_use_id: { type: string, nullable: true }
        tool_name: { type: string, nullable: true }
        tool_input: { type: object, additionalProperties: true, nullable: true }
        output: { type: object, additionalProperties: true, nullable: true }
        error: { type: string, nullable: true }
        filename:
          type: string
          nullable: true
          description: >-
            An `attachment` block references channel media by filename and mime
            only; the local path is never emitted to the wire (FR-033).
        mime: { type: string, nullable: true }

    MessageOut:
      type: object
      required: [id, conversation_id, seq, role, content, status, created_at]
      properties:
        id: { type: string }
        conversation_id: { type: string }
        seq: { type: integer }
        role: { type: string, enum: [user, assistant] }
        content:
          type: array
          items:
            $ref: '#/components/schemas/ContentBlockOut'
        status: { type: string, enum: [complete, streaming, failed] }
        model_id: { type: string, nullable: true }
        prompt_tokens: { type: integer, nullable: true }
        completion_tokens: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }

    MessageListOut:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MessageOut'

    SendMessageRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 32768 }

    SendMessageAck:
      type: object
      required: [queued]
      properties:
        queued:
          type: boolean
          description: >-
            True when the message was enqueued behind an in-flight turn; false
            when its turn started immediately.

    PendingQueueIn:
      type: object
      required: [pending]
      properties:
        pending:
          type: array
          items: { type: string }
          description: The new ordered pending-message texts (replaces the queue).

    PendingQueueOut:
      type: object
      required: [pending]
      properties:
        pending:
          type: array
          items: { type: string }
          description: The conversation's current ordered pending-message texts.

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: object
              additionalProperties: true
