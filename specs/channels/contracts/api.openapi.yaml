openapi: 3.0.3
info:
  title: Coffer — Channels API
  version: 0.1.0
  description: >
    REST surface for messaging channels (spec channels). Channel CRUD rides the
    generic /resources endpoints (spec mcp-gateway); this contract adds the
    channel-specific operations: pairing, status, notify, and the SeaTalk
    event ingest the callback listener forwards to. The callback listener's
    own public path (POST /seatalk/{channel}) is served by a separate process
    and is not part of the daemon's API surface.

    It also carries the turn platform's own read surface — which agents are
    registered, and what models each can be put on. Those two routes were
    written for the web chat page; channels are what outlived it, and they are
    what the channel editor calls before binding a channel to an agent.

servers:
  - url: http://127.0.0.1:8000

security:
  - bearerAuth: []

paths:
  /api/v1/channels/{name}/pairing-code:
    post:
      summary: Issue a single-use pairing code for a channel
      operationId: issuePairingCode
      tags: [channels]
      parameters:
        - $ref: '#/components/parameters/ChannelName'
      responses:
        '200':
          description: Code issued (replaces any previous pending code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingCodeOut'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/channels/{name}/status:
    get:
      summary: Runtime, pairing, and callback status of a channel
      operationId: getChannelStatus
      tags: [channels]
      parameters:
        - $ref: '#/components/parameters/ChannelName'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelStatusOut'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/channels/{name}/notify:
    post:
      summary: Push a text message to the channel's paired peer
      operationId: notifyChannel
      tags: [channels]
      parameters:
        - $ref: '#/components/parameters/ChannelName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotifyIn'
      responses:
        '200':
          description: Delivered to the IM platform
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotifyOut'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Channel has no paired peer or is disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/channels/{name}/events:
    post:
      summary: Ingest a verified SeaTalk callback event (listener-internal)
      description: >
        Called by the callback listener over loopback after signature
        verification. Requires the daemon token like every other route;
        the body is the raw SeaTalk event envelope.
      operationId: ingestChannelEvent
      tags: [channels]
      parameters:
        - $ref: '#/components/parameters/ChannelName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeaTalkEventIn'
      responses:
        '200':
          description: Accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAcceptedOut'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The channel's adapter is not running (channel disabled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/agent-providers:
    get:
      summary: List the agents the turn platform can run a turn on
      operationId: listAgentProviders
      tags: [agent-providers]
      responses:
        '200':
          description: The registered agent providers, each with availability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProviderListOut'

  /api/v1/agent-providers/{agent_key}/models:
    get:
      summary: List the models an agent can be put on
      operationId: listAgentModels
      tags: [agent-providers]
      parameters:
        - name: agent_key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: >
            The concrete models the installed agent itself reported, minus the
            ones its own retirement table says are gone. The order is
            meaningful (newest first). NOT narrowed by the curated selection —
            the curation screen renders this list and ticks the selection
            against it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentModelsOut'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/agent-providers/{agent_key}/models/selection:
    get:
      summary: Which of the catalogue this agent's pickers offer
      operationId: getAgentModelSelection
      tags: [agent-providers]
      parameters:
        - name: agent_key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: >
            The model ids the user curated. EMPTY means not curated yet — every
            model in the catalogue is offered — never "no models".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentModelSelectionOut'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Replace which of the catalogue this agent's pickers offer
      operationId: setAgentModelSelection
      tags: [agent-providers]
      parameters:
        - name: agent_key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentModelSelectionIn'
      responses:
        '200':
          description: The stored selection after the write.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentModelSelectionOut'
        '404':
          description: >
            Unknown agent key, or no agent of that type is registered — the
            curated set lives in an agent's config row, so without one there is
            nowhere to put it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    ChannelName:
      name: name
      in: path
      required: true
      schema: { type: string }
      description: Channel resource name (the `<name>` of `channel:<name>`)

  responses:
    NotFound:
      description: No channel with this name
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    AgentProviderOut:
      type: object
      required: [agent_key, display_name, available]
      properties:
        agent_key:
          type: string
        display_name:
          type: string
        available:
          type: boolean
          description: Whether the agent's CLI is present on this host.

    AgentProviderListOut:
      type: object
      required: [agents]
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/AgentProviderOut'

    AgentModelOut:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: >-
            The id passed verbatim to the agent's CLI. Concrete models only —
            tier aliases (`sonnet`, `opus`, `best`, `sonnet[1m]`, …) are not
            listed, since each resolves to a model already in the list.
        label:
          type: string
        description:
          type: string

    AgentModelsOut:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/AgentModelOut'

    AgentModelSelectionIn:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items:
            type: string
          description: >-
            The curated set, replacing the stored one wholesale. Ids are stored
            verbatim and are NOT checked against the catalogue: the catalogue
            moves on every CLI upgrade, so an id it does not currently carry is
            a stale menu entry rather than a config error. An empty array clears
            the curation.

    AgentModelSelectionOut:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items:
            type: string
          description: >-
            The model ids this agent's pickers offer, out of the catalogue.
            EMPTY means not curated — every model is offered.

    PairingCodeOut:
      type: object
      required: [code, expires_at]
      properties:
        code:
          type: string
          description: 8-character code from an unambiguous alphabet
        expires_at:
          type: string
          format: date-time

    ChannelStatusOut:
      type: object
      required: [name, channel_type, enabled, running, peer, callback]
      properties:
        name: { type: string }
        channel_type:
          type: string
          enum: [telegram, seatalk]
        enabled: { type: boolean }
        running:
          type: boolean
          description: Whether the adapter task is currently live
        pending_pairing:
          type: boolean
          description: Whether an unexpired pairing code is outstanding
        peer:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ChannelPeerOut'
        callback:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CallbackInfoOut'
          description: Present for seatalk channels only

    ChannelPeerOut:
      type: object
      required: [chat_id, display_name, paired_at, active_conversation_id]
      properties:
        chat_id: { type: string }
        display_name: { type: string }
        paired_at:
          type: string
          format: date-time
        active_conversation_id:
          type: string
          nullable: true

    CallbackInfoOut:
      type: object
      required: [port, path, listener_running]
      properties:
        port: { type: integer }
        path:
          type: string
          description: The path to append to the tunnel URL
        listener_running: { type: boolean }

    NotifyIn:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4096

    NotifyOut:
      type: object
      required: [sent]
      properties:
        sent: { type: boolean }

    SeaTalkEventIn:
      type: object
      required: [event_type, event]
      properties:
        event_id: { type: string }
        event_type: { type: string }
        timestamp: { type: integer }
        app_id: { type: string }
        event:
          type: object
          additionalProperties: true

    EventAcceptedOut:
      type: object
      required: [accepted]
      properties:
        accepted: { type: boolean }

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: object
              additionalProperties: true
