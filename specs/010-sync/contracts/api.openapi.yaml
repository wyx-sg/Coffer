openapi: 3.0.3
info:
  title: Coffer — Sync API
  version: 0.1.0
  description: >
    REST surface for multi-machine sync (spec 010). Sync is a cross-cutting
    service, not a resource kind, so it has its own endpoints rather than riding
    /resources. All paths require the loopback bearer token. The master key is
    never returned over the network except via the explicit, audited
    key-export endpoint that writes it to a local file path.

servers:
  - url: http://127.0.0.1:8000

security:
  - bearerAuth: []

paths:
  /api/v1/sync/config:
    get:
      summary: Get sync configuration
      operationId: getSyncConfig
      tags: [sync]
      responses:
        '200':
          description: Current sync config
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncConfigOut' }
    put:
      summary: Update sync configuration
      operationId: putSyncConfig
      tags: [sync]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncConfigIn' }
      responses:
        '200':
          description: Updated config
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncConfigOut' }
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/sync/status:
    get:
      summary: Get last-run sync status
      operationId: getSyncStatus
      tags: [sync]
      responses:
        '200':
          description: Current sync state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncStatusOut' }

  /api/v1/sync/run:
    post:
      summary: Trigger a sync run (export -> pull -> push -> import)
      operationId: runSync
      tags: [sync]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncRunIn' }
      responses:
        '200':
          description: Run completed (possibly into conflicted/locked state)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncStatusOut' }
        '409':
          description: Sync not configured or already running
          $ref: '#/components/responses/Conflict'

  /api/v1/sync/resolve:
    post:
      summary: Resolve conflicting paths
      operationId: resolveSync
      tags: [sync]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncResolveIn' }
      responses:
        '200':
          description: Conflict resolved; resulting status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncStatusOut' }
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/sync/machines:
    get:
      summary: List every machine known to this vault (workspace registry + this machine)
      operationId: listSyncMachines
      tags: [sync]
      responses:
        '200':
          description: Machines attached to the vault
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncMachinesOut' }

  /api/v1/sync/machine:
    put:
      summary: Rename this machine (display name only; the machine id is immutable)
      operationId: renameSyncMachine
      tags: [sync]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MachineRenameIn' }
      responses:
        '200':
          description: Updated local machine entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncMachineOut' }
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/sync/overrides:
    get:
      summary: This machine's per-resource config overrides
      operationId: listSyncOverrides
      tags: [sync]
      responses:
        '200':
          description: Overrides for this machine
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OverridesOut' }

  /api/v1/sync/overrides/{kind}/{name}:
    put:
      summary: Set a per-machine merge patch for a resource
      operationId: setSyncOverride
      tags: [sync]
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OverrideIn' }
      responses:
        '200':
          description: Updated override list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OverridesOut' }
    delete:
      summary: Remove this machine's merge patch for a resource
      operationId: unsetSyncOverride
      tags: [sync]
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Updated override list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OverridesOut' }

  /api/v1/sync/key/export:
    post:
      summary: Export this machine's master key to a local file (out-of-band transfer)
      operationId: exportMasterKey
      tags: [sync]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KeyExportIn' }
      responses:
        '200':
          description: Key written to the given local path
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyOpOut' }

  /api/v1/sync/key/import:
    post:
      summary: Import a master key from a local file onto this machine
      operationId: importMasterKey
      tags: [sync]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KeyImportIn' }
      responses:
        '200':
          description: Key installed; resulting status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncStatusOut' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  responses:
    ValidationError:
      description: Invalid request body
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflicting state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    SyncConfigIn:
      type: object
      properties:
        remote: { type: string, nullable: true }
        enabled: { type: boolean }
        auto: { type: boolean }
        interval_seconds: { type: integer, minimum: 30 }
        poll_remote_seconds: { type: integer, minimum: 5, description: "Auto-sync remote-head probe cadence" }
        branch: { type: string }
    SyncConfigOut:
      type: object
      required: [enabled, auto, interval_seconds, poll_remote_seconds, branch]
      properties:
        remote: { type: string, nullable: true }
        enabled: { type: boolean }
        auto: { type: boolean }
        interval_seconds: { type: integer }
        poll_remote_seconds: { type: integer }
        branch: { type: string }
        updated_at: { type: string }
    SyncStatusOut:
      type: object
      required: [status, conflict_paths, locked_refs, quarantined_refs]
      properties:
        status:
          type: string
          enum: [unconfigured, clean, syncing, conflicted, error, credentials_locked]
        last_sync_at: { type: string, nullable: true }
        last_error: { type: string, nullable: true }
        conflict_paths:
          type: array
          items: { type: string }
        locked_refs:
          type: array
          items: { type: string }
        quarantined_refs:
          type: array
          items: { type: string }
          description: "<kind>:<name> refs whose import failed on this machine; retried each run"
    SyncRunIn:
      type: object
      properties:
        push: { type: boolean, description: "Push after a clean merge (default true)" }
        pull: { type: boolean, description: "Pull before pushing (default true)" }
    SyncResolveIn:
      type: object
      required: [strategy]
      properties:
        strategy:
          type: string
          enum: [ours, theirs, resolved]
        paths:
          type: array
          items: { type: string }
          description: "Paths to resolve; empty means all conflicting paths"
    SyncMachineOut:
      type: object
      required: [machine_id, display_name, is_local]
      properties:
        machine_id: { type: string, description: "Stable ULID minted at first daemon start" }
        display_name: { type: string }
        platform: { type: string, nullable: true }
        os_version: { type: string, nullable: true }
        coffer_version: { type: string, nullable: true }
        last_sync_at: { type: string, nullable: true }
        is_local: { type: boolean, description: "True for the machine serving this request" }
    SyncMachinesOut:
      type: object
      required: [machines]
      properties:
        machines:
          type: array
          items: { $ref: '#/components/schemas/SyncMachineOut' }
    MachineRenameIn:
      type: object
      required: [display_name]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 100 }
    OverrideIn:
      type: object
      required: [patch]
      properties:
        patch:
          type: object
          additionalProperties: true
          description: "RFC 7386 JSON Merge Patch applied over the imported config on this machine only"
    OverrideOut:
      type: object
      required: [kind, name, patch]
      properties:
        kind: { type: string }
        name: { type: string }
        patch: { type: object, additionalProperties: true }
    OverridesOut:
      type: object
      required: [overrides]
      properties:
        overrides:
          type: array
          items: { $ref: '#/components/schemas/OverrideOut' }
    KeyExportIn:
      type: object
      required: [path]
      properties:
        path: { type: string, description: "Local filesystem path to write the key to" }
    KeyImportIn:
      type: object
      required: [path]
      properties:
        path: { type: string, description: "Local filesystem path to read the key from" }
    KeyOpOut:
      type: object
      required: [path]
      properties:
        path: { type: string }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }
