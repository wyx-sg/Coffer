openapi: 3.0.3
info:
  title: Coffer — Vault Export/Import API
  version: 0.2.0
  description: >
    REST surface for vault export and import (spec 010, ADR-016). Export and
    import are a cross-cutting service, not a resource kind, so they have their
    own endpoints rather than riding /resources. All paths require the loopback
    bearer token. Both operations act on a directory path on this machine; no
    request ever carries vault content over the wire. The master key is never
    returned over the network except via the explicit, audited key-export
    endpoint that writes it to a local file path.

servers:
  - url: http://127.0.0.1:8000

security:
  - bearerAuth: []

paths:
  /api/v1/sync/export:
    post:
      summary: Export this vault into a bundle directory
      operationId: exportVault
      tags: [sync]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportIn' }
      responses:
        '200':
          description: >-
            Bundle written. Per-resource failures are reported in `failures`
            rather than failing the request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportOut' }
        '422':
          description: The path cannot hold a bundle (`SYNC_BUNDLE_INVALID`)
          $ref: '#/components/responses/ValidationError'

  /api/v1/sync/import:
    post:
      summary: Import an export bundle into this vault
      operationId: importVault
      tags: [sync]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportIn' }
      responses:
        '200':
          description: >-
            Bundle applied. The bundle wins per resource, nothing local-only is
            deleted, and per-resource failures are reported in `failures`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportOut' }
        '409':
          description: >-
            The bundle declares a schema version this build does not know
            (`SYNC_BUNDLE_TOO_NEW`); nothing was applied.
          $ref: '#/components/responses/Conflict'
        '422':
          description: Not a readable export bundle (`SYNC_BUNDLE_INVALID`)
          $ref: '#/components/responses/ValidationError'

  /api/v1/sync/key/fingerprint:
    get:
      summary: Short SHA-256 fingerprint of the master key (never the key itself)
      operationId: getKeyFingerprint
      tags: [sync]
      responses:
        '200':
          description: >-
            Whether a key exists here and its fingerprint — matching
            fingerprints on two machines mean they hold the same key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyFingerprintOut' }

  /api/v1/sync/key/export:
    post:
      summary: Export this machine's master key to a local file (out-of-band transfer)
      operationId: exportMasterKey
      tags: [sync]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KeyPathIn' }
      responses:
        '200':
          description: Key written to the given local path
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyOpOut' }
        '422':
          description: No master key on this machine (`MASTER_KEY_FILE_INVALID`)
          $ref: '#/components/responses/ValidationError'

  /api/v1/sync/key/import:
    post:
      summary: Import a master key from a local file onto this machine
      operationId: importMasterKey
      tags: [sync]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KeyPathIn' }
      responses:
        '200':
          description: Key installed; credential refs that remain locked here
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyImportOut' }
        '422':
          description: Missing file or not a valid Fernet key (`MASTER_KEY_FILE_INVALID`)
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  responses:
    ValidationError:
      description: Invalid request body
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflicting state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    AreaCountOut:
      type: object
      required: [area, count]
      properties:
        area:
          type: string
          description: "Bundle area: resources, knowledge, memory, skills, state/<area>, credentials"
        count: { type: integer }
    FailureOut:
      type: object
      required: [ref, reason]
      properties:
        ref:
          type: string
          description: "<kind>:<name>, state/<area>/<doc>, or reconcile[<kind>]"
        reason: { type: string }
    ExportIn:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: "Local directory to write the bundle into (created if absent)"
        with_credentials:
          type: boolean
          description: >-
            Include Fernet ciphertext under credentials/. Off by default; the
            master key is never written regardless.
    ExportOut:
      type: object
      required: [path, areas, failures, credentials_included]
      properties:
        path: { type: string }
        areas:
          type: array
          items: { $ref: '#/components/schemas/AreaCountOut' }
        failures:
          type: array
          items: { $ref: '#/components/schemas/FailureOut' }
        credentials_included: { type: boolean }
    ImportIn:
      type: object
      required: [path]
      properties:
        path: { type: string, description: "Local export bundle directory to apply" }
    ImportOut:
      type: object
      required: [path, areas, failures, locked_refs]
      properties:
        path: { type: string }
        areas:
          type: array
          items: { $ref: '#/components/schemas/AreaCountOut' }
        failures:
          type: array
          items: { $ref: '#/components/schemas/FailureOut' }
        locked_refs:
          type: array
          items: { type: string }
          description: >-
            Credential refs whose ciphertext cannot be decrypted here; bootstrap
            the master key with key/import to unlock them.
    KeyFingerprintOut:
      type: object
      required: [present, fingerprint]
      properties:
        present: { type: boolean }
        fingerprint:
          type: string
          nullable: true
          description: "First 12 hex chars of SHA-256(master key); null when absent"
    KeyPathIn:
      type: object
      required: [path]
      properties:
        path: { type: string, description: "Local filesystem path for the key file" }
    KeyOpOut:
      type: object
      required: [path]
      properties:
        path: { type: string }
    KeyImportOut:
      type: object
      required: [locked_refs]
      properties:
        locked_refs:
          type: array
          items: { type: string }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }
