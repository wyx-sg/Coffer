openapi: 3.0.3
info:
  title: Coffer — Transcript Distillation API
  version: 0.1.0
  description: |
    REST surface for transcript distillation (Spec 007 extension — ADR-020).

    Reads a registered coding-agent's local chat transcripts, distils durable
    insights via an LLM, and writes those insights as project-scoped Coffer
    memory facts. Only natural-language conversation text reaches the LLM; tool
    payloads and secrets are scrubbed before distillation and never persisted.

    All routes are loopback-only and require the daemon's auth token in the
    `X-Coffer-Token` header. All error responses use the app-wide envelope
    `{ "error": { code, message, details } }`.

servers:
  - url: http://127.0.0.1:8000
    description: Local daemon (default port; actual port read from daemon.json)

security:
  - cofferToken: []

paths:
  /api/v1/agents/{name}/transcripts:
    parameters:
      - $ref: "#/components/parameters/AgentName"
    get:
      summary: List transcript sessions for an agent
      description: |
        Returns one page of sessions plus the matched total. Supports
        server-side search (title or project path), filtering (exact project
        path; started_at time range), and sorting (started_at or
        last_activity_at, asc/desc). Backed by an in-process mtime-aware cache,
        so listing an agent with thousands of past sessions stays responsive.
      operationId: listTranscripts
      tags: [transcripts]
      parameters:
        - in: query
          name: limit
          required: false
          description: Max sessions to return in this page.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - in: query
          name: offset
          required: false
          description: Number of (sorted) sessions to skip before this page.
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: q
          required: false
          description: Case-insensitive substring matched against title or project path.
          schema:
            type: string
        - in: query
          name: project
          required: false
          description: Filter to sessions whose project_path equals this value exactly.
          schema:
            type: string
        - in: query
          name: started_after
          required: false
          description: Keep only sessions whose started_at is at or after this instant.
          schema:
            type: string
            format: date-time
        - in: query
          name: started_before
          required: false
          description: Keep only sessions whose started_at is at or before this instant.
          schema:
            type: string
            format: date-time
        - in: query
          name: sort
          required: false
          description: Sort key.
          schema:
            type: string
            enum: [started_at, last_activity_at, message_count]
            default: last_activity_at
        - in: query
          name: order
          required: false
          description: Sort direction.
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptSessionListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/agents/{name}/transcripts/distill:
    parameters:
      - $ref: "#/components/parameters/AgentName"
    post:
      summary: Distil a transcript session into Coffer memory facts
      operationId: distillTranscript
      tags: [transcripts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DistillRequest"
      responses:
        "200":
          description: OK — insights extracted (and facts written unless dry_run)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DistillResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/agents/{name}/session-context:
    parameters:
      - $ref: "#/components/parameters/AgentName"
    get:
      summary: SessionStart rules bundle for an agent (slice 6, FR-049/FR-050)
      operationId: getAgentSessionContext
      tags: [session-hooks]
      description: |
        Returns the context-only rules bundle the agent's SessionStart hook
        injects as `additionalContext` — global rules (always) plus the current
        project's rules (when `cwd` resolves to a git project, project rules
        first), followed by the two Coffer-seeded built-in rules (call
        `coffer__resume()` to continue prior work; prefer
        `coffer__remember`/`coffer__recall` over native memory). The seeded
        rules are present even when the rules lanes are empty; the handoff body
        is NOT injected (pull-on-demand via `coffer__resume`). NEVER a native
        file write (ADR-026). When `cwd` is outside a git project the bundle
        carries the global + seeded rules only. Read-only; emits no audit event.
      parameters:
        - in: query
          name: cwd
          required: false
          description: |
            The session's launch working directory (from the hook stdin). Used
            to resolve the current project's rules; omitted/non-git → global +
            seeded rules only.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionContextResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/agents/{name}/sessions/{session_id}/end:
    parameters:
      - $ref: "#/components/parameters/AgentName"
      - in: path
        name: session_id
        required: true
        description: The just-closed session's id (from the SessionEnd hook stdin).
        schema:
          type: string
    post:
      summary: SessionEnd distil of a just-closed session (slice 6, FR-051)
      operationId: endAgentSession
      tags: [session-hooks]
      description: |
        Distils the just-closed session into the project journal lane,
        immediately lowering memory-capture latency. Reuses the FR-045 distill
        path and the FR-046 `distilled_sessions` idempotency ledger
        (`is_distilled? → distill → mark_distilled`) so a session is never
        double-distilled. A clean no-op (still 202/200) when the session was
        already distilled, no internal model is configured, or `cwd` is not a
        git project. Installed for Claude Code only — Codex has no session-end
        event and degrades to the FR-046 catch-up sweep.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionEndRequest"
      responses:
        "202":
          description: Accepted — distill enqueued (or a no-op as described).
        "200":
          description: OK — distilled synchronously (or a no-op as described).
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    cofferToken:
      type: apiKey
      in: header
      name: X-Coffer-Token

  parameters:
    AgentName:
      in: path
      name: name
      required: true
      description: Registered agent name (slug; e.g. "claude-code").
      schema:
        type: string

  responses:
    BadRequest:
      description: Validation failed or unsupported agent type
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Agent or transcript session not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: |
        Conflict — e.g. no model configured (NO_MODEL_CONFIGURED).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    TranscriptSessionSummary:
      type: object
      required: [session_id, message_count, source_path]
      properties:
        session_id:
          type: string
          description: Unique session identifier derived from the transcript file.
        title:
          type: string
          nullable: true
          description: |
            Human-readable session title — the agent's own title (Claude Code
            ai-title) when present, else the first real user message, truncated.
            Null when none can be derived.
        project_path:
          type: string
          nullable: true
          description: Absolute path to the project the session was recorded in.
        message_count:
          type: integer
          description: Number of conversation turns parsed from the transcript.
        started_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the first event in the session, if available.
        last_activity_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the last event in the session, if available.
        source_path:
          type: string
          description: Absolute path to the session's .jsonl file (powers reveal-in-file-manager).

    TranscriptSessionListResponse:
      type: object
      required: [sessions, total, limit, offset]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptSessionSummary"
          description: One page of sessions, most-recent first.
        total:
          type: integer
          description: Total number of sessions on disk for the agent.
        limit:
          type: integer
          description: Echo of the applied page size.
        offset:
          type: integer
          description: Echo of the applied page offset.

    DistillRequest:
      type: object
      properties:
        session_id:
          type: string
          nullable: true
          description: |
            Distil a specific session by id. Mutually exclusive with
            project_path; at least one must be provided.
        project_path:
          type: string
          nullable: true
          description: |
            Distil the most-recent session for this project path.
        dry_run:
          type: boolean
          default: false
          description: |
            If true, return insights without writing journal entries.
            journal_entries will be an empty array.

    InsightOut:
      type: object
      required: [name, description, body]
      properties:
        name:
          type: string
          description: Short title for the insight.
        description:
          type: string
          description: One-line summary.
        body:
          type: string
          description: Full markdown body of the distilled insight.

    DistillResponse:
      type: object
      required: [insights, journal_entries]
      properties:
        insights:
          type: array
          items:
            $ref: "#/components/schemas/InsightOut"
          description: Distilled insights extracted from the transcript.
        journal_entries:
          type: array
          items:
            type: string
          description: |
            Markers (entry timestamps) of the journal entries written, one per
            insight. Empty when dry_run=true, when no insights were extracted, or
            when the session's path does not resolve to a git project (there is
            no global journal).

    SessionContextResponse:
      type: object
      required: [additional_context]
      properties:
        additional_context:
          type: string
          description: |
            The rules bundle the SessionStart hook injects as `additionalContext`
            (context only, never a file write). Project rules then global rules,
            followed by the two seeded built-in rules. Always non-empty (the
            seeded rules are present even when the rules lanes are empty).

    SessionEndRequest:
      type: object
      properties:
        cwd:
          type: string
          nullable: true
          description: |
            The session's launch working directory (from the SessionEnd hook
            stdin). Optional — when omitted (or outside a git project) the call
            is a tolerated no-op. Resolves the project journal to distil into.

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              description: |
                Machine-readable error code. Distillation-specific codes:
                UNSUPPORTED_AGENT_TYPE, TRANSCRIPT_SESSION_NOT_FOUND,
                NO_MODEL_CONFIGURED. Generic: RESOURCE_NOT_FOUND, BAD_REQUEST.
            message:
              type: string
              description: Human-readable error description.
            details:
              type: object
              additionalProperties: true
              description: Optional machine-readable details (e.g. reason).
