openapi: 3.0.3
info:
  title: Coffer — Memory API
  version: 0.1.0
  description: REST surface for the `memory` resource kind. Spec 007.

servers:
  - url: http://127.0.0.1:8000

security:
  - bearerAuth: []

paths:
  /api/v1/memory_stores:
    post:
      summary: Create a new memory store
      operationId: createMemoryStore
      tags: [memory_stores]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryStoreCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryStoreOut"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/AlreadyExists"

    get:
      summary: List memory stores
      operationId: listMemoryStores
      tags: [memory_stores]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryStoreListOut"

  /api/v1/memory_stores/{name}:
    parameters:
      - $ref: "#/components/parameters/StoreName"
    get:
      summary: Get one memory store
      operationId: getMemoryStore
      tags: [memory_stores]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryStoreOut"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/memory_stores/{name}/metrics:
    parameters:
      - $ref: "#/components/parameters/StoreName"
    get:
      summary: Memory store metrics
      operationId: getMemoryStoreMetrics
      tags: [memory_stores]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryStoreMetrics"

  /api/v1/memory_stores/{name}/memories:
    parameters:
      - $ref: "#/components/parameters/StoreName"

    post:
      summary: Add a memory
      operationId: addMemory
      tags: [memory_stores]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryOut"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: LLM not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorOut"

    get:
      summary: List memories
      operationId: listMemories
      tags: [memory_stores]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryListOut"

  /api/v1/memory_stores/{name}/memories/{memory_id}:
    parameters:
      - $ref: "#/components/parameters/StoreName"
      - in: path
        name: memory_id
        required: true
        schema: { type: string }

    get:
      summary: Get a memory
      operationId: getMemory
      tags: [memory_stores]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryOut"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      summary: Edit a memory's text
      operationId: updateMemory
      tags: [memory_stores]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryOut"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      summary: Delete a memory
      operationId: deleteMemory
      tags: [memory_stores]
      responses:
        "204":
          description: No Content
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/memory_stores/{name}/memories/clear:
    parameters:
      - $ref: "#/components/parameters/StoreName"
    post:
      summary: Clear every memory in the store
      operationId: clearMemories
      tags: [memory_stores]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [cleared]
                properties:
                  cleared: { type: integer }

  /api/v1/memory_stores/{name}/search:
    parameters:
      - $ref: "#/components/parameters/StoreName"
    post:
      summary: Search memories
      operationId: searchMemories
      tags: [memory_stores]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    StoreName:
      in: path
      name: name
      required: true
      schema: { type: string }

  responses:
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorOut"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorOut"
    AlreadyExists:
      description: Resource with the same name already exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorOut"

  schemas:
    MemoryStoreCreate:
      type: object
      required: [name, config]
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        config:
          $ref: "#/components/schemas/MemoryStoreConfig"

    MemoryStoreConfig:
      type: object
      required: [embedding_model, llm_provider]
      properties:
        embedding_model:
          type: string
          example: BAAI/bge-small-en-v1.5
        llm_provider:
          type: string
          enum: [none, ollama, openai]
        llm_model:
          type: string
          nullable: true
        llm_endpoint:
          type: string
          nullable: true
        llm_credential_ref:
          type: string
          nullable: true
        max_memory_chars:
          type: integer
          minimum: 64
          maximum: 32768
          default: 8192

    MemoryStoreOut:
      type: object
      required: [ref, name, kind, config, enabled, created_at, updated_at]
      properties:
        ref: { type: string }
        kind: { type: string, example: memory }
        name: { type: string }
        description: { type: string, nullable: true }
        config:
          $ref: "#/components/schemas/MemoryStoreConfig"
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    MemoryStoreListOut:
      type: object
      required: [memory_stores]
      properties:
        memory_stores:
          type: array
          items:
            $ref: "#/components/schemas/MemoryStoreOut"

    MemoryStoreMetrics:
      type: object
      required: [memory_count, disk_bytes]
      properties:
        memory_count: { type: integer }
        disk_bytes: { type: integer }

    MemoryCreate:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 32768 }

    MemoryUpdate:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 32768 }

    MemoryOut:
      type: object
      required: [id, store_name, text, actor, created_at, updated_at]
      properties:
        id: { type: string }
        store_name: { type: string }
        text: { type: string }
        actor: { type: string, enum: [agent, user] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    MemoryListOut:
      type: object
      required: [memories, total]
      properties:
        memories:
          type: array
          items:
            $ref: "#/components/schemas/MemoryOut"
        total: { type: integer }

    SearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string, minLength: 1, maxLength: 4096 }
        top_k:
          type: integer
          minimum: 1
          maximum: 20
          default: 5

    SearchHit:
      type: object
      required: [id, text, score, created_at]
      properties:
        id: { type: string }
        text: { type: string }
        score: { type: number, format: float }
        created_at: { type: string, format: date-time }

    SearchResponse:
      type: object
      required: [hits]
      properties:
        hits:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"

    ErrorOut:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
        detail: { type: object, additionalProperties: true }
