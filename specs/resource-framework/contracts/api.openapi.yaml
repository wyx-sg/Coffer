openapi: 3.1.0
info:
  title: Coffer Resource Framework API
  version: "0.1.0"
  description: |
    The kind-agnostic half of Coffer's management plane: the resource
    lifecycle every kind is managed through, per-agent reach, the audit log,
    per-table retention, and the cross-kind read of the passes in flight.

    A kind's own operations live in that kind's contract — the MCP-server
    routes under `/resources/mcp_server/*`, for one, are spec mcp-gateway's.

    Authentication: every request must carry `X-Coffer-Token` (a per-daemon
    random token written to `~/.coffer/daemon.json`; the token itself is spec
    daemon's).
  contact:
    name: Coffer
    url: https://github.com/wyx-sg/Coffer

servers:
  - url: http://127.0.0.1:{port}/api/v1
    description: Local daemon
    variables:
      port:
        default: "8000"
        description: >-
          Port from `~/.coffer/daemon.json`. The daemon binds exactly one
          port and refuses to start rather than moving; the daemon's own
          lifecycle, discovery file and token are spec daemon's.

security:
  - cofferToken: []

# Every mutating endpoint accepts an optional `X-Coffer-Actor` request header
# (values: cli, api, ui, system). The audit log records the supplied value so
# downstream tooling can attribute actions back to the originating surface.
# Absent header defaults to "api". Documented once here rather than repeated
# on every operation.

tags:
  - name: resources
    description: Kind-agnostic resource lifecycle
  - name: audit
    description: Audit log query
  - name: retention
    description: Retention policy management
  - name: upkeep
    description: The long, model-driven passes this daemon is running right now

paths:
  /resources:
    get:
      tags: [resources]
      operationId: listResources
      summary: List resources
      parameters:
        - in: query
          name: kind
          required: false
          schema: { type: string, example: mcp_server }
        - in: query
          name: name
          required: false
          description: >-
            Filter by exact label. The ONE place a name may be used to find a
            resource: it is how a surface that started from what a human typed
            — the CLI — turns that into the uid every other route takes.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceListOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [resources]
      operationId: registerResource
      summary: Register a new resource
      description: |
        Only a kind that declares itself creatable through the kind-agnostic
        route is accepted here. A kind owning a creation invariant beyond
        config validation — a skill's master folder, an agent's on-disk
        detection — is registered through its own surface instead, which is
        the only place that invariant can be held.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResourceCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceOut" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /resources/{uid}:
    parameters:
      - in: path
        name: uid
        required: true
        description: The resource's immutable identity.
        schema: { type: string }
    get:
      tags: [resources]
      operationId: getResource
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [resources]
      operationId: updateResource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResourceUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceOut" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [resources]
      operationId: deleteResource
      responses:
        "204": { description: No Content }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /resources/{uid}/enable:
    parameters:
      - in: path
        name: uid
        required: true
        description: The resource's immutable identity.
        schema: { type: string }
    post:
      tags: [resources]
      operationId: enableResource
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /resources/{uid}/disable:
    parameters:
      - in: path
        name: uid
        required: true
        description: The resource's immutable identity.
        schema: { type: string }
    post:
      tags: [resources]
      operationId: disableResource
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /resources/{uid}/scope:
    parameters:
      - in: path
        name: uid
        required: true
        description: The resource's immutable identity.
        schema: { type: string }
    get:
      tags: [resources]
      operationId: getResourceScope
      summary: Read a resource's per-agent activation scope
      description: |
        The framework-level reach of one resource
        ([Per-Agent Resource Scope](../../docs/decisions/per-agent-resource-scope.md)),
        served for EVERY kind by the kind-agnostic route rather than per kind.
        `supports_scope` says whether this kind takes a scope at all — false
        makes any non-null write a 422 — so a client can render the two-choice
        Disabled/Enabled panel instead of the agent list without knowing the
        kinds itself.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceScopeOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [resources]
      operationId: updateResourceScope
      summary: Set a resource's per-agent activation scope
      description: |
        `scope: null` clears back to unscoped — active for every agent. A list
        restricts to exactly those agents, and an empty list matches nothing,
        so `{"agents": []}` is dormant. Deliberately NOT gated on the kind's
        creation invariants: scope is orthogonal to them. A kind that declares
        no scope rejects any non-null payload with 422, and so does an unknown
        property — a client still sending the withdrawn `machines` axis would
        otherwise have its restriction silently widened to "every agent".
        Writing scope emits `resource_scope_updated` and fires the kind's
        post-write reaction, so delivery and reclaim stay in step with the edit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResourceScopeUpdate" }
      responses:
        "200":
          description: OK — the resource as it now stands, scope included
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /audit:
    get:
      tags: [audit]
      operationId: listAuditEntries
      parameters:
        - in: query
          name: kind
          schema: { type: string }
        - in: query
          name: resource_uid
          description: >-
            One resource's whole trail, including rows written while it carried
            a different name. Filtering by name was removed with the identity
            change: a label cannot tell a renamed resource from a deleted one
            whose name was later reused.
          schema: { type: string }
        - in: query
          name: event_type
          schema: { type: string }
        - in: query
          name: since
          schema: { type: string, format: date-time }
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 500 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditListOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /retention/policies:
    get:
      tags: [retention]
      operationId: listRetentionPolicies
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetentionPolicyListOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /retention/policies/{table_name}:
    parameters:
      - in: path
        name: table_name
        required: true
        schema: { type: string }
    patch:
      tags: [retention]
      operationId: updateRetentionPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RetentionPolicyUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetentionPolicyOut" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /retention/prune:
    post:
      tags: [retention]
      operationId: pruneRetention
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                table_name:
                  type: string
                  description: When omitted, prunes every registered table.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PruneResultOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /upkeep/runs:
    get:
      tags: [upkeep]
      operationId: listUpkeepRuns
      summary: What this daemon is rewriting right now
      description: |
        Every *upkeep pass* in flight: memory's `distil` over a partition,
        knowledge's `curate` over a collection. Both take minutes, both rewrite
        files with a model in the loop, and both can be started from a button,
        the CLI or a timer — so whether one is running is a fact about the
        daemon, not about whichever surface started it.

        One route answers for every kind rather than each kind growing its own
        near-identical "is my pass running?" endpoint, because the fact is one
        table (`coffer.application.upkeep_runs`), and it belongs beside this
        contract's other cross-kind reads for the same reason. A caller asking
        about one partition or collection filters the list; a target not named
        here has no pass running.

        The registry is **per-process by design**: there is no queue, no row
        and no lease, so a daemon restart ends any pass it was running and this
        list comes back empty. That is the truth, not a lost record.

        Starting a pass is the kind's own route
        (`POST /memory/partitions/{uid}/distil`,
        `POST /knowledge/collections/{uid}/curate`); each refuses a second
        concurrent pass over the same target with `UPKEEP_ALREADY_RUNNING`.
        Whether a pass runs on a timer at all is spec internal-engine's.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpkeepRunListOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    cofferToken:
      type: apiKey
      in: header
      name: X-Coffer-Token

  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: Duplicate resource
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    UnprocessableEntity:
      description: Validation error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: RESOURCE_NOT_FOUND
            message:
              type: string
              example: "resource not found: mcp_server:filesystem"
            details:
              type: object
              additionalProperties: true

    ScopeOut:
      type: object
      description: >-
        Which agents a resource is active for, on THIS machine. null means every
        agent; [] matches nothing, i.e. dormant. Scope is machine-local — it is
        set on the machine it applies to and is never synced to the others.
        Unknown properties are rejected (422) rather than ignored: a client
        still sending the withdrawn `machines` axis means "only there", and
        silently keeping what is left would store "every agent" — widening the
        restriction the request was written to make.
      required: [agents]
      additionalProperties: false
      properties:
        agents:
          type: array
          description: >-
            Agent resource UIDS, not names. A scope is a reference to another
            resource and a name is a label its owner may change; while this
            held names, renaming an agent silently emptied every scope naming
            it.
          items: { type: string }
          nullable: true
          example: [9f2c1a7b4e8d4c1fa0b3d5e6f7081920]
      nullable: true

    ResourceScopeOut:
      type: object
      description: >-
        GET .../scope — the resource's current scope plus whether its kind
        supports one. Field names MUST match `ResourceScopeOut` in
        `backend/coffer/surfaces/http/schemas.py`; the frontend's scope module
        is hand-written, so nothing checks this at compile time.
      properties:
        scope:
          $ref: "#/components/schemas/ScopeOut"
        supports_scope:
          type: boolean
          description: >-
            False means this kind has no scope at all and any non-null write is
            a 422 (`agent` is the only such kind today).
      required: [supports_scope]

    ResourceScopeUpdate:
      type: object
      description: >-
        PUT .../scope body. `scope: null` clears back to unscoped — every agent.
      properties:
        scope:
          $ref: "#/components/schemas/ScopeOut"

    ResourceOut:
      type: object
      required: [uid, kind, name, config, enabled, created_at, updated_at]
      properties:
        uid:
          type: string
          description: >-
            The resource's identity: immutable, opaque, and the same value on
            every machine holding it. Every route that addresses a resource
            takes this.
          example: 9f2c1a7b4e8d4c1fa0b3d5e6f7081920
        kind: { type: string }
        name:
          type: string
          description: A mutable label, unique within its kind. Editable through PATCH.
        description:
          type: string
          nullable: true
        config:
          type: object
          additionalProperties: true
        # Framework-level activation scope: ONE allow-list of agents. null =
        # unscoped (active for every agent); [] matches nothing, i.e. dormant.
        # The machine axis was withdrawn — reach does not travel. Carried on
        # the list payload so a list view can render the reach control without
        # one GET per row.
        scope:
          $ref: "#/components/schemas/ScopeOut"
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ResourceListOut:
      type: object
      required: [resources]
      properties:
        resources:
          type: array
          items: { $ref: "#/components/schemas/ResourceOut" }

    ResourceCreate:
      type: object
      required: [kind, name, config]
      properties:
        kind: { type: string }
        name:
          {
            type: string,
            minLength: 1,
            maxLength: 64,
            pattern: "^[a-zA-Z0-9_.-]+$",
          }
        description:
          type: string
          nullable: true
        config:
          type: object
          additionalProperties: true

    ResourceUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[a-zA-Z0-9_.\\-]+$"
          description: >-
            Renaming is a field, not an operation — the same level as editing a
            description, for every kind. Absent leaves the label alone; a label
            another resource of this kind already holds answers 409.
        description:
          type: string
          nullable: true
        config:
          type: object
          additionalProperties: true

    AuditEntryOut:
      type: object
      required: [id, timestamp, event_type, actor]
      properties:
        id: { type: integer }
        timestamp: { type: string, format: date-time }
        event_type: { type: string }
        resource_kind:
          type: string
          nullable: true
        resource_name:
          type: string
          nullable: true
        actor: { type: string, enum: [cli, api, ui, system] }
        details:
          type: object
          additionalProperties: true
          nullable: true

    AuditListOut:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/AuditEntryOut" }

    RetentionPolicyOut:
      type: object
      required:
        [
          table_name,
          display_name,
          description,
          default_retention_days,
          retention_days,
          last_pruned_rows,
        ]
      properties:
        table_name: { type: string }
        display_name: { type: string }
        description: { type: string }
        default_retention_days:
          type: integer
          nullable: true
        retention_days:
          type: integer
          nullable: true
          description: "Null means keep forever; positive integer is the day count."
        last_pruned_at:
          type: string
          format: date-time
          nullable: true
        last_pruned_rows: { type: integer }

    RetentionPolicyListOut:
      type: object
      required: [policies]
      properties:
        policies:
          type: array
          items: { $ref: "#/components/schemas/RetentionPolicyOut" }

    RetentionPolicyUpdate:
      type: object
      properties:
        retention_days:
          type: integer
          nullable: true
          minimum: 1
          maximum: 3650
          description: "Set to null to keep forever; 1..3650 days otherwise."

    PruneResultOut:
      type: object
      required: [tables]
      properties:
        tables:
          type: object
          additionalProperties: { type: integer }
          example: { audit_log: 0, mcp_invocations: 1247 }

    UpkeepRunOut:
      type: object
      required: [kind, name, started_at]
      properties:
        kind:
          type: string
          description: "The kind whose pass this is: `memory` or `knowledge`."
          example: memory
        name:
          type: string
          description: The partition or collection being rewritten.
          example: coffer
        started_at:
          type: string
          format: date-time
          description: When this daemon started the pass.

    UpkeepRunListOut:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          description: Every pass in flight, oldest first. Empty means nothing is running.
          items: { $ref: "#/components/schemas/UpkeepRunOut" }
