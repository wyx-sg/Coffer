openapi: 3.0.3
info:
  title: Coffer — Knowledge Base API (redesign)
  version: 0.2.0
  description: |
    REST surface for the `knowledge_base` resource kind — the KB face of the
    shared knowledge substrate (spec 006, redesign). Uploads of ANY format are
    converted to Markdown on disk (the source of truth); SQLite (documents /
    chunks / FTS5 / sqlite-vec) is a rebuildable index. Retrieval has three
    modes: `grep`, `keyword`, `vector`. The KB is user-curated; agents read it
    read-only over the MCP gateway.

    All routes are loopback-only and require the daemon's auth token in the
    `X-Coffer-Token` header (token from `~/.coffer/daemon.json`). Errors use
    the app-wide envelope `{ "error": { "code", "message", "details" } }`.

servers:
  - url: http://127.0.0.1:8000
    description: Local daemon (default port; actual port read from daemon.json)

security:
  - cofferToken: []

paths:
  /api/v1/knowledge_bases:
    post:
      summary: Create a knowledge base
      description: |
        Convenience endpoint equivalent to `POST /api/v1/resources` with
        kind="knowledge_base". Returns the created Resource as a `KnowledgeBaseOut`.
      operationId: createKnowledgeBase
      tags: [knowledge_bases]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeBaseCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBaseOut"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/AlreadyExists"

    get:
      summary: List knowledge bases
      operationId: listKnowledgeBases
      tags: [knowledge_bases]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBaseListOut"

  /api/v1/knowledge_bases/{name}:
    parameters:
      - $ref: "#/components/parameters/KBName"
    get:
      summary: Get one knowledge base
      operationId: getKnowledgeBase
      tags: [knowledge_bases]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBaseOut"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/knowledge_bases/{name}/documents:
    parameters:
      - $ref: "#/components/parameters/KBName"

    post:
      summary: Upload and ingest a document (any format → Markdown)
      description: |
        Streams the uploaded bytes, detects format, converts to Markdown via the
        MarkdownConverter registry, cleans, writes `docs/<doc-id>.md` (truth) and
        `raw/<doc-id>.<ext>` (provenance), and indexes into FTS5 (and sqlite-vec
        if vector is enabled). A new document gets a fresh ULID id with
        `source_mode=converted`. A re-upload is matched to an existing document by
        `original_filename`: byte-identical content is an idempotent no-op; changed
        content under the same filename updates the SAME document in place (reuse
        the id, overwrite `docs/`+`raw/`) when `replace=true`, otherwise it is
        rejected (`409` duplicate). Refused with `DOCUMENT_LOCKED` (409) when the
        matched document is locked.
      operationId: ingestDocument
      tags: [knowledge_bases]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                replace:
                  type: boolean
                  default: false
                  description: If true, a changed re-upload of a filename already in the KB updates that document in place. Byte-identical re-uploads are a no-op regardless.
                project_id:
                  type: string
                  description: Scope for the document (FR-022). Omit or pass the WORKSPACE_GLOBAL sentinel for global; pass a project ULID for a per-project document. Re-upload matching is scoped to (kb, project_id).
      responses:
        "201":
          description: Document ingested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentOut"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Duplicate source hash without replace=true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: File exceeds max_document_bytes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: Unsupported type, or empty after conversion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Converter engine unavailable for this format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

    get:
      summary: List documents in a knowledge base
      operationId: listDocuments
      tags: [knowledge_bases]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: project_id
          required: false
          schema: { type: string }
          description: Filter to one scope (FR-022). Omit for all scopes; pass the WORKSPACE_GLOBAL sentinel for global-only or a project ULID for that project.
        - in: query
          name: deleted
          required: false
          schema: { type: boolean, default: false }
          description: When true, return the trash (soft-deleted documents) instead of live documents (FR-023).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentListOut"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/knowledge_bases/{name}/documents/{document_id}:
    parameters:
      - $ref: "#/components/parameters/KBName"
      - $ref: "#/components/parameters/DocumentId"

    get:
      summary: Get a document's Markdown body and frontmatter
      operationId: getDocument
      tags: [knowledge_bases]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentDetailOut"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      summary: Edit a document's Markdown (sets source_mode=edited, reindexes)
      description: |
        Replaces the Markdown body. The document's `source_mode` becomes `edited`,
        which blocks future re-conversion from the raw original until a new source
        is uploaded. Runs the single idempotent re-index routine (no-op if the
        content hash is unchanged). Refused with `DOCUMENT_LOCKED` (409) when the
        document is locked (FR-021).
      operationId: editDocument
      tags: [knowledge_bases]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentEditRequest"
      responses:
        "200":
          description: Edited and reindexed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentOut"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/DocumentLocked"

    patch:
      summary: Lock or unlock a document
      description: |
        Sets the document's `locked` flag. While locked, every mutation (edit,
        reconvert, re-upload replace, delete) is refused with `DOCUMENT_LOCKED`
        (409) for human and agent callers alike (FR-021). Locking/unlocking is
        always permitted and is audited (`KB_DOCUMENT_LOCKED` / `_UNLOCKED`).
      operationId: setDocumentLock
      tags: [knowledge_bases]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentLockRequest"
      responses:
        "200":
          description: Lock state updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentOut"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      summary: Delete a document (soft-delete a live one; purge a trashed one)
      description: |
        Deleting a LIVE document is a recoverable soft-delete: its `docs/<id>.md`
        and index rows are removed but `raw/<id>.<ext>` and the row are kept with
        `deleted_at` set, and it leaves all live reads (FR-023). Deleting an
        ALREADY-TRASHED document purges it permanently (removes `raw/` + the row).
        Refused with `DOCUMENT_LOCKED` (409) when the document is locked.
      operationId: deleteDocument
      tags: [knowledge_bases]
      responses:
        "204":
          description: No Content
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/DocumentLocked"

  /api/v1/knowledge_bases/{name}/documents/{document_id}/restore:
    parameters:
      - $ref: "#/components/parameters/KBName"
      - $ref: "#/components/parameters/DocumentId"

    post:
      summary: Restore a trashed document
      description: |
        Re-converts a soft-deleted document from its kept `raw/` original,
        regenerates `docs/<id>.md`, re-indexes it, and clears `deleted_at`
        (`source_mode` resets to `converted`). Audited `KB_DOCUMENT_RESTORED`.
        Refused with `DOCUMENT_LOCKED` (409) when locked; `404` when the document
        is not in the trash (FR-023).
      operationId: restoreDocument
      tags: [knowledge_bases]
      responses:
        "200":
          description: Restored and reindexed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentOut"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/DocumentLocked"

  /api/v1/knowledge_bases/{name}/documents/{document_id}/reconvert:
    parameters:
      - $ref: "#/components/parameters/KBName"
      - $ref: "#/components/parameters/DocumentId"
    post:
      summary: Re-run conversion of a document from its stored raw source
      description: |
        Re-converts the document from the original raw upload in `raw/`,
        regenerating the Markdown and reindexing. Refused with
        `RECONVERSION_BLOCKED` (409) when the document's `source_mode` is
        `edited`, so hand edits are never clobbered — upload a new source file to
        reset `source_mode` to `converted` first. Also refused with
        `DOCUMENT_LOCKED` (409) when the document is locked (FR-021).
      operationId: reconvertDocument
      tags: [knowledge_bases]
      responses:
        "200":
          description: Re-converted and reindexed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentOut"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ReconversionBlocked"
        "503":
          description: Converter engine unavailable for this format (`ENGINE_UNAVAILABLE`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/knowledge_bases/{name}/reindex:
    parameters:
      - $ref: "#/components/parameters/KBName"
    post:
      summary: Rescan files and rebuild the index from disk
      description: |
        Rescans `docs/` for deltas and runs the single re-index routine per file,
        reconstructing all SQLite index state from the Markdown files. Re-embeds
        if vector is enabled.
      operationId: reindexKnowledgeBase
      tags: [knowledge_bases]
      responses:
        "200":
          description: Reindex complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReindexResult"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/knowledge_bases/{name}/search:
    parameters:
      - $ref: "#/components/parameters/KBName"
    post:
      summary: Search a knowledge base (keyword / vector)
      description: |
        Relevance search. `mode` defaults to the KB's `default_mode`. A `vector`
        request on a KB with no embedding configured falls back to `keyword`,
        flagged in the response (`fallback`) — never an error. Any other
        explicit `mode` the KB cannot serve — `grep` (which has its own
        endpoint) or a mode not in `enabled_modes` — is rejected with 400
        `SEARCH_MODE_INVALID`, never silently rewritten.
      operationId: searchKnowledgeBase
      tags: [knowledge_bases]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Index engine unavailable (`ENGINE_UNAVAILABLE`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/knowledge_bases/{name}/grep:
    parameters:
      - $ref: "#/components/parameters/KBName"
    post:
      summary: Grep (ripgrep) over the Markdown files
      description: |
        Exact / regex match over `docs/*.md`. No index, no embedding. Bounded by
        `max_matches` and a server-side timeout.
      operationId: grepKnowledgeBase
      tags: [knowledge_bases]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrepRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrepResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: ripgrep binary unavailable (`ENGINE_UNAVAILABLE`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/knowledge_bases/{name}/metrics:
    parameters:
      - $ref: "#/components/parameters/KBName"
    get:
      summary: KB counts, indexed modes, and on-disk size
      operationId: getKnowledgeBaseMetrics
      tags: [knowledge_bases]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBaseMetrics"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/embedding/test:
    post:
      summary: Probe an embedding provider (reports the returned vector dimension)
      operationId: testEmbedding
      tags: [embedding]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, model]
              properties:
                provider: { type: string }
                model: { type: string }
                base_url: { type: string, nullable: true }
                credential_ref: { type: string, nullable: true }
      responses:
        "200":
          description: Result (ok + dimension on success), nothing persisted
          content:
            application/json:
              schema:
                type: object
                required: [ok, message]
                properties:
                  ok: { type: boolean }
                  message: { type: string }
                  detail: { type: object, additionalProperties: true }

components:
  securitySchemes:
    cofferToken:
      type: apiKey
      in: header
      name: X-Coffer-Token

  parameters:
    KBName:
      in: path
      name: name
      required: true
      schema: { type: string }
    DocumentId:
      in: path
      name: document_id
      required: true
      schema: { type: string }

  responses:
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Resource or document not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    AlreadyExists:
      description: A knowledge base with the same name already exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ReconversionBlocked:
      description: Document source_mode is 'edited'; re-conversion is refused
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    DocumentLocked:
      description: The document is locked (`DOCUMENT_LOCKED`); the mutation is refused until it is unlocked
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    RetrievalMode:
      type: string
      enum: [grep, keyword, vector]

    EmbeddingConfig:
      type: object
      required: [provider, model, dimensions]
      properties:
        provider:
          type: string
          description: openai | openrouter | voyage | jina | gemini | azure | dashscope | ollama | lmstudio | local
          example: local
        model:
          type: string
          example: bge-m3
        base_url:
          type: string
          nullable: true
          description: OpenAI-compatible endpoint; null for the provider default; ignored for `local`.
        credential_ref:
          type: string
          nullable: true
          description: Keychain reference (never plaintext); null for `local` / keyless endpoints.
        dimensions:
          type: integer
          minimum: 1
          example: 1024

    KnowledgeBaseConfig:
      type: object
      properties:
        enabled_modes:
          type: array
          items:
            $ref: "#/components/schemas/RetrievalMode"
          default: [keyword, grep]
        default_mode:
          allOf:
            - $ref: "#/components/schemas/RetrievalMode"
          default: keyword
        chunk_size:
          type: integer
          minimum: 64
          maximum: 2048
          default: 512
        chunk_overlap:
          type: integer
          minimum: 0
          maximum: 1024
          default: 64
        max_document_bytes:
          type: integer
          minimum: 1024
          maximum: 104857600
          default: 26214400
        embedding:
          allOf:
            - $ref: "#/components/schemas/EmbeddingConfig"
          nullable: true
          description: Required only when `vector` is in enabled_modes.

    KnowledgeBaseCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        config:
          $ref: "#/components/schemas/KnowledgeBaseConfig"

    KnowledgeBaseOut:
      type: object
      required: [ref, name, kind, config, enabled, created_at, updated_at]
      properties:
        ref: { type: string, example: "knowledge_base:design-notes" }
        kind: { type: string, example: knowledge_base }
        name: { type: string }
        description: { type: string, nullable: true }
        config:
          $ref: "#/components/schemas/KnowledgeBaseConfig"
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    KnowledgeBaseListOut:
      type: object
      required: [knowledge_bases]
      properties:
        knowledge_bases:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeBaseOut"

    DocumentOut:
      type: object
      required:
        [
          id,
          kind,
          resource_name,
          title,
          source_mode,
          content_sha256,
          locked,
          project_id,
          metadata,
          path,
          folder_path,
          created_at,
          updated_at,
        ]
      properties:
        id:
          {
            type: string,
            description: Stable ULID minted at first ingest (decoupled from content; the source sha256 is provenance,
            in metadata),
          }
        kind: { type: string, example: knowledge_base }
        resource_name: { type: string }
        title: { type: string }
        description: { type: string, nullable: true }
        source_mode:
          type: string
          enum: [converted, edited]
        content_sha256: { type: string }
        locked:
          {
            type: boolean,
            description: "When true, every mutation (edit / reconvert / replace / delete) is refused (FR-021).",
          }
        project_id:
          {
            type: string,
            description: "Document scope (FR-022): the WORKSPACE_GLOBAL sentinel for a global document, or a project ULID for a per-project document.",
          }
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: "Null for a live document; set when the document is soft-deleted (in the trash — FR-023)."
        chunk_count: { type: integer }
        metadata:
          type: object
          description: Per-face metadata (KB keys below).
          properties:
            original_filename: { type: string }
            original_format: { type: string, example: docx }
            source_sha256: { type: string }
            converted_at: { type: string, format: date-time }
            conversion_engine: { type: string, example: markitdown }
          additionalProperties: true
        path:
          type: string
          description: >-
            Absolute path of the normalized markdown on disk
            (`docs/<doc-id>.md`, the source of truth). The in-app viewer is
            read-only; this path backs open-in-external-editor /
            reveal-in-file-manager / copy-path.
        folder_path:
          type: string
          description: Absolute path of the document's containing folder (the KB `docs/` directory).
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DocumentListOut:
      type: object
      required: [documents, total]
      properties:
        documents:
          type: array
          items:
            $ref: "#/components/schemas/DocumentOut"
        total: { type: integer }

    DocumentDetailOut:
      allOf:
        - $ref: "#/components/schemas/DocumentOut"
        - type: object
          required: [markdown]
          properties:
            markdown:
              type: string
              description: The normalized Markdown body (without frontmatter).

    DocumentEditRequest:
      type: object
      required: [markdown]
      properties:
        markdown:
          type: string
          minLength: 1
          description: The new Markdown body. Replaces the file; sets source_mode=edited.

    DocumentLockRequest:
      type: object
      required: [locked]
      properties:
        locked:
          type: boolean
          description: Desired lock state. true locks the document (refuses all mutations); false unlocks it.

    ReindexResult:
      type: object
      required: [documents_scanned, documents_reindexed, documents_skipped]
      properties:
        documents_scanned: { type: integer }
        documents_reindexed: { type: integer }
        documents_skipped:
          { type: integer, description: Unchanged content (no-op). }
        documents_removed:
          {
            type: integer,
            description: Rows pruned because their markdown file vanished out-of-band.,
          }
        documents_degraded:
          {
            type: integer,
            description: Documents indexed keyword-only because embedding degraded.,
          }

    SearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string, minLength: 1, maxLength: 4096 }
        top_k:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
        mode:
          allOf:
            - $ref: "#/components/schemas/RetrievalMode"
          description: >
            Overrides the KB default. `grep` is served by the grep endpoint;
            requesting it here (or any mode not in `enabled_modes`) is a 400
            `SEARCH_MODE_INVALID`. `vector` is the exception — it degrades to
            keyword with a flagged fallback.
        project_id:
          type: string
          nullable: true
          description: "Scope (FR-022): omit for global; a project ULID restricts the search to that scope (filtered at the SQL layer)."

    Passage:
      type: object
      required: [text, document_id, title, score, position]
      properties:
        text: { type: string }
        document_id: { type: string }
        title: { type: string }
        score: { type: number, format: float }
        position: { type: integer }

    SearchResponse:
      type: object
      required: [mode, passages]
      properties:
        mode:
          $ref: "#/components/schemas/RetrievalMode"
        fallback:
          allOf:
            - $ref: "#/components/schemas/RetrievalMode"
          nullable: true
          description: Set to "keyword" when a requested vector search degraded (no embedding configured).
        passages:
          type: array
          items:
            $ref: "#/components/schemas/Passage"

    GrepRequest:
      type: object
      required: [pattern]
      properties:
        pattern: { type: string, minLength: 1, maxLength: 1024 }
        max_matches:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
        project_id:
          type: string
          nullable: true
          description: "Scope (FR-022): omit for global; a project ULID greps only that scope's docs/ subtree."

    GrepHit:
      type: object
      required: [path, line_number, line]
      properties:
        path: { type: string, example: "docs/8a3f1c2b....md" }
        line_number: { type: integer }
        line: { type: string }

    GrepResponse:
      type: object
      required: [hits, truncated]
      properties:
        hits:
          type: array
          items:
            $ref: "#/components/schemas/GrepHit"
        truncated:
          type: boolean
          description: >
            True when matches beyond max_matches exist or the server-side
            timeout cut the scan short (a timed-out grep returns no hits with
            truncated=true).

    KnowledgeBaseMetrics:
      type: object
      required: [document_count, chunk_count, indexed_modes, disk_bytes]
      properties:
        document_count: { type: integer }
        chunk_count: { type: integer }
        indexed_modes:
          type: array
          items:
            $ref: "#/components/schemas/RetrievalMode"
        disk_bytes: { type: integer }

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: INGEST_REJECTED
            message:
              type: string
            details:
              type: object
              additionalProperties: true
              nullable: true
