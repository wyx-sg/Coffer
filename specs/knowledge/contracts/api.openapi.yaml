openapi: 3.1.0
info:
  title: Coffer — Knowledge API
  version: 0.5.0
  description: |
    REST surface for the one `knowledge` resource kind (spec knowledge,
    Knowledge Layer). Eight routes, and that is the whole management plane.

    ## A collection is two lanes, not an index

    Knowledge is Markdown files under `~/.coffer/knowledge/<collection>/`, and
    a collection holds exactly **two lanes**:

    - `sources/` — what a person, an upload or `coffer__write` contributed.
      Nested however the person filing them likes. Curation never writes here.
    - `topics/` — the documents curation derives from those sources. This is
      what an agent reads, and nothing but the curation pass writes it.

    A `README.md` sits at the collection root, outside both lanes, and its
    first paragraph is the collection's `description`. There is no `.raw/` and
    no `.history/`: an uploaded original is an ordinary, visible file in
    `sources/` beside the Markdown extracted from it.

    The files are the **sole** source of truth: there is no `documents` table,
    no chunk table, no FTS5 index and no vectors, so nothing is derived and
    nothing is reconciled
    ([Knowledge Is Plain Files](../../../docs/decisions/knowledge-is-plain-files.md)).

    A file's **path is its identity** — the `path` every route takes and
    returns is relative to the knowledge root, and it carries the lane:
    `shopee/sources/gateway.md`, `shopee/topics/account-gateway.md`. There is
    no id anywhere in this contract. Frontmatter carries `title`,
    `description`, `actor` (`agent` | `user`), `created_at` and `updated_at`,
    plus `coffer_ingested_at` on a source curation has already folded in.

    ## Nothing here retrieves

    There is **no** `POST /search` and **no** `GET /grep`. The layer keeps no
    index and exposes no retrieval anywhere (FR-033, invariant 4): an agent
    reads the files with its own `Read` and `Grep` at the absolute paths its
    delivered skill carries, and the person reads them through `GET /tree` and
    `GET /file`. The one input beside a tree on the web page narrows the names
    already on screen, client-side (FR-040) — it is not a query.

    `GET /tree` walks **one level at a time** — a directory's immediate
    subdirectories and its files, each file with the `title` and `description`
    from its frontmatter. The lane is part of the path (`shopee/sources`,
    `shopee/topics`), so the page asks twice, once per tree, rather than this
    surface inventing a lane parameter the path already carries. The listing is
    produced by walking the directory and reading frontmatter at call time; it
    is never materialized, so it cannot fall out of step with the disk.

    `GET /file` returns a whole file, from either lane. There is no chunking,
    no passage granularity and no `top_k`.

    ## Writing is split by lane

    `PUT /file` and `DELETE /file` reach `sources/` and only `sources/`
    (FR-013, FR-020, FR-021). Neither `collection` nor `path` names the
    `sources/` segment — the service adds it — so no caller can aim a write at
    `topics/` by spelling a path, and a `path` that already names `topics/` is
    refused by the path layer as `KNOWLEDGE_PATH_UNSAFE`. A correction to a
    topic document goes in as a new source; the next pass carries it through.

    ## Ingestion: one entrance beside the filesystem

    Putting a Markdown file in `sources/` stays a complete way to add knowledge
    (FR-015), and the next `GET /tree` sees it. But the filesystem is only
    reachable while the person is sitting at the machine, so `POST /upload`
    converts a document — whatever `markitdown` handles, plus plain text and
    CSV — into an ordinary Markdown file in a collection's `sources/`, with the
    **original** beside it under its own name and byte-identical to what was
    sent (FR-016). A channel doing the same thing from the person's phone is
    the other end of this path.

    ## Curation

    `POST /collections/{name}/curate` runs one bounded agentic pass over a
    collection, driven by Coffer's internal model connection. It reads one
    source and at most five candidate topic documents, and writes only
    `topics/` — its tool surface is `list_topics`, `read_topic`, `write_topic`
    and `retire_topic`, none of which can reach `sources/` (FR-021). A pass is
    bounded to eight writes (FR-025) and reports what it refused. With no
    internal connection configured it is a clean no-op (`status: no_model`);
    with nothing pending, `up_to_date`. Every one of those is a 200 — a vault
    with no model configured is an ordinary state, not a bad request (FR-029).

    A background sweep runs the same pass on an interval, governed by
    installation-wide settings that live elsewhere (`auto_curate_enabled`,
    `curate_interval_s` and `curate_owner_machine_id` on
    `internal_engine_config`, reached through the engine settings routes, out
    of scope for this contract). Unlike the pass it replaces,
    `auto_curate_enabled` ships **on**: curation is the only path from a source
    to something an agent can read (FR-032).

    ## Why there is no reindex or settings route

    - **No reindex.** Nothing is indexed, so nothing can be stale. An edit made
      in the person's own editor is live on the very next call, with no import
      step and nothing to reconcile (FR-001, FR-015).
    - **No check-sources / update-source.** External source tracking is gone
      with the index that motivated it; a source's whole provenance is that it
      is a file in `sources/`.
    - **No embedding or per-scope settings.** A collection carries **no
      configuration at all** — `KnowledgeConfig` is empty and refuses unknown
      keys. There are no retrieval modes to pick, no chunk parameters and no
      embedding config, installation-wide or otherwise (FR-045).

    ## Why deleting a collection is not here

    There is deliberately **no** `DELETE /api/v1/knowledge/collections/{name}`.
    A collection's lifecycle is a Resource's lifecycle, so deletion goes
    through the kind-agnostic resource route,
    `DELETE /api/v1/resources/knowledge/{name}` (FR-039). That way
    unregistering a collection runs the same lifecycle, audit and cascade as
    unregistering any other resource, instead of a second path that would have
    to be kept in step with it. Creation gets its own route only because it
    returns the collection already projected as a `CollectionOut`.

    ## Transport

    All routes are loopback-only and require the daemon's auth token in the
    `X-Coffer-Token` header (token from `~/.coffer/daemon.json`). Write routes
    additionally read an optional `X-Coffer-Actor` header. Every error response
    uses the app-wide envelope `{ "error": { code, message, details } }`.

    These routes are the **owner's** surface and are therefore unscoped:
    per-agent authorization governs what an agent is told through delivery
    (FR-010), not what the person who owns the vault sees in their own UI.

    ## Reading this file against the code

    Component names mirror the Pydantic class names in
    `coffer/surfaces/http/knowledge/schemas.py`, so this contract can be diffed
    against the app's generated OpenAPI without a translation table. The only
    exception is `ErrorEnvelope`, a contract-only alias for the app-wide error
    shape.

servers:
  - url: http://127.0.0.1:8000
    description: Local daemon (default port; actual port read from daemon.json)

security:
  - cofferToken: []

tags:
  - name: knowledge
    description: |
      The single `knowledge` kind: collections, one level of one lane, reading
      one file, writing and deleting a source, uploading a document, and the
      manual curation trigger. No retrieval of any kind.
      Mounted by `coffer.surfaces.http.knowledge` as one router with the prefix
      `/api/v1/knowledge`.

paths:
  # --- collections ----------------------------------------------------------

  /api/v1/knowledge/collections:
    get:
      summary: List collections
      description: |
        Every collection: the top-level folders under the knowledge root, each
        with the first paragraph of its `README.md` as `description` and the
        two lanes counted apart. Hidden entries (anything dot-prefixed) are
        excluded, and `README.md` itself is neither listed nor counted
        (FR-007).

        The two counts answer different questions — how much a person has
        contributed, and how much of it an agent can read today. A collection
        with sources and no topics is one curation has not reached yet, which a
        single total would hide.

        The list can legitimately be empty — nothing auto-provisions, so a
        fresh installation has no collections until someone creates one.
      operationId: listKnowledgeCollections
      tags: [knowledge]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionListOut"

    post:
      summary: Create a collection
      description: |
        Creates one collection: a directory under the knowledge root holding
        both lanes (`sources/` and `topics/`), and one `knowledge` Resource for
        it so the framework's per-agent scope has something to authorize.
        Nothing else creates one — not a read, not a write, not an agent's
        working directory (FR-008).

        `name` is a single path segment. Names that would escape the root
        (containing `/`, `\` or `..`, or dot-only) are rejected, as is a name
        already taken. A `description` is written into the new collection's
        `README.md`; omitted, the collection simply has no description until
        someone writes that README by hand.
      operationId: createKnowledgeCollection
      tags: [knowledge]
      parameters:
        - $ref: "#/components/parameters/ActorHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionOut"
        "400":
          $ref: "#/components/responses/UnsafePath"
        "409":
          $ref: "#/components/responses/AlreadyExists"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  # --- one level of one lane ------------------------------------------------

  /api/v1/knowledge/tree:
    get:
      summary: List one level of one lane
      description: |
        One level, not the whole tree: the immediate subdirectories of `path`
        and the files directly in it, each with the `title` and `description`
        from its frontmatter.

        `path` is relative to the knowledge root and **carries the lane** —
        `shopee/sources` or `shopee/topics`, `shopee/sources/account` for a
        folder inside one. The page asks once per tree (FR-040). The listing is
        generated at call time by walking the directory and reading frontmatter,
        never materialized (FR-001). Hidden entries are absent.
      operationId: readKnowledgeTree
      tags: [knowledge]
      parameters:
        - $ref: "#/components/parameters/TreePath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeOut"
        "400":
          $ref: "#/components/responses/UnsafePath"
        "404":
          $ref: "#/components/responses/CollectionNotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  # --- one file -------------------------------------------------------------

  /api/v1/knowledge/file:
    get:
      summary: Read a file
      description: |
        The file's full text, plus its frontmatter fields and the two absolute
        on-disk paths the UI needs to offer open-in-editor and
        reveal-in-file-manager on the file and on its folder (FR-041).

        Reading is **lane-agnostic** on purpose: the page previews a topic
        document exactly as it previews a source, and refuses to *edit* it
        instead (FR-040). Whole file, always: no chunking, no passage
        granularity, no `top_k`. Bytes come off disk at call time, so an edit
        made in the person's own editor is what comes back.
      operationId: readKnowledgeFile
      tags: [knowledge]
      parameters:
        - $ref: "#/components/parameters/FilePath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileOut"
        "400":
          $ref: "#/components/responses/UnsafePath"
        "404":
          $ref: "#/components/responses/FileNotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

    put:
      summary: Write a source
      description: |
        Creates a source, or replaces an existing one. Exactly one of
        `collection` and `path` must be given: `collection` (plus an optional
        `folder` inside it) creates a new file there, with a human-readable
        slug derived from `title` (a collision appends a short suffix); `path`
        replaces the source already at that path. Giving both, or neither, is a
        400.

        **Neither names the `sources/` segment** — the service adds it (FR-013,
        FR-021). A `path` that names `topics/` is refused as
        `KNOWLEDGE_PATH_UNSAFE`: `topics/` is curation's to write and no one
        else's, and a correction goes in as a new source instead.

        A write is a plain file write — no LLM, no conversion, no indexing step
        (FR-014). `description` is required, not optional: the delivered
        skill's catalogue is how a document is ever found, so a file that fails
        to describe itself is unfindable (FR-003).
      operationId: writeKnowledgeFile
      tags: [knowledge]
      parameters:
        - $ref: "#/components/parameters/ActorHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileWrite"
      responses:
        "200":
          description: Written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileOut"
        "400":
          $ref: "#/components/responses/UnsafePath"
        "404":
          $ref: "#/components/responses/FileNotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

    delete:
      summary: Delete a source
      description: |
        Removes the file from disk. There is nothing else to remove — no index
        row, no chunks, no embedding — so the deletion is complete when the
        file is gone. Recorded in the audit log with the actor.

        A **source** only (FR-020). A topic document is derived and is removed
        by being retired in a pass, never from here, so a `topics/` path is
        refused rather than offering a delete the next pass would undo.
      operationId: deleteKnowledgeFile
      tags: [knowledge]
      parameters:
        - $ref: "#/components/parameters/FilePath"
        - $ref: "#/components/parameters/ActorHeader"
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/UnsafePath"
        "404":
          $ref: "#/components/responses/FileNotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  # --- ingestion ------------------------------------------------------------

  /api/v1/knowledge/upload:
    post:
      summary: Convert a document and file it into a collection's sources
      description: |
        The entrance for a document the person did not write as Markdown
        (FR-016…FR-019). The file is converted, named from a readable slug of
        its title, given FR-003's frontmatter — `title` from the document
        falling back to its file name, `description` from the internal
        connection where one is configured and from the document's opening
        prose where not — and written into `collection`'s `sources/`
        (optionally into `folder` inside that lane). Afterwards it is an
        ordinary source, indistinguishable from one written by hand.

        The bytes that were sent land **beside it in `sources/`**, under their
        own name and extension and byte-identical to what was sent, so a bad
        conversion can be redone from an original the person can see. There is
        no hidden `.raw/` any more, no re-conversion on a schedule and no
        external-source tracking.

        `folder` is a subdirectory inside that `sources/` lane, never the lane
        itself: an upload is a source like any other and cannot be aimed at
        `topics/`.

        Supported inputs are exactly what `markitdown` handles (PDF, `.docx`,
        `.pptx`, `.xlsx`, `.xls`, HTML, EPUB) plus plain text, Markdown and
        CSV. The call is bounded: **one file**, a size ceiling, and a refusal
        that names the limit. All-or-nothing — a conversion failure leaves
        neither the Markdown nor the original behind.

        Upload is deliberately **not** an agent tool (FR-033): a document
        enters through a human surface — this route, the CLI, or a channel that
        confirms the collection with its paired owner.
      operationId: uploadKnowledgeDocument
      tags: [knowledge]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, collection]
              properties:
                file:
                  type: string
                  format: binary
                  description: The document to convert. One per call.
                collection:
                  type: string
                  description: The collection it belongs in. Must already exist.
                folder:
                  type: string
                  description: |
                    A folder inside that collection's `sources/`. Omitted, the
                    lane's top level.
      responses:
        "201":
          description: Converted and filed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestedDocumentOut"
        "400":
          $ref: "#/components/responses/IngestRejected"
        "404":
          $ref: "#/components/responses/CollectionNotFound"
        "413":
          $ref: "#/components/responses/UploadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/EngineUnavailable"

  # --- curation -------------------------------------------------------------

  /api/v1/knowledge/collections/{name}/curate:
    post:
      summary: Run one curation pass over one collection
      description: |
        One bounded agentic pass, driven by the internal model connection,
        whose tool surface is **four** operations — `list_topics`,
        `read_topic`, `write_topic`, `retire_topic`. None of them can reach
        `sources/`: a pass reads the sources it is handed and writes only
        `topics/` (FR-021).

        The pass takes **one source**. Name it in the body to fold in a
        particular file; omit the body and the pass takes the oldest source
        whose `coffer_ingested_at` is behind its own modification time
        (FR-022) — which is what the page's "Curate now" button wants. One
        source either way: a trigger is never a corpus-wide rewrite (FR-025).

        Its context is bounded — the source in full, at most five candidate
        topic documents in full, and the collection's catalogue of titles and
        descriptions (FR-023) — and its writes are bounded to eight, with
        `refused` reporting what the bound or the no-file-references rule
        (FR-027) turned away.

        `status` is `ok` when a pass ran, `no_model` when no internal
        connection is configured (a clean no-op), `up_to_date` when no source
        is pending, `too_large` when the source does not fit the model's
        context (`limit` then names the ceiling), and `failed` when the pass
        did not complete — in which case the watermark is left unset so the
        material is curated later rather than lost (FR-028). All of them are
        **200**: none is a fault of the request (FR-029).

        **One pass per collection at a time** (FR-030). A request that arrives
        while a pass over the same collection is still running is refused with
        `409` rather than queued: the caller asked to start a pass, and no pass
        is going to start. Which collections are being curated right now is
        readable at `GET /api/v1/upkeep/runs` (spec mcp-gateway's contract), so
        a surface that mounts mid-pass shows the button as already running
        instead of inviting the second click.
      operationId: curateKnowledgeCollection
      tags: [knowledge]
      parameters:
        - $ref: "#/components/parameters/CollectionName"
        - $ref: "#/components/parameters/ActorHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurationRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurationOut"
        "404":
          $ref: "#/components/responses/CollectionNotFound"
        "409":
          $ref: "#/components/responses/UpkeepAlreadyRunning"
        "422":
          $ref: "#/components/responses/ValidationFailed"

components:
  securitySchemes:
    cofferToken:
      type: apiKey
      in: header
      name: X-Coffer-Token

  parameters:
    CollectionName:
      in: path
      name: name
      required: true
      description: |
        The collection's name — which is also the Resource name and the
        top-level directory name under `~/.coffer/knowledge/`.
      schema: { type: string }
      examples:
        shopee: { value: shopee }
        coffer: { value: coffer }
    TreePath:
      in: query
      name: path
      required: true
      description: |
        A directory path relative to the knowledge root, carrying the lane: a
        collection's `sources` or `topics`, or a folder nested inside one.
        Required — there is a dedicated route for the collection list, so this
        one always names a level.
      schema: { type: string, minLength: 1 }
      examples:
        sources: { value: shopee/sources }
        topics: { value: shopee/topics }
        nested: { value: shopee/sources/account }
    FilePath:
      in: query
      name: path
      required: true
      description: |
        A file path relative to the knowledge root, carrying the lane —
        `<collection>/sources/…` or `<collection>/topics/…`. This is the
        file's identity; there is no id.
      schema: { type: string, minLength: 1 }
      examples:
        source: { value: shopee/sources/session-ownership.md }
        topic: { value: shopee/topics/account-gateway.md }
    ActorHeader:
      in: header
      name: X-Coffer-Actor
      required: false
      description: |
        Who is writing, for the audit trail and for the file's `actor`
        frontmatter. `agent` is recorded as such; anything else, an absent
        header included, is recorded as `user`.
      schema:
        type: string
        enum: [agent, user]

  responses:
    UnsafePath:
      description: |
        A path that escapes the knowledge root, names a hidden entry, or aims a
        write or a delete at `topics/` (`KNOWLEDGE_PATH_UNSAFE`) — or a write
        that named both `path` and `collection`, or neither. The lane rule
        lives in path construction rather than in a check each handler
        remembers to make, which is why it is reported here (FR-006).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UpkeepAlreadyRunning:
      description: |
        A curation pass over this collection is already in flight
        (`UPKEEP_ALREADY_RUNNING`). Refused rather than queued — the caller
        asked to start a pass, and no pass is going to start (FR-030).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    AlreadyExists:
      description: A collection of that name already exists (`KNOWLEDGE_COLLECTION_EXISTS`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    CollectionNotFound:
      description: |
        No such collection (`KNOWLEDGE_COLLECTION_NOT_FOUND`). An unknown name
        is always an error — nothing is conjured into existence by being asked
        for (FR-008).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    FileNotFound:
      description: No file at that path (`KNOWLEDGE_FILE_NOT_FOUND`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    IngestRejected:
      description: |
        The document could not be converted (`INGEST_REJECTED`). `details`
        carries a `reason` — `unsupported_type`, `scanned_pdf` or
        `empty_conversion` — and the rejected `doc_type`, so a surface can name
        the format it will not take instead of failing vaguely. Legacy
        `.doc`/`.ppt`, `.rtf` and `.odt` reach this case deliberately: no
        converter claims them, so they are refused cleanly rather than turned
        into a misleading conversion failure. Nothing half-converted is stored,
        and neither the Markdown nor the original is left behind.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UploadTooLarge:
      description: |
        The upload is past the size ceiling (`KNOWLEDGE_UPLOAD_TOO_LARGE`).
        Refused before any conversion or write is attempted, naming the limit
        so the caller knows what to shrink below (FR-019).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    EngineUnavailable:
      description: |
        A converter library the call needs is absent (`ENGINE_UNAVAILABLE`) —
        one of MarkItDown's format backends on an upload. The daemon stays up
        and the answer names the engine.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationFailed:
      description: Request schema validation failed (FastAPI's `HTTPValidationError` shape).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    CollectionOut:
      type: object
      description: One collection, as the collection list sees it.
      required: [name, description, source_count, topic_count]
      properties:
        name:
          type: string
          description: The directory name under the knowledge root, and the Resource name.
        description:
          type: string
          description: |
            The first paragraph of the collection's `README.md`, empty when
            there is none. Never stored in the database (FR-011).
        source_count:
          type: integer
          description: |
            Files under `sources/`, counted recursively, hidden entries and the
            collection's own `README.md` excluded.
        topic_count:
          type: integer
          description: |
            Documents under `topics/`, counted the same way. Counted apart from
            the sources because the two answer different questions: how much a
            person has contributed, and how much of it an agent can read today.
      example:
        name: shopee
        description: Internal systems at Shopee — services, data plane, the chains between them.
        source_count: 61
        topic_count: 23

    CollectionListOut:
      type: object
      required: [collections]
      properties:
        collections:
          type: array
          items:
            $ref: "#/components/schemas/CollectionOut"

    CollectionCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: One path segment. No `/`, no `\`, no `..`, not dot-only.
        description:
          anyOf:
            - type: string
            - type: "null"
          description: |
            Written into the new collection's `README.md` as its first
            paragraph. Omitted, the collection has no description until someone
            writes that README themselves.
      example:
        name: shopee
        description: Internal systems at Shopee — services, data plane, the chains between them.

    DirectoryOut:
      type: object
      description: A subdirectory at the level being listed.
      required: [path, name, file_count]
      properties:
        path:
          type: string
          description: Path relative to the knowledge root — pass it back to `GET /tree` to descend.
        name:
          type: string
          description: The directory's own name.
        file_count:
          type: integer
          description: Files beneath it, counted recursively.

    FileSummaryOut:
      type: object
      description: |
        One file as a tree row shows it — enough to judge relevance without
        reading the body.
      required: [path, title, description, actor, updated_at]
      properties:
        path:
          type: string
          description: Path relative to the knowledge root, lane included. The file's identity.
        title:
          type: string
        description:
          type: string
          description: What the file says it is about. Required on write (FR-003).
        actor:
          type: string
          enum: [agent, user]
          description: Who last wrote it.
        updated_at:
          type: string
          description: ISO-8601 timestamp from frontmatter.

    TreeOut:
      type: object
      description: One level of one lane — never the whole tree.
      required: [path, directories, files]
      properties:
        path:
          type: string
          description: The level that was listed, relative to the knowledge root.
        directories:
          type: array
          items:
            $ref: "#/components/schemas/DirectoryOut"
        files:
          type: array
          items:
            $ref: "#/components/schemas/FileSummaryOut"

    FileOut:
      type: object
      description: |
        One file in full, from either lane: its frontmatter, its body, and the
        absolute paths the UI needs for open-in-editor and
        reveal-in-file-manager.
      required:
        [
          path,
          title,
          description,
          actor,
          created_at,
          updated_at,
          body,
          file_path,
          folder_path,
          ingested_at,
        ]
      properties:
        path:
          type: string
          description: Path relative to the knowledge root, lane included. The file's identity.
        title:
          type: string
        description:
          type: string
        actor:
          type: string
          enum: [agent, user]
        created_at:
          type: string
        updated_at:
          type: string
        body:
          type: string
          description: The Markdown body, frontmatter stripped.
        file_path:
          type: string
          description: Absolute on-disk path of the file (FR-041).
        folder_path:
          type: string
          description: Absolute on-disk path of its containing folder (FR-041).
        ingested_at:
          type: string
          description: |
            When curation last consumed this source (`coffer_ingested_at`).
            Empty for a topic document and for a source no pass has reached yet
            (FR-028) — it is what answers "is this note in the topics yet?".

    FileWrite:
      type: object
      description: |
        Create a source, or replace one. Exactly one of `collection` and
        `path`. Neither names the `sources/` segment — the service adds it, so
        no caller can aim a write at `topics/` by spelling a path (FR-013,
        FR-021).
      required: [title, description]
      properties:
        title:
          type: string
          minLength: 1
          description: Also the source of the file name when creating — a readable slug, not a ULID.
        description:
          type: string
          minLength: 1
          description: |
            Required. The delivered skill's catalogue is how a document is ever
            found, so a file that fails to describe itself is unfindable
            (FR-003).
        body:
          type: string
          default: ""
          description: The Markdown body. Frontmatter is written by the layer, not supplied here.
        collection:
          anyOf:
            - type: string
            - type: "null"
          description: |
            The collection to create the source in. Its `sources/` lane is
            added by the service.
        folder:
          anyOf:
            - type: string
            - type: "null"
          description: |
            A folder inside that collection's `sources/`. Only meaningful
            beside `collection`.
        path:
          anyOf:
            - type: string
            - type: "null"
          description: |
            An existing source to replace, relative to the knowledge root. A
            path naming `topics/` is refused.
      example:
        title: Session ownership
        description: Which service owns a login session, and what reads it.
        body: |
          Login state is owned by `account.session`.
        collection: shopee
        folder: account

    CurationRequest:
      type: object
      description: |
        Which source to fold in. The whole body is optional — omitted, the pass
        takes the oldest source whose `coffer_ingested_at` is behind its own
        modification time (FR-022), which is what the page's button wants.
      properties:
        source:
          anyOf:
            - type: string
            - type: "null"
          description: One source's path, relative to the knowledge root.
      example:
        source: shopee/sources/session-ownership.md

    CurationOut:
      type: object
      description: |
        What one pass did. Every status is a 200 — a collection with no model
        configured, or with nothing pending, is an ordinary state of the
        feature and not a fault of the request (FR-029).
      required:
        [
          status,
          collection,
          source,
          model,
          written,
          retired,
          refused,
          topics_before,
          topics_after,
          limit,
        ]
      properties:
        status:
          type: string
          enum: [ok, no_model, up_to_date, too_large, failed]
          description: |
            `no_model` when no internal connection is configured — a clean
            no-op, never an error. `up_to_date` when no source is pending.
            `too_large` when the source does not fit, `limit` naming the
            ceiling. `failed` leaves the watermark unset so the material is
            curated later rather than lost.
        collection:
          type: string
        source:
          type: string
          description: The source the pass took, when it took one.
        model:
          type: string
          description: |
            The internal model that ran it, so a surprising rewrite is
            traceable to a model rather than to Coffer.
        written:
          type: integer
          description: Topic documents this pass wrote.
        retired:
          type: integer
          description: Topic documents this pass retired, their content written elsewhere.
        refused:
          type: integer
          description: |
            Writes the pass refused — a topic naming another file (FR-027), or
            the eight-write bound (FR-025). Reported rather than swallowed,
            because a pass that hit its bound has more to absorb than it
            managed.
        topics_before:
          type: integer
        topics_after:
          type: integer
        limit:
          type: integer
          description: The source-size ceiling, present only with `status` `too_large`.
      example:
        status: ok
        collection: shopee
        source: shopee/sources/session-ownership.md
        model: internal-model
        written: 2
        retired: 1
        refused: 0
        topics_before: 22
        topics_after: 23
        limit: 0

    IngestedDocumentOut:
      type: object
      description: |
        The converted document, as an ordinary source in the collection. Note
        `converter` is reported here and written **nowhere on disk** — a file
        that has landed is just a file, and FR-003's frontmatter carries its
        five keys and nothing else.
      required: [path, title, description, converter, original_path]
      properties:
        path:
          type: string
          description: The converted Markdown file, relative to the knowledge root.
        title: { type: string }
        description: { type: string }
        converter:
          type: string
          description: Which converter produced this file.
        original_path:
          type: string
          description: |
            The original the upload sent, relative to the knowledge root like
            `path`: an ordinary visible file in `sources/` beside the Markdown
            extracted from it (FR-016), so the surface that browses the lane
            can name it — which a hidden absolute location could not.

    ErrorEnvelope:
      type: object
      description: |
        The app-wide error shape (`surfaces/http/errors.py`). Contract-only
        alias — there is no Pydantic model of this name.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: e.g. `KNOWLEDGE_COLLECTION_NOT_FOUND`, `KNOWLEDGE_PATH_UNSAFE`.
            message:
              type: string
            details:
              type: object
