openapi: 3.1.0
info:
  title: Coffer — Knowledge API
  version: 0.3.0
  description: |
    REST surface for the one `knowledge` resource kind (spec knowledge, Knowledge
    Layer). This contract is the merge of the two pre-merge ones: the `memory`
    face (`/api/v1/memory_stores/*`) and the `knowledge_base` face
    (`/api/v1/knowledge_bases/*`). Neither route tree exists any more — there is
    one kind, one route tree, one storage root.

    ## One kind, three scopes

    A **scope** is where a piece of knowledge belongs, and the resource *name*
    says which of the three it is (`domain.knowledge.scope.scope_kind_of`) —
    derived, never stored, so the two can never disagree:

    - `global`          — knowledge that follows the user everywhere.
                          Auto-provisions on first access.
    - `project-<ULID>`  — resolved from the cwd's git root.
                          Auto-provisions on first access.
    - any other name    — a **named collection** the user created deliberately
                          (what used to be a separate `knowledge_base`).
                          It does **NOT** auto-provision: silently conjuring a
                          scope out of a typo'd name would be worse than a 404,
                          so an unknown named scope is an error, and creating
                          one goes through `POST /api/v1/knowledge`.

    ## One storage root, two lanes

    There are only two kinds of material a person actually distinguishes: what
    someone wrote, and what someone uploaded. Everything lives under
    `~/.coffer/knowledge/<scope>/`:

    - `notes/`            what an agent or the user wrote
    - `.history/`   pre-rewrite copies kept by the tidy pass
    - `docs/`             ingested documents, normalized to Markdown
    - `.raw/`             the ingested originals, kept for re-conversion

    `.history/` and `.raw/` are dot-prefixed deliberately: ripgrep skips hidden
    entries, so a grep never returns an archived revision or an original
    alongside the live file.

    The Markdown files are the source of truth (ADR files-as-truth-sqlite-retrieval); SQLite (documents /
    chunks / FTS5 / sqlite-vec) is a rebuildable index, never a thing that must
    be migrated.

    ## The lane discriminator

    Both writers index into one `documents` table under one
    `(kind, resource_name)`, so each row carries a stored `lane` discriminator,
    `notes` or `docs`. It is why `entry_count` and `document_count` are two
    lane-scoped numbers rather than one total — while retrieval deliberately
    spans both lanes, because a caller asking a question does not care which
    writer produced the answer.

    `lane` is an internal storage discriminator and is deliberately NOT on the
    document wire shape: the endpoint you called already tells you the lane.

    ## Retrieval mode is internal (ADR retrieval-mode-is-internal)

    No endpoint takes a `mode`. `POST /{name}/search` and `POST /{name}/recall`
    resolve the strategy from the scope's `default_mode`; when the resolved
    strategy needs vectors and no embedding provider is available, the engine
    degrades to `keyword` internally. The degradation is NOT surfaced as a
    per-query flag — it is reported as state, through the `documents_degraded`
    metric and the per-document `embed_status`. `grep` is a separate capability
    with its own endpoint.

    ## No per-scope embedding configuration

    `KnowledgeConfig` carries **no embedding fields at all**. Both pre-merge
    faces had them (flat `embedding_*` on memory, a nested `embedding` block on
    the KB) and by the time the two were merged neither was read. Embedding
    resolves through the installation-wide config (`/api/v1/embedding/*`, out of
    scope for this contract); a scope opts into semantic search purely by
    listing `vector` (or `hybrid`) in `retrieval_modes`.

    ## Deleting a scope

    There is deliberately **no** `DELETE /api/v1/knowledge/{name}`. Scope
    deletion goes through the kind-agnostic resource route,
    `DELETE /api/v1/resources/knowledge/{name}` (spec ui-shell), so that unregistering
    a knowledge scope runs the same lifecycle, audit and cascade as
    unregistering any other resource.

    ## Transport

    All routes are loopback-only and require the daemon's auth token in the
    `X-Coffer-Token` header (token from `~/.coffer/daemon.json`). Write routes
    additionally read an optional `X-Coffer-Actor` header. Every error response
    uses the app-wide envelope `{ "error": { code, message, details } }`.

    ## Reading this file against the code

    The path parameter is spelled `{name}` here because that is what the route
    functions call it — it denotes the **scope name** throughout. Component
    names deliberately mirror the Pydantic class names in
    `coffer/surfaces/http/knowledge/{schemas,document_schemas}.py`, so this
    contract can be diffed against the app's generated OpenAPI without a
    translation table. The only exceptions are the
    three contract-only aliases with no model of their own — `ScopeKind`,
    `RetrievalMode` and `ErrorEnvelope`.

servers:
  - url: http://127.0.0.1:8000
    description: Local daemon (default port; actual port read from daemon.json)

security:
  - cofferToken: []

tags:
  - name: knowledge
    description: |
      The single `knowledge` kind: scopes, the notes an agent wrote, the
      documents someone ingested, retrieval over both, and the tidy pass.
      Mounted by `coffer.surfaces.http.knowledge` as one router with the prefix
      `/api/v1/knowledge`.

paths:
  # --- scopes ---------------------------------------------------------------

  /api/v1/knowledge:
    get:
      summary: List knowledge scopes
      description: |
        Every knowledge scope: the auto-provisioned `global` scope, one
        `project-<ULID>` scope per project seen so far, and every named
        collection. `global` is provisioned as a side effect of this call, so
        the list is never empty.

        Each row's `entry_count` / `document_count` are cheap indexed counts;
        `disk_bytes` is deliberately absent here (it needs a per-scope disk
        walk) — read `GET /{name}/metrics` for that.
      operationId: listKnowledgeScopes
      tags: [knowledge]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeListOut"

    post:
      summary: Create a named collection
      description: |
        Creates a **named** scope — the deliberate kind. `global` and
        `project-<ULID>` are rejected by the schema (422): they are provisioned
        on first use, and conjuring one by hand would let a typo'd name
        masquerade as an auto-scope. Names that would escape the knowledge root
        (dot-only, containing `/`, `\` or `..`) are rejected for the same
        reason.

        Equivalent to `POST /api/v1/resources` with `kind="knowledge"`, but
        returns the created resource already projected as a `ScopeOut`.
      operationId: createKnowledgeScope
      tags: [knowledge]
      parameters:
        - $ref: "#/components/parameters/ActorHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScopeCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeOut"
        "409":
          $ref: "#/components/responses/AlreadyExists"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/knowledge/{name}:
    parameters:
      - $ref: "#/components/parameters/ScopeName"
    get:
      summary: Get one knowledge scope
      description: |
        `global` is provisioned on demand, so it always resolves. A
        `project-<ULID>` scope that has never been written to, and any unknown
        named collection, is a 404 (`MEMORY_STORE_NOT_FOUND`).
      operationId: getKnowledgeScope
      tags: [knowledge]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeOut"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      summary: Update a scope's mutable config (partial merge)
      description: |
        **Merges** the supplied fields into the scope's existing config — the
        body is read with `exclude_unset` + `exclude_none`, so an omitted field
        and an explicit `null` both mean "leave it alone", and only the fields
        you send change. The merged result is then re-validated as a whole, so a
        patch that would make the config internally inconsistent (a
        `default_mode` outside `retrieval_modes`, a `chunk_overlap` above half
        the `chunk_size`) is refused with 422 and nothing is written.

        Changing a retrieval or chunking field re-indexes the scope through the
        kind's `on_update_config` hook. That is cheap and safe precisely because
        the files on disk are the truth: the index is always rebuildable.
        `auto_update_sources` is deliberately not a reindex trigger — toggling
        it must not re-chunk.

        `merged_identities` is system-managed (written by worktree adoption) and
        is not patchable.
      operationId: updateKnowledgeScope
      tags: [knowledge]
      parameters:
        - $ref: "#/components/parameters/ActorHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeConfigPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeOut"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/knowledge/{name}/label:
    parameters:
      - $ref: "#/components/parameters/ScopeName"
    patch:
      summary: Set or clear a scope's display label
      description: |
        The label is UI-only metadata held outside the resource config, so
        renaming what a scope is *called* never touches what it *is*. An empty
        or whitespace-only label clears it, reverting to the derived name (the
        project-dir basename for a project scope).
      operationId: updateKnowledgeScopeLabel
      tags: [knowledge]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScopeLabelPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeOut"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/knowledge/{name}/metrics:
    parameters:
      - $ref: "#/components/parameters/ScopeName"
    get:
      summary: One scope's counts, indexed modes and on-disk size
      description: |
        The union of what the two pre-merge faces reported, for one scope. The
        entry/document split is the `lane` discriminator surfaced as numbers.
        `disk_bytes` walks the scope directory, which is why the list endpoint
        omits it.
      operationId: getKnowledgeScopeMetrics
      tags: [knowledge]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeMetrics"
        "404":
          $ref: "#/components/responses/NotFound"

  # --- entries (the `notes/` lane) ------------------------------------------

  /api/v1/knowledge/{name}/entries:
    parameters:
      - $ref: "#/components/parameters/ScopeName"
    post:
      summary: Write one entry into a scope
      description: |
        No LLM runs at write time: a write is a Markdown file under the scope's
        `notes/`, plus an index row, plus an audit event. Reshaping notes is the
        separate tidy pass, which runs in the background and on `organize`.

        Writing to `global` or `project-<ULID>` provisions the scope if needed —
        an agent that wants to record something should not have to ask
        permission first. Writing to an unknown *named* collection is a 404.
      operationId: addKnowledgeEntry
      tags: [knowledge]
      parameters:
        - $ref: "#/components/parameters/ActorHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryOut"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: |
            Empty or over-long entry (`MEMORY_REJECTED` with
            `details.reason` = `empty` | `too_long`), or schema validation
            failure (`CONFIG_INVALID`). The schema cap is the hard ceiling
            (32768); a scope configured with a smaller `max_entry_chars` is
            enforced by the service, which is why the same 422 can come from
            either layer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

    get:
      summary: List a scope's entries
      operationId: listKnowledgeEntries
      tags: [knowledge]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryListOut"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      summary: Clear every entry in a scope
      description: |
        Removes the scope's entries; the scope itself, its ingested documents
        and its other lanes survive. Deleting the scope is a resource-level
        operation (`DELETE /api/v1/resources/knowledge/{name}`).
      operationId: clearKnowledgeEntries
      tags: [knowledge]
      parameters:
        - $ref: "#/components/parameters/ActorHeader"
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClearResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/knowledge/{name}/entries/{entry_id}:
    parameters:
      - $ref: "#/components/parameters/ScopeName"
      - $ref: "#/components/parameters/EntryId"
    get:
      summary: Read one entry
      operationId: getKnowledgeEntry
      tags: [knowledge]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryOut"
        "404":
          $ref: "#/components/responses/EntryNotFound"

    patch:
      summary: Rewrite one entry
      description: |
        `text` is required — an entry update replaces the body rather than
        appending to it. `title` / `description` are optional; omitting them
        leaves the frontmatter values as they were.
      operationId: updateKnowledgeEntry
      tags: [knowledge]
      parameters:
        - $ref: "#/components/parameters/ActorHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryOut"
        "404":
          $ref: "#/components/responses/EntryNotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

    delete:
      summary: Delete one entry
      operationId: deleteKnowledgeEntry
      tags: [knowledge]
      parameters:
        - $ref: "#/components/parameters/ActorHeader"
      responses:
        "204":
          description: No Content
        "404":
          $ref: "#/components/responses/EntryNotFound"

  # --- documents: async re-embed -------------------------------------------
  #
  # These two live on their own router, which `knowledge/__init__.py` includes
  # BEFORE the main one, so the literal segments `status` and `reembed-batch`
  # are matched before `/documents/{document_id}` can capture them as a
  # document id. They are declared here, ahead of the `{document_id}` paths, to
  # keep that precedence visible to a reader of the contract.

  /api/v1/knowledge/{name}/documents/status:
    parameters:
      - $ref: "#/components/parameters/ScopeName"
    get:
      summary: In-flight re-embed state for a scope's documents
      description: |
        Only **in-flight** documents appear (`queued` / `running` / `error`). A
        document absent from the list is either done or still pending an embed —
        read the list endpoint's per-document `embed_status` for that.
      operationId: getKnowledgeDocumentStatus
      tags: [knowledge]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentStatusResponse"

  /api/v1/knowledge/{name}/documents/reembed-batch:
    parameters:
      - $ref: "#/components/parameters/ScopeName"
    post:
      summary: Enqueue re-embed of existing documents (async, 202)
      description: |
        The slow part of ingest is convert + chunk + embed. A document indexed
        keyword-only because the embedding provider was unavailable is marked
        pending, and this endpoint moves the retry of those EXISTING documents
        off the request path: it returns 202 immediately and the work runs on
        the shared async op runner.

        Either name an explicit `document_ids` set, or send `all: true` to
        re-embed every document still pending an embed. Already-embedded
        documents are skipped. Poll `GET /{name}/documents/status` (and the
        list's `embed_status`) for progress.
      operationId: reembedKnowledgeDocuments
      tags: [knowledge]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReembedBatchRequest"
      responses:
        "202":
          description: Accepted — work enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReembedBatchResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # --- documents: the `docs/` lane -----------------------------------------

  /api/v1/knowledge/{name}/documents:
    parameters:
      - $ref: "#/components/parameters/ScopeName"
    post:
      summary: Ingest an uploaded file into a scope (any format → Markdown)
      description: |
        Streams the uploaded bytes, detects the format, converts to Markdown via
        the converter registry, cleans it, and writes `<scope>/docs/<doc-id>.md`
        (the truth) plus `<scope>/.raw/<doc-id>.<ext>` (provenance, hidden so
        grep never matches the same content twice). The Markdown is then chunked
        and indexed into FTS5, and embedded when the scope lists `vector` and an
        embedding provider is available.

        A new document gets a fresh ULID and `source_mode=converted`. A
        re-upload is matched to an existing document by `original_filename`:
        byte-identical content is an idempotent no-op; changed content under the
        same filename updates the SAME document in place (same id, `docs/` and
        `.raw/` overwritten) when `replace=true`, and is otherwise refused as a
        duplicate (409).

        Uploading into `global` provisions it on demand. The absolute size
        ceiling (100 MiB) is checked before the body is buffered, so an
        oversized upload is rejected without being read into memory; the scope's
        own `max_document_bytes` (which may be smaller) is enforced after.
      operationId: ingestKnowledgeDocument
      tags: [knowledge]
      parameters:
        - $ref: "#/components/parameters/DocActorHeader"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                replace:
                  type: boolean
                  default: false
                  description: |
                    If true, a changed re-upload of a filename already in the
                    scope updates that document in place. Byte-identical
                    re-uploads are a no-op regardless.
                source_path:
                  type: [string, "null"]
                  default: null
                  description: |
                    Absolute path of the external original, supplied only by
                    trusted clients (CLI / native file picker) so
                    `check-sources` can later re-hash it. The web surface merely
                    forwards what the client sends and never auto-derives a
                    server path; an untrusted upload leaves this unset.
      responses:
        "201":
          description: Document ingested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentOut"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Duplicate filename without `replace=true` (`INGEST_REJECTED` with
            `details.reason = "duplicate"`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: |
            Upload exceeds the absolute ceiling or the scope's
            `max_document_bytes` (`INGEST_REJECTED`, `details.reason = "too_large"`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: |
            Unsupported type, empty file, or empty after conversion
            (`INGEST_REJECTED`, `details.reason` =
            `unsupported_type` | `empty` | `scanned_pdf`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Converter engine unavailable for this format (`ENGINE_UNAVAILABLE`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

    get:
      summary: List a scope's ingested documents
      operationId: listKnowledgeDocuments
      tags: [knowledge]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: q
          required: false
          description: |
            Optional case-insensitive title filter, applied server-side BEFORE
            pagination, so `total` reflects the filtered count.
          schema: { type: [string, "null"] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentListOut"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/knowledge/{name}/documents/{document_id}:
    parameters:
      - $ref: "#/components/parameters/ScopeName"
      - $ref: "#/components/parameters/DocumentId"
    get:
      summary: Read a document's normalized Markdown
      operationId: getKnowledgeDocument
      tags: [knowledge]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentDetailOut"
        "404":
          $ref: "#/components/responses/DocumentNotFound"

    put:
      summary: Edit a document's Markdown (sets source_mode=edited, reindexes)
      description: |
        Replaces the Markdown body. The document's `source_mode` becomes
        `edited`, which blocks re-conversion from the raw original until a new
        source is uploaded — a hand edit is never silently clobbered. Runs the
        single idempotent re-index routine (a no-op when the content hash is
        unchanged).
      operationId: editKnowledgeDocument
      tags: [knowledge]
      parameters:
        - $ref: "#/components/parameters/DocActorHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentEditRequest"
      responses:
        "200":
          description: Edited and reindexed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentOut"
        "404":
          $ref: "#/components/responses/DocumentNotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

    delete:
      summary: Delete a document
      operationId: deleteKnowledgeDocument
      tags: [knowledge]
      parameters:
        - $ref: "#/components/parameters/DocActorHeader"
      responses:
        "204":
          description: No Content
        "404":
          $ref: "#/components/responses/DocumentNotFound"

  /api/v1/knowledge/{name}/documents/{document_id}/reconvert:
    parameters:
      - $ref: "#/components/parameters/ScopeName"
      - $ref: "#/components/parameters/DocumentId"
    post:
      summary: Re-run conversion from the stored raw original
      description: |
        Re-converts the document from its original upload in `<scope>/.raw/`,
        regenerating the Markdown and reindexing. Refused with
        `RECONVERSION_BLOCKED` (409) when `source_mode` is `edited` — upload a
        new source file first to reset it to `converted`.
      operationId: reconvertKnowledgeDocument
      tags: [knowledge]
      parameters:
        - $ref: "#/components/parameters/DocActorHeader"
      responses:
        "200":
          description: Re-converted and reindexed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentOut"
        "404":
          $ref: "#/components/responses/DocumentNotFound"
        "409":
          $ref: "#/components/responses/ReconversionBlocked"
        "503":
          description: Converter engine unavailable for this format (`ENGINE_UNAVAILABLE`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/knowledge/{name}/documents/{document_id}/update-source:
    parameters:
      - $ref: "#/components/parameters/ScopeName"
      - $ref: "#/components/parameters/DocumentId"
    post:
      summary: Re-ingest a document from its tracked external original
      description: |
        Re-reads the external original at the document's stored `source_path`
        and replays the `replace=true` ingest path, so the stable ULID is
        preserved and the corpus is re-chunked and re-indexed in place. Refused
        with `RECONVERSION_BLOCKED` (409) when `source_mode` is `edited`; a
        document with no `source_path`, or whose source file has vanished, is
        rejected with `INGEST_REJECTED` (400).
      operationId: updateKnowledgeDocumentSource
      tags: [knowledge]
      parameters:
        - $ref: "#/components/parameters/DocActorHeader"
      responses:
        "200":
          description: Re-ingested from source and reindexed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentOut"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/DocumentNotFound"
        "409":
          $ref: "#/components/responses/ReconversionBlocked"

  # --- maintenance ----------------------------------------------------------

  /api/v1/knowledge/{name}/reindex:
    parameters:
      - $ref: "#/components/parameters/ScopeName"
    post:
      summary: Rescan the scope's ingested files and rebuild the index from disk
      description: |
        Rescans `<scope>/docs/` for deltas and runs the single idempotent
        re-index routine per file, reconstructing the SQLite index state from
        the Markdown. Re-embeds when the scope lists `vector` and a provider is
        available; documents that end up keyword-only are counted in
        `documents_degraded` and retried on the next pass.
      operationId: reindexKnowledgeScope
      tags: [knowledge]
      parameters:
        - $ref: "#/components/parameters/DocActorHeader"
      responses:
        "200":
          description: Reindex complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReindexResult"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/knowledge/{name}/check-sources:
    parameters:
      - $ref: "#/components/parameters/ScopeName"
    post:
      summary: Detect whether path-tracked documents' external originals changed
      description: |
        For each document carrying a `source_path`, re-hashes the external
        original (streamed) against the stored `source_sha256` and classifies it
        `unchanged` / `changed` / `missing`. Detection alone changes nothing and
        audits nothing.

        When the scope's `auto_update_sources` is true, a changed document whose
        `source_mode` is not `edited` is refreshed in place and reported
        `updated`; a changed hand-edited document is left alone and reported
        `edited`. On-demand only — there is no filesystem watcher.
      operationId: checkKnowledgeSources
      tags: [knowledge]
      parameters:
        - $ref: "#/components/parameters/DocActorHeader"
      responses:
        "200":
          description: Source-status report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceCheckResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # --- retrieval ------------------------------------------------------------

  /api/v1/knowledge/{name}/search:
    parameters:
      - $ref: "#/components/parameters/ScopeName"
    post:
      summary: Passage search over a scope (one query → one answer)
      description: |
        Relevance search returning passages. The caller does NOT choose a
        retrieval mode (ADR retrieval-mode-is-internal): the engine resolves the scope's `default_mode`
        internally — `hybrid` (reciprocal rank fusion of keyword + vector, per
        the files-as-truth-sqlite-retrieval ADR) when the scope lists `vector`,
        else `keyword`. When the
        resolved strategy needs vectors and no embedding provider is available,
        it degrades to `keyword`; that is never an error and is deliberately not
        reported as a per-query flag, because a degraded index is a state of the
        scope (`documents_degraded`, `embed_status`) rather than a property of
        one question.

        `grep` is a separate capability with its own endpoint.
      operationId: searchKnowledge
      tags: [knowledge]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          description: Index engine unavailable (`ENGINE_UNAVAILABLE`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/knowledge/{name}/grep:
    parameters:
      - $ref: "#/components/parameters/ScopeName"
    post:
      summary: Literal / regex grep over every Markdown file in a scope
      description: |
        Exact or regex match across the scope's lanes. No index, no embedding,
        so it works on a scope that has never been indexed. `<scope>/.raw/` is
        hidden and therefore skipped, which is what keeps an ingested document
        from matching twice (once as Markdown, once as its original).

        Bounded by `max_matches` and a server-side timeout; a scan cut short by
        either returns `truncated=true` (a timed-out grep returns no hits with
        `truncated=true`).
      operationId: grepKnowledge
      tags: [knowledge]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrepRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrepResponse"
        "400":
          description: Invalid regex (`GREP_PATTERN_INVALID`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          description: ripgrep binary unavailable (`ENGINE_UNAVAILABLE`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/knowledge/{name}/recall:
    parameters:
      - $ref: "#/components/parameters/ScopeName"
    post:
      summary: Recall entries from a scope (one query → one answer)
      description: |
        The entry-oriented read: same engine as `/search`, same
        mode-stays-internal rule (ADR retrieval-mode-is-internal), but returning whole recalled items
        rather than passages, and able to widen past the addressed scope.

        `scope` in the body says how wide to look: `project` = the addressed
        scope only, `global` = the global scope only, `both` (default) = the two
        merged by reciprocal rank fusion — so an agent working in a project
        still sees the knowledge that follows the user everywhere.
      operationId: recallKnowledge
      tags: [knowledge]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecallRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecallResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  # --- the tidy pass --------------------------------------------------------

  /api/v1/knowledge/{name}/organize:
    parameters:
      - $ref: "#/components/parameters/ScopeName"
    post:
      summary: Tidy the scope's notes now
      description: |
        Runs the tidy pass over `notes/`: merge duplicates, split what has grown
        over-long. The same pass also fires on its own — after a quiet spell
        following a write, and on a periodic sweep — so this endpoint only means
        "now"; there is one pass and one name for it.

        Before any overwrite the prior revision is copied into `.history/`,
        so an unattended rewrite is always recoverable.
      operationId: organizeKnowledge
      tags: [knowledge]
      responses:
        "200":
          description: Tidy pass complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizeResponse"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    cofferToken:
      type: apiKey
      in: header
      name: X-Coffer-Token

  parameters:
    ScopeName:
      in: path
      name: name
      required: true
      description: |
        The **scope name**, which is also the resource name and the directory
        name under `~/.coffer/knowledge/`. `global`, `project-<ULID>`, or a
        named collection. The scope's kind is derived from this name, never
        stored separately.
      schema: { type: string }
      examples:
        global: { value: global }
        project: { value: project-01J0000000000000000000000A }
        named: { value: design-notes }
    EntryId:
      in: path
      name: entry_id
      required: true
      description: The entry's ULID.
      schema: { type: string }
    DocumentId:
      in: path
      name: document_id
      required: true
      description: The document's stable ULID, minted at first ingest.
      schema: { type: string }
    ActorHeader:
      in: header
      name: X-Coffer-Actor
      required: false
      description: |
        Who is writing, for the audit trail. `agent` is recorded as such;
        anything else (including an absent header) is recorded as `user`.
      schema:
        type: string
        enum: [agent, user]
    DocActorHeader:
      in: header
      name: X-Coffer-Actor
      required: false
      description: |
        Who is writing, for the audit trail. Document routes accept a free-form
        actor string rather than the entry routes' two-value enum; an absent
        header is recorded as `api`.
      schema: { type: string }

  responses:
    BadRequest:
      description: Validation or precondition failure (`INGEST_REJECTED`, `SCOPE_UNRESOLVED`, …)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationFailed:
      description: |
        Request schema validation failed (`CONFIG_INVALID`), or the config as
        merged is internally inconsistent.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: |
        Scope not found (`MEMORY_STORE_NOT_FOUND`). Reachable for a
        `project-<ULID>` scope never written to and for any unknown named
        collection; `global` auto-provisions and so does not 404.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    EntryNotFound:
      description: Scope or entry not found (`MEMORY_STORE_NOT_FOUND` / `MEMORY_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    DocumentNotFound:
      description: Scope or document not found (`MEMORY_STORE_NOT_FOUND` / `DOCUMENT_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    AlreadyExists:
      description: A knowledge scope with the same name already exists (`RESOURCE_ALREADY_EXISTS`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ReconversionBlocked:
      description: |
        The document's `source_mode` is `edited`; re-conversion is refused
        (`RECONVERSION_BLOCKED`) so a hand edit is never clobbered.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    ScopeKind:
      type: string
      enum: [global, project, named]
      description: |
        Which of the three a scope is, derived from its name: `global` and
        `project` auto-provision on first use; `named` does not, because a
        collection exists only because someone decided it should.

    RetrievalMode:
      type: string
      enum: [grep, keyword, vector, hybrid]
      description: |
        A retrieval strategy the substrate supports. `hybrid` fuses `keyword`
        and `vector` by reciprocal rank fusion (ADR files-as-truth-sqlite-retrieval); like `vector` it
        degrades to keyword-only when no embedding provider is available. A
        scope opts into semantic search by listing `vector` (or `hybrid`) here —
        that listing IS the opt-in, which is why there are no per-scope
        embedding settings.

    KnowledgeConfig:
      type: object
      description: |
        Per-scope knowledge settings — the union of what the two pre-merge
        faces actually used: the write bound from the memory face, the ingestion
        parameters from the knowledge-base face, and retrieval settings that
        were already identical on both sides.

        **There are no embedding fields.** Both faces carried their own and by
        the time they were merged neither was read. Embedding resolves through
        the installation-wide config; the dead fields were dropped rather than
        carried across.

        Changing a retrieval or chunking field re-indexes the scope — safe
        because the files on disk are the truth and the index is always
        rebuildable.

        Every field has a default, so none is required on input (`ScopeCreate`
        may omit `config` entirely). On output every field is always present:
        the stored config is the fully-defaulted model.
      properties:
        retrieval_modes:
          type: array
          items: { $ref: "#/components/schemas/RetrievalMode" }
          default: [grep, keyword]
          description: |
            The modes this scope indexes for. Duplicates are collapsed and at
            least one mode is required. Listing `vector` also adds `hybrid`
            (fusion becomes possible, so it is offered), and makes `hybrid` the
            `default_mode` unless one was set explicitly.
        default_mode:
          allOf:
            - $ref: "#/components/schemas/RetrievalMode"
          default: keyword
          description: |
            The strategy `/search` and `/recall` resolve internally. Must be one
            of `retrieval_modes`. Never accepted as a request parameter
            (ADR retrieval-mode-is-internal).
        max_entry_chars:
          type: integer
          minimum: 64
          maximum: 32768
          default: 8192
          description: |
            Bound on one written entry. The per-scope value bounds ordinary
            agent writes; the hard ceiling (32768) is what a trusted bulk import
            of the user's own notes may reach, so a long note is never silently
            truncated.
        chunk_size:
          type: integer
          minimum: 64
          maximum: 2048
          default: 512
        chunk_overlap:
          type: integer
          minimum: 0
          default: 64
          description: |
            Must be at most half of `chunk_size`; there is no independent upper
            bound, because the meaningful constraint is the ratio.
        max_document_bytes:
          type: integer
          minimum: 1024
          maximum: 104857600
          default: 26214400
          description: |
            Per-scope ingest ceiling. The surface additionally refuses anything
            over the absolute 100 MiB bound before buffering the body.
        auto_update_sources:
          type: boolean
          default: false
          description: |
            When true, `check-sources` refreshes documents whose tracked
            external original changed, skipping hand-edited ones. Deliberately
            NOT a reindex-triggering field — toggling it must not re-chunk.
        merged_identities:
          type: array
          items: { type: string }
          default: []
          description: |
            Project ids folded INTO this scope. System-managed, written by the
            worktree-adoption flow and never user-set: a resolve whose computed identity is
            listed here — and whose own scope no longer exists — lands here
            instead of provisioning an empty duplicate.

    KnowledgeConfigPatch:
      type: object
      description: |
        The mutable config fields, all optional. Applied as a **merge**: an
        omitted field and an explicit `null` both leave the stored value alone,
        and only what you send changes. The merged result is re-validated as a
        whole before it is written.

        `merged_identities` is absent by design — it is system-managed.
      properties:
        retrieval_modes:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/RetrievalMode" }
        default_mode:
          oneOf:
            - $ref: "#/components/schemas/RetrievalMode"
            - type: "null"
        max_entry_chars: { type: [integer, "null"], minimum: 64, maximum: 32768 }
        chunk_size: { type: [integer, "null"], minimum: 64, maximum: 2048 }
        chunk_overlap: { type: [integer, "null"], minimum: 0 }
        max_document_bytes: { type: [integer, "null"], minimum: 1024, maximum: 104857600 }
        auto_update_sources: { type: [boolean, "null"] }

    ScopeLabelPatch:
      type: object
      description: |
        Set or clear a scope's display label. An empty or whitespace-only label
        clears it, reverting to the derived / fallback name.
      properties:
        label:
          type: [string, "null"]
          maxLength: 200

    ScopeCreate:
      type: object
      description: |
        Create a NAMED collection. `global` and `project-<ULID>` are rejected:
        they are provisioned on first use, and creating one by hand would let a
        typo masquerade as an auto-scope. Names that would traverse out of the
        knowledge root are rejected too.
      required: [name]
      properties:
        name:
          type: string
          description: |
            The collection's name, which becomes both the resource name and the
            directory name. Not `global`, not `project-`-prefixed, not dot-only,
            and free of `/`, `\` and `..`.
          examples: [design-notes]
        description: { type: [string, "null"] }
        config:
          $ref: "#/components/schemas/KnowledgeConfig"

    ScopeOut:
      type: object
      description: |
        One knowledge scope, whatever kind of material it holds. The single
        model replaces the two pre-merge ones: a scope is a scope whether it
        holds entries an agent wrote, documents someone ingested, or both, so
        the wire stops asking the caller which of the two it is looking at.
      required: [ref, kind, name, scope, project_id, scope_dir, config, enabled, created_at, updated_at]
      properties:
        ref: { type: string, examples: ["knowledge:design-notes"] }
        kind: { type: string, const: knowledge }
        name: { type: string }
        scope: { $ref: "#/components/schemas/ScopeKind" }
        project_id:
          type: string
          description: |
            The project ULID for a project scope, the installation-global
            sentinel (`00000000000000000000000000`) for `global`, and the
            collection's own name for a named one — whatever keys this scope's
            rows.
        project_root:
          type: [string, "null"]
          default: null
          description: |
            Absolute git root a project scope was provisioned from. Null for
            `global`, for named collections, and for project scopes provisioned
            before the root was tracked.
        label:
          type: [string, "null"]
          default: null
          description: |
            User-set display label. When present it is the scope's readable name
            in the UI, taking precedence over the derived project-dir basename.
        scope_dir:
          type: string
          description: |
            Absolute on-disk directory holding the scope's Markdown
            (`~/.coffer/knowledge/<scope>/`). The in-app viewer is read-only;
            this backs reveal-in-file-manager for the whole scope.
        description: { type: [string, "null"], default: null }
        config: { $ref: "#/components/schemas/KnowledgeConfig" }
        enabled: { type: boolean }
        entry_count:
          type: integer
          default: 0
          description: Rows in the `knowledge` lane — entries an agent or person wrote.
        document_count:
          type: integer
          default: 0
          description: Rows in the `docs` lane — documents someone ingested.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ScopeListOut:
      type: object
      required: [scopes]
      properties:
        scopes:
          type: array
          items: { $ref: "#/components/schemas/ScopeOut" }

    ScopeMetrics:
      type: object
      description: The union of what the two pre-merge faces reported for one scope.
      required: [entry_count, document_count, chunk_count, indexed_modes, disk_bytes]
      properties:
        entry_count: { type: integer }
        document_count: { type: integer }
        chunk_count: { type: integer }
        documents_degraded:
          type: integer
          default: 0
          description: |
            Documents indexed keyword-only because the embedding provider was
            unavailable (the embed is retried on the next reconcile). Surfaced
            from the persisted pending flag, so it reflects a degraded embed
            observed during any read — not only an explicit `/reindex`.
        indexed_modes:
          type: array
          items: { $ref: "#/components/schemas/RetrievalMode" }
        disk_bytes: { type: integer }

    # --- entries -------------------------------------------------------------

    EntryCreate:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 32768
          description: |
            The entry body (Markdown). The schema cap is the hard ceiling; a
            scope with a smaller `max_entry_chars` is enforced by the service,
            which answers `MEMORY_REJECTED { reason: "too_long" }`.
        title:
          type: [string, "null"]
          default: null
          description: Frontmatter title; derived from the text when omitted.
        description:
          type: [string, "null"]
          default: null
          description: Frontmatter one-line description.

    EntryUpdate:
      type: object
      description: |
        Replaces the entry body. `text` is required — an update rewrites rather
        than appends; omitted `title` / `description` keep their stored values.
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 32768 }
        title: { type: [string, "null"], default: null }
        description: { type: [string, "null"], default: null }

    EntryOut:
      type: object
      required: [id, scope_name, scope, title, description, text, actor, path, folder_path, created_at, updated_at]
      properties:
        id: { type: string, description: The entry's ULID. }
        scope_name: { type: string }
        scope: { $ref: "#/components/schemas/ScopeKind" }
        title: { type: string }
        description: { type: string }
        text: { type: string, description: Markdown body. }
        actor: { type: string, enum: [agent, user] }
        origin_session_id: { type: [string, "null"], default: null }
        path:
          type: string
          description: |
            Absolute canonical `.md` path of the note file (the source of
            truth), under the scope's `notes/`. The tidy pass may merge a note
            into another, so this path can change across a pass; the revision it
            replaced is kept under `.history/`.
        folder_path:
          type: string
          description: Absolute path of the entry file's containing folder.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    EntryListOut:
      type: object
      required: [entries, total]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/EntryOut" }
        total: { type: integer }

    ClearResponse:
      type: object
      required: [cleared]
      properties:
        cleared: { type: integer, description: Entries removed. }

    # --- recall --------------------------------------------------------------

    RecallRequest:
      type: object
      required: [query]
      properties:
        query: { type: string, minLength: 1, maxLength: 4096 }
        scope:
          type: string
          enum: [global, project, both]
          default: both
          description: |
            How wide to look: `project` = the addressed scope only, `global` =
            the global scope only, `both` (default) = the two merged by
            reciprocal rank fusion.
        top_k:
          type: integer
          minimum: 1
          maximum: 20
          default: 5

    RecallHit:
      type: object
      required: [id, text, score, source, time]
      properties:
        id: { type: string }
        text: { type: string }
        score: { type: number, format: float }
        source:
          type: string
          description: Scope plus the canonical path of the source file.
        time: { type: string, format: date-time }

    RecallResponse:
      type: object
      description: |
        Hits only. The resolved mode and any vector→keyword degradation are
        deliberately not on the response: mode is internal (ADR retrieval-mode-is-internal), and
        degradation is scope state reported through metrics.
      required: [hits]
      properties:
        hits:
          type: array
          items: { $ref: "#/components/schemas/RecallHit" }

    # --- documents -----------------------------------------------------------

    DocumentOut:
      type: object
      description: |
        One ingested document. The stored `lane` discriminator is not on the
        wire — every route that returns this shape is already a document route,
        so the lane is implied.
      required: [id, kind, resource_name, title, source_mode, content_sha256, project_id, metadata, path, folder_path, created_at, updated_at]
      properties:
        id:
          type: string
          description: |
            Stable ULID minted at first ingest, decoupled from content — a
            re-upload of the same filename keeps it, so links and chunk
            references survive an update. The source sha256 is provenance, in
            `metadata`.
        kind: { type: string, const: knowledge }
        resource_name:
          type: string
          description: The owning scope's name.
        title: { type: string }
        description: { type: [string, "null"], default: null }
        source_mode:
          type: string
          enum: [converted, edited]
          description: |
            `converted` = still derived from the raw original, so re-conversion
            is allowed; `edited` = hand-edited, so re-conversion and
            source-refresh are refused until a new source is uploaded.
        content_sha256: { type: string }
        project_id:
          type: string
          description: |
            The owning scope's project id — a project ULID, the global sentinel,
            or a named collection's own name. Surfaced so the UI can group
            documents.
        chunk_count: { type: integer, default: 0 }
        metadata:
          type: object
          description: |
            Per-document provenance. Ingest keys are listed below; the map is
            open, and entry rows use a different key set entirely.
          properties:
            original_filename: { type: string }
            original_format: { type: string, examples: [docx] }
            source_sha256: { type: string }
            source_path:
              type: string
              description: |
                The external original's absolute path, present only for
                path-tracked ingests so `check-sources` can detect drift.
            converted_at: { type: string, format: date-time }
            conversion_engine: { type: string, examples: [markitdown] }
          additionalProperties: true
        path:
          type: string
          description: |
            Absolute path of the normalized Markdown on disk
            (`<scope>/docs/<doc-id>.md`, the source of truth). The in-app viewer
            is read-only; this backs open-in-external-editor /
            reveal-in-file-manager.
        folder_path:
          type: string
          description: Absolute path of the document's containing folder (the scope's `docs/`).
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        embed_status:
          type: [string, "null"]
          enum: [done, embedding, queued, running, error, null]
          default: null
          description: |
            Per-document embed state: derived from the pending flag (`embedding`
            while pending, else `done`) with any in-flight `queued` / `running` /
            `error` re-embed overlaid. Null when the async batch service is not
            wired (minimal apps and tests) — absence means "unknown", not "done".

    DocumentDetailOut:
      allOf:
        - $ref: "#/components/schemas/DocumentOut"
        - type: object
          required: [markdown]
          properties:
            markdown:
              type: string
              description: The normalized Markdown body (without frontmatter).

    DocumentListOut:
      type: object
      required: [documents, total]
      properties:
        documents:
          type: array
          items: { $ref: "#/components/schemas/DocumentOut" }
        total: { type: integer }

    DocumentEditRequest:
      type: object
      required: [markdown]
      properties:
        markdown:
          type: string
          minLength: 1
          description: The new Markdown body. Replaces the file and sets `source_mode=edited`.

    ReindexResult:
      type: object
      required: [documents_scanned, documents_reindexed, documents_skipped]
      properties:
        documents_scanned:
          type: integer
          description: Reindexed plus skipped — every file the scan considered.
        documents_reindexed: { type: integer }
        documents_skipped: { type: integer, description: Unchanged content (no-op). }
        documents_removed:
          type: integer
          default: 0
          description: Rows pruned because their Markdown file was removed out-of-band.
        documents_degraded:
          type: integer
          default: 0
          description: |
            Documents indexed keyword-only because the embedding provider was
            unavailable; marked pending so the next scan retries just the embed.

    SourceStatusOut:
      type: object
      required: [document_id, title, source_path, status]
      properties:
        document_id: { type: string }
        title: { type: string }
        source_path:
          type: string
          description: The external original's absolute path (machine-local).
        status:
          type: string
          enum: [unchanged, changed, missing, edited, updated]
          description: |
            `unchanged` = the tracked file's sha256 still matches; `changed` =
            it differs; `missing` = the tracked file is gone; `edited` = it
            changed but the document was hand-edited, so it was skipped;
            `updated` = a changed source that `auto_update_sources` re-ingested
            in place.

    SourceCheckResponse:
      type: object
      required: [sources]
      properties:
        sources:
          type: array
          items: { $ref: "#/components/schemas/SourceStatusOut" }

    # --- retrieval shapes ----------------------------------------------------

    SearchRequest:
      type: object
      description: |
        No `mode`. The retrieval strategy is resolved from the scope's
        `default_mode` (ADR retrieval-mode-is-internal).
      required: [query]
      properties:
        query: { type: string, minLength: 1, maxLength: 4096 }
        top_k: { type: integer, minimum: 1, maximum: 20, default: 5 }

    Passage:
      type: object
      required: [text, document_id, title, score, position]
      properties:
        text: { type: string }
        document_id: { type: string }
        title: { type: string }
        score: { type: number, format: float }
        position: { type: integer, description: The chunk's ordinal within its document. }

    SearchResponse:
      type: object
      description: |
        Passages only — no resolved-mode or fallback flag, for the same reason
        `RecallResponse` carries none.
      required: [passages]
      properties:
        passages:
          type: array
          items: { $ref: "#/components/schemas/Passage" }

    GrepRequest:
      type: object
      required: [pattern]
      properties:
        pattern: { type: string, minLength: 1, maxLength: 1024 }
        max_matches: { type: integer, minimum: 1, maximum: 1000, default: 100 }

    GrepHitOut:
      type: object
      required: [path, line_number, line]
      properties:
        path: { type: string, examples: ["docs/01J0000000000000000000000A.md"] }
        line_number: { type: integer }
        line: { type: string }

    GrepResponse:
      type: object
      required: [hits, truncated]
      properties:
        hits:
          type: array
          items: { $ref: "#/components/schemas/GrepHitOut" }
        truncated:
          type: boolean
          description: |
            True when matches beyond `max_matches` exist or the server-side
            timeout cut the scan short — never a count heuristic. A timed-out
            grep returns no hits with `truncated=true`.

    # --- async re-embed ------------------------------------------------------

    ReembedBatchRequest:
      type: object
      description: |
        Either re-embed an explicit `document_ids` set, or set `all` to re-embed
        every document still pending an embed. Already-embedded documents are
        skipped either way.
      properties:
        document_ids:
          type: [array, "null"]
          items: { type: string }
          default: null
          description: Re-embed these specific documents.
        all:
          type: boolean
          default: false
          description: Re-embed every document still pending an embed.

    ReembedBatchResponse:
      type: object
      required: [queued, skipped, total]
      properties:
        queued: { type: integer, description: Newly enqueued documents. }
        skipped: { type: integer, description: Skipped — already embedded (nothing to retry). }
        total: { type: integer, description: Candidate documents considered. }

    DocumentEmbedStatus:
      type: object
      description: One in-flight document's re-embed state.
      required: [document_id, state]
      properties:
        document_id: { type: string }
        state: { type: string, enum: [queued, running, error] }
        message:
          type: [string, "null"]
          default: null
          description: Error detail when `state` is `error`.

    DocumentStatusResponse:
      type: object
      required: [statuses]
      properties:
        statuses:
          type: array
          items: { $ref: "#/components/schemas/DocumentEmbedStatus" }

    # --- the tidy pass -------------------------------------------------------

    OrganizeResponse:
      type: object
      description: |
        Result of one tidy pass over a scope's `notes/` lane. `no_model`
        (nothing configured to do the shaping) and `empty` (nothing to shape)
        are clean no-ops, not errors.
      required: [status, notes_before, notes_after, notes_written, notes_archived]
      properties:
        status: { type: string, enum: [reorganized, no_model, empty] }
        notes_before: { type: integer, description: Note files in the lane when the pass started. }
        notes_after: { type: integer, description: Note files in the lane when it finished. }
        notes_written: { type: integer, description: Notes created or overwritten by the pass. }
        notes_archived:
          type: integer
          description: |
            Prior revisions copied into `.history/` before being replaced.
            The lane is never destructively rewritten.
        model:
          type: [string, "null"]
          default: null
          description: Display name of the internal model used; null when `status="no_model"`.

    # --- errors --------------------------------------------------------------

    ErrorEnvelope:
      type: object
      description: |
        The app-wide error shape. Note the scope- and entry-level codes still
        carry the pre-merge `MEMORY_*` names: they are the wire contract
        frontends already match on, so renaming them would be a breaking change
        with no behavioural payoff.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              description: |
                Stable machine-readable code. The ones this surface emits:
                `MEMORY_STORE_NOT_FOUND` (404, scope), `MEMORY_NOT_FOUND` (404,
                entry), `MEMORY_REJECTED` (422, empty/over-long entry),
                `DOCUMENT_NOT_FOUND` (404), `INGEST_REJECTED`
                (400/409/413/415 by `details.reason`), `RECONVERSION_BLOCKED`
                (409), `GREP_PATTERN_INVALID` (400), `ENGINE_UNAVAILABLE` (503),
                `SCOPE_UNRESOLVED` (400), `RESOURCE_ALREADY_EXISTS` (409),
                `CONFIG_INVALID` (422).
              examples: [INGEST_REJECTED]
            message: { type: string, description: Human-readable description. }
            details:
              type: object
              additionalProperties: true
              description: |
                Machine-readable extras. `reason` is set for `INGEST_REJECTED`
                (`too_large` | `duplicate` | `unsupported_type` | `empty` |
                `scanned_pdf`) and for `MEMORY_REJECTED` (`empty` | `too_long`).
