openapi: 3.1.0
info:
  title: Coffer — Knowledge API
  version: 0.4.0
  description: |
    REST surface for the one `knowledge` resource kind (spec knowledge,
    Knowledge Layer). Ten routes, and that is the whole management plane.

    ## The layer is a directory, not an index

    Knowledge is Markdown files under `~/.coffer/knowledge/<collection>/`,
    nested however the person filing them likes. The files are the **sole**
    source of truth: there is no `documents` table, no chunk table, no FTS5
    index and no vectors, so nothing is derived and nothing is reconciled
    ([Knowledge Is Plain Files](../../../docs/decisions/knowledge-is-plain-files.md),
    which supersedes Files as Truth and Retrieval Mode Is Internal).

    A file's **path is its identity** — the `path` every route takes and
    returns is relative to the knowledge root, `<collection>/…/<slug>.md`.
    There is no id anywhere in this contract. Frontmatter carries exactly
    `title`, `description`, `actor` (`agent` | `user`), `created_at` and
    `updated_at`, and those are the fields the wire shapes below expose.

    ## A collection is the only boundary

    A **collection** is a top-level subdirectory of the knowledge root and is
    one `knowledge` Resource. It is created deliberately, through
    `POST /api/v1/knowledge/collections` (or the CLI, or the UI) — a read, a
    write, or an agent's working directory never provisions one. There is no
    `global` scope, no `project-<ULID>` name and no cwd-derived anything: the
    collection exists so the Resource framework's **per-agent scope** can
    authorize it (spec knowledge FR-010…FR-012).

    A collection describes itself in the first paragraph of a `README.md` in
    its own directory — that paragraph is the `description` on `CollectionOut`.
    It is not stored in the database, so it cannot drift from what a person
    reading the folder sees.

    These routes are the **owner's** surface and are therefore unscoped:
    per-agent authorization governs what an agent sees through the MCP tools,
    not what the person who owns the vault sees in their own UI.

    ## Retrieval is a catalogue plus a literal matcher

    `GET /tree` walks **one level at a time** — a directory's immediate
    subdirectories and its files, each file with the `title` and `description`
    from its frontmatter. The catalogue is generated by walking the tree and
    reading frontmatter at call time; it is never materialized to a file or a
    table, so it cannot fall out of step with the disk.

    `GET /grep` runs ripgrep over the files and returns file, line number and
    matching line, bounded by `max_matches` and flagging `truncated`. It needs
    no tokenizer, so CJK matches like any other text. (Ripgrep is preferred,
    not required: a machine without `rg` runs the same search in a built-in
    Python walk with the same semantics.)

    `POST /search` is that same matcher over the same files, reported a
    **file** at a time rather than a line at a time — the path, its `title` and
    `description`, and the lines that matched. The two differ only in what they
    report. It is not a second retrieval tier: matching is literal and
    case-sensitive either way, there is no score, no rank and no retrieval
    *mode* anywhere on this surface, and nothing derived stands between a query
    and a file.

    `GET /file` returns a whole file. There is no chunking, no passage
    granularity and no `top_k`.

    ## Ingestion: one entrance beside the filesystem

    Putting a Markdown file in the directory stays a complete way to add
    knowledge, and the next `GET /tree`, `GET /grep` or `POST /search` sees it
    (FR-032). But the filesystem is only reachable while the person is sitting
    at the machine, so `POST /upload` converts a document — whatever
    `markitdown` handles, plus plain text and CSV — into an ordinary Markdown
    file in a collection, keeping the original under one hidden `.raw/` at the
    collection's root purely so a bad conversion can be redone (FR-033…FR-037).
    A channel doing the same thing from the person's phone is the other end of
    this path.

    Conversion is all that came back with it. There is still no converter
    registry to configure, no `source_mode` lock, no external-source tracking
    and no re-conversion on a schedule: a converted file has no `source_path`
    and no `source_sha256`, and is indistinguishable afterwards from one
    written by hand.

    ## Why there is no reindex or settings route

    - **No reindex.** Nothing is indexed, so nothing can be stale. An edit made
      in the person's own editor is live on the very next call, with no import
      step and nothing to reconcile (FR-001, FR-020).
    - **No check-sources / update-source.** External source tracking is gone
      with the index that motivated it.
    - **No embedding or per-scope settings.** A collection carries **no
      configuration at all** — `KnowledgeConfig` is empty and refuses unknown
      keys. There are no retrieval modes to pick, no chunk parameters and no
      embedding config, installation-wide or otherwise.

    The one setting the layer still has is installation-wide and lives
    elsewhere: whether the background tidy worker runs at all, on what interval,
    and on which machine (`auto_tidy_enabled`, `tidy_interval_s` and
    `tidy_owner_machine_id` on `internal_engine_config`, **off by default**,
    reached through the engine settings routes, out of scope for this
    contract).

    ## Why deleting a collection is not here

    There is deliberately **no** `DELETE /api/v1/knowledge/collections/{name}`.
    A collection's lifecycle is a Resource's lifecycle, so deletion goes
    through the kind-agnostic resource route,
    `DELETE /api/v1/resources/knowledge/{name}` (spec ui-shell, FR-060). That
    way unregistering a collection runs the same lifecycle, audit and cascade
    as unregistering any other resource, instead of a second path that would
    have to be kept in step with it. Creation gets its own route only because
    it returns the collection already projected as a `CollectionOut`.

    ## Tidy

    `POST /collections/{name}/tidy` runs one bounded agentic pass over a
    collection, driven by Coffer's internal model connection: it merges
    duplicates and rewrites them, copying each prior revision into the hidden
    `.history/` first. `.history/` is dot-prefixed, so an archived revision
    never comes back as a second grep hit. With no internal connection
    configured the pass is a clean no-op (`status: no_model`).

    ## Transport

    All routes are loopback-only and require the daemon's auth token in the
    `X-Coffer-Token` header (token from `~/.coffer/daemon.json`). Write routes
    additionally read an optional `X-Coffer-Actor` header. Every error response
    uses the app-wide envelope `{ "error": { code, message, details } }`.

    ## Reading this file against the code

    Component names mirror the Pydantic class names in
    `coffer/surfaces/http/knowledge/schemas.py`, so this contract can be diffed
    against the app's generated OpenAPI without a translation table. The only
    exception is `ErrorEnvelope`, a contract-only alias for the app-wide error
    shape.

servers:
  - url: http://127.0.0.1:8000
    description: Local daemon (default port; actual port read from daemon.json)

security:
  - cofferToken: []

tags:
  - name: knowledge
    description: |
      The single `knowledge` kind: collections, the catalogue, the two reports
      of one literal matcher (grep and search), reading and writing one file,
      uploading a document, and the manual tidy trigger.
      Mounted by `coffer.surfaces.http.knowledge` as one router with the prefix
      `/api/v1/knowledge`.

paths:
  # --- collections ----------------------------------------------------------

  /api/v1/knowledge/collections:
    get:
      summary: List collections
      description: |
        Every collection: the top-level folders under the knowledge root, each
        with the first paragraph of its `README.md` as `description` and a
        recursive count of the Markdown files it holds. Hidden entries
        (`.history/` and anything else dot-prefixed) are excluded.

        The list can legitimately be empty — nothing auto-provisions, so a
        fresh installation has no collections until someone creates one.
      operationId: listKnowledgeCollections
      tags: [knowledge]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionListOut"

    post:
      summary: Create a collection
      description: |
        Creates one collection: a directory under the knowledge root and one
        `knowledge` Resource for it, so the framework's per-agent scope has
        something to authorize. Nothing else creates one — not a read, not a
        write, not an agent's working directory (FR-010).

        `name` is a single path segment. Names that would escape the root
        (containing `/`, `\` or `..`, or dot-only) are rejected, as is a name
        already taken. A `description` is written into the new collection's
        `README.md`; omitted, the collection simply has no description until
        someone writes that README by hand.
      operationId: createKnowledgeCollection
      tags: [knowledge]
      parameters:
        - $ref: "#/components/parameters/ActorHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionOut"
        "400":
          $ref: "#/components/responses/UnsafePath"
        "409":
          $ref: "#/components/responses/AlreadyExists"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  # --- catalogue ------------------------------------------------------------

  /api/v1/knowledge/tree:
    get:
      summary: List one level of the catalogue
      description: |
        One level, not the whole tree: the immediate subdirectories of `path`
        and the Markdown files directly in it. Each file carries the `title`
        and `description` from its frontmatter, which is what makes the
        catalogue the retrieval surface — an agent descends it to choose *which
        file*, then greps to find *which line*.

        `path` is relative to the knowledge root; `shopee` is a collection,
        `shopee/account` a folder inside it. The catalogue is generated at call
        time by walking the directory and reading frontmatter, never
        materialized (FR-020, FR-021). Hidden entries are absent.
      operationId: readKnowledgeTree
      tags: [knowledge]
      parameters:
        - $ref: "#/components/parameters/TreePath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeOut"
        "400":
          $ref: "#/components/responses/UnsafePath"
        "404":
          $ref: "#/components/responses/CollectionNotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  # --- one file -------------------------------------------------------------

  /api/v1/knowledge/file:
    get:
      summary: Read a file
      description: |
        The file's full text, plus its frontmatter fields and the two absolute
        on-disk paths the UI needs to offer open-in-editor and
        reveal-in-file-manager on the file and on its folder (FR-062).

        Whole file, always: no chunking, no passage granularity, no `top_k`
        (FR-023). Bytes come off disk at call time, so an edit made in the
        person's own editor is what comes back.
      operationId: readKnowledgeFile
      tags: [knowledge]
      parameters:
        - $ref: "#/components/parameters/FilePath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileOut"
        "400":
          $ref: "#/components/responses/UnsafePath"
        "404":
          $ref: "#/components/responses/FileNotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

    put:
      summary: Write a file
      description: |
        Creates a file, or replaces an existing one. Exactly one of
        `directory` and `path` must be given: `directory` creates a new file
        there, with a human-readable slug derived from `title` (a collision
        appends a short suffix); `path` replaces the file already at that path.
        Giving both, or neither, is a 400.

        A write is a plain file write — no LLM, no conversion, no indexing step
        (FR-030). `description` is required, not optional: with no ranked index
        the catalogue is the retrieval surface, so a file that fails to
        describe itself is unfindable (FR-003).
      operationId: writeKnowledgeFile
      tags: [knowledge]
      parameters:
        - $ref: "#/components/parameters/ActorHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileWrite"
      responses:
        "200":
          description: Written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileOut"
        "400":
          $ref: "#/components/responses/UnsafePath"
        "404":
          $ref: "#/components/responses/FileNotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

    delete:
      summary: Delete a file
      description: |
        Removes the file from disk. There is nothing else to remove — no index
        row, no chunks, no embedding — so the deletion is complete when the
        file is gone. Recorded in the audit log with the actor.
      operationId: deleteKnowledgeFile
      tags: [knowledge]
      parameters:
        - $ref: "#/components/parameters/FilePath"
        - $ref: "#/components/parameters/ActorHeader"
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/UnsafePath"
        "404":
          $ref: "#/components/responses/FileNotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  # --- grep -----------------------------------------------------------------

  /api/v1/knowledge/grep:
    get:
      summary: Grep the files
      description: |
        Ripgrep over the Markdown files themselves — literal or regex,
        recursive, returning file, line number and matching line. There is no
        index; this *is* the search (FR-022, FR-024). No tokenizer is involved,
        so CJK content matches like anything else.

        `collection` narrows the run to one collection; omitted, it spans every
        collection. Matches stop at `max_matches` and `truncated` says whether
        they did. Hidden directories are skipped, so an archived revision under
        `.history/` never comes back beside the live file.
      operationId: grepKnowledge
      tags: [knowledge]
      parameters:
        - in: query
          name: pattern
          required: true
          description: Literal string or regular expression.
          schema: { type: string, minLength: 1 }
        - in: query
          name: collection
          required: false
          description: Restrict the run to one collection. Omitted, every collection is searched.
          schema:
            anyOf:
              - type: string
              - type: "null"
        - in: query
          name: max_matches
          required: false
          description: Upper bound on returned matches; `truncated` reports whether it was hit.
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrepOut"
        "400":
          $ref: "#/components/responses/GrepPatternInvalid"
        "404":
          $ref: "#/components/responses/CollectionNotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/EngineUnavailable"

  # --- search ---------------------------------------------------------------

  /api/v1/knowledge/search:
    post:
      summary: The files a phrase appears in
      description: |
        The same matcher `GET /grep` uses, over the same files, reported a
        **file** at a time instead of a line at a time: each hit is a path,
        the `title` and `description` from its frontmatter, and the lines that
        matched, so a caller can judge what it found before reading any of it
        (FR-024).

        There is no score, no ranking, no heading and no retrieval *mode* — no
        second way an answer can be reached. Matching is **literal and
        case-sensitive**, so a question phrased in the caller's own words finds
        nothing; give it a distinctive word or an exact phrase. It is confined
        to the files the caller may see and skips hidden directories
        (`.history/`, `.raw/`), and it sends a file's content nowhere: search
        runs entirely on this machine and needs no connection of any kind
        (FR-029).

        It is a POST because the query is a body rather than a path, not
        because anything is written.
      operationId: searchKnowledge
      tags: [knowledge]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: OK — an empty `results` when nothing matched, never an error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchOut"
        "400":
          $ref: "#/components/responses/GrepPatternInvalid"
        "404":
          $ref: "#/components/responses/CollectionNotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/EngineUnavailable"

  # --- ingestion ------------------------------------------------------------

  /api/v1/knowledge/upload:
    post:
      summary: Convert a document and file it into a collection
      description: |
        The entrance for a document the person did not write as Markdown
        (FR-033…FR-037). The file is converted, named from a readable slug of
        its title, given FR-003's frontmatter — `title` from the document
        falling back to its file name, `description` from the internal
        connection where one is configured and from the document's opening
        prose where not — and written into `collection` (optionally into
        `directory` inside it). Afterwards it is an ordinary Markdown file,
        indistinguishable from one written by hand.

        The bytes that were sent are kept under a single hidden `.raw/` at the
        **collection's root**, at the converted file's path relative to that
        root, so a bad conversion can be redone from the original. `.raw/` is
        excluded from the catalogue, from grep and from search, and is removed
        when its converted file is deleted. Coffer never re-converts it on a
        schedule and never tracks it as an external source.

        Supported inputs are exactly what `markitdown` handles (PDF, `.docx`,
        `.pptx`, `.xlsx`, `.xls`, HTML, EPUB) plus plain text, Markdown and
        CSV. The call is bounded: **one file**, a size ceiling, and a
        refusal that names the limit. All-or-nothing — a conversion failure
        leaves neither a Markdown file nor a `.raw/` original behind.

        Upload is deliberately **not** an agent tool (FR-040): a document
        enters through a human surface — this route, the CLI, or a channel that
        confirms the collection with its paired owner.
      operationId: uploadKnowledgeDocument
      tags: [knowledge]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, collection]
              properties:
                file:
                  type: string
                  format: binary
                  description: The document to convert. One per call.
                collection:
                  type: string
                  description: The collection it belongs in. Must already exist.
                directory:
                  type: string
                  description: A folder inside that collection. Omitted, the collection's top level.
      responses:
        "201":
          description: Converted and filed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestedDocumentOut"
        "400":
          $ref: "#/components/responses/IngestRejected"
        "404":
          $ref: "#/components/responses/CollectionNotFound"
        "413":
          $ref: "#/components/responses/UploadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/EngineUnavailable"

  # --- tidy -----------------------------------------------------------------

  /api/v1/knowledge/collections/{name}/tidy:
    post:
      summary: Run the tidy pass over one collection
      description: |
        One bounded agentic pass, driven by the internal model connection,
        whose tool surface is **four** operations — `list_files`, `read_file`,
        `write_file`, `delete_file`. A pass rewrites a collection, so it never
        needs `grep` or `search`, and it is not given the agents' own six. It
        merges
        duplicate notes and rewrites them into coherent documents, copying each
        prior revision into the hidden `.history/` before any overwrite
        (FR-050). With no index behind it, there is nothing to reconcile
        afterwards.

        This is the manual trigger — the UI button and `coffer knowledge
        organize` both land here. A background worker may also run the pass on
        an interval, governed by one installation-wide setting that is **off by
        default** and names the one machine allowed to run it (FR-051, FR-053).
        Only one pass per collection runs at a time, whoever started it
        (FR-056).

        `status` is `no_model` when no internal connection is configured (a
        clean no-op), `empty` when the collection holds nothing to tidy, and
        `ok` when a pass ran — `merged` and `rewritten` then count what it did.

        **One pass per collection at a time.** A request that arrives while a
        pass over the same collection is still running is refused with `409`
        rather than started: the two would be two writers over one directory,
        not one faster pass. Which collections are being rewritten right now is
        readable at `GET /api/v1/upkeep/runs` (spec mcp-gateway's contract), so
        a surface that mounts mid-pass shows the button as already running
        instead of inviting the second click.
      operationId: tidyKnowledgeCollection
      tags: [knowledge]
      parameters:
        - $ref: "#/components/parameters/CollectionName"
        - $ref: "#/components/parameters/ActorHeader"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TidyOut"
        "404":
          $ref: "#/components/responses/CollectionNotFound"
        "409":
          $ref: "#/components/responses/UpkeepAlreadyRunning"
        "422":
          $ref: "#/components/responses/ValidationFailed"

components:
  securitySchemes:
    cofferToken:
      type: apiKey
      in: header
      name: X-Coffer-Token

  parameters:
    CollectionName:
      in: path
      name: name
      required: true
      description: |
        The collection's name — which is also the Resource name and the
        top-level directory name under `~/.coffer/knowledge/`.
      schema: { type: string }
      examples:
        shopee: { value: shopee }
        coffer: { value: coffer }
    TreePath:
      in: query
      name: path
      required: true
      description: |
        A directory path relative to the knowledge root: a collection name, or
        a folder nested inside one. Required — there is a dedicated route for
        the collection list, so this one always names a level.
      schema: { type: string, minLength: 1 }
      examples:
        collection: { value: shopee }
        nested: { value: shopee/account }
    FilePath:
      in: query
      name: path
      required: true
      description: |
        A file path relative to the knowledge root, `<collection>/…/<slug>.md`.
        This is the file's identity; there is no id.
      schema: { type: string, minLength: 1 }
      examples:
        file: { value: shopee/account/session-ownership.md }
    ActorHeader:
      in: header
      name: X-Coffer-Actor
      required: false
      description: |
        Who is writing, for the audit trail and for the file's `actor`
        frontmatter. `agent` is recorded as such; anything else, an absent
        header included, is recorded as `user`.
      schema:
        type: string
        enum: [agent, user]

  responses:
    UnsafePath:
      description: |
        A path that escapes the knowledge root or names a hidden entry
        (`KNOWLEDGE_PATH_UNSAFE`), or a write that named both `path` and
        `directory` or neither. Hidden entries are refused rather than skipped:
        handing back a `.history/` revision would answer with content the live
        file has already replaced.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UpkeepAlreadyRunning:
      description: |
        A tidy pass over this collection is already in flight
        (`UPKEEP_ALREADY_RUNNING`). Refused rather than queued — the caller
        asked to start a pass, and no pass is going to start.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    AlreadyExists:
      description: A collection of that name already exists (`KNOWLEDGE_COLLECTION_EXISTS`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    CollectionNotFound:
      description: |
        No such collection (`KNOWLEDGE_COLLECTION_NOT_FOUND`). An unknown name
        is always an error — nothing is conjured into existence by being asked
        for (FR-010).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    FileNotFound:
      description: No file at that path (`KNOWLEDGE_FILE_NOT_FOUND`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    IngestRejected:
      description: |
        The document could not be converted (`INGEST_REJECTED`). `details`
        carries a `reason` — `unsupported_type` — and the rejected `doc_type`,
        so a surface can name the format it will not take instead of failing
        vaguely. Legacy `.doc`/`.ppt`, `.rtf` and `.odt` reach this case
        deliberately: no converter claims them, so they are refused cleanly
        rather than turned into a misleading conversion failure. Nothing
        half-converted is stored.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UploadTooLarge:
      description: |
        The upload is past the size ceiling (`KNOWLEDGE_UPLOAD_TOO_LARGE`).
        Refused before any conversion or write is attempted, naming the limit
        so the caller knows what to shrink below (FR-037).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    GrepPatternInvalid:
      description: |
        The matcher rejected the pattern (`GREP_PATTERN_INVALID`) — ripgrep
        exited 2, or the built-in fallback could not compile the regex. Without
        its own code this would masquerade as "no matches".
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    EngineUnavailable:
      description: |
        A binary or converter library the call needs is absent
        (`ENGINE_UNAVAILABLE`) — one of MarkItDown's format backends on an
        upload, or the search binary with no fallback available. The daemon
        stays up and the answer names the engine.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationFailed:
      description: Request schema validation failed (FastAPI's `HTTPValidationError` shape).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    CollectionOut:
      type: object
      description: One collection, as the catalogue's top level sees it.
      required: [name, description, file_count]
      properties:
        name:
          type: string
          description: The directory name under the knowledge root, and the Resource name.
        description:
          type: string
          description: |
            The first paragraph of the collection's `README.md`, empty when
            there is none. Never stored in the database (FR-013).
        file_count:
          type: integer
          description: Markdown files in the collection, counted recursively, hidden entries excluded.
      example:
        name: shopee
        description: Internal systems at Shopee — services, data plane, the chains between them.
        file_count: 48

    CollectionListOut:
      type: object
      required: [collections]
      properties:
        collections:
          type: array
          items:
            $ref: "#/components/schemas/CollectionOut"

    CollectionCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: One path segment. No `/`, no `\`, no `..`, not dot-only.
        description:
          anyOf:
            - type: string
            - type: "null"
          description: |
            Written into the new collection's `README.md` as its first
            paragraph. Omitted, the collection has no description until someone
            writes that README themselves.
      example:
        name: shopee
        description: Internal systems at Shopee — services, data plane, the chains between them.

    DirectoryOut:
      type: object
      description: A subdirectory at the level being listed.
      required: [path, name, file_count]
      properties:
        path:
          type: string
          description: Path relative to the knowledge root — pass it back to `GET /tree` to descend.
        name:
          type: string
          description: The directory's own name.
        file_count:
          type: integer
          description: Markdown files beneath it, counted recursively.

    FileSummaryOut:
      type: object
      description: |
        One file as the catalogue shows it — enough for an agent to judge
        relevance without reading the body.
      required: [path, title, description, actor, updated_at]
      properties:
        path:
          type: string
          description: Path relative to the knowledge root. The file's identity.
        title:
          type: string
        description:
          type: string
          description: What makes the file findable. Required on write (FR-003).
        actor:
          type: string
          enum: [agent, user]
          description: Who last wrote it.
        updated_at:
          type: string
          description: ISO-8601 timestamp from frontmatter.

    TreeOut:
      type: object
      description: One level of the catalogue — never the whole tree.
      required: [path, directories, files]
      properties:
        path:
          type: string
          description: The level that was listed, relative to the knowledge root.
        directories:
          type: array
          items:
            $ref: "#/components/schemas/DirectoryOut"
        files:
          type: array
          items:
            $ref: "#/components/schemas/FileSummaryOut"

    FileOut:
      type: object
      description: |
        One file in full: its frontmatter, its body, and the absolute paths the
        UI needs for open-in-editor and reveal-in-file-manager.
      required:
        [
          path,
          title,
          description,
          actor,
          created_at,
          updated_at,
          body,
          file_path,
          folder_path,
        ]
      properties:
        path:
          type: string
          description: Path relative to the knowledge root. The file's identity.
        title:
          type: string
        description:
          type: string
        actor:
          type: string
          enum: [agent, user]
        created_at:
          type: string
        updated_at:
          type: string
        body:
          type: string
          description: The Markdown body, frontmatter stripped.
        file_path:
          type: string
          description: Absolute on-disk path of the file (FR-062).
        folder_path:
          type: string
          description: Absolute on-disk path of its containing folder (FR-062).

    FileWrite:
      type: object
      description: |
        Create a file, or replace one. Exactly one of `directory` and `path`.
      required: [title, description]
      properties:
        title:
          type: string
          minLength: 1
          description: Also the source of the file name when creating — a readable slug, not a ULID.
        description:
          type: string
          minLength: 1
          description: |
            Required. With no ranked index the catalogue is the retrieval
            surface, so a file that fails to describe itself is unfindable
            (FR-003).
        body:
          type: string
          default: ""
          description: The Markdown body. Frontmatter is written by the layer, not supplied here.
        directory:
          anyOf:
            - type: string
            - type: "null"
          description: Collection or nested folder to create the file in.
        path:
          anyOf:
            - type: string
            - type: "null"
          description: Existing file to replace, relative to the knowledge root.
      example:
        title: Session ownership
        description: Which service owns a login session, and what reads it.
        body: |
          Login state is owned by `account.session`.
        directory: shopee/account

    GrepMatchOut:
      type: object
      required: [path, line_number, line]
      properties:
        path:
          type: string
          description: Path relative to the knowledge root.
        line_number:
          type: integer
        line:
          type: string
          description: The matching line, as it is on disk.

    GrepOut:
      type: object
      required: [matches, truncated]
      properties:
        matches:
          type: array
          items:
            $ref: "#/components/schemas/GrepMatchOut"
        truncated:
          type: boolean
          description: True when `max_matches` cut the result short.

    SearchRequest:
      type: object
      description: |
        A literal, case-sensitive query. `collection` narrows it to one
        collection; omitted, every collection the caller may see is searched.
      required: [query]
      properties:
        query: { type: string, minLength: 1 }
        collection:
          anyOf:
            - type: string
            - type: "null"

    SearchLineOut:
      type: object
      description: One matching line inside a hit.
      required: [line_number, line]
      properties:
        line_number: { type: integer }
        line: { type: string }

    SearchHitOut:
      type: object
      description: |
        One matching **file** — its path, the frontmatter that says what it is,
        and the lines that matched, so a caller can judge it before reading it.
      required: [path, title, description, lines]
      properties:
        path: { type: string, description: Relative to the knowledge root. }
        title: { type: string }
        description: { type: string }
        lines:
          type: array
          items:
            $ref: "#/components/schemas/SearchLineOut"

    SearchOut:
      type: object
      description: |
        One entry per matching file, bounded to a handful of files and a few
        matched lines each. There is no retrieval mode a caller picks and none
        the answer reports, and no score or rank on any entry (FR-024).
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchHitOut"

    IngestedDocumentOut:
      type: object
      description: |
        The converted document, as an ordinary file in the collection. Note
        `converter` is reported here and written **nowhere on disk** — a file
        that has landed is just a file, and FR-003's frontmatter carries five
        keys and nothing else.
      required: [path, title, description, converter, raw_path]
      properties:
        path:
          type: string
          description: The converted Markdown file, relative to the knowledge root.
        title: { type: string }
        description: { type: string }
        converter:
          type: string
          description: Which converter produced this file.
        raw_path:
          type: string
          description: The kept original under the collection's hidden `.raw/` (FR-035).

    TidyOut:
      type: object
      required: [status, collection]
      properties:
        status:
          type: string
          enum: [ok, empty, no_model]
          description: |
            `no_model` when no internal connection is configured — a clean
            no-op, never an error. `empty` when there was nothing to tidy.
        collection:
          type: string
        merged:
          type: integer
          default: 0
          description: Files folded into another during the pass.
        rewritten:
          type: integer
          default: 0
          description: Files rewritten, each with its prior revision archived into `.history/`.

    ErrorEnvelope:
      type: object
      description: |
        The app-wide error shape (`surfaces/http/errors.py`). Contract-only
        alias — there is no Pydantic model of this name.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: e.g. `KNOWLEDGE_COLLECTION_NOT_FOUND`, `KNOWLEDGE_PATH_UNSAFE`.
            message:
              type: string
            details:
              type: object
