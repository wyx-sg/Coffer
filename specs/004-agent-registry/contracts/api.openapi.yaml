openapi: 3.1.0
info:
  title: Coffer — Agent Registry API
  version: "0.1.0"
  description: |
    Agent registry endpoints. Merged into the main Coffer Management API at
    runtime; this document scopes only the agent-specific routes added by
    spec 004.

    All routes use the same `X-Coffer-Token` authentication from
    `specs/001-mcp-gateway/contracts/api.openapi.yaml`.

servers:
  - url: http://127.0.0.1:{port}/api/v1
    variables:
      port:
        default: "8000"

security:
  - cofferToken: []

tags:
  - name: agents
    description: Local AI agent registry

paths:
  /agents:
    get:
      tags: [agents]
      operationId: listAgents
      summary: List registered agents
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AgentOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [agents]
      operationId: registerAgent
      summary: Register a new agent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentOut" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /agents/{name}:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string }
    get:
      tags: [agents]
      operationId: getAgent
      summary: Get one agent
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [agents]
      operationId: updateAgent
      summary: Update an agent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentPatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentOut" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [agents]
      operationId: deleteAgent
      summary: Remove an agent
      responses:
        "204":
          description: No Content
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /agents/candidates:
    get:
      tags: [agents]
      operationId: listAgentCandidates
      summary: Discover installed-but-unregistered agents
      description: |
        Read-only discovery: scans known install markers for each supported
        agent type and returns the ones that are installed but not yet
        registered, as candidates. Registers nothing — the user reviews the
        candidates and chooses which to add (discovery + confirm). A removed
        agent re-appears here on the next scan; there is no suppression list.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentCandidatesOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /agents/{name}/config-files:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string }
    get:
      tags: [agents]
      operationId: listAgentConfigFiles
      summary: List an agent's curated config files
      description: |
        Returns the curated config-file allowlist for the agent's type, each
        with its key, display name, resolved absolute path, containing-folder
        absolute path (`folder_path`), format, and existence metadata. The set
        is fixed per agent type; files that do not exist yet are listed with
        `exists=false`. The `path`/`folder_path` pair backs the read-only UI's
        open-in-external-editor / reveal-in-file-manager
        affordances (FR-038).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ConfigFileInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /agents/{name}/config-files/{key}:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string }
      - in: path
        name: key
        required: true
        schema: { type: string }
        description: Allowlisted config-file key (e.g. settings, global, instructions, config).
    get:
      tags: [agents]
      operationId: readAgentConfigFile
      summary: Read one config file's content
      description: |
        Returns the file's text content, its resolved absolute path and
        containing-folder path (`folder_path`), format, existence, and a content
        fingerprint for optimistic-concurrency writes (FR-036). The in-app UI
        renders this content read-only; the `path`/`folder_path` pair backs the
        open-in-external-editor / reveal affordances (FR-038). A
        file that does not exist returns empty content with `exists=false` and
        `fingerprint=""` and is not created. A key outside the agent type's
        allowlist returns 404.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigFileContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [agents]
      operationId: writeAgentConfigFile
      summary: Save one config file's content
      description: |
        Validates the content against the file's format, then writes it
        atomically (temp file + rename), keeping a `.bak` of the prior content.
        Malformed `json`/`toml` content returns 422 and leaves the on-disk file
        unchanged. A key outside the agent type's allowlist returns 404 and
        performs no filesystem access. When `expected_fingerprint` is supplied
        and the on-disk content changed since the read, the write is rejected
        with 409 (`CONFIG_FILE_STALE`) and the file is left untouched (FR-036).
        Records an `agent_config_file_written` audit entry on success. Returns
        the refreshed metadata view.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigFileWrite" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigFileInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /agents/{name}/config-files/{key}/files/{relpath}:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string }
      - in: path
        name: key
        required: true
        schema: { type: string }
        description: Allowlisted directory-entry key (e.g. subagents).
      - in: path
        name: relpath
        required: true
        schema: { type: string }
        description: >-
          Entry-relative POSIX path of the child file (nested paths allowed,
          e.g. `review/security.md`). Validated server-side before any
          filesystem access: no `..`, no absolute paths, no backslashes, no
          hidden segments, `.md` extension required (FR-035). An invalid path
          returns 404 or 422 without touching disk.
    get:
      tags: [agents]
      operationId: readAgentConfigDirFile
      summary: Read one child file of a directory config entry
      description: |
        Returns the child file's text content, its resolved absolute path and
        containing-folder path (`folder_path`), format, existence, and content
        fingerprint, like the single-file read. The in-app UI renders this
        content read-only (`path`/`folder_path` back open-in-editor / reveal,
        FR-038). A child that does not exist returns empty content
        with `exists=false` and is not created.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigFileContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    put:
      tags: [agents]
      operationId: writeAgentConfigDirFile
      summary: Save (create-on-write) one child file of a directory config entry
      description: |
        Same machinery as the single-file write: format validation, atomic
        write + `.bak`, optional `expected_fingerprint` (stale → 409), audited
        as `agent_config_file_written`. A missing child file is created
        (create-on-write), including intermediate subdirectories.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigFileWrite" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigFileInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [agents]
      operationId: deleteAgentConfigDirFile
      summary: Delete one child file of a directory config entry
      description: |
        Removes the child file from disk, preserving the prior content as
        `<path>.bak`. Audited as `agent_config_file_deleted`. Deleting a child
        that does not exist returns 404.
      responses:
        "204":
          description: No Content
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /agents/{name}/mcp-entries:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string }
    get:
      tags: [agents]
      operationId: listAgentMcpEntries
      summary: List the MCP server entries in the agent's own config files
      description: |
        Derived at read time from the agent's MCP-bearing config files
        (claude_code: `~/.claude.json` + `settings.json` `mcpServers`; codex:
        `config.toml` `[mcp_servers.*]`) — nothing is stored (FR-025). Env and
        header VALUES never cross HTTP: each entry exposes key names only,
        plus which keys look secret-like. A file that fails to parse degrades
        to an entry in `parse_errors` instead of failing the view (FR-030).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpEntriesOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /agents/{name}/mcp-entries/{entry}:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string }
      - in: path
        name: entry
        required: true
        schema: { type: string }
        description: MCP entry name as it appears in the agent's config file.
    patch:
      tags: [agents]
      operationId: toggleAgentMcpEntry
      summary: Enable or disable one MCP entry in place (Codex only)
      description: |
        Sets the entry's `enabled` flag in `config.toml` (FR-027). For
        `claude_code`, whose format has no per-entry flag, the toggle is
        rejected with 422 (`MCP_ENTRY_TOGGLE_UNSUPPORTED`). The `coffer`
        entry is protected (422, `MCP_ENTRY_PROTECTED`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/McpEntryPatch" }
      responses:
        "204":
          description: No Content
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [agents]
      operationId: deleteAgentMcpEntry
      summary: Remove one MCP entry from the agent's config file
      description: |
        Edits only the entry's source file with the atomic-write + `.bak`
        machinery and records an `agent_mcp_entry_removed` audit entry
        (FR-026). When the same name exists in several files (claude_code),
        the `source` query parameter disambiguates; omitting it then is
        rejected with 422 (`MCP_ENTRY_SOURCE_AMBIGUOUS`). The `coffer` entry
        is not removable here (422, `MCP_ENTRY_PROTECTED`) — it is managed by
        the `/mcp-install` operations.
      parameters:
        - in: query
          name: source
          required: false
          schema: { type: string }
          description: Config-file key the entry lives in, when ambiguous.
      responses:
        "204":
          description: No Content
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /agents/{name}/mcp-entries/{entry}/adopt:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string }
      - in: path
        name: entry
        required: true
        schema: { type: string }
    post:
      tags: [agents]
      operationId: adoptAgentMcpEntry
      summary: Adopt a direct MCP entry into Coffer as a managed mcp_server resource
      description: |
        Registers the entry as an `mcp_server` resource, verifies the resource
        reads back, then removes the source entry — strictly in that order;
        any failure rolls back a created resource and leaves the agent's
        config byte-identical (FR-028). Secret-looking env/header keys MUST be
        mapped to keychain refs via `secrets`, or the request is rejected with
        422 (`ADOPT_SECRET_UNRESOLVED`) listing the unresolved keys; mapped
        values go into the OS keychain, never into resource config (FR-029).
        A name collision returns 409 with `details.suggested_name`. The
        `coffer` entry is never adoptable. Audited as
        `agent_mcp_entry_adopted`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/McpEntryAdopt" }
      responses:
        "201":
          description: Adopted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdoptedResource" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            Name collision with an existing mcp_server resource; the error
            envelope's `details.suggested_name` carries a suggested
            alternative.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorOut" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /agents/{name}/plugins:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string }
    get:
      tags: [agents]
      operationId: listAgentPlugins
      summary: List the agent's installed plugins and known marketplaces
      description: |
        Derived at read time, never stored (FR-031). For `codex` the listing
        comes from `config.toml` (`[plugins.*]`, `[marketplaces.*]`) plus
        presence of the documented cache directory; for `claude_code` the
        inventory is read-only from `installed_plugins.json` /
        `known_marketplaces.json`, with enabled state from `settings.json`
        `enabledPlugins`. Parse failures degrade to `parse_errors` (FR-030).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginsOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /agents/{name}/plugins/{pluginId}:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string }
      - in: path
        name: pluginId
        required: true
        schema: { type: string }
        description: Plugin id, `<name>@<marketplace>`.
    patch:
      tags: [agents]
      operationId: toggleAgentPlugin
      summary: Enable or disable a plugin
      description: |
        Writes only the documented config surface — the Codex entry's
        `enabled` field in `config.toml`; the Claude Code `enabledPlugins`
        map in `settings.json` — and never the agents' internal state files
        (FR-032). Audited as `agent_plugin_toggled`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PluginPatch" }
      responses:
        "204":
          description: No Content
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [agents]
      operationId: uninstallAgentPlugin
      summary: Uninstall a plugin
      description: |
        Uninstalls a plugin, dispatching on the agent's uninstall strategy.
        For Codex, removes the `[plugins."…"]` entry from `config.toml` and
        deletes the plugin's cache directory. For Claude Code, delegates to
        `claude plugin uninstall <id>` — Coffer never hand-writes Claude's
        internal `installed_plugins.json`; the CLI owns that state. Audited as
        `agent_plugin_uninstalled` (FR-033). Rejected with 422
        (`PLUGIN_UNINSTALL_UNSUPPORTED`) when the agent can't uninstall or the
        required CLI is not on PATH; a CLI uninstall that errors returns 422
        (`PLUGIN_UNINSTALL_FAILED`) with the CLI's message.
      responses:
        "204":
          description: No Content
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /agents/{name}/mcp-install:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string }
    get:
      tags: [agents]
      operationId: getAgentMcpInstallStatus
      summary: Whether Coffer's MCP is installed in this agent
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpInstallStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [agents]
      operationId: installAgentMcp
      summary: Install Coffer's MCP server into this agent
      description: |
        Writes a `coffer` stdio MCP-server entry (command = absolute path to
        coffer-mcp-shim) into the agent's MCP config file, atomically and with
        a `.bak` backup. Idempotent — re-installing updates the entry in place.
        Returns 422 if the coffer-mcp-shim binary cannot be resolved.
      responses:
        "200":
          description: Installed (or already installed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpInstallStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [agents]
      operationId: uninstallAgentMcp
      summary: Remove Coffer's MCP server entry from this agent
      description: Removes the `coffer` entry. No-op success when not installed.
      responses:
        "200":
          description: Uninstalled (or was not installed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpInstallStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /agents/{name}/native-memory:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string }
    get:
      tags: [agents]
      operationId: listAgentNativeMemory
      summary: List the agent's OWN native per-project memory stores
      description: |
        Read-only scan of the coding agent's own native per-project memory —
        distinct from the `instructions` config files of FR-013 (CLAUDE.md /
        AGENTS.md are human-authored instructions; this is the agent's
        self-written memory store). For `claude_code` these live at
        `<config_dir>/projects/<slug>/memory/*.md` (FR-040). Each store carries
        a readable `project` label decoded from the slug, a best-effort decoded
        `path` (the slug decode is lossy and may be null), the real
        `memory_dir`, and an `item_count` of `.md` files excluding `MEMORY.md`.
        Derived at read time, never stored; the agent's store is never written.
        An agent type with no native memory layout (`codex`), or one whose
        `projects/` directory is absent, returns an empty list. Read-only —
        emits no audit event (FR-011).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NativeMemoryListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /agents/{name}/native-memory/import:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string }
    post:
      tags: [agents]
      operationId: importAgentNativeMemory
      summary: Adopt a native memory store into the matching Coffer project memory
      description: |
        Reads the store's fact files (skipping `MEMORY.md`), resolves the REAL
        project path — the decoded slug when it exists on disk, else the `cwd`
        recorded in a sibling transcript `.jsonl` (the slug decode is lossy) —
        and writes each fact as a project-scoped Coffer memory fact into the
        project store's `knowledge/inbox/` lane (like a batch of `remember`s; a
        trusted import may write a note up to the 32768-character domain
        ceiling). It then triggers spec 007's organizer as a BACKGROUND task —
        a bulk import is dozens of sequential internal-LLM calls and must not
        block the request (FR-041). The imported facts audit through spec 007's
        existing memory write events; the import adds no new 004 audit event. A
        store outside any git project (no mappable Coffer project) yields
        `imported=0`, `store=null`, `project_path=null`, `organized=false` — it
        corrupts no inbox and is not an error.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NativeMemoryImportRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NativeMemoryImportResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /fs/browse:
    get:
      tags: [fs]
      operationId: browseFilesystem
      summary: List the subdirectories of a local directory
      description: |
        Read-only filesystem browse backing the web folder picker for choosing
        an agent's config directory (a browser can't read absolute paths, but
        the loopback daemon can). Returns a directory's path, its parent, and
        its immediate subdirectories only — never file contents.
      parameters:
        - in: query
          name: path
          required: false
          schema: { type: string }
          description: Directory to list. Defaults to the user's home directory.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FsBrowseOut" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /fs/open:
    post:
      tags: [fs]
      operationId: openFilesystemPath
      summary: Open a local path in an application
      description: |
        Open an existing absolute path (a managed file or its folder) in an
        application — the preferred editor (`with`) or the OS default. Backs the
        read-only file viewers' "open in editor" action on the web, where a
        browser can't reach the OS but the loopback daemon — always on the user's
        own machine — can (ADR-033). Validated absolute-and-existing before any
        launch; creates nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FsOpenRequest" }
      responses:
        "204": { description: The launcher was spawned. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /fs/reveal:
    post:
      tags: [fs]
      operationId: revealFilesystemPath
      summary: Reveal a local path in the OS file manager
      description: |
        Select / reveal an existing absolute path in the OS file manager (Finder /
        Explorer; on Linux, where there is no portable "select", the containing
        folder is opened). Backs the read-only file viewers' "reveal" action on
        the web via the loopback daemon (ADR-033). Validated absolute-and-existing;
        creates nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FsRevealRequest" }
      responses:
        "204": { description: The file manager was opened. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /fs/editors:
    get:
      tags: [fs]
      operationId: listEditors
      summary: List GUI editors installed on this machine
      description: |
        Enumerate common GUI code editors detected as installed, for the
        preferred-editor picker in Settings (spec 002-ui-shell). Detection is
        per-OS: macOS returns app-bundle names (for `open -a`), Linux/Windows
        return commands found on PATH. The returned `value` is exactly what
        `/fs/open`'s `with` field accepts. The chosen preference itself stays
        client-side (localStorage); this endpoint only lists candidates.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FsEditorsOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /fs/pick-folder:
    post:
      tags: [fs]
      operationId: pickFolder
      summary: Open the host's native folder dialog
      description: |
        Open the OS-native directory dialog via the loopback daemon (macOS
        `osascript`, Linux `zenity`/`kdialog`) and return the chosen absolute
        path. A web browser cannot open a native dialog, so this is the daemon
        counterpart to the in-app folder browser (`/fs/browse`). `available:false`
        means this host has no native dialog tool (caller falls back to the in-app
        browser); `available:true` with `path:null` means the user cancelled.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FsPickFolderRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FsPickFolderOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /fs/pick-file:
    post:
      tags: [fs]
      operationId: pickFile
      summary: Open the host's native open-file dialog
      description: |
        Open the OS-native open-file dialog via the loopback daemon (macOS
        `osascript`, Linux `zenity`/`kdialog`) and return the chosen absolute
        file path (ADR-036). `available:false` means this host has no native
        dialog tool (caller falls back to a typed path); `available:true` with
        `path:null` means the user cancelled.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FsPickFileRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FsFilePickOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /fs/save-file:
    post:
      tags: [fs]
      operationId: saveFile
      summary: Open the host's native save-file dialog
      description: |
        Open the OS-native save-file dialog via the loopback daemon (macOS
        `osascript`, Linux `zenity`/`kdialog`) with an optional suggested file
        name and return the chosen destination path (ADR-036). `available:false`
        means this host has no native dialog tool (caller falls back to a typed
        path); `available:true` with `path:null` means the user cancelled.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FsSaveFileRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FsFilePickOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    cofferToken:
      type: apiKey
      in: header
      name: X-Coffer-Token

  schemas:
    AgentType:
      type: string
      enum: [claude_code, codex]
      description: >
        Supported agent product identifiers (v1). Each value covers both the
        CLI and the app/IDE form of that product (shared config directory).

    AgentCreate:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type: { $ref: "#/components/schemas/AgentType" }
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[a-zA-Z0-9_-]+$"
          description: >-
            Optional. When omitted the server derives a stable default from the
            type (underscores become hyphens, e.g. claude_code -> claude-code).
        config_dir:
          type: string
          description: >-
            Optional absolute path overriding the type's standard config
            directory (~/.claude, ~/.codex). Skills are delivered to
            <config_dir>/skills, which is auto-created at registration.
        description:
          type: string
          nullable: true

    AgentPatch:
      type: object
      additionalProperties: false
      properties:
        config_dir: { type: string }
        description: { type: string, nullable: true }
        follow_all_skills:
          type: boolean
          description: >-
            Follow-master-library policy flag (spec 005 FR-025). Fields absent
            from the PATCH body are preserved unchanged.
        skill_exclusions:
          type: array
          items: { type: string }
          description: >-
            Skill names excluded from delivery while following. Replaces the
            whole list when present.

    AgentOut:
      type: object
      required:
        [
          name,
          type,
          config_dir,
          follow_all_skills,
          skill_exclusions,
          created_at,
          updated_at,
        ]
      properties:
        name: { type: string }
        type: { $ref: "#/components/schemas/AgentType" }
        config_dir:
          {
            type: string,
            description: "Resolved config directory (the type's standard location unless overridden) — where the agent's config files live and skills are delivered under <config_dir>/skills.",
          }
        description: { type: string, nullable: true }
        follow_all_skills:
          type: boolean
          description: "Follow-master-library policy flag (spec 005 FR-025). Defaults to true for newly registered agents."
        skill_exclusions:
          type: array
          items: { type: string }
          description: "Skill names excluded from delivery while following."
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AgentCandidate:
      type: object
      required:
        [type, display_name, config_dir, default_skill_dir, suggested_name]
      description: >-
        An installed-but-unregistered agent surfaced by discovery. Derived at
        scan time, never stored; the user confirms it to register.
      properties:
        type: { $ref: "#/components/schemas/AgentType" }
        display_name: { type: string }
        config_dir:
          {
            type: string,
            description: "The type's standard config directory on disk (~/.claude, ~/.codex).",
          }
        default_skill_dir:
          {
            type: string,
            description: "Where skills are delivered for this candidate: <config_dir>/skills.",
          }
        suggested_name:
          {
            type: string,
            description: "Default resource name (e.g. claude-code).",
          }

    AgentCandidatesOut:
      type: object
      required: [candidates]
      properties:
        candidates:
          type: array
          items: { $ref: "#/components/schemas/AgentCandidate" }

    ConfigFileFormat:
      type: string
      enum: [json, toml, markdown, text]
      description: Validation/format of a config file.

    ConfigFileKind:
      type: string
      enum: [file, directory]
      description: >-
        Whether an allowlist entry is a single file or a directory of files
        (FR-034). For directory entries, `format` describes the CHILD files.

    DirChild:
      type: object
      required: [relpath, size, modified_at]
      description: One child file of a directory-type config entry.
      properties:
        relpath:
          {
            type: string,
            description: "POSIX path relative to the entry's directory root.",
          }
        size: { type: integer }
        modified_at: { type: string, format: date-time }

    ConfigFileInfo:
      type: object
      required: [key, display_name, path, folder_path, format, kind, exists]
      properties:
        key:
          {
            type: string,
            description: "Stable allowlist key (e.g. settings, global, instructions, subagents, config, hooks).",
          }
        display_name: { type: string }
        path:
          {
            type: string,
            description: "Resolved absolute path of the file (or directory, for kind=directory entries).",
          }
        folder_path:
          type: string
          description: >-
            Absolute path of the file's containing folder (its parent
            directory). The in-app viewer is read-only; the `path`/`folder_path`
            pair backs open-in-external-editor / reveal-in-file-manager
            (FR-038).
        format: { $ref: "#/components/schemas/ConfigFileFormat" }
        kind: { $ref: "#/components/schemas/ConfigFileKind" }
        exists: { type: boolean }
        size:
          type: integer
          nullable: true
          description: "Byte size when the file exists; null otherwise."
        modified_at:
          type: string
          format: date-time
          nullable: true
          description: "Last-modified time when the file exists; null otherwise."
        files:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/DirChild" }
          description: >-
            Child files for kind=directory entries (recursive `.md` listing,
            sorted by relpath); null for kind=file entries. A missing
            directory lists as exists=false with no files.

    ConfigFileContent:
      type: object
      required:
        [
          key,
          path,
          folder_path,
          format,
          exists,
          content,
          fingerprint,
          memory_block,
        ]
      properties:
        key: { type: string }
        path:
          type: string
          description: >-
            Resolved absolute path of the file on disk (for a directory child,
            the resolved absolute path of that child). The in-app viewer is
            read-only; this path backs open-in-external-editor /
            reveal-in-file-manager (FR-038).
        folder_path:
          type: string
          description: "Absolute path of the file's containing folder (FR-038)."
        format: { $ref: "#/components/schemas/ConfigFileFormat" }
        exists: { type: boolean }
        content:
          type: string
          description: "File text; empty string when the file does not exist."
        fingerprint:
          type: string
          description: >-
            Content fingerprint for optimistic-concurrency writes (FR-036);
            empty string when the file does not exist.
        memory_block:
          type: boolean
          description: >-
            True when the file contains the managed memory-projection block
            marker owned by spec 007 (FR-037) — the editor surfaces a notice,
            never parses the block.

    ConfigFileWrite:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: "New file text. Validated against the file's format before writing."
        expected_fingerprint:
          type: string
          nullable: true
          description: >-
            Fingerprint from the prior read. When supplied and the on-disk
            content changed since, the write is rejected with 409
            (`CONFIG_FILE_STALE`) and the file is left untouched (FR-036).

    ParseError:
      type: object
      required: [source, path, error]
      description: >-
        One agent config file that failed to parse — the facet degrades to
        this explicit state instead of failing the view (FR-030).
      properties:
        source: { type: string, description: "Allowlist key of the file." }
        path: { type: string, description: "Resolved absolute path." }
        error: { type: string, description: "Parser error message." }

    McpEntry:
      type: object
      required:
        [
          name,
          source,
          transport,
          command,
          args,
          env_keys,
          secret_keys,
          url,
          header_keys,
          enabled,
          is_coffer,
          matches_resource,
        ]
      description: >-
        One MCP server entry as configured in the agent's own file — derived
        at read time, never stored. Env/header VALUES never cross HTTP; only
        key names are exposed.
      properties:
        name: { type: string }
        source:
          { type: string, description: "Allowlist key of the source file." }
        transport: { type: string, enum: [stdio, http] }
        command: { type: string, nullable: true }
        args:
          type: array
          items: { type: string }
        env_keys:
          type: array
          items: { type: string }
          description: "Env variable KEY NAMES only (sorted); values stay on disk."
        secret_keys:
          type: array
          items: { type: string }
          description: >-
            Env/header key names that look secret-like (TOKEN, SECRET,
            PASSWORD, API_KEY, CREDENTIAL, AUTHORIZATION patterns). These must
            be mapped to keychain refs on adopt.
        url: { type: string, nullable: true }
        header_keys:
          type: array
          items: { type: string }
          description: "HTTP header KEY NAMES only (sorted); values stay on disk."
        enabled:
          type: boolean
          nullable: true
          description: >-
            Per-entry enabled flag where the format defines one (Codex);
            null for claude_code, whose format has no per-entry flag.
        is_coffer:
          type: boolean
          description: "True for Coffer's own gateway entry (protected)."
        matches_resource:
          type: string
          nullable: true
          description: >-
            Name of an equivalent registered mcp_server resource, when one
            exists — the user can remove the duplicate instead of adopting.

    McpEntriesOut:
      type: object
      required: [items, parse_errors]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/McpEntry" }
        parse_errors:
          type: array
          items: { $ref: "#/components/schemas/ParseError" }

    McpEntryPatch:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled: { type: boolean }

    McpEntryAdopt:
      type: object
      additionalProperties: false
      properties:
        source:
          type: string
          nullable: true
          description: "Config-file key the entry lives in, when ambiguous."
        new_name:
          type: string
          nullable: true
          description: "Register the resource under this name instead (e.g. after a 409)."
        secrets:
          type: object
          nullable: true
          additionalProperties: { type: string }
          description: >-
            Maps secret-looking env/header KEY names to keychain refs; the
            VALUES go into the OS keychain server-side, never into the
            resource config (FR-029).

    AdoptedResource:
      type: object
      required: [kind, name]
      properties:
        kind: { type: string, example: mcp_server }
        name: { type: string }

    Plugin:
      type: object
      required: [id, name, marketplace, enabled, cache_present]
      description: One installed plugin — derived at read time, never stored.
      properties:
        id: { type: string, description: "`<name>@<marketplace>`." }
        name: { type: string }
        marketplace: { type: string }
        enabled: { type: boolean }
        cache_present:
          type: boolean
          description: >-
            Whether the plugin's cache directory is present on disk; false
            flags a configured-without-cache plugin (no repair is attempted).
        version:
          type: string
          nullable: true
          description: Installed version, when the inventory records one (Claude).
        description:
          type: string
          nullable: true
          description: From the plugin's `.claude-plugin/plugin.json` manifest.
        author:
          type: string
          nullable: true
          description: Author name from the manifest (object `name` or bare string).
        homepage:
          type: string
          nullable: true
          description: Manifest `homepage`, falling back to `repository`.
        skills:
          type: array
          items: { type: string }
          description: Names of skills the plugin bundles (its `skills/` subfolders).
        commands:
          type: array
          items: { type: string }
          description: Names of slash-commands the plugin bundles (`commands/*.md`).
        mcp_servers:
          type: array
          items: { type: string }
          description: Names of MCP servers the plugin bundles (its `.mcp.json`).

    Marketplace:
      type: object
      required: [name]
      properties:
        name: { type: string }
        source_type: { type: string, nullable: true }
        source: { type: string, nullable: true }

    PluginsOut:
      type: object
      required: [items, marketplaces, parse_errors]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Plugin" }
        marketplaces:
          type: array
          items: { $ref: "#/components/schemas/Marketplace" }
        parse_errors:
          type: array
          items: { $ref: "#/components/schemas/ParseError" }
        can_uninstall:
          type: boolean
          default: false
          description: >-
            Whether in-app uninstall is available for this agent now — the
            capability allows it AND, for CLI-strategy agents (Claude Code), the
            agent's plugin CLI is on PATH. Drives the UI's uninstall affordance.

    PluginPatch:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled: { type: boolean }

    McpInstallStatus:
      type: object
      required: [installed]
      properties:
        installed:
          type: boolean
          description: "Whether a `coffer` MCP-server entry is present in the agent's MCP config."
        command:
          type: string
          nullable: true
          description: "The resolved coffer-mcp-shim command written/found, when installed."

    NativeMemoryStore:
      type: object
      required: [project, path, memory_dir, item_count]
      description: >-
        One of the coding agent's OWN per-project native memory directories
        (claude_code: `<config_dir>/projects/<slug>/memory`) — derived at read
        time, never stored; the agent's store is never written (FR-040).
      properties:
        project:
          type: string
          description: "Readable project label decoded from the on-disk slug."
        path:
          type: string
          nullable: true
          description: >-
            Best-effort decoded absolute project path. The slug decode is lossy
            (path separators and slug encoding are ambiguous), so this is null
            when the path cannot be reconstructed.
        memory_dir:
          type: string
          description: "The real on-disk memory directory (the scan's source of truth)."
        item_count:
          type: integer
          description: "Count of `.md` fact files in the store, excluding `MEMORY.md`."

    NativeMemoryListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/NativeMemoryStore" }

    NativeMemoryImportRequest:
      type: object
      required: [memory_dir]
      additionalProperties: false
      properties:
        memory_dir:
          type: string
          description: >-
            Absolute path to the native memory store to adopt (the `memory_dir`
            of a NativeMemoryStore from the scan).

    NativeMemoryImportResult:
      type: object
      required: [imported, skipped, store, project_path, organized]
      description: >-
        Outcome of adopting one native memory store. A store that cannot be
        mapped to a Coffer project (non-git project, or an unresolvable lossy
        slug with no transcript `cwd`) yields imported=0 with store and
        project_path null and organized=false (FR-041).
      properties:
        imported:
          type: integer
          description: "Number of fact files written into the project store's `knowledge/inbox/` lane."
        skipped:
          type: integer
          description: "Number of fact files skipped (e.g. unparseable)."
        store:
          type: string
          nullable: true
          description: >-
            Resolved Coffer project memory store name (e.g. `project-…`); null
            when the project cannot be mapped to a Coffer store.
        project_path:
          type: string
          nullable: true
          description: "The resolved real project path; null when unresolvable."
        organized:
          type: boolean
          description: >-
            Whether spec 007's organizer was scheduled as a background task
            (false when the store could not be resolved, or no items were
            imported).

    FsEntry:
      type: object
      required: [name, path]
      properties:
        name: { type: string, description: "Directory name." }
        path: { type: string, description: "Resolved absolute path." }

    FsBrowseOut:
      type: object
      required: [path, parent, entries]
      properties:
        path:
          {
            type: string,
            description: "The resolved directory that was listed.",
          }
        parent:
          type: string
          nullable: true
          description: "Parent directory, or null at the filesystem root."
        entries:
          type: array
          items: { $ref: "#/components/schemas/FsEntry" }
          description: "Immediate subdirectories (no files)."

    FsOpenRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: "Absolute path of an existing file or folder to open."
        with:
          type: string
          nullable: true
          description: >-
            Application to open with (the preferred-editor preference). Omitted /
            null opens with the OS default application.

    FsRevealRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: "Absolute path of an existing file or folder to reveal."

    EditorOption:
      type: object
      required: [label, value]
      properties:
        label:
          type: string
          description: "Human-readable editor name (e.g. \"Visual Studio Code\")."
        value:
          type: string
          description: >-
            Launcher value for the preferred-editor preference — a macOS app
            name (`open -a`) or a Linux/Windows command on PATH.

    FsEditorsOut:
      type: object
      required: [editors]
      properties:
        editors:
          type: array
          items: { $ref: "#/components/schemas/EditorOption" }
          description: "GUI editors detected as installed on this machine."

    FsPickFolderRequest:
      type: object
      properties:
        start:
          type: string
          nullable: true
          description: "Absolute path to seed the dialog's starting directory."

    FsPickFolderOut:
      type: object
      required: [available, path]
      properties:
        available:
          type: boolean
          description: >-
            Whether this host has a native folder-dialog tool. When false the
            caller falls back to the in-app folder browser (`/fs/browse`).
        path:
          type: string
          nullable: true
          description: "The chosen absolute directory, or null if cancelled/unavailable."

    FsPickFileRequest:
      type: object
      properties:
        start:
          type: string
          nullable: true
          description: "Absolute path to seed the dialog's starting directory."

    FsSaveFileRequest:
      type: object
      properties:
        suggested_name:
          type: string
          nullable: true
          description: "Default file name to pre-fill in the save dialog."
        start:
          type: string
          nullable: true
          description: "Absolute path to seed the dialog's starting directory."

    FsFilePickOut:
      type: object
      required: [available, path]
      properties:
        available:
          type: boolean
          description: >-
            Whether this host has a native file-dialog tool. When false the
            caller falls back to a typed path.
        path:
          type: string
          nullable: true
          description: "The chosen absolute file path, or null if cancelled/unavailable."

    ErrorOut:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: AGENT_NOT_FOUND
            message:
              type: string
              example: "agent not found: agent:claude-code"
            details:
              type: object
              additionalProperties: true

  responses:
    Unauthorized:
      description: Missing or invalid X-Coffer-Token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorOut" }
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorOut" }
    NotFound:
      description: Agent not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorOut" }
    Conflict:
      description: >-
        Duplicate name within the agent kind, or a stale config-file write
        (`CONFIG_FILE_STALE` — the on-disk content changed since the read)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorOut" }
    UnprocessableEntity:
      description: Validation failure (config_dir not writable, privileged path, unknown type, malformed content, unsupported toggle/uninstall, protected/ambiguous MCP entry, unresolved adopt secrets, unparseable config file, ...)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorOut" }
