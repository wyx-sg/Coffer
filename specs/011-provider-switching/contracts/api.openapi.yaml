openapi: 3.1.0
info:
  title: Coffer — Provider Switching API
  version: "0.1.0"
  description: |
    Provider registry endpoints. Merged into the main Coffer Management API at
    runtime; this document scopes only the provider-specific routes added by
    the 011-provider-switching spec.

    All routes use the same `X-Coffer-Token` authentication from
    `specs/001-mcp-gateway/contracts/api.openapi.yaml`.

    Hand-written; NOT contract-test-gated. Sync with the implementation manually.

    Security note: `ProviderOut` never includes the raw secret. `credential_ref`
    and `is_active` are always present.

servers:
  - url: http://127.0.0.1:{port}/api/v1
    variables:
      port:
        default: "8000"

security:
  - cofferToken: []

tags:
  - name: providers
    description: Provider profile registry and activation

paths:
  /providers:
    get:
      tags: [providers]
      operationId: listProviders
      summary: List all provider profiles
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderListOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }

    post:
      tags: [providers]
      operationId: createProvider
      summary: Create a new provider connection
      description: |
        Credential source depends on `wire_format`:
        - For `anthropic`/`openai`, exactly one credential source must be
          supplied:
          - `secret_value`: the raw API key — stored to the Fernet vault under
            `provider/<name>/key` and kept only as a `credential_ref`.
          - `credential_ref`: reuse an existing vault ref.
          Supplying both or neither is rejected with 422.
        - For `ollama`, the credential is OPTIONAL — supply NEITHER
          `secret_value` nor `credential_ref` (an ollama connection has no
          key). Supplying either is rejected with 422.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderCreateRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderOut" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /providers/{name}:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string }
        description: Provider profile name (unique within kind).

    get:
      tags: [providers]
      operationId: getProvider
      summary: Get a single provider profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

    patch:
      tags: [providers]
      operationId: updateProvider
      summary: Update a provider profile
      description: |
        All fields are optional. Supplying `secret_value` rotates the stored
        secret (overwrites the vault entry at the existing `credential_ref`).
        `wire_format` and `credential_ref` are immutable (identity) — change
        them by recreating the profile.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderPatchRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderOut" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

    delete:
      tags: [providers]
      operationId: deleteProvider
      summary: Delete a provider profile
      description: |
        If the profile owns its `credential_ref` (no other profile cites it),
        the Fernet vault entry is also deleted. Guarded by
        `find_credential_citations`.
      responses:
        "204":
          description: No Content
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /providers/{name}/activate:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string }
        description: Provider profile name to activate.

    post:
      tags: [providers]
      operationId: activateProvider
      summary: Activate (switch to) a provider profile
      description: |
        Sets this profile as the active one for its `wire_format` (at most one
        active per wire at any time). Atomically clears `is_active` on all
        other profiles of the same `wire_format`.

        For each ENABLED registered agent whose native wire matches the
        profile's `wire_format`, projects (writes native config):
        - `anthropic` → `~/.claude/settings.json` (apiKeyHelper + env keys)
        - `openai` → `~/.codex/config.toml` (model + model_providers.coffer)

        If no matching agent is registered, the profile is still activated and
        the response carries the agent in `skipped` — NOT an error.

        Emits a `PROVIDER_SWITCHED` audit event with details
        `{from, to, wire_format, agents: [...projected...]}`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivateOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /providers/{name}/internal-default:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string }
        description: Connection name to set as the internal-engine default.

    post:
      tags: [providers]
      operationId: setInternalDefaultProvider
      summary: Set a connection as Coffer's internal-engine default
      description: |
        Marks this connection as the one Coffer's internal LLM engine uses
        (memory organizer, reorg, distill, `coffer__ask`). At most one
        connection globally is the internal default; setting one clears the
        previous one (sequential clear-then-set, serialised by the
        single-process daemon).

        Emits a `PROVIDER_INTERNAL_DEFAULT_SET` audit event with details
        `{from, to}` and returns the updated `ProviderOut`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /providers/active-key/{wire}:
    parameters:
      - in: path
        name: wire
        required: true
        schema: { type: string, enum: [anthropic, openai] }
        description: Wire format whose active profile's key to resolve.

    get:
      tags: [providers]
      operationId: activeProviderKey
      summary: Resolve the active provider's API key for a wire format
      description: |
        Returns the decrypted API key of the active profile for `wire`, over the
        local token-protected daemon API. This is what Claude Code's
        `apiKeyHelper = "coffer provider key --wire anthropic"` invokes, so the
        raw key never has to be written into `settings.json`. Not audited —
        `apiKeyHelper` polls it frequently. 404 when no profile is active for
        that wire.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActiveKeyOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /providers/use-builtin/{wire}:
    parameters:
      - in: path
        name: wire
        required: true
        schema: { type: string, enum: [anthropic, openai] }
        description: Wire format whose agent(s) to switch back to built-in.

    post:
      tags: [providers]
      operationId: useBuiltinProvider
      summary: Switch a wire's agent(s) back to their built-in login
      description: |
        Removes Coffer's projected keys from every ENABLED matching agent's
        native config (the inverse of activate) and clears `is_active` on the
        wire's active connection, so the agent runs on its OWN built-in
        model/login. A Coffer LLM connection is an optional override, not a
        prerequisite (ADR-032 amendment D1/D3).

        Idempotent — a no-op when nothing is active for the wire. Emits a
        `PROVIDER_SWITCHED` audit event `{from, to: null, wire_format, agents}`
        only when something changed.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeactivateOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /internal-engine-config:
    get:
      tags: [internal-engine]
      operationId: getInternalEngineConfig
      summary: Get the global internal-engine model selection
      description: |
        The single, global model Coffer's internal LLM engine (memory organizer,
        reorg, distill, `coffer__ask`) runs on. The engine takes its endpoint +
        key from the `internal_default` connection but its MODEL from this
        singleton (ADR-032 amendment E3). `model` is `null` until one is chosen.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalEngineConfigOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

    put:
      tags: [internal-engine]
      operationId: updateInternalEngineConfig
      summary: Set the global internal-engine model
      description: |
        Sets the model the internal engine runs on (`null`/empty clears it).
        Overlaid onto the resolved `internal_default` connection before the
        engine builds its chat model. Emits an `internal_engine_model_set` audit
        event.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InternalEngineConfigUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalEngineConfigOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

components:
  securitySchemes:
    cofferToken:
      type: apiKey
      in: header
      name: X-Coffer-Token

  schemas:

    WireFormat:
      type: string
      enum: [anthropic, openai, ollama]
      description: |
        Determines which native agent this connection projects to:
        - `anthropic` → Claude Code (`~/.claude/settings.json`)
        - `openai` → Codex (`~/.codex/config.toml`)
        - `ollama` → internal-only; projected to NO agent (`target_for`
          returns null). Used solely by Coffer's internal engine when this
          connection is the internal default. Has no API key, so its
          `credential_ref` is absent.

    WireApi:
      type: string
      enum: [chat, responses]
      description: >-
        Codex wire API variant. `chat` = Chat Completions;
        `responses` = Responses API. Ignored for anthropic wire.

    ProviderOut:
      type: object
      required:
        - name
        - wire_format
        - base_url
        - credential_ref
        - model
        - is_active
        - internal_default
        - created_at
        - updated_at
      description: >-
        A provider connection. Never includes the raw secret. `credential_ref`
        (null for ollama), `is_active`, and `internal_default` are always
        present.
      properties:
        name:
          type: string
          description: Connection name (unique within kind `provider`).
        wire_format:
          $ref: "#/components/schemas/WireFormat"
        base_url:
          type: string
          description: The upstream LLM endpoint URL.
        credential_ref:
          type: string
          nullable: true
          description: >-
            Fernet vault reference for the API key.
            Pattern: `^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$`.
            Typically `provider/<name>/key` for an owned secret.
            Null for an ollama connection (no API key).
        model:
          type: string
          description: Primary model ID.
        fast_model:
          type: string
          nullable: true
          description: >-
            Fast/small model ID. anthropic only (`ANTHROPIC_SMALL_FAST_MODEL`).
            Null or absent for openai.
        wire_api:
          $ref: "#/components/schemas/WireApi"
        is_active:
          type: boolean
          description: >-
            Whether this is the active profile for its wire_format. At most
            one profile per wire_format has is_active=true. Always false for
            ollama (internal-only, never projected).
        internal_default:
          type: boolean
          description: >-
            Whether this connection is Coffer's internal-engine default. At
            most one connection globally has internal_default=true.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProviderCreateRequest:
      type: object
      required:
        - name
        - wire_format
        - base_url
        - model
      additionalProperties: false
      properties:
        name:
          type: string
          description: Profile name; must pass `validate_name`.
        wire_format:
          $ref: "#/components/schemas/WireFormat"
        base_url:
          type: string
          description: The upstream LLM endpoint URL.
        model:
          type: string
          description: Primary model ID.
        fast_model:
          type: string
          nullable: true
          description: Fast/small model ID (anthropic only).
        wire_api:
          $ref: "#/components/schemas/WireApi"
        credential_ref:
          type: string
          nullable: true
          description: >-
            Reuse an existing vault ref. Mutually exclusive with
            `secret_value`. For anthropic/openai exactly one of the two must
            be supplied; for ollama supply neither.
        secret_value:
          type: string
          nullable: true
          description: >-
            Raw API key. Stored to the vault under `provider/<name>/key`.
            Mutually exclusive with `credential_ref`. For anthropic/openai
            exactly one of the two must be supplied; for ollama supply
            neither. Never echoed in any response.

    ProviderPatchRequest:
      type: object
      additionalProperties: false
      description: >-
        All fields optional. `wire_format` and `credential_ref` are immutable
        and cannot be patched.
      properties:
        base_url:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        fast_model:
          type: string
          nullable: true
          description: Pass null to remove `ANTHROPIC_SMALL_FAST_MODEL` from settings.
        wire_api:
          $ref: "#/components/schemas/WireApi"
        secret_value:
          type: string
          nullable: true
          description: >-
            Rotate the stored secret. Overwrites the vault entry at the
            current `credential_ref`. Never echoed in any response.

    ActivateOut:
      type: object
      required: [activated, wire_format, projected, skipped]
      description: Result of a successful activate operation.
      properties:
        activated:
          type: string
          description: Name of the profile that is now active.
        wire_format:
          $ref: "#/components/schemas/WireFormat"
        projected:
          type: array
          items: { type: string }
          description: Agent names whose native config was updated.
        skipped:
          type: array
          items: { type: string }
          description: >-
            Agent type(s) matching this wire format that have no registered
            enabled agent to project into. Not an error — the profile is still
            activated. (A genuine native-config write failure aborts the switch
            with a 5xx and leaves the registry unchanged, rather than skipping.)

    DeactivateOut:
      type: object
      required: [wire_format, deprojected]
      description: Result of switching a wire back to the agent's built-in login.
      properties:
        wire_format:
          $ref: "#/components/schemas/WireFormat"
        deprojected:
          type: array
          items: { type: string }
          description: Agent names whose Coffer projection was removed.
        previous:
          type: [string, "null"]
          description: The connection that was active before, or null if none.

    ProviderListOut:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items: { $ref: "#/components/schemas/ProviderOut" }

    ActiveKeyOut:
      type: object
      required: [value]
      description: >-
        The decrypted API key of the active profile for a wire format, served
        for Claude Code's apiKeyHelper. Never logged or audited.
      properties:
        value:
          type: string
          description: The decrypted provider API key.

    InternalEngineConfigOut:
      type: object
      required: [model]
      description: >-
        The single, global internal-engine model selection. The connection used
        is the `internal_default` (endpoint + key); only the model lives here.
      properties:
        model:
          type: string
          nullable: true
          description: The chosen model id, or null when unset.
        updated_at:
          type: string
          format: date-time
          nullable: true

    InternalEngineConfigUpdate:
      type: object
      description: Set the internal-engine model; null/empty clears it.
      properties:
        model:
          type: string
          nullable: true

    ErrorOut:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Machine-readable error code.
        message:
          type: string
          description: Human-readable description.
        details:
          type: object
          additionalProperties: true
          description: Optional structured error details.

  responses:
    Unauthorized:
      description: Missing or invalid X-Coffer-Token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorOut" }
    BadRequest:
      description: Malformed request body or query parameters
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorOut" }
    NotFound:
      description: Provider profile not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorOut" }
    Conflict:
      description: A provider with this name already exists
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorOut" }
    UnprocessableEntity:
      description: |
        Validation failure. Common cases:
        - Unknown `wire_format`
        - For anthropic/openai: both `secret_value` and `credential_ref`
          supplied, or neither
        - For ollama: a `secret_value` or `credential_ref` supplied (ollama
          has no key)
        - `credential_ref` pattern violation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorOut" }
    InternalError:
      description: >-
        Server error during projection (e.g. config file write failed).
        The profile's `is_active` state reflects the transaction outcome;
        check the audit log for details.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorOut" }
